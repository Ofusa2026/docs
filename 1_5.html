    L131:()=>`  <span class="id" style="font-size:7.5pt;">（ខាងក្រោមនេះនឹងហៅថា「ភាគីខ」）គឺ</span>`,
    L136:()=>`  <span class="id" style="font-size:7.5pt;">ចុះកិច្ចសន្យាការងារសម្រាប់ជនបរទេសក្នុងជំនាញជាក់លាក់ដោយស្របតាមខ្លឹមសារដែលបានកត់ត្រានៅក្នុងឯកសារភ្ជាប់ស្តីអំពីលក្ខខណ្ឌការងារ។</span>`,
    L143:()=>`  <span class="id" style="font-size:7pt;">កិច្ចសន្យាការងារនេះ នឹងមានសុពលភាពចាប់ពីពេលវេលាដែលភាគីខបានទទួលការអនុញ្ញាតនិរទេសឬអនុញ្ញាតផ្លាស់ប្តូរប្រភេទនៃការស្នាក់នៅជា«ជនបរទេសក្នុងជំនាញជាក់លាក់លេខទី 1»ឬ «ជនបរទេសក្នុងជំនាញជាក់លាក់លេខទី 2»។ ភាគីក និងភាគីខ នឹងសម្របសម្រួលគ្នាយ៉ាងឆាប់រហ័ស ហើយការងារនឹងចាប់ផ្តើមនៅថ្ងៃដែលបានព្រមព្រៀងគ្នារវាងភាគីក និងភាគីខ ក្នុងរយៈពេល 1 ខែចាប់ពីថ្ងៃដដែល។</span>`,
    L148:()=>`  <span class="id" style="font-size:7pt;">រយៈពេលនៃកិច្ចសន្យាការងារ（ថ្ងៃចាប់ផ្តើម និងថ្ងៃបញ្ចប់នៃកិច្ចសន្យាការងារ）ដែលបានកត់ត្រានៅក្នុងឯកសារស្តីអំពីលក្ខខណ្ឌការងារ នឹងត្រូវបានផ្លាស់ប្តូរស្របតាមថ្ងៃចាប់ផ្តើមការងារ ដែលត្រូវបានកំណត់តាមការសម្របសម្រួលរវាងភាគីក និងភាគីខ។</span>`,
    L153:()=>`  <span class="id" style="font-size:7pt;">ភាគី ក និងភាគី ខ ត្រូវចែករំលែកគ្នាទៅវិញទៅមក នូវព័ត៌មានស្ដីពីលទ្ធផលនៃការពិនិត្យអំពីលក្ខណៈសម្បត្តិនៃការស្នាក់នៅរបស់ភាគី ខ។</span>`,
    L158:()=>`  <span class="id" style="font-size:7pt;">ម៉្យាងទៀត កិច្ចសន្យាការងារនេះនឹងត្រូវបញ្ចប់ ក្នុងករណីផុតពេលកំណត់កិច្ចសន្យាការងារ ដោយមិនបានពន្យារកិច្ចសន្យាការងារជាថ្មី និងនៅពេលដែលភាគីខ បាត់បង់សិទ្ធិស្នាក់នៅដោយសារហេតុណាមួយ។</span>`,
    L163:()=>`  <span class="id" style="font-size:7pt;">កិច្ចសន្យាការងារ និងឯកសារស្តីអំពីលក្ខខណ្ឌការងារនេះ នឹងត្រូវបានធ្វើឡើងជា 2 ច្បាប់ដូចគ្នា ហើយភាគីក និងភាគីខត្រូវរក្សាទុកម្នាក់មួយច្បាប់រៀងៗខ្លួន។</span>`,
    L171:()=>`  <span class="id" style="font-size:7.5pt;">កាលបរិច្ឆេទចុះកិច្ចសន្យា ${f('es_createY')} ឆ្នាំ ${f('es_createM')} ខែ ${f('es_createD')} ថ្ងៃ</span>`,
    L184:()=>`    <div style="display:flex;align-items:center;"><span style="min-width:3em;">ភាគីក</span><span style="flex:1;text-align:center;border-bottom:1px solid #000;padding:0 0.5em 2px;">${f('es_repTitleEn')}　${f('es_repNameEn')}</span><span style="min-width:3em;text-align:right;">（ត្រា）</span></div>`,
    L185:()=>`    <div style="font-size:7pt;">(ឈ្មោះស្ថាប័ននៃជនបរទេសក្នុងជំនាញជាក់លាក់・<br>ឈ្មោះតួនាទីអ្នកតំណាង・ឈ្មោះ・ត្រា)</div>`,
    L200:()=>`    <div style="display:flex;align-items:flex-end;"><span style="white-space:nowrap;">ភាគីខ</span><span style="flex:1;border-bottom:1px solid #000;height:1.2em;margin-left:0.5em;"></span></div>`,
    L201:()=>`    <div style="font-size:7pt;">(ហត្ថលេខាជនបរទេសក្នុងជំនាញជាក់លាក់)</div>`
  },

    dockey:false,
    L120:()=>`<div style="font-size:8pt;margin-bottom:2px;">参考様式第１－５号<br><span class="id">ရည်ညွှန်းပုံစံအမှတ် ၁-၅</span></div>`,
    L123:()=>`<div style="text-align:center;font-size:9pt;font-weight:bold;margin-bottom:8px;" class="id">အထူးကျွမ်းကျင်လုပ်သား အလုပ်ခန့်အပ်ခြင်းသဘောတူစာချုပ်</div>`,
    L127:()=>`  <span class="id" style="font-size:7.5pt;">အထူးကျွမ်းကျင်လုပ်သားဆောင်ရွက်မည့်အဖွဲ့အစည်း　${f('es_orgNameEn')}</span><br>`,
    L128:()=>`  <span class="id" style="font-size:7.5pt;">(အောက်တွင် "ပထမပါတီ" ဟုပြောမည်။) နှင့်</span><br>`,
    L130:()=>`  <span class="id" style="font-size:7.5pt;">နိုင်ငံခြားသားအထူးကျွမ်းကျင်လုပ်သားများ(စာမေးပွဲဖြေဆိုမည့်ကျောင်းသားများအပါအဝင်)　${f('es_applicantNameEn')}</span><br>`,
    L131:()=>`  <span class="id" style="font-size:7.5pt;">(အောက်တွင် "ဒုတိယပါတီ" ဟုပြောမည်။)တို့သည်</span>`,
    L136:()=>`  <span class="id" style="font-size:7.5pt;">ပူးတွဲပါ အလုပ်ခန့်အပ်ခြင်းသတ်မှတ်ချက်စာချုပ်များတွင်ဖော်ပြထားသည့်အကြောင်းအရာများအောက်ရှိအထူးကျွမ်းကျင်လုပ်သား အလုပ်ခန့်အပ်ခြင်းသဘောတူစာချုပ်ကို အကောင်အထည်ဖော်ဆောင်ရွက်ရန် သဘောတူပါသည်။</span>`,
    L143:()=>`  <span class="id" style="font-size:7pt;">ဤအလုပ်ခန့်အပ်စာချုပ်တွင် ဒုတိယပါတီသည် နေထိုင်ခွင့်အမျိုးအစား "အထူးကျွမ်းကျင်လုပ်သား (၁)" သို့မဟုတ် "အထူးကျွမ်းကျင်လုပ်သား (၂)"ဖြင့် ဂျပန်နိုင်ငံသို့ဝင်ရောက်ခြင်း သို့မဟုတ် နေထိုင်ခွင့်အမျိုးအစားပြောင်းလဲခြင်း ခွင့်ပြုချက်ကျသည့်ရက်မှစပြီး ပထမပါတီနှင့် ဒုတိယပါတီအချင်းချင်း လျင်မြန်စွာ ညှိနှိုင်းပြီး တူညီသောရက်မှစ၍ ၁ လအတွင်း ပထမပါတီနှင့် ဒုတိယပါတီနှစ်ဦးနှစ်ဖက်၏ သဘောတူညီချက်ဖြင့် သတ်မှတ်ထားသည့်ရက်မှစ၍ အလုပ်ခန့်အပ်မည်။</span>`,
    L148:()=>`  <span class="id" style="font-size:7pt;">အလုပ်ခန့်အပ် စာချုပ်တွင် ဖော်ပြထားသည့် အလုပ်ခန့်အပ်စာချုပ်ကာလ (အလုပ်ခန့်အပ် စာချုပ်စတင်ချိန်နှင့် ပြီးဆုံးချိန်)အား ပထမပါတီနှင့် ဒုတိယပါတီ နှစ်ဦးနှစ်ဖက်၏ စီစဉ်ညှိနှိုင်းမှုအရ သတ်မှတ်ထားသည့် အလုပ်ခန့်အပ်မှုစတင် သည့်ရက်ကိုလိုက်၍ ပြောင်းလဲသည်ဟု သတ်မှတ်ပါသည်။</span>`,
    L153:()=>`  <span class="id" style="font-size:7pt;">ပထမပါတီနှင့် ဒုတိယပါတီနှစ်ဖက်လုံးသည် ဒုတိယပါတီ၏ နေထိုင်ခွင့်အမျိုးအစားနှင့်သက်ဆိုင်သည့် စစ်ဆေးမှုရလဒ်ကို သတင်းအချက်အလက်များ အပြန်အလှန်မျှဝေရမည်ဟု သတ်မှတ်ပါသည်။</span>`,
    L158:()=>`  <span class="id" style="font-size:7pt;">ထို့အပြင် အလုပ်ခန့်အပ်ခြင်းသဘောတူညီချက်စာချုပ်အားသက်တမ်းတိုးခြင်းမရှိဘဲစာချုပ်သက်တမ်းကာလပြီးဆုံးသွားပါက သို့မဟုတ် ဒုတိယပါတီမှ အကြောင်းအရင်းတစ်ခုခုကြောင့် နေထိုင်ခွင့်ဆုံးရှုံးခဲ့ပါက ထိုအချိန်မှစ၍ဤအလုပ်ခန့်အပ်ခြင်းသဘောတူညီချက်စာချုပ်သည်အဆုံးသတ်မည်ဖြစ်ပါသည်။</span>`,
    L163:()=>`  <span class="id" style="font-size:7pt;">ဤအလုပ်ခန့်အပ်ခြင်းသဘောတူညီချက်စာချုပ်နှင့်အလုပ်ခန့်အပ်ခြင်းသတ်မှတ်ချက်စာချုပ်ကို ၂ စုံပြုလုပ်ပြီး ပထမပါတီနှင့်ဒုတိယပါတီအသီးသီးမှ ၁ စုံစီသိမ်းထားရမည်ဖြစ်ပါသည်။</span>`,
    L171:()=>`  <span class="id" style="font-size:7.5pt;">${f('es_createY')} ခုနှစ် ${f('es_createM')} လ ${f('es_createD')} ရက်တွင် ချုပ်ဆိုပါသည်</span>`,
    L184:()=>`    <div style="display:flex;align-items:center;"><span style="min-width:3em;">ပထမပါတီ</span><span style="flex:1;text-align:center;border-bottom:1px solid #000;padding:0 0.5em 2px;">${f('es_repTitleEn')}　${f('es_repNameEn')}</span><span style="min-width:3em;text-align:right;">တံဆိပ်တုံး</span></div>`,
    L185:()=>`    <div style="font-size:7pt;">(အထူးကျွမ်းကျင်လုပ်သားဆောင်ရွက်မည့်အဖွဲ့အစည်း<br>အမည်၊ကိုယ်စားလှယ်၏ရာထူး၊အမည်နှင့်တံဆိပ်တုံး)</div>`,
    L200:()=>`    <div style="display:flex;align-items:flex-end;"><span style="white-space:nowrap;">ဒုတိယပါတီ</span><span style="flex:1;border-bottom:1px solid #000;height:1.2em;margin-left:0.5em;"></span></div>`,
    L201:()=>`    <div style="font-size:7pt;">(နိုင်ငံခြားသားအထူးကျွမ်းကျင်လုပ်သား၏အမည်)</div>`
  },

    dockey:false,
    L120:()=>`<div style="font-size:8pt;margin-bottom:2px;">参考様式第１－５号<br><span class="id">Reference Form 1-5</span></div>`,
    L123:()=>`<div style="text-align:center;font-size:9pt;font-weight:bold;margin-bottom:8px;" class="id">EMPLOYMENT CONTRACT FOR SPECIFIED SKILLED WORKERS</div>`,
    L127:()=>`  <span class="id" style="font-size:7.5pt;">Organization of affiliation of the specified skilled worker　${f('es_orgNameEn')}</span><br>`,
    L128:()=>`  <span class="id" style="font-size:7.5pt;">(hereinafter referred to as "organization") and</span><br>`,
    L130:()=>`  <span class="id" style="font-size:7.5pt;">Specified skilled worker (including specified skilled worker candidates)　${f('es_applicantNameEn')}</span><br>`,
    L131:()=>`  <span class="id" style="font-size:7.5pt;">(hereinafter referred to as "specified skilled worker")</span>`,
    L136:()=>`  <span class="id" style="font-size:7.5pt;">This Employment Contract is hereby entered into in accordance with the contents described in the attached Written Employment Conditions.</span>`,
    L143:()=>`  <span class="id" style="font-size:7pt;">This employment contract will commence on a date to be determined by mutual agreement between the organization and the specified skilled worker within one month from the date the specified skilled worker receives landing permission for the status of residence "Specified Skilled Worker No. 1" or "Specified Skilled Worker No. 2", or permission for change of status of residence, etc.</span>`,
    L148:()=>`  <span class="id" style="font-size:7pt;">The period of the Employment Contract (beginning and end of the Employment Contract) stated in the Written Employment Conditions shall be changed in accordance with the start date of employment specified with the adjustment made between the organization and the specified skilled worker.</span>`,
    L153:()=>`  <span class="id" style="font-size:7pt;">The organization and the specified skilled worker shall share with each other the results of the assessment of the specified skilled worker's status of residence.</span>`,
    L158:()=>`  <span class="id" style="font-size:7pt;">The Employment Contract shall be terminated at the time of the period of the Employment Contract expiring without being renewed, or if the specified skilled worker has forfeited the status of residence for any reason.</span>`,
    L163:()=>`  <span class="id" style="font-size:7pt;">The Employment Contract and Written Employment Conditions shall be prepared in duplicate, and one copy shall be retained by each party.</span>`,

    L131:()=>`  <span class="id" style="font-size:7.5pt;">(මෙතැන් පටන් 「දෙවන පාර්ශවය」 ලෙස හඳුන්වනු ලබන)</span>`,
    L136:()=>`  <span class="id" style="font-size:7.5pt;">වෙනම අමුණා ඇති රැකියා කොන්දේසි පත්‍රයේ සඳහන් කර ඇති අන්තර්ගතයට අනුව, නිශ්චිත කුසලතා සඳහා වන රැකියා කොන්ත්‍රාත්තුව ගිවිසුම් ගත කරන ලදී.</span>`,
    L143:()=>`  <span class="id" style="font-size:7pt;">මෙම රැකියා කොන්ත්‍රාත්තුව යටතේ, දෙවන පාර්ශවය "නිශ්චිත කුසලතා අංක 1" හෝ "නිශ්චිත කුසලතා අංක 2" යන පදිංචි තත්ත්වය යටතේ ගොඩබෑමේ අවසරය හෝ පදිංචි තත්ත්වය වෙනස් කිරීමේ අවසරය ආදිය ලැබුණු දින සිට, පළමු පාර්ශවය සහ දෙවන පාර්ශවය වහාම සම්බන්ධීකරණය කර, එම දින සිට මාසයක් ඇතුළත දෙපාර්ශවයේ එකඟතාවයෙන් තීරණය කරන ලද දිනයේ සිට රැකියාව ආරම්භ කරනු ලැබේ.</span>`,
    L148:()=>`  <span class="id" style="font-size:7pt;">රැකියා කොන්දේසි පත්‍රයේ දක්වා ඇති රැකියා කොන්ත්‍රාත්තුවේ කාලසීමාව (රැකියා කොන්ත්‍රාත්තුවේ ආරම්භක සහ අවසන් දිනයන්), පළමු පාර්ශවය සහ දෙවන පාර්ශවය අතර සම්බන්ධීකරණය මගින් තීරණය කරනු ලබන රැකියා ආරම්භක දිනයට අනුකූලව වෙනස් කරනු ලැබේ.</span>`,
    L153:()=>`  <span class="id" style="font-size:7pt;">පළමු පාර්ශවය සහ දෙවන පාර්ශවය යන දෙදෙනාම, දෙවන පාර්ශවයේ පදිංචි තත්ත්වය පිළිබඳ විභාග ප්‍රතිඵල සම්බන්ධයෙන් තොරතුරු එකිනෙකා සමඟ බෙදා ගනු ඇත.</span>`,
    L158:()=>`  <span class="id" style="font-size:7pt;">තවද, රැකියා කොන්ත්‍රාත්තුව අලුත් නොකර රැකියා කොන්ත්‍රාත් කාලය අවසන් වූ අවස්ථාවකදී, නැතහොත් කිසියම් හේතුවක් නිසා දෙවන පාර්ශවයේ පදිංචි තත්ත්වය අහිමි වූ අවස්ථාවේදී, මෙම රැකියා කොන්ත්‍රාත්තුව අවසන් වේ.</span>`,
    L163:()=>`  <span class="id" style="font-size:7pt;">මෙම රැකියා කොන්ත්‍රාත්තුව සහ රැකියා කොන්දේසි පත්‍රිකාව පිටපත් දෙකක් සකස් කර, පළමු පාර්ශවය සහ දෙවන පාර්ශවය එක් පිටපත බැගින් තබා ගනු ඇත.</span>`,
    L171:()=>`  <span class="id" style="font-size:7.5pt;">${f('es_createY')} වසර ${f('es_createM')} මස ${f('es_createD')} දින (ගිවිසුම් ගත කරන ලදී)</span>`,
    L184:()=>`    <div style="display:flex;align-items:center;"><span style="min-width:3em;">පළමු පාර්ශවය</span><span style="flex:1;text-align:center;border-bottom:1px solid #000;padding:0 0.5em 2px;">${f('es_repTitleEn')}　${f('es_repNameEn')}</span><span style="min-width:3em;text-align:right;">නිල මුද්‍රාව</span></div>`,
    L185:()=>`    <div style="font-size:7pt;">(නිශ්චිත කුසලතා සඳහා අනුබද්ධ සංවිධානයේ නම・<br>නියෝජිතයාගේ තනතුර・නම・නිල මුද්‍රාව)</div>`,
    L200:()=>`    <div style="display:flex;align-items:flex-end;"><span style="white-space:nowrap;">දෙවන පාර්ශවය</span><span style="flex:1;border-bottom:1px solid #000;height:1.2em;margin-left:0.5em;"></span></div>`,
    L201:()=>`    <div style="font-size:7pt;">(නිශ්චිත කුසලතා විදේශික වෘත්තිකයාගේ අත්සන)</div>`
  },

    L123:()=>`<div style="text-align:center;font-size:9pt;font-weight:bold;margin-bottom:8px;" class="id">Тусгай ур чадварын хөдөлмөрийн гэрээ</div>`,
    L127:()=>`  <span class="id" style="font-size:7.5pt;">Тусгай ур чадварын харьяа байгууллага　${f('es_orgNameEn')}</span><br>`,
    L128:()=>`  <span class="id" style="font-size:7.5pt;">(цаашид “Ажил олгогч” гэх) болон</span><br>`,
    L130:()=>`  <span class="id" style="font-size:7.5pt;">Тусгай ур чадвартай гадаад иргэн (горилогч хамаарна)　${f('es_applicantNameEn')}</span><br>`,
    L131:()=>`  <span class="id" style="font-size:7.5pt;">(цаашид “Ажилтан” гэх) нар нь</span>`,
    L136:()=>`  <span class="id" style="font-size:7.5pt;">хавсралт Хөдөлмөр эрхлэлтийн нөхцөлд бичигдсэн агуулгын дагуу Тусгай ур чадварын хөдөлмөрийн гэрээг байгуулав.</span>`,
    L143:()=>`  <span class="id" style="font-size:7pt;">Энэхүү хөдөлмөрийн гэрээ нь Ажилтан “Тусгай ур чадварын 1-р зэрэг” болон “Тусгай ур чадварын 2-р зэрэг”-н оршин суух зөвшөөрлөөр Япон улсад ирсэн эсвэл оршин суух статусыг өөрчлөх зөвшөөрөл авсан өдрөөс эхлэн, хоёр тал нэн даруй зохицуулалт хийж, тус өдрөөс хойш нэг сарын дотор хоёр талуудын харилцан тохиролцсон өдрөөс хүчин төгөлдөр болно.</span>`,
    L148:()=>`  <span class="id" style="font-size:7pt;">Хөдөлмөр эрхлэлтийн нөхцөлд бичигдсэн хөдөлмөрийн гэрээний хугацааг (хөдөлмөрийн гэрээний эхлэх болон дуусах хугацаа) хоёр талуудын харилцан тохиролцсон ажилд орох өдрийг үндэслэн өөрчилнө.</span>`,
    L153:()=>`  <span class="id" style="font-size:7pt;">Хоёр талууд Ажилтны оршин суух статустай холбогдох шалгалтын үр дүнгийн талаар харилцан мэдээлэл солилцоно.</span>`,
    L158:()=>`  <span class="id" style="font-size:7pt;">Түүнчлэн, хөдөлмөрийн гэрээг сунгалгүйгээр гэрээний хугацааг дуусгавар болгосон тохиолдолд, мөн ажилтан нь ямар нэгэн шалтгаанаар оршин суух зөвшөөрлийг хүчингүй болгуулсан тохиолдолд тухайн үеэс эхлэн хөдөлмөрийн гэрээг дуусгавар болсонд тооцно.</span>`,
    L163:()=>`  <span class="id" style="font-size:7pt;">Энэхүү Хөдөлмөрийн гэрээ болон Хөдөлмөр эрхлэлтийн нөхцөлийг 2 хувь үйлдэж, Ажил олгогч, Ажилтан нар нь тус бүр нэг хувийг хадгална.</span>`,
    L171:()=>`  <span class="id" style="font-size:7.5pt;">${f('es_createY')} он ${f('es_createM')} сар ${f('es_createD')} өдөр байгуулав.</span>`,
    L184:()=>`    <div style="display:flex;align-items:center;"><span style="min-width:3em;">Ажил олгогч</span><span style="flex:1;text-align:center;border-bottom:1px solid #000;padding:0 0.5em 2px;">${f('es_repTitleEn')}　${f('es_repNameEn')}</span><span style="min-width:3em;text-align:right;">Тамга</span></div>`,
    L185:()=>`    <div style="font-size:7pt;">(Тусгай ур чадварын харьяа байгууллагын нэр,<br>Төлөөлөгч захирлын нэр, овог нэр, тамга)</div>`,
    L200:()=>`    <div style="display:flex;align-items:flex-end;"><span style="white-space:nowrap;">Ажилтан</span><span style="flex:1;border-bottom:1px solid #000;height:1.2em;margin-left:0.5em;"></span></div>`,
    L201:()=>`    <div style="font-size:7pt;">(Тусгай ур чадвартай гадаад иргэний гарын үсэг)</div>`
  },

    L120:()=>`<div style="font-size:8pt;margin-bottom:2px;">参考様式第１－５号<br><span class="id">Sangguniang Dokumento 1-5</span></div>`,
    L123:()=>`<div style="text-align:center;font-size:9pt;font-weight:bold;margin-bottom:8px;" class="id">KONTRATA SA PAGTATRABAHO NG TEKNIKAL NA MANGGAGAWA</div>`,
    L127:()=>`  <span class="id" style="font-size:7.5pt;">Ang institusyong papasukan ng teknikal na manggagawa　${f('es_orgNameEn')}</span><br>`,
    L128:()=>`  <span class="id" style="font-size:7.5pt;">(tatawaging “organisasyon”) at</span><br>`,
    L130:()=>`  <span class="id" style="font-size:7.5pt;">ang dayuhang teknikal na manggagawa (o taong namamasukan)　${f('es_applicantNameEn')}</span><br>`,
    L131:()=>`  <span class="id" style="font-size:7.5pt;">(tatawaging “teknikal na manggagawa”)</span>`,
    L136:()=>`  <span class="id" style="font-size:7.5pt;">ay pumapasok sa Kontrata sa Pagtatrabaho ng Teknikal na Manggawa na ito, alinsunod sa mga nilalaman ng kalakip na Mga Kondisyon ng Pagtatrabaho.</span>`,
    L143:()=>`  <span class="id" style="font-size:7pt;">Ang kontrata ng pagtatrabahong ito ay agad na aayusin ng parehong organisasyon at teknikal na manggagawa mula sa petsa kung kailan natanggap ng teknikal na manggagawa ang pahintulot sa landing para sa katayuan ng paninirahan na "Specified Skilled Worker No. 1" o "Specified Skilled Worker No. 2" o pahintulot na baguhin ang katayuan ng paninirahan atbp., at ang pagtatrabaho ay dapat na magsimula sa petsang napagkasunduan ng parehong organisasyon at teknikal na manggagawa sa loob ng isang buwan mula sa petsa.</span>`,
    L148:()=>`  <span class="id" style="font-size:7pt;">Ang panahon ng Kontrata sa Pagtatrabaho (simula at pagtatapos ng Kontrata sa Pagtatrabaho) na nakasaad sa Mga Kondisyon ng Pagtatrabaho ay babaguhin alinsunod sa petsa ng pagsisimula ng pagtatrabaho na itinakda sa pamamagitan ng pag-aayos ng parehong organisasyon at teknikal na manggagawa.</span>`,
    L153:()=>`  <span class="id" style="font-size:7pt;">Ang parehong organisasyon at teknikal na manggagawa ay dapat na magbahaginan ng impormasyon tungkol sa mga resulta ng pagsusuring may kaugnayan sa katayuan ng paninirahan ng teknikal na manggagawa.</span>`,
    L158:()=>`  <span class="id" style="font-size:7pt;">Ang Kontrata sa Pagtatrabaho na ito ay mawawalan ng bisa kung matapos ang panahon ng kontrata nang hindi na-renew, o kung mawala ang residence status ng teknikal na manggagawa buhat ng anumang dahilan.</span>`,
    L163:()=>`  <span class="id" style="font-size:7pt;">Ang Kontrata sa Pagtatrabaho at ang Mga Kondisyon ng Pagtatrabaho ay dapat ihanda nang may dalawang kopya, isa para sa organisasyon at isa para sa teknikal na manggagawa.</span>`,
    L171:()=>`  <span class="id" style="font-size:7.5pt;">${f('es_createY')} Taon ${f('es_createM')} Buwan ${f('es_createD')} Araw (Petsa ng pagpasok sa kontrata).</span>`,
    L184:()=>`    <div style="display:flex;align-items:center;"><span style="min-width:3em;">Organisasyon</span><span style="flex:1;text-align:center;border-bottom:1px solid #000;padding:0 0.5em 2px;">${f('es_repTitleEn')}　${f('es_repNameEn')}</span><span style="min-width:3em;text-align:right;">Selyo</span></div>`,
    L185:()=>`    <div style="font-size:7pt;">(Pangalan ng institusyong papasukan ng teknikal na manggagawa<br>at pangalan, posisyon, at selyo ng kinatawan nito)</div>`,
    L200:()=>`    <div style="display:flex;align-items:flex-end;"><span style="white-space:nowrap;">Teknikal na manggagawa</span><span style="flex:1;border-bottom:1px solid #000;height:1.2em;margin-left:0.5em;"></span></div>`,
    L201:()=>`    <div style="font-size:7pt;">(Lagda ng teknikal na manggagawa)</div>`
  }

<div style="font-size:8.5pt;margin-bottom:6px;">

  _fontSize=(_fontSize===8.5)?8.5:_fontSize;

function _apply15LangFontSize(){
  const st=document.getElementById(_T15.stid)||document.createElement('style');
  st.id=_T15.stid;
  document.head.appendChild(st);
  const s=_fontSize/8.5;
  st.textContent=[
    `.doc [style*="font-size:13pt"]{font-size:${(13*s).toFixed(2)}pt!important}`,
    `.doc [style*="font-size:9pt"]{font-size:${(9*s).toFixed(2)}pt!important}`,
  ].join('');
}

p();

// index.htmlからの案件選択を受信（自動追加）
if(!window._selectCaseListenerAdded){
  window._selectCaseListenerAdded=true;
  window.addEventListener('message', async function(e){
    if(!e.data||e.data.type!=='SELECT_CASE') return;
    const info=e.data.info;
    if(!info||!info.caseId) return;
    console.log('[doc] SELECT_CASE received:', info);
    const sel=document.getElementById('caseSelect');
    if(sel){
      let found=false;
      for(let o of sel.options){
        try{ const d=JSON.parse(o.value); if(d.caseId===info.caseId){sel.value=o.value;found=true;break;} }catch(e2){}
      }
      if(!found){
        const opt=document.createElement('option');
        opt.value=JSON.stringify(info);
        opt.textContent='（indexから選択）';
        sel.appendChild(opt);
        sel.value=opt.value;
      }
    }
    if(typeof loadFromDB==='function'){ loadFromDB(info); }
    else if(typeof loadCaseToForm==='function'){ await loadCaseToForm(info, '1_5'); }
  });
}
