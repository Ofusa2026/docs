// ---- 書類の描画 ----------------------------------------------------------
const B4='　　　　';
const ck=on=>on?'■':'□';
const isSelf=()=>v('f_itaku')==='自社';
const vv=id=>(SELF_ONLY.indexOf(id)>=0 && !isSelf())?'':String(v(id)||'').trim();
function fx(id, txt, blank){   // 値を整えて出す（空なら薄い文字の目印。印刷では消える）
  const raw=vv(id);
  if(!raw) return blank!=null?blank:`<span class="f" data-bind="${id}" style="color:#aaa;font-size:0.85em;font-family:monospace;">${id.replace(/^f_/,'')}</span>`;
  return `<span class="f" data-bind="${id}">${esc(txt!=null?txt:raw).replace(/\n/g,'<br>')}</span>`;
}
const fb=id=>fx(id,null,B4+B4);
function yn(id){ const a=vv(id); return `${ck(a==='有')}　有　　${ck(a==='無')}　無`; }
function ynd(id, lab){   // □有（内容：　）□無
  const a=vv(id), d=vv(id+'d');
  const body=(a==='有'&&d)?fx(id+'d'):'　　　　　　　　　　　　　　　　　';
  return `${ck(a==='有')}　有（${lab||'内容'}：${body}　）　${ck(a==='無')}　無`;
}
function gai(id){ const a=vv(id); return `${ck(a==='該当')}　該当　${ck(a==='非該当')}　非該当`; }
function _ymdP(s){
  const t=String((typeof ofusaToISO==='function'?ofusaToISO(s):s)||'').trim();
  let m=t.match(/^(\d{4})[-\/年.](\d{1,2})[-\/月.](\d{1,2})/); if(m) return [m[1],String(+m[2]),String(+m[3])];
  m=t.match(/^(\d{4})(\d{2})(\d{2})$/); if(m) return [m[1],String(+m[2]),String(+m[3])];
  return null;
}
function ymdTxt(id){
  const r=_ymdP(vv(id));
  if(!vv(id)) return '　　　　年　　　月　　　日';
  if(!r) return fx(id);
  return `<span class="f" data-bind="${id}">${r[0]}年${('　'+r[1]).slice(-2)}月${('　'+r[2]).slice(-2)}日</span>`;
}
const per=(a,b)=>`${ymdTxt(a)}から${ymdTxt(b)}まで`;
const num=(id,unit)=>{ const raw=vv(id); if(!raw) return B4+B4; let t=raw.replace(new RegExp(unit+'$'),'').trim(); if(/^\d+$/.test(t)) t=Number(t).toLocaleString('ja-JP'); return fx(id,t); };
function kubunTxt(){ const raw=vv('f_kubun'); if(!raw) return fx('f_kubun'); return fx('f_kubun', raw.replace(/[（(][^）)]*(分野|特定技能)[^）)]*[）)]\s*$/,'').trim()); }
// 番号の枠（労働保険番号 2-1-2-6-3-4／法人番号13桁／雇用保険適用事業所番号11桁）
function boxes(groups, id){
  const raw=vv(id);
  let parts=null;
  if(raw){
    const g=raw.normalize('NFKC').split(/[-‐－ー―\s]+/).filter(Boolean);
    if(g.length>1 && g.every((x,i)=>/^\d+$/.test(x) && i<groups.length && x.length===groups[i])) parts=g;
    else { const dg=raw.normalize('NFKC').replace(/\D/g,''); let s=0;
      for(let k=1;k<=groups.length && !parts;k++){ const L=groups.slice(0,k).reduce((a,b)=>a+b,0); if(dg.length===L){ parts=[]; s=0; groups.slice(0,k).forEach(n=>{ parts.push(dg.substr(s,n)); s+=n; }); } }
    }
  }
  if(raw && !parts) return fx(id);   // 枠に合わない番号は、そのまま文字で出す
  let h='<table class="bx"><tr>';
  groups.forEach((n,gi)=>{ if(gi) h+='<td class="dash">－</td>'; for(let i=0;i<n;i++) h+=`<td>${parts&&parts[gi]?parts[gi][i]||'':''}</td>`; });
  return h+'</tr></table>';
}

function roRegTxt(){ const r=_ymdP(vv('f_roRegDate')); if(!vv('f_roRegDate')) return fx('f_roRegDate'); return r?`<span class="f" data-bind="f_roRegDate">${r[0]}年${r[1]}月${r[2]}日</span>`:fx('f_roRegDate'); }
function p(){
  if(_editMode) return;
  const w=document.getElementById('pageArea'); if(!w) return;
  _fontSize = (_fontSize === 8.5) ? 11 : _fontSize;
  _applyFontSize();
  _applyJdFontSize();
  // ページ分けは自動（質問と答えの行は同じページに置く。行の頭に + が付いた行は前の行とひとまとまり）
  const units=[];
  blocks().forEach(b=>{
    if(b==='<<PB>>'){ units.push({pb:true}); return; }
    if(b.charAt(0)==='+' && units.length && !units[units.length-1].pb) units[units.length-1].h.push(b.slice(1));
    else units.push({h:[b.replace(/^\+/,'')]});
  });
  const m=document.createElement('div'); m.className='doc'; m.style.cssText='position:absolute;left:-10000px;top:0;visibility:hidden;zoom:1;';
  m.innerHTML='<div class="bd" style="font-size:11pt;">'+units.map((u,i)=>u.pb?'':`<div data-u="${i}">${u.h.join('')}</div>`).join('')+'</div>';
  document.body.appendChild(m);
  const cs=getComputedStyle(m);
  const cap=1123-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-2;
  const pages=[[]]; let used=0;
  const isSp=h=>h.length===1 && /^<div[^>]*><\/div>$/.test(h[0]);
  units.forEach((u,i)=>{
    const cur=pages[pages.length-1];
    if(u.pb){ if(cur.length){ pages.push([]); used=0; } return; }
    const hh=m.querySelector('[data-u="'+i+'"]').getBoundingClientRect().height;
    if(isSp(u.h) && !cur.length) return;   // ページの頭の空行は入れない
    if(used+hh>cap && cur.length){ pages.push([]); used=0; if(isSp(u.h)) return; }
    pages[pages.length-1].push('<div>'+u.h.join('\n')+'</div>'); used+=hh;
  });
  m.remove();
  w.innerHTML=pages.map((pg,i)=>`<div class="doc"><div class="page-num-label">P${i+1}</div><div class="bd" style="font-size:11pt;">${pg.join('\n')}</div></div>`).join('\n');
  const nb=document.getElementById('pnBtns');
  if(nb && nb.childElementCount!==pages.length) nb.innerHTML=pages.map((_,i)=>`<button class="pn-btn pn-btn-page${i?'':' active'}" onclick="scrollToPage(${i+1})">P${i+1}</button>`).join('');
  const lbl=document.getElementById('fontSizeLabel');if(lbl)lbl.textContent=_fontSize+'pt';
  setupPageTracker();
  fitDocToPreview();
}
function _applyJdFontSize(){
  const st=document.getElementById('_jdFontStyle')||document.createElement('style');
  st.id='_jdFontStyle'; document.head.appendChild(st);
  const s=_fontSize/11;
  st.textContent=[18,12,11,10,9].map(z=>`.doc [style*="font-size:${z}pt"]{font-size:${(z*s).toFixed(2)}pt!important}`).join('');
}

function _today(){ const n=new Date(); return n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日'; }
async function loadFromDB(passedInfo){
  let info = passedInfo;
  if(!info){
    const sel=document.getElementById('caseSelect');
    if(!sel.value) return;
    try{info=JSON.parse(sel.value);}catch(e){return;}
  }
  if(!info || !info.caseId) return;
  const {caseId,companyId,companyName}=info;
  const s=(id,val)=>{const e=document.getElementById(id); if(e&&val!=null&&String(val).trim()!=='') e.value=String(val).trim();};
  const d=(id,val)=>{const e=document.getElementById(id); if(e&&!String(e.value||'').trim()&&val) e.value=val;};   // 空欄のときだけ入れる（保存した答えは消さない）
  try{
    const [cases,persons]=await Promise.all([
      sb('cases?select=applicant,company,company_id,org,emp_set_idx,job_category,contract_start,contract_end,support_fee,so_office_idx,doc_create_date&id=eq.'+caseId),
      sb('persons?select=applicant_name_en,nationality&case_id=eq.'+caseId)
    ]);
    const cas=cases&&cases[0], pd=persons&&persons[0];
    // ver.20260715 と同じ：実在する列だけを指定する（無い列を混ぜると全部止まる）
    const cs='name,pref,city,address,tel,labor_ins_no,emp_sets';
    let co=null; const cid=companyId||(cas&&cas.company_id);
    if(cid){ const r=await sb('companies?select='+cs+'&id=eq.'+cid); co=r&&r[0]; }
    if(!co){ const nm=companyName||(cas&&cas.company); if(nm){ const r=await sb('companies?select='+cs+'&name=eq.'+encodeURIComponent(nm)); co=r&&r[0]; } }
    s('f_applicant',(pd&&pd.applicant_name_en)||(cas&&cas.applicant)||'');
    s('f_nationality',(pd&&pd.nationality)||info.nationality||'');
    // 雇用条件セット（1-6号と同じセット）
    let es={};
    const idx=(co&&typeof window.resolveEmpSetIdx==='function')?await window.resolveEmpSetIdx(co,cas,info):-1;
    if(co&&Array.isArray(co.emp_sets)&&idx>=0) es=co.emp_sets[idx]||{};
    s('f_kubun',es.category||(cas&&cas.job_category)||'');
    s('f_ceFrom',(cas&&cas.contract_start)||es.contractStart||'');
    s('f_ceTo',(cas&&cas.contract_end)||es.contractEnd||'');
    s('f_hW',es.weeklyH); s('f_hM',es.monthlyH);
    // 月額報酬：月給の人は月給、時給・日給の人は月額に直した額（1-6号の「月額換算」）、無ければ支払概算額
    s('f_pay',es.salaryMonthly||es.calcMonthly||es.totalMonthly); s('f_payH',es.calcHourly||es.salaryHourly); s('f_payJp',es.jpCompSalary);
    if(es.payMethod) s('f_payWay',/口座|振込|bank/i.test(es.payMethod)?'口座振込み':'通貨払');
    if(co){
      const ad=(co.pref||'')+(co.city||'')+(co.address||'');
      s('f_coName',co.name); s('f_coAddr',ad);
      s('f_coTel',(typeof ofusaFmtTelJP==='function'&&ofusaFmtTelJP(co.tel))||co.tel);
      s('f_office',String(es.officeName||es.orgName||'').trim()||co.name);
      s('f_officeAddr',String(es.officeAddr||es.orgAddress||'').trim()||ad);
      if(co.labor_ins_no && !/^[―ー\-\s]+$/.test(String(co.labor_ins_no))) s('f_laborNo',co.labor_ins_no);
      s('f_signCo',co.name);
    }
    // 登録支援機関（案件の登録支援機関が入っていれば「全部委託」）
    const orgName=String((cas&&cas.org)||info.orgName||'').trim();
    d('f_itaku',(orgName&&!/自社/.test(orgName))?'委託':'自社');
    if(v('f_itaku')==='委託' && orgName && typeof findSupportOrg==='function'){
      const org=await findSupportOrg(orgName,'name,corp_no,emp_ins_no,pref,city,address,address_detail,tel,rep_name,reg_no,reg_date,support_manager,languages,offices,support_staff_list');
      if(org){
        s('f_roName',org.name); s('f_roCorp',org.corp_no); s('f_roEi',org.emp_ins_no);
        // support_orgs.address は都道府県から始まる住所（pref+city を足すと二重になる）
        s('f_roAddr',org.address||((org.pref||'')+(org.city||'')+(org.address_detail||'')));
        s('f_roTel',(typeof ofusaFmtTelJP==='function'&&ofusaFmtTelJP(org.tel))||org.tel);
        s('f_roRep',org.rep_name); s('f_roRegNo',org.reg_no); s('f_roRegDate',org.reg_date);
        s('f_roSm',org.support_manager); s('f_roLang',org.languages);
        try{
          const o=(typeof org.offices==='string')?JSON.parse(org.offices):org.offices; const oi=parseInt(cas&&cas.so_office_idx||0)||0;
          const t=(Array.isArray(o)&&o.length)?(o[oi]||o[0]):null;
          // 事業所の住所は「都道府県＋市区町村＋番地」を優先（officeAddress に「東京都千代田区東京都千代田区…」と二重のものがあるため）
          const oa=t?(((t.officePref||'')+(t.officeCity||'')+(t.officeAddressDetail||'')) || t.officeAddress || ''):'';
          s('f_roOffice',(t&&t.officeName)||org.name); s('f_roOfficeAddr',oa||org.address);
        }catch(_e){ s('f_roOffice',org.name); }
        try{ const l=(typeof org.support_staff_list==='string')?JSON.parse(org.support_staff_list):org.support_staff_list; const ss=(Array.isArray(l)&&l.length)?(l[0].name||l[0]||''):''; s('f_roSs',ss||'支援計画書のとおり'); }catch(_e){ s('f_roSs','支援計画書のとおり'); }
        s('f_signRo',org.name);
      }
      s('f_roFee',(cas&&cas.support_fee)||es.supportFee||'');
    }
    // ふつうの答え（空欄のときだけ）
    Object.keys(DEF).forEach(k=>d(k,DEF[k]));
    if(v('f_itaku')==='自社') Object.keys(DEF_SELF).forEach(k=>d(k,DEF_SELF[k]));
    d('f_docDate',(cas&&cas.doc_create_date)||_today());
    p(); showToast('✅ データを読み込みました');
  }catch(e){showToast('⚠️ 読込エラー: '+e.message);console.error(e);}
}

function fitDocToPreview(){
  requestAnimationFrame(()=>{
    const pp=document.querySelector('.pp'); const area=document.getElementById('pageArea');
    if(!pp||!area) return;
    const ppW=pp.clientWidth-40, docW=794;
    area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom=(ppW<docW)?(ppW/docW):1; });
  });
}

window.addEventListener('message', async function(e){
  if(!e.data||e.data.type!=='SELECT_CASE') return;
  const info=e.data.info;
  if(!info||!info.caseId) return;
  const sel=document.getElementById('caseSelect');
  if(sel){
    let found=false;
    for(let o of sel.options){ try{ const d=JSON.parse(o.value); if(d.caseId===info.caseId){sel.value=o.value;found=true;break;} }catch(e2){} }
    if(!found){ const opt=document.createElement('option'); opt.value=JSON.stringify(info); opt.textContent='（indexから選択）'; sel.appendChild(opt); sel.value=opt.value; }
  }
  // まず共通関数で全入力欄を埋める（保存した答えもここで戻る）
  if(typeof loadCaseToForm==='function'){ await loadCaseToForm(info, 'tokkatsu_jidosha'); }
  if(typeof loadFromDB==='function') loadFromDB(info);
});
