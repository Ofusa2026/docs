/* ===== 1-17 様式固有CSS ===== */

/* ==========================================================================
   参考様式第1-17号  1号特定技能外国人支援計画書
   Screen + print stylesheet
   --------------------------------------------------------------------------
   原本: A4 横 / 本文 9pt(日本語 ＭＳ明朝) ・ 8pt(ベトナム語 Times New Roman)
   表組は Word の tblGrid をそのまま % に換算して再現しています。
   ========================================================================== */

/* --- 1. 基本設定 ------------------------------------------------------- */
:root{
  --sheet-w: 1040px;        /* A4横の本文幅 275mm 相当 @96dpi */
  --fs-base: 12px;          /* 9pt */
  --ink: #000;
  --rule: #000;
  --bg: #f4f4f5;
  --paper: #fff;
  --hair: 1px;              /* 0.25pt */
  --thin: 1px;              /* 0.50pt */
  --thick: 2px;             /* 1.50pt */
}

*, *::before, *::after{ box-sizing: border-box; }



/* --- 2. 用紙 ----------------------------------------------------------- */
.viewport{
  padding: 24px 16px 64px;
  overflow-x: auto;
}

.sheet{
  width: var(--sheet-w);
  margin:0;
  padding: 10mm 8mm 14mm;
  background: var(--paper);
  box-shadow: 0 1px 3px rgba(0,0,0,.16), 0 8px 28px rgba(0,0,0,.10);
  font-size: var(--fs-base);
}

/* --- 3. 段落 ----------------------------------------------------------- */
.sheet p{
  margin: 0;
  white-space: pre-wrap;      /* 記入用の空白（全角・半角）を保持 */
  line-height: 1.3333;
  tab-size: 4;
  overflow-wrap: break-word;
}

/* 原本は全段落 line=240exact（＝12pt固定の行送り）。
   9pt の日本語は 1.3333、8pt のベトナム語は 1.5 で同じ 12pt になる。 */
p.ja{ font-size: 1em;    line-height: 1.3333; }
p.vi{ font-size: .889em; line-height: 1.5; }

.a-center{ text-align: center; }
.a-right { text-align: right;  }
.a-both  { text-align: justify; }

/* 表紙まわりの見出し */
.doc-title{
  font-size: 1.55em;
  font-weight: bold;
  letter-spacing: .12em;
  text-align: center;
  margin: 1.1em 0 .1em;
}
.doc-title-vi{
  font-size: 1em;
  text-align: center;
  margin-bottom: 1.1em;
}
.form-no{ margin-bottom: .2em; }

/* --- 4. 表組 ----------------------------------------------------------- */
.tbl-wrap{ margin: 0 0 .9em; }

table.grid{
  width: 100%;
  table-layout: fixed;         /* colgroup の % をそのまま効かせる */
  border-collapse: collapse;
  border-spacing: 0;
}

table.grid td{
  padding: .18em .2em;         /* Word の tblCellMar 99twips 相当 */
  vertical-align: middle;      /* 原本は全セル vAlign=center */
  word-break: break-word;
  border-style: solid;
  border-color: var(--rule);
  border-width: var(--thin);   /* 既定値。実際の太さは borders.css が上書き */
}

/* 罫線の太さはセルごとに borders.css で指定（Word の tcBorders を忠実に再現）。
   クラス名 b-<上><左><下><右>   n=なし / h=0.25pt / t=0.5pt / k=1.5pt */

/* --- 5. 縦書きセル（Ⅰ〜Ⅳ の見出し） ---------------------------------- */
td.vert{
  writing-mode: vertical-rl;
  text-orientation: mixed;
  padding: .3em .1em;
}
/* 原本どおり縦書きの見出しは1行に流す（折り返すとセル幅＝縦書きの行数を
   超えて隣の欄へはみ出す）。原本の行送りは line=160exact ＝ 8pt。 */
td.vert p{
  white-space: normal;
  text-align: center;
  margin: 0 .05em;
  font-size: .9em;
  line-height: 1.25;
  letter-spacing: .02em;
}
/* 縦書きセルは内容がはみ出さないよう縦方向に収める */
td.vert{ overflow: hidden; }

/* --- 6. チェックボックス ----------------------------------------------- */
input.cb{
  -webkit-appearance: none;
  appearance: none;
  display: inline-block;
  /* 原本の □ は全角1文字ぶん。ただし 1em ちょうどだと「□有（　　　）」のような
     行が桁あふれで折り返してしまうため、わずかに小さい 0.9em とする。 */
  width: .9em;
  height: .9em;
  margin: 0;
  padding: 0;
  border: var(--thin) solid var(--ink);
  background: transparent;
  vertical-align: -.14em;
  cursor: pointer;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
/* ver.20261020.06: チェック時は ✔ ではなく塗りつぶしの ■ で表示する。
   原本の記入例が □→■ の塗りつぶしであるため。 */
input.cb:checked{
  background: var(--ink);
}
input.cb:checked::after{ content: none; }
input.cb:focus-visible{ outline: 2px solid #0b57d0; outline-offset: 1px; }

/* --- 7. 改ページ（原本の明示的な改ページ位置） ------------------------- */
.pagebreak{ break-after: page; page-break-after: always; height: 0; }

/* --- 8. ツールバー（画面のみ） ----------------------------------------- */
.sr-only{
  position: absolute; width: 1px; height: 1px;
  margin: -1px; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}




#fitmode:checked ~ 

/* --- 9. レスポンシブ ---------------------------------------------------- */
/* 既定: 画面幅がシートより狭い場合は用紙全体を縮小して全幅表示 */

}

  width: var(--sheet-w);

  padding: 10mm 8mm 14mm;

}

}

.b-hknt{border-width:var(--hair) var(--thin) 0 var(--thick)}

/* ver.20261029.02: 作成日の行は下線だけにする（table.grid td の細線指定に負けて上・左右にも線が出ていた） */

/* ==========================================================================
   11. 記入欄（入力フォーム）
   --------------------------------------------------------------------------
   入力欄は元の空白とまったく同じ幅で置き換え、セル全体の記入欄は絶対配置に
   しているため、組版（行の高さ・改ページ位置）は静的版と変わりません。
   ========================================================================== */
td.fld{ position: relative; }
td.fld > .sp{ visibility: hidden; }     /* 行の高さを元のまま保つための下敷き */

textarea.f{
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  margin: 0; padding: .18em .2em;
  font: inherit; line-height: 1.3333; color: inherit;
  border: 0; border-radius: 0; background: transparent;
  resize: none; overflow: auto;
}

input.bl{                                /* 行中の記入欄（〒・年月日など） */
  font: inherit; line-height: inherit; color: inherit;
  margin: 0; padding: 0; border: 0; border-radius: 0;
  background: transparent;
  vertical-align: baseline;
  text-align: center;
  min-width: 0;
}

/* 「有・無」などは○で囲んで選ぶ。
   選択肢は inline のままにする。inline-block にすると、字下げ（text-indent）
   のある段落の行頭に来たとき、その字下げ分まで箱に含まれて○が横に伸びる。 */
.chc .opt{ cursor: pointer; }
.chc .opt input{ position: absolute; opacity: 0; width: 0; height: 0; }
.chc .opt input:checked + span{
  outline: 1.2px solid currentColor;     /* outline は組版に影響しない */
  outline-offset: 1px;
  border-radius: 1em;
}
.chc .opt input:focus-visible + span{ background: #dbe9ff; }
/* ver.20261015.01: 常に〇が付く固定選択肢。
   「支援の適正性を確保していることの有無」のように答が必ず「有」になる欄は、
   ラジオを置かず選択済みの見た目だけを埋め込む（国籍・ほか0名と同じ方針）。
   見た目は input:checked + span と同一。 */
.chc .fixed{
  outline: 1.2px solid currentColor;
  outline-offset: 1px;
  border-radius: 1em;
}

  padding:0 !important; margin:0 !important; width:auto !important; min-height:0 !important;
  box-shadow:none !important; background:transparent !important;
}

/* ver.20260913.42: 画面プレビューの可読性（縮小表示でも潰れないよう行間確保） */
#pageArea .doc.p17doc p.ja{ line-height:1.4; }
#pageArea .doc.p17doc p.vi{ line-height:1.35; }
#pageArea .doc.p17doc td.vert p{ line-height:1.3; letter-spacing:.02em; }

/* ver.20261029.04: 画面の1ページ＝印刷の紙1枚。画面でもA4横の比率（297:210）の紙に見せる。 */
#pageArea .doc.p17doc{ min-height:735px !important; }
@media print{
  .p17page{ break-after:page; page-break-after:always; break-inside:avoid; page-break-inside:avoid; }
  .p17page:last-child{ break-after:auto; page-break-after:auto; }
  /* 紙に収まらないページだけ印刷時に縮める（値は各ページの style="--pz:…"） */
  .p17page{ zoom:var(--pz,1); }
  #pageArea .doc.p17doc{ min-height:0 !important; }
}

/* ver.20261029.05: 縦書き見出し（Ⅳ・項目番号など）が細い列からはみ出してベトナム語が切れていた。
   日本語・ベトナム語の2行が列幅に収まるよう、文字と行間を詰める（長いときは縦方向に折り返す）。 */
#pageArea .doc.p17doc td.vert{ padding:.15em 0 !important; }
#pageArea .doc.p17doc td.vert p{ margin:0 !important; padding-left:0 !important; line-height:1.05 !important; letter-spacing:0 !important; white-space:normal !important; }
#pageArea .doc.p17doc td.vert p.ja{ font-size:.85em !important; }
#pageArea .doc.p17doc td.vert p.vi{ font-size:.7em !important; }
@media print{
  #pageArea .doc.p17doc td.vert p.ja{ font-size:.78em !important; }
  #pageArea .doc.p17doc td.vert p.vi{ font-size:.62em !important; }
}

/* ver.20261104.01: 1ページ＝1枚に分けたので、表の中の改ページ（Wordの改ページ位置）は使わない。

/* ver.20261105.01: 表記ゆれをそろえてから辞書を引く（全角→半角、3ヶ月/3カ月→3か月、1週間→一週間、一回/一度→1回、空白なし） */
function _p17Nk(t){
  t=String(t||'');
  try{ t=t.normalize('NFKC'); }catch(e){}
  return t.replace(/[\s　]+/g,'').replace(/(\d)[ヶヵカケか]月/g,'$1か月').replace(/1週間/g,'一週間').replace(/一回|一度/g,'1回');

var _p17ViN = null;      // 正規化した辞書（静的）

try{ var _ls=JSON.parse(localStorage.getItem('p17_en_learned')||'{}'); if(_ls && typeof _ls==='object') Object.assign(window._p17ViLearned,_ls); }catch(e){}
window._p17Untr = window._p17Untr || {};   // 今の画面で訳せなかった語（原文→true）
function _p17Look(x){
  if(!_p17ViN){ _p17ViN={}; Object.keys(P17_VI_DICT).forEach(function(k){ _p17ViN[_p17Nk(k)]=P17_VI_DICT[k]; }); }
  var k=_p17Nk(x); if(!k) return '';
  return _p17ViN[k] || window._p17ViLearned[k] || '';
}
/* 辞書の語を中に含むだけの文（例：電話 06-1234-5678）は、語を置き換えて日本語が残らなければそれを使う */
function _p17Subst(x){
  if(!_p17ViN) _p17Look('');
  var t=String(x), keys=Object.keys(_p17ViN).filter(function(k){ return k.length>=2; }).sort(function(a,b){ return b.length-a.length; });
  var out=String(t); try{ out=out.normalize('NFKC'); }catch(e){}
  keys.forEach(function(k){ if(out.indexOf(k)>=0) out=out.split(k).join(' '+_p17ViN[k]+' '); });
  out=out.replace(/\s+/g,' ').trim();
  return _P17_JP.test(out) ? '' : out;
}
function _p17Vi(t){
  t=String(t||'').trim(); if(!t) return '';
  var hit=_p17Look(t); if(hit) return hit;
  if(!_P17_JP.test(t)) return t;   // 電話番号・メールアドレスなどはそのまま
  // 「有（適宜実施）」「直接面談(月1回)」のようなカッコ付きは、外と中を別々に訳す
  var pm=t.match(/^([^（(]+)[（(](.+)[）)]$/);
  if(pm && !/[（(]/.test(pm[2])) return _p17Vi(pm[1])+' ('+_p17Vi(pm[2])+')';
  return t.split(/／/).map(function(a){
    a=a.trim(); var h=_p17Look(a); if(h) return h;
    if(!_P17_JP.test(a)) return a;
    return a.split(/[・、,，]/).map(function(b){
      b=b.trim(); if(!b) return '';
      if(/^(電話番号記載なし|記載チェック無し|記載文言多数|確認方法(欄)?未(チェック|記載))$/.test(_p17Nk(b))) return '';   // 読み取り時のメモは出さない
      var h2=_p17Look(b) || _p17Subst(b); if(h2) return h2;
      if(!_P17_JP.test(b)) return b;
      window._p17Untr[b]=true; return b;
    }).filter(Boolean).join(', ');
  }).join(' / ');
}
function _p17EscMark(s){
  var e=String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return e.replace(/[぀-ヿ㐀-鿿々〆〜「」（）：＝]+/g, function(m){ return '<span class="p17-untr">'+m+'</span>'; });
}

<div class="p17page"><div class="doc p17doc"><p class="ja">（注意）</p>
<p class="ja">１　Ⅰ欄は，支援対象者が複数名いる場合であって支援内容が同一の場合に限り，「１　氏名に「別紙の名簿のとおり」と記載し，Ⅰ欄の事項が記載された名簿（任意様式）を添付することとして差し支えない。ただし，申請を同時に行う場合に限る。</p>
<p class="ja" style="padding-left:3.00em;text-indent:-3.00em">２　Ⅱ欄４は，特定技能所属機関自らが１号特定技能外国人支援計画を実施する場合のみ記載すること。</p>
<p class="ja" style="padding-left:3.00em;text-indent:-3.00em">３　Ⅲ欄は，１号特定技能外国人支援計画の全部の実施を登録支援機関に委託する場合のみ記載すること。</p>
<p class="ja">４　Ⅳ欄１から９までの「実施予定」欄は，該当するものにチェックをし，実施予定が「有」の場合は実施時期を簡潔に記載し，「無」の場合は当該支援を実施しない理由について括弧内に記載すること。</p>
<p class="ja">５　Ⅳ欄１から９までの「委託の有無」欄は，特定技能所属機関が支援の一部を第三者に委託（登録支援機関に委託する場合を除く。）する場合にのみ「有」と記載し，特定技能所属機関が自ら支援を行う場合や登録支援機関に支援の全部を委託する場合には「無」と記載すること。</p>
<p class="ja">６　Ⅳ欄１から８までの「支援担当者又は委託を受けた支援実施者」欄は，特定技能所属機関が自ら支援を行う場合や登録支援機関に支援の全部を委託する場合に選任することとされている支援担当者を支援項目ごとに氏名及び括弧内に役職を記載し，特定技能所属機関から委託の一部を受けた第三者が支援を実施する場合は支援の委託を受けた者の氏名及び所在地を記載すること。</p>
<p class="ja" style="text-indent:1.00em">なお，Ⅳ欄９の「支援責任者又は支援担当者」欄は，特定技能所属機関が自ら支援を行う場合や登録支援機関に支援の全部を委託する場合に選任することとされている支援責任者又は支援担当者の氏名及び括弧内に役職を記載すること。このうちｂ欄及び自由記入欄については同欄の支援を特定技能所属機関から委託の一部を受けた第三者が実施する場合は支援の委託を受けた者の氏名及び所在地を記載すること。</p>
<p class="ja">７　Ⅳ欄１から４まで及び９の「実施方法」欄は，該当するものにチェックをすること。「その他」にチェックする場合は，その実施方法について括弧内に記載すること。</p>
<p class="ja">８　Ⅳ欄３アｄ「居室の広さ」について，該当するものを括弧内のチェックボックスから選択すること。</p>
<p class="ja">②から④までは、①で有にチェックを付した場合にのみ記載すること。</p>
<p class="ja">③は、「自己所有物件」、「借上物件」のいずれかにチェックを付すこと。</p>
<p class="ja">④は、例えば以下のような観点から記載し、説明が適切にされなければならない</p>
<p class="ja" style="padding-left:2.21em;text-indent:-1.11em">・	③が「自己所有物件」の場合：　実際に建設・改装等に要した費用、物件の耐用年数、入居する特定技能外国人の人数等を勘案して合理的であると説明可能な額</p>
<p class="ja" style="padding-left:2.21em;text-indent:-1.11em">・	③が「借上物件」の場合：　借上げに要する賃料（管理費・共益費等を含み、敷金・礼金・保証金・仲介手数料は含まない。以下同じ。）を、入居する特定技能外国人の人数で除した額</p>
<p class="ja">９　Ⅳ欄６イの「対応時間」欄は，対応可能曜日についてその時間帯を記載すること。</p>
<p class="vi">(Notes)</p>
<p class="vi">1	Column I: If there are multiple people who are supposed to receive support and the contents of the support are the same, for “1 Name” write, “As given in the attached name list”, and attach a name list (no set format) for the matters set out in column I. However, this applies only to applications filed at the same time.</p>
<p class="vi">2	Column II-4: Fill in this section only if the organization of affiliation of the specified skilled worker itself is to implement the support plan for specified skilled workers (i).</p>
<p class="vi">3	Column III: Fill in this section only when entrusting the implementation of all support plans for specified skilled workers (i) to a registered support organization.</p>
<p class="vi">4	“Scheduled implementation” in Column IV-1 to 9: Select the applicable items. If the scheduled implementation is “Yes”, briefly describe the implementation time; and if “No”, describe the reasons for not implementing the support in the parentheses.</p>
<p class="vi">5 Only tick “Yes” for the “Outsourced” section in Column IV-1 to 9, if the organization of affiliation of the specified skilled worker is to entrust part of the support to a third party (excluding the cases when it is outsourced to a registered support organization). If the organization of affiliation of the specified skilled worker itself is to provide support or entrust all of the support to a registered support organization, tick “No”.</p>
<p class="vi">6 “Support staff or implementing staff if the support is to be outsourced” in Column IV-1 to 8: If the organization of affiliation of the specified skilled worker itself is to provide support or entrust all of the support to a registered support organization, list the names of the appointed support staff, followed by their titles in parenthesis, for each type of support given. If a third party partly entrusted by the organization of affiliation of the specified skilled worker is to provide support, list the names and addresses of the staff entrusted for the support.</p>
<p class="vi" style="text-indent:0.86em">In addition, “Support manager or support staff” in Column IV-9: If the organization of affiliation of the specified skilled worker itself is to provide support or entrust all of the support to a registered support organization, list the names of the appointed support manager or support staff, followed by their titles in parenthesis, for each type of support given. In addition, if the support work described in the same column is performed by the third party partly entrusted by the organization of affiliation of the specified skilled worker, list the names and addresses of the staff entrusted for the support in column b and the free-entry column.</p>
<p class="vi">7	“Implementation method” in Column IV-1 to 4, 9: Select the applicable items. If you select “Others”, give the method of implementation in the parentheses.</p>
<p class="vi">8	With regard to “Size of room” in IV Cell 3-A-d, select the appropriate check box from within the parentheses.</p>
<p class="vi">Answer ② to ④ only if you have selected “Yes” in ①.</p>
<p class="vi">For ③, tick either “Owned property” or “Rental property.”</p>
<p class="vi">For ④, provide a proper explanation, including the following information, for example:</p>
<p class="vi" style="padding-left:2.21em;text-indent:-1.11em">- If ③ accommodation provided is an owned property: The amount that can be reasonably justified, considering actual costs incurred in building or renovating the property, the useful life of the property, the number of specified skilled workers occupying the property, etc.</p>
<p class="vi" style="padding-left:2.21em;text-indent:-1.11em">- If ③ accommodation provided is a rental property: The amount obtained by dividing the rent required for renting the property (including management charges and common area service charges but not including the security deposit, key money, guarantee money, and agent's commissions; and the same definition applies hereinafter.) by the number of specified skilled workers occupying the property.</p>
<p class="vi">9 “Response times” in Column IV-6, B: Give the times for the available days of the week.</p>

async function loadFromDB(passedInfo){
  var info=passedInfo;
  if(!info){ var sel=document.getElementById('caseSelect'); if(!sel||!sel.value) return; try{info=JSON.parse(sel.value);}catch(e){return;} }
  if(!info||!info.caseId) return;
  var caseId=info.caseId, companyId=info.companyId, companyName=info.companyName;
  var _s=function(id,val){var e=document.getElementById(id); if(e&&val!=null&&val!=='') e.value=val;};
  /* ver.20261013.02: 住所文字列を 都道府県／市区町村／以降 に分割（1_17.html Word版 splitAddress と同一仕様） */
  var _splitAddr=function(str){
    if(!str) return {pref:'',city:'',rest:''};
    var pm=String(str).match(/^(北海道|東京都|(?:京都|大阪)府|.{2,3}県)/);
    var pref=pm?pm[1]:''; var r1=pm?String(str).substring(pref.length):String(str);
    var cm=r1.match(/^(.+?[市区町村郡])/);
    var city=cm?cm[1]:''; var rest=cm?r1.substring(city.length):r1;
    return {pref:pref,city:city,rest:rest};
  };
  /* ver.20261013.11: 電話番号の3分割ヘルパー(_setTel)は、全ての電話欄を
     「案シスの値をそのまま1本で表示」に統一したため不要になり削除した。 */
  /* "2026-10-01" / "2026年10月1日" を es_<base>Y/M/D にセット（月日は先頭0を落とす） */
  var _setYMD=function(base,val){

      }
    }catch(e){ console.warn('[selfSupport]',e); }
  }
  const ids=[]; if(coId) ids.push('co_'+coId); if(caseId) ids.push(caseId);
  if(ids.length){
    const q=ids.map(x=>`"${x}"`).join(',');

    box.insertBefore(el, box.firstChild);
  }
  var d=''; try{ var t=new Date(at); d=t.getFullYear()+'/'+(t.getMonth()+1)+'/'+t.getDate()+' '+('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2); }catch(_){}
  el.innerHTML = (loaded ? '💾 前回の保存（'+d+(by?'・'+String(by).replace(/</g,'&lt;'):'')+'）を読み込みました。'
                          : '💾 保存しました（'+d+'）')
    + (loaded ? '<br><a href="#" onclick="_p17Reload();return false;" style="color:#1d4ed8">保存を使わず、案件データから作り直す</a>' : '');
}
async function _p17LoadSaved(){
  var cid = _p17CaseId(); if(!cid) return false;
  var rows = await sb('saysay_form_state?select=state,saved_at,saved_by&case_id=eq.'+encodeURIComponent(cid)+'&doc_file=eq.'+encodeURIComponent(P17_DOC)+'&order=saved_at.desc&limit=1');
  var r = rows && rows[0]; if(!r || !r.state) return false;
  var st = r.state;
  Object.keys(st.side||{}).forEach(function(id){ var el=document.getElementById(id); if(el) el.value=st.side[id]; });
  window._p17Text  = Object.assign({}, st.text||{});
  window._p17Check = Object.assign(_p17DefaultChecks(), st.check||{});
  window._p17Radio = Object.assign({}, st.radio||{});
  p();
  _p17SavedNote(r.saved_at, r.saved_by, true);
  return true;
}
async function _p17Reload(){
  if(!confirm('保存した内容を使わず、案件データとヒアリング回答から作り直します。（保存した内容は消えません）')) return;
  document.querySelectorAll('input[id^="es_"],input[id^="f_"],textarea[id^="es_"],textarea[id^="f_"]').forEach(function(el){ el.value=''; });
  window._p17Check=_p17DefaultChecks(); window._p17Text={}; window._p17Radio={};
  window._p17SkipSaved = true;
  try{ await loadFromDB(window._lastCaseInfo || {caseId:_p17CaseId()}); } finally { window._p17SkipSaved = false; }
  var el=document.getElementById('p17SavedNote'); if(el) el.innerHTML='案件データとヒアリング回答から作り直しました。必要なら「💾 DB保存」で保存してください。';
}

// プレビューをプレビュー領域の幅に収める（横長A4を自動縮小）
function p17Fit(){
  var area=document.getElementById('pageArea'); if(!area) return;
  var pages=area.querySelectorAll('.p17page'); if(!pages.length) return;
  var avail=area.clientWidth - 40;
  if(avail<=0){ requestAnimationFrame(p17Fit); return; }
  pages.forEach(function(pg){
    var d=pg.querySelector('.doc.p17doc'); if(!d) return;
    d.style.transform='none';
    var w=d.offsetWidth||1040, h=d.offsetHeight;
    var scale=Math.min(1, avail/w);
    d.style.transformOrigin='top left';
    d.style.transform='scale('+scale+')';
    pg.style.width=(w*scale)+'px';
    pg.style.height=(h*scale)+'px';
    pg.style.margin='0 0 24px 0';
    pg.style.overflow='hidden';
  });
}
window.addEventListener("resize", function(){ if(!window._editMode) p17Fit(); });
// iframeが後から表示される（タブ切替）ケース: 可視化・フォーカス・visibilitychangeで再フィット
window.addEventListener('focus', function(){ if(!window._editMode) p17Fit(); });
document.addEventListener('visibilitychange', function(){ if(!document.hidden && !window._editMode) p17Fit(); });
(function(){
  var area=document.getElementById('pageArea');
  if(area && window.IntersectionObserver){
    try{ new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting && !window._editMode) p17Fit(); }); }).observe(area); }catch(e){}
  }
  // 保険: 起動後しばらく定期的にfit（幅が遅れて確定する環境向け）
  var n=0, t=setInterval(function(){ n++; if(!window._editMode) p17Fit(); if(n>=6) clearInterval(t); }, 400);
})();
// pageAreaの幅変化を監視して常にフィット（iframe内で初期幅が遅れて確定するケース対策）
(function(){
  function obs(){
    var area=document.getElementById('pageArea'); if(!area||!window.ResizeObserver) return;
    try{ new ResizeObserver(function(){ if(!window._editMode) p17Fit(); }).observe(area); }catch(e){}
  }
  if(document.readyState!=='loading') obs(); else document.addEventListener('DOMContentLoaded',obs);
})();

document.addEventListener('DOMContentLoaded', function(){
  if(typeof initCommon==='function'){ try{ initCommon(); }catch(e){} }
  p();
  var q=new URLSearchParams(location.search).get('case');
  if(q){ loadFromDB({caseId:q}); }
  setTimeout(function(){ p17Fit(); if(typeof setupPageTracker==="function") setupPageTracker(); },120);
});


/* ver.20261013.04: index.html からの案件選択(SELECT_CASE)を受信する。
   index 側は 1_17_vi の iframe にも postMessage を送っていたが、この書類だけ
   受信リスナーが無く、左パネルでの案件選択や「ジャンプ」で何も入らなかった。
   1_6_vi.html と同じ実装を移植する。
   ※ loadCaseToForm は呼ばない。この書類の loadFromDB が companies.emp_sets を
     自分で読んでおり、後から loadCaseToForm が走ると es_* を一旦クリアして
     emp_sets の総当たりで上書きするため、会社・支援機関の値が消えてしまう。 */
if(!window._selectCaseListenerAdded){
  window._selectCaseListenerAdded=true;
  window.addEventListener('message', async function(e){
    if(!e.data||e.data.type!=='SELECT_CASE') return;
    var info=e.data.info;
    if(!info||!info.caseId) return;
    console.log('[1-17en] SELECT_CASE received:', info);
    /* RLS用トークンと案件情報の共有（通常は loadCaseToForm が行う処理）。 */
    try{ if(info.token) window.__OFUSA_SB_TOKEN=info.token; }catch(_e){}
    window._lastCaseInfo=info;
    /* 前案件の値が残らないよう入力欄をクリアしてから読み込む。 */
    try{
      document.querySelectorAll('input[id^="es_"],input[id^="f_"],textarea[id^="es_"],textarea[id^="f_"]').forEach(function(el){ el.value=''; });
      window._fieldData={};
      /* ver.20261020.11: チェック状態も既定へ戻す。
         残すと前の案件で外したチェックが次の案件に持ち越される。 */
      window._p17Check = _p17DefaultChecks();
      window._p17Text = {};   // ver.20261029.06: 前の案件の本文の文字も持ち越さない
      window._p17Radio = {};
    }catch(_e){ console.warn('[1-17en] 入力欄クリア失敗:', _e); }
    /* 書類内の案件セレクトも選択状態を合わせる（無ければ項目を足す）。 */
    var sel=document.getElementById('caseSelect');
    if(sel){
      var found=false;
      for(var i=0;i<sel.options.length;i++){
        try{ if((JSON.parse(sel.options[i].value)||{}).caseId===info.caseId){ sel.value=sel.options[i].value; found=true; break; } }catch(_x){}
      }
      if(!found){
        var opt=document.createElement('option');
        opt.value=JSON.stringify(info);
        opt.textContent='（indexから選択）';
        sel.appendChild(opt); sel.value=opt.value;
      }
    }
    if(typeof loadFromDB==='function'){ await loadFromDB(info); }
  });
}
