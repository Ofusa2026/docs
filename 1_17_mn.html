"<p class=\"vi\">6 “Support staff or implementing staff if the support is to be outsourced” in Column IV-1 to 8: If the organization of affiliation of the specified skilled worker itself is to provide support or entrust all of the support to a registered support organization, list the names of the appointed support staff, followed by their titles in parenthesis, for each type of support given. If a third party partly entrusted by the organization of affiliation of the specified skilled worker is to provide support, list the names and addresses of the staff entrusted for the support.</p>",
"<p class=\"vi\" style=\"text-indent:0.86em\">In addition, “Support manager or support staff” in Column IV-9: If the organization of affiliation of the specified skilled worker itself is to provide support or entrust all of the support to a registered support organization, list the names of the appointed support manager or support staff, followed by their titles in parenthesis, for each type of support given. In addition, if the support work described in the same column is performed by the third party partly entrusted by the organization of affiliation of the specified skilled worker, list the names and addresses of the staff entrusted for the support in column b and the free-entry column.</p>",

"<p class=\"vi\">(Тайлбар)</p>",
"<p class=\"vi\">1\tI хэсэгт дэмжлэгт хамаарах этгээд олон хүн байх тохиолдолд бөгөөд дэмжлэгийн агуулга нь ижил байхаас гадна, “1 Овог нэр”-д “Хавсралт дахь нэрсийн дагуу” гэж бичиж, Ⅰ хэсгийн зүйлүүдийг бичсэн нэрс (дурын форматаар) хавсаргахад ямар нэг асуудал байхгүй. Гэхдээ зөвхөн өргөдөл өгөх үед л хамт өгөхийг зөвшөөрнө.</p>",
"<p class=\"vi\">2\tII-4 хэсгийг тусгай ур чадварын харьяа байгууллага нь өөрсдөө 1-р тусгай ур чадвартай гадаад иргэний дэмжлэгийн төлөвлөгөөг хэрэгжүүлэх тохиолдолд л бичнэ.</p>",
"<p class=\"vi\">3\tIII хэсгийг 1-р тусгай ур чадвартай гадаад иргэний дэмжлэгийн төлөвлөгөөний бүх хэрэгжилтийг бүртгэлтэй дэмжлэгийн байгууллагад захиалгаар гүйцэтгүүлэх тохиолдолд л бичнэ.</p>",
"<p class=\"vi\">4\tIV-1-с 9 хүртэлх “Хэрэгжүүлэх төлөвлөгөө” хэсгийг тохирох зүйлийг чагталж, хэрэгжүүлэх төлөвлөгөөг “Байгаа” байх тохиолдолд хэрэгжүүлэх хугацааг товч бичих ба “Байхгүй” тохиолдолд тухайн дэмжлэгийг хэрэгжүүлэхгүй байх шалтгааны тухай хаалт дотор бичнэ.</p>",
"<p class=\"vi\">5 IV-1-с 9 хүртэлх “Захиалан гүйцэтгүүлэх эсэх” хэсгийг зөвхөн тусгай ур чадварын харьяа байгууллага дэмжлэгийн зарим хэсгийг гуравдагч этгээдэд захиалах (бүртгэлтэй дэмжлэгийн байгууллагад захиалах тохиолдол үүнд хамаарахгүй) тохиолдолд “Байгаа” гэх бөгөөд тусгай ур чадварын харьяа байгууллага дэмжлэгийг өөрөө хэрэгжүүлэх эсвэл бүртгэлтэй дэмжлэгийн байгууллагад бүрэн захиалсан тохиолдолд “Байхгүй” гэж тэмдэглэнэ.</p>",
"<p class=\"vi\">6 IV-1-с 8 хүртэлх “Дэмжлэг хариуцагч эсвэл захиалга авсан дэмжлэгийн байгууллага” хэсгийг тусгай ур чадварын харьяа байгууллага дэмжлэгийг өөрөө хэрэгжүүлэх эсвэл бүртгэлтэй дэмжлэгийн байгууллагад бүрэн захиалсан тохиолдолд томилох ёстой гэж заасан Дэмжлэг хариуцагчийг дэмжлэгийн төрөл тус бүрээр овог нэр болон албан тушаалыг нь бичиж, тусгай ур чадварын харьяа байгууллагаас захиалга хүлээн авсан гуравдагч этгээд дэмжлэгийг хэрэгжүүлэх тохиолдолд тухайн гүйцэтгэгч этгээдийн нэр, хаягийг бичнэ.</p>",
"<p class=\"vi\" style=\"text-indent:0.86em\">Мөн IV хэсгийн 9-н “Дэмжлэг хариуцагч болон дэмжлэг гүйцэтгэгч” хэсэгт тусгай ур чадварын харьяа байгууллага нь өөрөө дэмжлэг үзүүлэх, эсвэл бүртгэлтэй дэмжлэгийн байгууллагад дэмжлэгийг бүрэн хариуцуулах тохиолдолд сонгон томилогдох дэмжлэг хариуцагч болон дэмжлэг гүйцэтгэгчийн овог нэр, хаалт дотор албан тушаалыг бичнэ. Үүн дотор b хэсэг болон чөлөөтэй бичих хэсгийн хувьд тусгай ур чадварын харьяа байгууллагаас ажлыг хэсэгчлэн хүлээн авсан гуравдагч этгээд хэрэгжүүлэх тохиолдолд дэмжлэгийн ажлыг хүлээн авсан этгээдийн овог нэр болон байршлыг бичнэ.</p>",
"<p class=\"vi\">7\tIV-1-с 4 хүртэлх болон 9-н “Хэрэгжүүлэх арга зам” хэсэгт тохирох зүйлийг чагтлах. “Бусад”-г чагтлах тохиолдолд түүний хэрэгжүүлэх арга замын тухай хаалт дотор бичнэ.</p>",
"<p class=\"vi\">8\tIV 3-A-d -д “Өрөөний хэмжээ”-ний тухайд тохирох зүйлийг хаалт доторх нүднээс сонгож чагтална.</p>",
"<p class=\"vi\">① -д Байгаа гэж хариулсан тохиолдолд ②-с ④ хүртэлхийг бичнэ.</p>",
"<p class=\"vi\">③ -д “Өөрийн байр”, “Түрээсийн байр” хэсэгт тохирох зүйлийг сонгож чагтлана.</p>",
"<p class=\"vi\">④ -д жишээлбэл дараах байдлаар бичиж, зөв тайлбарлах ёстой:</p>",
"<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- ③ “Өөрийн байр” бол: Барилга, засварын бодит зардал, барилгын ашиглалтын хугацаа, оршин суух тусгай ур чадвартай гадаад иргэдийн тоо зэргийг харгалзан үндэслэлтэй гэж тайлбарлах боломжтой дүн.</p>",
"<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- ③ “Түрээсийн байр” бол: Түрээслэхэд шаардлагатай түрээсийн төлбөр (СӨХ-ийн төлбөр орно; барьцааны мөнгө, урамшууллын мөнгө, баталгааны мөнгө, зуучлалын хураамж орохгүй)-ийг оршин суух тусгай ур чадвартай гадаад иргэдийн тоонд хуваасан дүн.</p>",
"<p class=\"vi\">9 IV-6 B хэсгийн “Шийдвэрлэх хугацаа” хэсэгт шийдвэрлэх боломжтой гарагийн цагийн хүрээг бичнэ.</p>"
