\" name=\"f405\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> Бусад арга (<input type=\"text\" class=\"bl\" id=\"f406\" name=\"f406\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿)\" style=\"width:17.00em\">)</p><p class=\"vi\" style=\"padding-left:6.30em\">Тайлбар:</p></td>"],0,1],[2244,16,2543715452,["<p class=\"vi\">(Тайлбар)</p>","<p class=\"vi\">1\tI хэсэгт дэмжлэгт хамаарах этгээд олон хүн байх тохиолдолд бөгөөд дэмжлэгийн агуулга нь ижил байхаас гадна, “1 Овог нэр”-д “Хавсралт дахь нэрсийн дагуу” гэж бичиж, Ⅰ хэсгийн зүйлүүдийг бичсэн нэрс (дурын форматаар) хавсаргахад ямар нэг асуудал байхгүй. Гэхдээ зөвхөн өргөдөл өгөх үед л хамт өгөхийг зөвшөөрнө.</p>","<p class=\"vi\">2\tII-4 хэсгийг тусгай ур чадварын харьяа байгууллага нь өөрсдөө 1-р тусгай ур чадвартай гадаад иргэний дэмжлэгийн төлөвлөгөөг хэрэгжүүлэх тохиолдолд л бичнэ.</p>","<p class=\"vi\">3\tIII хэсгийг 1-р тусгай ур чадвартай гадаад иргэний дэмжлэгийн төлөвлөгөөний бүх хэрэгжилтийг бүртгэлтэй дэмжлэгийн байгууллагад захиалгаар гүйцэтгүүлэх тохиолдолд л бичнэ.</p>","<p class=\"vi\">4\tIV-1-с 9 хүртэлх “Хэрэгжүүлэх төлөвлөгөө” хэсгийг тохирох зүйлийг чагталж, хэрэгжүүлэх төлөвлөгөөг “Байгаа” байх тохиолдолд хэрэгжүүлэх хугацааг товч бичих ба “Байхгүй” тохиолдолд тухайн дэмжлэгийг хэрэгжүүлэхгүй байх шалтгааны тухай хаалт дотор бичнэ.</p>","<p class=\"vi\">5 IV-1-с 9 хүртэлх “Захиалан гүйцэтгүүлэх эсэх” хэсгийг зөвхөн тусгай ур чадварын харьяа байгууллага дэмжлэгийн зарим хэсгийг гуравдагч этгээдэд захиалах (бүртгэлтэй дэмжлэгийн байгууллагад захиалах тохиолдол үүнд хамаарахгүй) тохиолдолд “Байгаа” гэх бөгөөд тусгай ур чадварын харьяа байгууллага дэмжлэгийг өөрөө хэрэгжүүлэх эсвэл бүртгэлтэй дэмжлэгийн байгууллагад бүрэн захиалсан тохиолдолд “Байхгүй” гэж тэмдэглэнэ.</p>","<p class=\"vi\">6 IV-1-с 8 хүртэлх “Дэмжлэг хариуцагч эсвэл захиалга авсан дэмжлэгийн байгууллага” хэсгийг тусгай ур чадварын харьяа байгууллага дэмжлэгийг өөрөө хэрэгжүүлэх эсвэл бүртгэлтэй дэмжлэгийн байгууллагад бүрэн захиалсан тохиолдолд томилох ёстой гэж заасан Дэмжлэг хариуцагчийг дэмжлэгийн төрөл тус бүрээр овог нэр болон албан тушаалыг нь бичиж, тусгай ур чадварын харьяа байгууллагаас захиалга хүлээн авсан гуравдагч этгээд дэмжлэгийг хэрэгжүүлэх тохиолдолд тухайн гүйцэтгэгч этгээдийн нэр, хаягийг бичнэ.</p>","<p class=\"vi\" style=\"text-indent:0.86em\">Мөн IV хэсгийн 9-н “Дэмжлэг хариуцагч болон дэмжлэг гүйцэтгэгч” хэсэгт тусгай ур чадварын харьяа байгууллага нь өөрөө дэмжлэг үзүүлэх, эсвэл бүртгэлтэй дэмжлэгийн байгууллагад дэмжлэгийг бүрэн хариуцуулах тохиолдолд сонгон томилогдох дэмжлэг хариуцагч болон дэмжлэг гүйцэтгэгчийн овог нэр, хаалт дотор албан тушаалыг бичнэ. Үүн дотор b хэсэг болон чөлөөтэй бичих хэсгийн хувьд тусгай ур чадварын харьяа байгууллагаас ажлыг хэсэгчлэн хүлээн авсан гуравдагч этгээд хэрэгжүүлэх тохиолдолд дэмжлэгийн ажлыг хүлээн авсан этгээдийн овог нэр болон байршлыг бичнэ.</p>","<p class=\"vi\">7\tIV-1-с 4 хүртэлх болон 9-н “Хэрэгжүүлэх арга зам” хэсэгт тохирох зүйлийг чагтлах. “Бусад”-г чагтлах тохиолдолд түүний хэрэгжүүлэх арга замын тухай хаалт дотор бичнэ.</p>","<p class=\"vi\">8\tIV 3-A-d -д “Өрөөний хэмжээ”-ний тухайд тохирох зүйлийг хаалт доторх нүднээс сонгож чагтална.</p>","<p class=\"vi\">① -д Байгаа гэж хариулсан тохиолдолд ②-с ④ хүртэлхийг бичнэ.</p>","<p class=\"vi\">③ -д “Өөрийн байр”, “Түрээсийн байр” хэсэгт тохирох зүйлийг сонгож чагтлана.</p>","<p class=\"vi\">④ -д жишээлбэл дараах байдлаар бичиж, зөв тайлбарлах ёстой:</p>","<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- ③ “Өөрийн байр” бол: Барилга, засварын бодит зардал, барилгын ашиглалтын хугацаа, оршин суух тусгай ур чадвартай гадаад иргэдийн тоо зэргийг харгалзан үндэслэлтэй гэж тайлбарлах боломжтой дүн.</p>","<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- ③ “Түрээсийн байр” бол: Түрээслэхэд шаардлагатай түрээсийн төлбөр (СӨХ-ийн төлбөр орно; барьцааны мөнгө, урамшууллын мөнгө, баталгааны мөнгө, зуучлалын хураамж орохгүй)-ийг оршин суух тусгай ур чадвартай гадаад иргэдийн тоонд хуваасан дүн.</p>","<p class=\"vi\">9 IV-6 B хэсгийн “Шийдвэрлэх хугацаа” хэсэгт шийдвэрлэх боломжтой гарагийн цагийн хүрээг бичнэ.</p>"],0,1],[2263,2,1942020107,["<p class=\"vi\" style=\"padding-left:3.00em;text-indent:-3.00em\">Дээр бичигдсэн дэмжлэгийг орон нутгийн засаг захиргаанаас хамтран оршин тогтнох нийгмийг бий болгохын тулд хэрэгжүүлж буй бодлогын дагуу зохих ёсоор хэрэгжүүлэх болно.</p>","<p class=\"vi\">Мөн, энэхүү бичгийг дэмжлэгт хамрагдах этгээдийн хангалттай сайн ойлгох хэл дээр орчуулж, дэмжлэгт хамрагдах этгээдэд хадгалуулахын зэрэгцээ, агуулгыг сайтар тайлбарласан болно.</p>"],0,1],[2267,1,1846093434,["<tr><td class=\"lb\"><p class=\"ja\">特定技能所属機関の氏名又は名称</p><p class=\"vi\">Тусгай ур чадварын харьяа байгууллагын нэр</p></td>"],0,1],[2269,1,617466521,["<tr><td class=\"lb\"><p class=\"ja\">作成責任者の氏名</p><p class=\"vi\">Боловсруулалт хариуцсан ажилтны овог нэр</p></td>"],0,1],[2274,2,4244995961,["<p class=\"vi\" style=\"padding-left:3.00em;text-indent:-3.00em\">Энэхүү бичгийг <span class=\"p17ul\">монгол</span> хэл рүү хөрвүүлснийг хүлээн авч, түүний агуулгыг тайлбарлуулж, хангалттай сайн ойлгож танилцсан болно.</p>","<p class=\"vi\">IV 9-A-a хэсгийн тогтмол ярилцлага хэрхэн явагдах талаар тайлбар авч, агуулгыг бүрэн ойлгосон бөгөөд дараах хэлбэрээр хийхийг хүсч байна:  <input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f408\" disabled>Биечлэн уулзах болон онлайн ярилцлагыг хослуулах  <input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f409\" disabled>Зөвхөн биечлэн уулзаж ярилцлага хийх.</p>"],0,1],[2277,1,31155209,["<p class=\"vi p17sign-date\" style=\"margin-top:.1em\">Гарын үсэг зурсан өдөр　${v('es_createD')||'　'}/${v('es_createM')||'　'}/${v('es_createY')||'　　'}</p>"],0,1],[2279,1,3300998647,["<p class=\"vi\" style=\"margin-left:34%\">1-р тусгай ур чадвартай гадаад иргэний гарын үсэг</p>"],0,1],[2324,3,337976243,["    if(_nat && !/モンゴル|MONGOL/i.test(_nat)){","      console.warn('[1-17mn] 申請人の国籍が「'+_nat+'」ですが、この書類はモンゴル語版です。')
