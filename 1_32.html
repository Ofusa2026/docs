// 指導対象者の行：氏名の行＋在留カード番号の12マス（原本どおり①〜⑤を常に表示）
const _CARD_RE=/^(.*?)[\s　]+([A-Za-z]{2}\d{8}[A-Za-z]{2})$/;
function _tParts(n){
  let nm=v('f_t'+n+'Name'), cd=v('f_t'+n+'Card');
  // 旧形式（氏名欄に「氏名　在留カード番号」）の保存データも分けて表示
  if(!cd){ const m=String(nm||'').match(_CARD_RE); if(m){ nm=m[1]; cd=m[2]; } }
  return {nm, cd:String(cd||'').replace(/[\s　-]/g,'').toUpperCase()};
}
function _tRow(n){
  const mark='①②③④⑤'[n-1];
  const {nm,cd}=_tParts(n);
  const esc2=x=>(typeof esc==='function')?esc(x):String(x||'');
  let cells='';
  for(let i=0;i<12;i++) cells+=`<td class="cardbox${i>0?' dl':''}${i<11?' dr':''}">${esc2(cd.charAt(i)||'')}</td>`;
  const nmHtml = nm ? `<span class="f" data-bind="f_t${n}Name">${esc2(nm)}</span>` : '';
  return `<tr style="height:10mm;"><td rowspan="2" class="no">${mark}</td><td colspan="12" class="v" style="vertical-align:middle;border-bottom:none;">${nmHtml}</td>`+
    `<td rowspan="2" class="v">${f('f_t'+n+'Dept')}</td><td rowspan="2" class="v">${f('f_t'+n+'Pos')}</td><td rowspan="2" class="v">${f('f_t'+n+'Job')}</td></tr>`+
    `<tr>${cells}</tr>`;
}
function _ymd32(){
  const s=v('f_docDate'); const m=String(s||'').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if(m) return `${m[1]}年　${+m[2]}月　${+m[3]}日`;
  // ver.20261024.01: 空欄でも「２０　年　月　日」の空テンプレは出さず、作成した日（今日）を表示する
  const n=new Date(); return `${n.getFullYear()}年　${n.getMonth()+1}月　${n.getDate()}日`;
}

  w.innerHTML=`

function _wareki32(d){ if(!d) return ''; const x=new Date(d); if(isNaN(x)) return d; return `${x.getFullYear()}年${x.getMonth()+1}月${x.getDate()}日`; }
// ver.20261007.01: 指導対象者を「どの２号外国人の対象か」で絞り込む。
//   フォーム回答の t2Targets[].group/person（this=今回申請・now=既存２号、person=各リストの番号）と
//   t2NamesThis / t2NamesNow を使って紐づけし、f_t2Who セレクタで選んだ人の対象者のみ①〜⑤へ反映する。
window._t2Form=null;
function _t2BuildOptions(fr){
  const parse=x=>{ if(Array.isArray(x)) return x; try{const a=JSON.parse(x||'[]');return Array.isArray(a)?a:[];}catch(_e){return [];} };
  const nThis=parse(fr.t2NamesThis), nNow=parse(fr.t2NamesNow);
  const names={}, order=[];
  nThis.forEach((nm,i)=>{const k='this-'+(i+1); names[k]=String(nm||'').trim(); order.push(k);});
  nNow.forEach((nm,i)=>{const k='now-'+(i+1); names[k]=String(nm||'').trim(); order.push(k);});
  const targets=Array.isArray(fr.t2Targets)?fr.t2Targets:[];
  const grouped=targets.some(t=>t && t.group && t.person);
  window._t2Form={targets, names, order, grouped};
  const sel=document.getElementById('f_t2Who'), wrap=document.getElementById('t2WhoWrap');
  if(!sel) return;
  sel.innerHTML='';
  const add=(vv,txt)=>{const o=document.createElement('option');o.value=vv;o.textContent=txt;sel.appendChild(o);};
  add('','── 選択してください ──');
  order.forEach(k=>{ if(names[k]) add(k,(k.indexOf('this')===0?'今回申請：':'既存２号：')+names[k]); });
  add('all','（全員まとめて表示）');
  if(wrap) wrap.style.display=(grouped && order.length)?'':'none';
}
function applyT2Targets(manual){
  const tf=window._t2Form; if(!tf) return;
  const sel=document.getElementById('f_t2Who');
  const who=sel?sel.value:'';
  let list=tf.targets;
  if(tf.grouped){
    if(who && who!=='all'){
      const m=who.match(/^(this|now)-(\d+)$/);
      list=m?tf.targets.filter(t=>t && String(t.group)===m[1] && String(t.person)===m[2]):[];
    }else if(!who){ list=[]; }
  }
  for(let n=1;n<=5;n++){ ['Name','Card','Dept','Pos','Job'].forEach(sfx=>{const e=document.getElementById('f_t'+n+sfx); if(e)e.value='';}); }
  list.slice(0,5).forEach((t,i)=>{
    const n=i+1;
    const s2=(id,val)=>{const e=document.getElementById(id);if(e&&val)e.value=val;};
    // ver.20261023.01: 新様式は在留カード番号を別の12マスに書くため、氏名と分けて入れる
    s2('f_t'+n+'Name',t.name); s2('f_t'+n+'Card',t.card); s2('f_t'+n+'Dept',t.dept); s2('f_t'+n+'Pos',t.position); s2('f_t'+n+'Job',t.job);
  });
  p();
  if(manual && typeof showToast==='function'){
    const nm=tf.names[who];
    showToast(who==='all' ? '指導対象者を全員分表示しました' : (nm?('「'+nm+'」の指導対象者（'+Math.min(list.length,5)+'名）を反映しました'):'指導対象者をクリアしました'));
  }
}
async function loadFromDB(passedInfo){
  let info = passedInfo;
  if(!info){
    const sel=document.getElementById('caseSelect');
    if(!sel.value) return;
    try{info=JSON.parse(sel.value);}catch(e){return;}
  }
  if(!info || !info.caseId) return;
  const {caseId,companyId,companyName}=info;
  try{
    const [cases,persons,cos,emp]=await Promise.all([
      caseId?sb('cases?select=applicant,company_id,emp_set_idx&id=eq.'+caseId):Promise.resolve([]),
      caseId?sb('persons?select=applicant_name_en&case_id=eq.'+caseId):Promise.resolve([]),
      companyId?sb(`companies?select=name,author_title,author_name,rep_name,rep_title,emp_sets&id=eq.${companyId}`)
        :companyName?sb(`companies?select=name,author_title,author_name,rep_name,rep_title,emp_sets&name=eq.${encodeURIComponent(companyName)}`):Promise.resolve([]),
      Promise.resolve([])
    ]);
    const cas=cases&&cases[0]; const pe=persons&&persons[0]; const co=cos&&cos[0];
    const s=(id,val)=>{const e=document.getElementById(id);if(e&&val&&!e.value)e.value=val;};
    if(cas){ s('f_applicant',cas.applicant||''); }
    if(pe){ s('f_applicant',pe.applicant_name_en||''); }
    if(co){
      s('f_company',co.name||'');
      // ver.20260827.04(1-16)と同じ役職重複防止
      var _at=(co.author_title||co.rep_title||'').trim();
      var _an=(co.author_name||co.rep_name||'').trim();
      s('f_author', (_at && _an && _an.replace(/[\s　]+/g,'').indexOf(_at.replace(/[\s　]+/g,''))===0) ? _an : [_at,_an].filter(Boolean).join('　'));
      // ③職務内容の初期値は 2号ヒアリングフォーム(tokutei2_pledge)の回答のみ。
      //   回答が無い場合は空欄のまま（雇用条件からのフォールバックは行わない）。
    }
    if(!v('f_docDate')){const n=new Date();document.getElementById('f_docDate').value=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日`;}
    // ver.20260827.07: 2号ヒアリングフォーム(tokutei2_pledge)の回答があれば①〜④・指導対象者を自動反映。
    //   回答キー: t2Dept/t2Position/t2JobDetail/t2JobDiff/t2Targets[{name,card,dept,position,job}]
    //   フォームの回答は雇用条件フォールバックより優先（企業が直接書いた内容のため）。
    try{
      // ver.20261023.03: 2号だけのフォーム（tokutei2_pledge）に加えて、企業フォームと一緒に聞いた回答（company_tokutei2 の③）も読む。
      //   会社IDが渡されないとき（案件だけ選んだとき）は案件の所属機関IDを使う。2号の内容が入っていない回答（①②だけのリンク）は飛ばす。
      const _cid = companyId || (cas && cas.company_id) || '';
      if(_cid){
        const frs = await sb(`form_responses?select=response,form_type,created_at&form_type=in.(tokutei2_pledge,company_tokutei2)&case_id=eq.${encodeURIComponent('co_'+_cid)}&deleted_at=is.null&order=created_at.desc&limit=10`);
        const _hasT2 = r => r && (r.t2Field || r.t2JobDetail || r.t2Dept || (Array.isArray(r.t2Targets) && r.t2Targets.length));
        const _hit = (frs||[]).find(x => _hasT2(x && x.response));
        const fr = _hit && _hit.response;
        if(fr){
          const sf=(id,val)=>{const e=document.getElementById(id);if(e&&val)e.value=val;};
          sf('f_dept', fr.t2Dept);
          sf('f_position', fr.t2Position);
          sf('f_jobDesc', fr.t2JobDetail);
          sf('f_jobDiff', fr.t2JobDiff);
          // ver.20261023.02: 新様式の留意事項３・５（2号ヒアリングフォーム form ver.20261023.01〜）
          sf('f_reason3', fr.t2SameOffice==='いいえ' ? fr.t2Reason3 : '');
          sf('f_reason5', fr.t2Short5==='checked' ? fr.t2Reason5 : '');
          { const c5=document.getElementById('f_short5'); if(c5 && fr.t2Short5==='checked') c5.checked=true; }
          // 留意事項４（他の２号にも指導を受ける人を含める理由）は様式に欄がないため、入力欄の上に表示して確認してもらう
          { const di=document.getElementById('t2DupInfo'); if(di){ const r=String(fr.t2DupReason||'').trim();
              di.style.display=r?'':'none'; di.textContent=r?('📝 フォームの回答：他の２号にも指導を受けている人を含める理由「'+r+'」（様式に欄がないため、必要に応じて別紙で説明）'):''; } }
          const tg = Array.isArray(fr.t2Targets) ? fr.t2Targets : [];
          // ver.20261007.01: 対象者はgroup/personで「どの２号外国人の対象か」を判定して反映
          _t2BuildOptions(fr);
          const sel2=document.getElementById('f_t2Who');
          if(sel2){
            // ①保存済みの選択（hidden f_t2WhoSel）を復元 → ②申請人名と一致する候補を自動選択
            const savedWho=v('f_t2WhoSel');
            if(savedWho && Array.from(sel2.options).some(o=>o.value===savedWho)) sel2.value=savedWho;
            if(!sel2.value && window._t2Form){
              const norm=s=>String(s||'').replace(/[\s　・，、]/g,'');
              const cand=[v('f_applicant'), cas&&cas.applicant, pe&&pe.applicant_name_en].map(norm).filter(Boolean);
              let hit='';
              for(const k of window._t2Form.order){
                const nm=norm(window._t2Form.names[k]);
                if(nm && cand.some(c=>c===nm)){ hit=k; break; }
              }
              if(!hit && window._t2Form.grouped && window._t2Form.order.length===1) hit=window._t2Form.order[0];
              if(!window._t2Form.grouped) hit='all';
              if(hit){ sel2.value=hit; const h=document.getElementById('f_t2WhoSel'); if(h)h.value=hit; }
            }
          }
          applyT2Targets(false);
          if(window._t2Form && window._t2Form.grouped && sel2 && !sel2.value){
            showToast('⚠️ 指導対象者が複数の２号外国人に紐づいています。入力欄の「この書類の２号特定技能外国人」から選択してください');
          } else if(fr.t2Dept||fr.t2JobDetail||tg.length) showToast('📋 2号ヒアリングフォームの回答を反映しました');
        }
      }
    }catch(_e){ console.warn('[1_32] tokutei2_pledge load:', _e); }
    p(); showToast('✅ データを読み込みました');
  }catch(e){showToast('⚠️ 読込エラー: '+e.message);}
}

function fitDocToPreview(){
  requestAnimationFrame(()=>{
    const pp = document.querySelector('.pp');
    const area = document.getElementById('pageArea');
    if(!pp || !area) return;
    const ppW = pp.clientWidth - 40;
    const docW = 794;  // 210mm
    if(ppW < docW){
      const scale = ppW / docW;
      area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = scale; });
    } else {
      area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = 1; });
    }
  });
}
window.addEventListener('resize', fitDocToPreview);

window.addEventListener('message', async function(e){
  if(!e.data||e.data.type!=='SELECT_CASE') return;
  const info=e.data.info;
  if(!info||!info.caseId) return;
  const sel=document.getElementById('caseSelect');
  if(sel){
    let found=false;
    for(let o of sel.options){
      try{ const d=JSON.parse(o.value); if(d.caseId===info.caseId){sel.value=o.value;found=true;break;} }catch(e2){}
    }
    if(!found){
      const opt=document.createElement('option');
      opt.value=JSON.stringify(info);
      opt.textContent='（indexから選択）';
      sel.appendChild(opt);
      sel.value=opt.value;
    }
  }
  if(typeof loadCaseToForm==='function'){ await loadCaseToForm(info, '1_32'); }
  if(typeof loadFromDB==='function') loadFromDB(info);
});
