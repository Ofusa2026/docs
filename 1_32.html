}

  w.innerHTML=`
<div class="doc">

<table class="t32">
<tr><th class="t32k">①　所属部署名</th><td>${f('f_dept')}</td></tr>
<tr><th class="t32k">②　役職又は地位</th><td>${f('f_position')}</td></tr>
<tr><th class="t32k">③　当該外国人が従事する具体的な職務内容（製造物、収穫物、作業工程など）</th><td>${f('f_jobDesc')}</td></tr>
<tr><th class="t32k">④　技能実習生又は１号特定技能外国人が従事する場合、それら外国人と当該２号特定技能外国人の職務内容の違い（各特定産業分野における分野別方針で定めている２号特定技能外国人の従事する業務内容に相違のないよう記載すること）</th><td>${f('f_jobDiff')}</td></tr>
</table>
<div style="font-weight:bold;margin-bottom:4px;">２　当該２号特定技能外国人に指導を受ける対象者一覧</div>
<table class="t32">
<tr><th style="width:2em;"></th><th>対象者の氏名<br><span style="font-size:8pt;">※外国人の場合は在留カード番号も記載</span></th><th>事業所及び<br>所属部署名</th><th>役職又は地位</th><th>指導を受ける職務内容</th></tr>
${tRows}
</table>
<div style="font-size:8.5pt;font-weight:bold;margin-bottom:2px;">※　留意事項</div>
<div style="font-size:8.5pt;margin-left:1em;margin-bottom:1px;">１　在留資格認定証明書の交付又は在留諸申請の許否に大きく影響するため、全て具体的に記載すること。なお、記載内容と実際の内容に相違がある場合、在留資格が取り消される可能性があるほか、虚偽の内容を記載した場合、特定技能所属機関としての欠格事由に該当することとなるため、留意すること。</div>
<div style="font-size:8.5pt;margin-left:1em;margin-bottom:1px;">２　事業所、事業内容、所属部署、役職、職務内容などで、複数該当するものがある場合については、全ての内容を記載すること。</div>
<div style="font-size:8.5pt;margin-left:1em;margin-bottom:1px;">３　対象者については、２号特定技能外国人と同一の事業所に出勤し、原則同一の所属部署に所属する者であって、フルタイムで業務に従事する者に限る。</div>
<div style="font-size:8.5pt;margin-left:1em;margin-bottom:1px;">４　在留諸申請時点で、他の２号特定技能外国人に指導を受けている者については記載しないこと。</div>
<div style="font-size:8.5pt;margin-left:1em;margin-bottom:0;">５　記載する枠が足りない場合は、適宜追加すること。</div>

<div class="doc">
<div class="page-num-label">P2</div>
<div style="font-weight:bold;margin-bottom:4px;">（参考）特定産業分野ごとの指導を受ける必要な対象者数</div>

<tr><th>特定技能２号対象の特定産業分野</th><th style="width:36%;">必要な対象者数</th></tr>
<tr><td>ビルクリーニング分野</td><td>２名以上</td></tr>

</table>
<div style="font-size:8.5pt;margin-bottom:14mm;">※　必要な対象者数の記載がない特定産業分野又は業務区分については、指導を受ける対象者が不在でも差し支えないが、当該対象者が在籍する場合は必ず記載すること。</div>
<div style="margin-bottom:8px;">作成年月日：${f('f_docDate')}</div>
<div style="margin-bottom:10px;">上記の記載内容は、事実と相違ありません。</div>
<div style="margin-bottom:8px;">２号特定技能外国人の署名　　<span style="display:inline-block;min-width:18em;border-bottom:1px solid #333;text-align:center;">${f('f_applicant')}</span></div>
<div style="margin-bottom:8px;">特定技能所属機関の氏名又は名称　　<span style="display:inline-block;min-width:18em;">${f('f_company')}</span></div>
<div>作成責任者の氏名及び役職　　<span style="display:inline-block;min-width:18em;">${f('f_author')}</span></div>
</div>`;
  _fontSize = (_fontSize === 8.5) ? 10.5 : _fontSize;
  _applyFontSize();
  const lbl=document.getElementById('fontSizeLabel');if(lbl)lbl.textContent=_fontSize+'pt';
  setupPageTracker();
  fitDocToPreview();
}
function _wareki32(d){ if(!d) return ''; const x=new Date(d); if(isNaN(x)) return d; return `${x.getFullYear()}年${x.getMonth()+1}月${x.getDate()}日`; }
async function loadFromDB(passedInfo){
  let info = passedInfo;
  if(!info){
    const sel=document.getElementById('caseSelect');
    if(!sel.value) return;
    try{info=JSON.parse(sel.value);}catch(e){return;}
  }
  if(!info || !info.caseId) return;
  const {caseId,companyId,companyName}=info;
  try{
    const [cases,persons,cos,emp]=await Promise.all([
      caseId?sb('cases?select=applicant,company_id,emp_set_idx&id=eq.'+caseId):Promise.resolve([]),
      caseId?sb('persons?select=applicant_name_en&case_id=eq.'+caseId):Promise.resolve([]),
      companyId?sb(`companies?select=name,author_title,author_name,rep_name,rep_title,emp_sets&id=eq.${companyId}`)
        :companyName?sb(`companies?select=name,author_title,author_name,rep_name,rep_title,emp_sets&name=eq.${encodeURIComponent(companyName)}`):Promise.resolve([]),
      Promise.resolve([])
    ]);
    const cas=cases&&cases[0]; const pe=persons&&persons[0]; const co=cos&&cos[0];
    const s=(id,val)=>{const e=document.getElementById(id);if(e&&val&&!e.value)e.value=val;};
    if(cas){ s('f_applicant',cas.applicant||''); }
    if(pe){ s('f_applicant',pe.applicant_name_en||''); }
    if(co){
      s('f_company',co.name||'');
      // ver.20260827.04(1-16)と同じ役職重複防止
      var _at=(co.author_title||co.rep_title||'').trim();
      var _an=(co.author_name||co.rep_name||'').trim();
      s('f_author', (_at && _an && _an.replace(/[\s　]+/g,'').indexOf(_at.replace(/[\s　]+/g,''))===0) ? _an : [_at,_an].filter(Boolean).join('　'));
      // ③職務内容の初期値は 2号ヒアリングフォーム(tokutei2_pledge)の回答のみ。
      //   回答が無い場合は空欄のまま（雇用条件からのフォールバックは行わない）。
    }
    if(!v('f_docDate')){const n=new Date();document.getElementById('f_docDate').value=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日`;}
    // ver.20260827.07: 2号ヒアリングフォーム(tokutei2_pledge)の回答があれば①〜④・指導対象者を自動反映。
    //   回答キー: t2Dept/t2Position/t2JobDetail/t2JobDiff/t2Targets[{name,card,dept,position,job}]
    //   フォームの回答は雇用条件フォールバックより優先（企業が直接書いた内容のため）。
    try{
      if(companyId){
        const frs = await sb(`form_responses?select=response&form_type=eq.tokutei2_pledge&case_id=eq.${encodeURIComponent('co_'+companyId)}&deleted_at=is.null&order=created_at.desc&limit=1`);
        const fr = frs && frs[0] && frs[0].response;
        if(fr){
          const sf=(id,val)=>{const e=document.getElementById(id);if(e&&val)e.value=val;};
          sf('f_dept', fr.t2Dept);
          sf('f_position', fr.t2Position);
          sf('f_jobDesc', fr.t2JobDetail);
          sf('f_jobDiff', fr.t2JobDiff);
          const tg = Array.isArray(fr.t2Targets) ? fr.t2Targets : [];
          tg.slice(0,5).forEach((t,i)=>{
            const n=i+1;
            const nm=[t.name, t.card].filter(Boolean).join('　');
            sf('f_t'+n+'Name', nm);
            sf('f_t'+n+'Dept', t.dept);
            sf('f_t'+n+'Pos', t.position);
            sf('f_t'+n+'Job', t.job);
          });
          if(fr.t2Dept||fr.t2JobDetail||tg.length) showToast('📋 2号ヒアリングフォームの回答を反映しました');
        }
      }
    }catch(_e){ console.warn('[1_32] tokutei2_pledge load:', _e); }
    p(); showToast('✅ データを読み込みました');
  }catch(e){showToast('⚠️ 読込エラー: '+e.message);}
}
initCaseSelect(); p();

function fitDocToPreview(){
  requestAnimationFrame(()=>{
    const pp = document.querySelector('.pp');
    const area = document.getElementById('pageArea');
    if(!pp || !area) return;
    const ppW = pp.clientWidth - 40;
    const docW = 794;
    if(ppW < docW){
      const scale = ppW / docW;
      area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = scale; });
    } else {
      area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = 1; });
    }
  });
}
window.addEventListener('resize', fitDocToPreview);

window.addEventListener('message', async function(e){
  if(!e.data||e.data.type!=='SELECT_CASE') return;
  const info=e.data.info;
  if(!info||!info.caseId) return;
  const sel=document.getElementById('caseSelect');
  if(sel){
    let found=false;
    for(let o of sel.options){
      try{ const d=JSON.parse(o.value); if(d.caseId===info.caseId){sel.value=o.value;found=true;break;} }catch(e2){}
    }
    if(!found){
      const opt=document.createElement('option');
      opt.value=JSON.stringify(info);
      opt.textContent='（indexから選択）';
      sel.appendChild(opt);
      sel.value=opt.value;
    }
  }
  if(typeof loadCaseToForm==='function'){ await loadCaseToForm(info, '1_32'); }
  if(typeof loadFromDB==='function') loadFromDB(info);
});
</script>
