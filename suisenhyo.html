<style>
.doc{padding:15mm!important;line-height:1.4!important;min-height:auto!important;font-size:10.5pt!important}
.sh-title{font-size:14pt;font-weight:bold;text-align:center;margin:2mm 0 6mm}
.sh-attach{text-align:right;font-size:10.5pt;margin-bottom:2mm}
.sh-sec{margin-bottom:5mm}
.sh-secnum{font-weight:bold;margin-bottom:1.5mm}
.sh-row{display:flex;margin-bottom:1mm;padding-left:1em}
.sh-label{flex:0 0 auto;white-space:nowrap}
.sh-val{flex:1;padding-left:0.5em}
.sh-cb{margin:3mm 0 2mm 1em;font-size:10.5pt}
.sh-cb span{margin-right:2em}
table.sh-tbl{width:100%;border-collapse:collapse;font-size:9.5pt;margin-top:2mm}
table.sh-tbl th,table.sh-tbl td{border:1px solid #000;padding:3px 4px;text-align:center;vertical-align:middle}
table.sh-tbl th{font-weight:normal;white-space:nowrap}
table.sh-tbl td.col-no{width:6%;}
table.sh-tbl td.col-name{width:20%;text-align:left}
table.sh-tbl td.col-birth{width:14%}
table.sh-tbl td.col-gender{width:8%}
table.sh-tbl td.col-pass{width:14%}
table.sh-tbl td.col-prev{width:18%}
table.sh-tbl td.col-job{width:20%;text-align:left}
.sh-note{font-size:9.5pt;margin-top:2mm}
.sh-foot{margin-top:8mm;font-size:10.5pt;text-align:right}
.sh-foot-date{margin:3mm 0 6mm}
.sh-foot-sign{margin-top:2mm}

/* 人材枠の case ID 貼り付けUI */
.cid-row{display:flex;gap:6px;align-items:center;margin:4px 6px 4px}
.cid-row input{flex:1;padding:5px 8px;border-radius:4px;border:1px solid #cbd5e0;font-size:11px;font-family:monospace}
.cid-btn{padding:5px 12px;background:#2563eb;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600;white-space:nowrap}
.cid-btn:hover{background:#1d4ed8}
.cid-btn.has-data{background:#16a34a}
.cid-btn.has-data:hover{background:#15803d}
.person-clear-btn{padding:5px 8px;background:#f3f4f6;color:#666;border:1px solid #d1d5db;border-radius:4px;cursor:pointer;font-size:11px;white-space:nowrap}
.person-clear-btn:hover{background:#e5e7eb}
.cid-status{margin:0 6px 6px;font-size:11px;color:#666;min-height:14px;line-height:1.3;font-family:sans-serif}
.cid-status.ok{color:#16a34a}
.cid-status.warn{color:#d97706}
.cid-status.err{color:#dc2626}
/* fp-case は共通CSSで display:none だが、ここでは表示する */
.fp-case{display:block!important;padding:10px!important;background:#1e293b!important;color:#e2e8f0!important;border-bottom:1px solid #475569!important}
.fp-case label{color:#cbd5e0!important;font-size:11px!important;font-weight:600!important;display:block;margin-bottom:4px;}

/* === 交付申請書（P1）専用 === */
.kf-receipt{text-align:right;font-size:10pt;margin-bottom:4mm}
.kf-receipt-line{display:inline-block;border-bottom:1px solid #000;min-width:50mm;padding:0 6px}
.kf-title{text-align:center;margin:2mm 0 4mm}
.kf-title-vi{font-weight:bold;font-size:12pt;letter-spacing:0.5pt}
.kf-title-ja{font-weight:bold;font-size:13pt;margin-top:1mm}
.kf-to{text-align:center;margin:3mm 0 4mm;font-size:10.5pt;line-height:1.5}
.kf-row{display:flex;margin-bottom:2mm;font-size:10.5pt;align-items:baseline;gap:0.5em}
.kf-row .lbl{flex:0 0 auto;white-space:nowrap}
.kf-row .val{flex:1;border-bottom:1px dotted #888;min-height:1.3em;padding-left:0.3em}
.kf-rel{margin:2mm 0 4mm;font-size:10.5pt;line-height:1.7}
.kf-rel span{margin-right:1.5em;white-space:nowrap}
.kf-intro{font-size:9.5pt;line-height:1.4;margin:3mm 0 3mm;text-align:justify}
.kf-secnum{font-weight:bold;margin:3mm 0 1.5mm;font-size:10.5pt}
.kf-info-row{font-size:10pt;line-height:1.6;padding-left:1em}
.kf-info-row .pair{display:inline-block;margin-right:2em}
.kf-info-row .pair .lbl{color:#000;margin-right:0.3em}
.kf-info-row .pair .val{display:inline-block;border-bottom:1px dotted #888;min-width:50mm;padding:0 0.3em}
table.kf-tbl{width:100%;border-collapse:collapse;font-size:8pt;margin-top:2mm;table-layout:fixed}
table.kf-tbl th,table.kf-tbl td{border:1px solid #000;padding:2px 3px;text-align:center;vertical-align:middle;word-wrap:break-word;line-height:1.25}
table.kf-tbl th{font-weight:normal;font-size:7.5pt}
table.kf-tbl th.kf-h-multi{font-size:6.5pt;line-height:1.2;padding:2px 2px}
table.kf-tbl td.kf-no{width:4%}
table.kf-tbl td.kf-name{width:13%;text-align:left;font-size:8pt}
table.kf-tbl td.kf-birth{width:9%}
table.kf-tbl td.kf-sex{width:5%}
table.kf-tbl td.kf-pass{width:10%}
table.kf-tbl td.kf-school{width:17%;text-align:left;font-size:7.5pt}
table.kf-tbl td.kf-job{width:9%}
table.kf-tbl td.kf-period{width:14%}
table.kf-tbl td.kf-addr{width:19%;text-align:left;font-size:7.5pt}
.kf-confirm{margin-top:5mm;font-size:10pt;line-height:1.5}
.kf-sign-row{margin-top:6mm;font-size:10pt;line-height:1.8}
.kf-sign-row .applicant{display:inline-block;border-bottom:1px solid #000;min-width:40mm;padding:0 0.5em}
.kf-sign-row .stamp{margin-left:0.5em;display:inline-block;border:1px solid #d00;color:#d00;padding:1px 6px;font-size:9pt;border-radius:2px}
.kf-page-break{page-break-after:always}

/* ver.20260521.19: 印刷・PDF時に各書類を1ページに収める設定 */
@page{
  size: A4 portrait;
  margin: 8mm 10mm;
}
@media print{
  .app-bar,.fp{display:none!important}
  .main{display:block!important}
  body{margin:0!important;padding:0!important}
  /* 各書類は1ページに収まるよう詰める。padding/margin/fontを縮小 */
  .doc{
    box-shadow:none!important;
    margin:0!important;
    padding:0!important;
    font-size:9pt!important;
    line-height:1.25!important;
    page-break-inside: avoid;
    page-break-after: always;
  }
  .doc:last-of-type{page-break-after: auto;}
  .f[style*="color:#aaa"]{visibility:hidden}

  /* 推薦状（kf-*）系を印刷時にコンパクト化 */
  .kf-title-vi{font-size:10pt!important}
  .kf-title-ja{font-size:11pt!important;margin-top:0.5mm!important}
  .kf-to{margin:1.5mm 0 2mm!important;font-size:9pt!important;line-height:1.3!important}
  .kf-row{margin-bottom:1mm!important;font-size:9pt!important}
  .kf-rel{margin:1mm 0 2mm!important;font-size:9pt!important;line-height:1.4!important}
  .kf-intro{font-size:8.5pt!important;line-height:1.3!important;margin:1.5mm 0!important}
  .kf-secnum{margin:1.5mm 0 0.8mm!important;font-size:9pt!important}
  .kf-info-row{font-size:8.5pt!important;line-height:1.35!important}
  .kf-receipt{margin-bottom:2mm!important;font-size:9pt!important}
  table.kf-tbl{font-size:7pt!important;margin-top:1mm!important}
  table.kf-tbl th, table.kf-tbl td{padding:1.5px 2px!important}
  .kf-sign-row{font-size:9pt!important;margin-top:2mm!important}

  /* 推薦状（sh-*）系を印刷時にコンパクト化 */
  .sh-attach{font-size:9pt!important;margin-bottom:1mm!important}
  .sh-title{font-size:12pt!important;margin:1mm 0 3mm!important}
  .sh-sec{margin:1.5mm 0!important}
  .sh-secnum{font-size:9pt!important;margin:1.5mm 0 0.8mm!important;font-weight:bold}
  .sh-row{margin-bottom:0.8mm!important;font-size:9pt!important;line-height:1.3!important}
  .sh-cb{margin:1.5mm 0 1mm 1em!important;font-size:9pt!important}
  table.sh-tbl{font-size:8pt!important;margin-top:1mm!important}
  table.sh-tbl th, table.sh-tbl td{padding:2px 3px!important}
  .sh-note{font-size:8.5pt!important;margin-top:1.5mm!important}
  .sh-foot{margin-top:3mm!important;font-size:9pt!important}
}
</style>

function _applySuisenhyoFontSize(){
  const st=document.getElementById('_suisenhyoFontStyle')||document.createElement('style');

  const s=_fontSize/10.5;
  st.textContent=[
    `.doc [style*="font-size:14pt"]{font-size:${(14*s).toFixed(2)}pt!important}`,
    `.doc .sh-title{font-size:${(14*s).toFixed(2)}pt!important}`,
    `.doc .sh-tbl{font-size:${(9.5*s).toFixed(2)}pt!important}`,
    `.doc .sh-note{font-size:${(9.5*s).toFixed(2)}pt!important}`,
  ].join('');
}

function _ymd(d){
  if(!d) return '';
  // 2025-04-01 → 2025/04/01
  const m=String(d).match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m) return `${m[1]}/${String(m[2]).padStart(2,'0')}/${String(m[3]).padStart(2,'0')}`;
  return d;
}
function _gender(g){
  if(!g) return '';
  const s=String(g);
  if(/男|male|^M$/i.test(s)) return '男';
  if(/女|female|^F$/i.test(s)) return '女';
  return s;
}

/* ========== case ID 形式チェック（緩い判定） ========== */
// case_<数字> 形式 または UUID形式 を許可。それ以外は警告のみで処理は継続
const _UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const _CASE_RE=/^case_\d+$/;
function _isValidCid(s){
  if(typeof s!=='string') return false;
  return _UUID_RE.test(s) || _CASE_RE.test(s);
}
// 後方互換用エイリアス（コード内の他箇所が _isUuid を呼んでいる場合に備え）
function _isUuid(s){ return _isValidCid(s); }

/* ========== メイン case ID 貼り付け（書類全体：登録支援機関+受入機関） ========== */
function onMainCidInput(){
  const inp=document.getElementById('caseIdPaste');

  const cid=(inp.value||'').trim();
  if(!cid){ st.textContent=''; st.style.color='#888'; return; }
  if(_isUuid(cid)){ st.textContent='UUID形式OK・Enterまたは取得で反映'; st.style.color='#16a34a'; }
  else { st.textContent='※ UUID形式ではない可能性があります'; st.style.color='#d97706'; }
}
async function importMainCase(){
  const inp=document.getElementById('caseIdPaste');
  const st=document.getElementById('mainCidStatus');
  if(!inp) return;
  const cid=(inp.value||'').trim();
  if(!cid){ if(st){st.textContent='case IDを貼り付けてください';st.style.color='#d97706';} return; }
  if(!_isUuid(cid)){ if(st){st.textContent='⚠️ UUID形式ではありません';st.style.color='#dc2626';} return; }
  if(st){ st.textContent='取得中...'; st.style.color='#888'; }
  await _loadCaseInfo({caseId:cid});
  if(st){ st.textContent='✅ 取得完了'; st.style.color='#16a34a'; }
}

/* ========== 案件情報をDBから引いてフォームに反映 ========== */
async function _loadCaseInfo(info){
  if(!info) return;
  const {caseId,companyId,companyName,orgName}=info;
  if(!caseId && !companyId && !companyName && !orgName){ return; }
  const s=(id,val)=>{const e=document.getElementById(id);if(e&&val!==undefined&&val!==null&&val!=='')e.value=val;};

  // 1. case → applicant・org・emp_set_idx・契約期間
  let cas=null, orgFromCase='';
  if(caseId){
    try{
      const rows=await sb('cases?select=applicant,org,company,company_id,emp_set_idx,contract_start,contract_end&id=eq.'+encodeURIComponent(caseId));
      cas=rows&&rows[0];
      if(cas) orgFromCase=cas.org||'';
    }catch(e){ console.warn('cases取得スキップ:',e.message); }
  }

  // 2. 登録支援機関：orgName(渡された値) または cas.org から名前検索
  const orgN=orgName||orgFromCase;
  if(orgN){
    try{
      // DB実カラム: name, address, support_manager, reg_no, tel, rep_name
      const sos=await sb('support_orgs?select=name,address,support_manager,reg_no,tel,rep_name&name=eq.'+encodeURIComponent(orgN));
      const org=sos&&sos[0];
      if(org){
        s('f_supName',org.name||'');
        s('f_supLicense',org.reg_no||'');
        s('f_supRep',org.rep_name||org.support_manager||'');
        s('f_supAddr',org.address||'');
        s('f_supTel',org.tel||'');
        // Fax は support_orgs に該当カラムなしのため未設定（手入力）
      } else {
        // 名前だけは入れておく
        s('f_supName',orgN);
      }
    }catch(e){ console.warn('support_orgs取得スキップ:',e.message); }
  }

  // 3. 受入機関（companies）
  const coId=companyId||(cas&&cas.company_id);
  const coN=(cas&&cas.company)||companyName||'';
  let co=null;
  if(coId){
    try{
      const rows=await sb(`companies?select=name,pref,city,address,rep_name,rep_title,corp_no,tel&id=eq.${coId}`);
      co=rows&&rows[0];
    }catch(e){ console.warn('companies(id)取得スキップ:',e.message); }
  }
  if(!co && coN){
    try{
      const rows=await sb(`companies?select=name,pref,city,address,rep_name,rep_title,corp_no,tel&name=eq.${encodeURIComponent(coN)}`);
      co=rows&&rows[0];
    }catch(e){ console.warn('companies(name)取得スキップ:',e.message); }
  }
  if(co){
    s('f_coName',co.name||'');
    s('f_coLicense',co.corp_no||'');
    s('f_coAddr',((co.pref||'')+(co.city||'')+(co.address||''))||'');
    s('f_coRep',co.rep_name||'');
    s('f_coTel',co.tel||'');
    // Fax: companies テーブルに該当カラムなしのため未設定（手入力）
  }

  // 4. 契約期間：cases.contract_start / cases.contract_end
  if(cas){
    s('f_workFrom',_ymd(cas.contract_start||''));
    s('f_workTo',_ymd(cas.contract_end||''));
  }

  // 署名日付は自動入力しない（ベトナム大使館側で入れる）
  p();
}

/* 旧loadFromDB互換（postMessageから呼ばれる場合）— UUIDなcaseIdのみ受け付け */
async function loadFromDB(info){
  if(info && info.caseId){
    await _loadCaseInfo(info);
  }
}

  const cid=(inp.value||'').trim();
  if(!cid){ if(st){st.textContent='case IDを貼り付けてください';st.className='cid-status warn';} return; }
  if(st){ st.textContent='取得中...'; st.className='cid-status'; }
  const s=(id,val)=>{const e=document.getElementById(id);if(e)e.value=val||'';};
  const i=slot;
  let nm='', filled=false;

  // 1. まずcasesから申請人名を取得（最低限の情報）
  let cas=null;
  try{
    const rows=await sb('cases?select=applicant&id=eq.'+encodeURIComponent(cid));
    cas=rows&&rows[0];
    if(cas && cas.applicant){
      nm=cas.applicant;
      s('f_p'+i+'Name',nm);
      filled=true;
    }
  }catch(e){ console.warn('cases取得スキップ:',e.message); }

  // 2. personsから詳細情報を取得（あれば上書き）
  let foundPersons=false;
  try{
    const persons=await sb('persons?select=*&case_id=eq.'+encodeURIComponent(cid));
    const rec=persons&&persons[0];
    if(rec){
      foundPersons=true;
      const pd=(rec&&rec.data)||rec||{};
      const pNm=pd.applicant_name_en||pd.name_en||pd.romaji||pd.applicant_en||pd.applicant||pd.name||'';
      if(pNm){ nm=pNm; s('f_p'+i+'Name',nm); }
      s('f_p'+i+'Birth',_ymd(pd.birthdate||''));
      s('f_p'+i+'Gender',_gender(pd.gender||''));
      s('f_p'+i+'Pass',pd.passport||'');
      s('f_p'+i+'Prev',pd.residence_status||'');
      s('f_p'+i+'Job',pd.occupation||'');
      // extra JSONB から推薦状用カスタムフィールドを取得
      // ankenの推薦状タブで追加された sendingOrgOrSchool / homeRelativeInfo は extra に保存される
      let extra=pd.extra;
      if(typeof extra==='string'){
        try{ extra=JSON.parse(extra); }catch(e){ extra={}; }
      }
      extra=extra||{};
      s('f_p'+i+'School', extra.sendingOrgOrSchool||'');
      s('f_p'+i+'VnContact', extra.homeRelativeInfo||'');
      filled=true;
    }
  }catch(e){ console.warn('persons取得スキップ:',e.message); }

  if(!filled){
    if(st){ st.textContent='⚠️ caseIDに該当する人材データが見つかりません'; st.className='cid-status err'; }
    return;
  }
  if(btn) btn.classList.add('has-data');
  if(st){
    const note=foundPersons?'':'（personsレコードなし。氏名のみ取得）';
    st.textContent='✅ 投入: '+(nm||'(名無し)')+note;
    st.className=foundPersons?'cid-status ok':'cid-status warn';
  }
  p();
  showToast('✅ 人材'+slot+'に投入しました');
}
function clearPerson(slot){
  const i=slot;
  ['Name','Birth','Gender','Pass','Prev','Job','Cid'].forEach(k=>{
    const el=document.getElementById('f_p'+i+k);
    if(el) el.value='';
  });
  const btn=document.getElementById('p'+i+'Btn');
  if(btn) btn.classList.remove('has-data');
  const st=document.getElementById('p'+i+'Status');
  if(st){ st.textContent=''; st.className='cid-status'; }
  p();
}
// 初期化：申請書作成年月日に当日をデフォルト挿入
(function _initApplyDate(){
  const el=document.getElementById('f_applyDate');
  if(el && !el.value){
    const n=new Date();
    const mm=String(n.getMonth()+1).padStart(2,'0');
    const dd=String(n.getDate()).padStart(2,'0');
    el.value=`${n.getFullYear()}/${mm}/${dd}`;
  }
})();
p();

function fitDocToPreview(){
  requestAnimationFrame(()=>{
    const pp = document.querySelector('.pp');
    const area = document.getElementById('pageArea');
    if(!pp || !area) return;
    const ppW = pp.clientWidth - 40;
    const docW = 794;
    if(ppW < docW){
      const scale = ppW / docW;
      area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = scale; });
    } else {
      area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = 1; });
    }
  });
}
window.addEventListener('resize', fitDocToPreview);

// index.htmlからの案件選択を受信
window.addEventListener('message', async function(e){
  if(!e.data||e.data.type!=='SELECT_CASE') return;
  const info=e.data.info;
  if(!info||!info.caseId) return;
  // 入力欄にも反映
  const inp=document.getElementById('caseIdPaste');
  if(inp) inp.value=info.caseId;
  await _loadCaseInfo(info);
  const st=document.getElementById('mainCidStatus');
  if(st){ st.textContent='✅ indexから取得'; st.style.color='#16a34a'; }
});
</script>
