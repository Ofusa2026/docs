/* 人材枠の case選択ボタン */

/* 人材選択モーダル */
.pp-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:flex-start;justify-content:center;padding:40px 20px}
.pp-modal-bg.open{display:flex}
.pp-modal{background:#fff;border-radius:8px;width:100%;max-width:600px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,0.3)}
.pp-modal-head{padding:14px 18px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:10px;background:#f9fafb}
.pp-modal-title{font-weight:700;font-size:14px;flex:1}
.pp-modal-close{cursor:pointer;background:none;border:none;font-size:22px;color:#666;line-height:1}
.pp-modal-search{padding:12px 18px;border-bottom:1px solid #e5e7eb;display:flex;gap:8px;flex-wrap:wrap}
.pp-modal-search input,.pp-modal-search select{padding:6px 10px;border:1px solid #d1d5db;border-radius:4px;font-size:13px;flex:1;min-width:120px}
.pp-modal-list{flex:1;overflow-y:auto;padding:4px 0}
.pp-modal-row{padding:9px 18px;cursor:pointer;border-bottom:1px solid #f3f4f6;font-size:13px}
.pp-modal-row:hover{background:#eff6ff}
.pp-modal-row .name{font-weight:600;color:#111}

.pp-modal-foot{padding:10px 18px;border-top:1px solid #e5e7eb;font-size:11px;color:#888;text-align:right}
@media print{

<script>
function _row(i){
  // 行に1つでも入力があれば f()（プレースホルダー付き）、無ければ完全空白でセル表示
  const ids=['Name','Birth','Gender','Pass','Prev','Job'];
  const any=ids.some(k=>v('f_p'+i+k));
  const cell=k=>any?f('f_p'+i+k):'&nbsp;';
  return `<tr>
    <td class="col-no">${i}</td>
    <td class="col-name">${cell('Name')}</td>
    <td class="col-birth">${cell('Birth')}</td>
    <td class="col-gender">${cell('Gender')}</td>
    <td class="col-pass">${cell('Pass')}</td>
    <td class="col-prev">${cell('Prev')}</td>
    <td class="col-job">${cell('Job')}</td>
  </tr>`;
}
function p(){
  if(_editMode) return;
  const w=document.getElementById('pageArea'); if(!w) return;
  const visa=document.getElementById('f_visaType');
  const v1=visa&&visa.value==='1'?'■':'□';
  const v2=visa&&visa.value==='2'?'■':'□';
  w.innerHTML=`
<div class="doc">
<div class="page-num-label">P1</div>
<div class="sh-attach">添付2</div>
<div class="sh-title">特定技能外国人表</div>

<div class="sh-sec">
  <div class="sh-secnum">1．登録支援機関に関する情報</div>
  <div class="sh-row"><div class="sh-label">（名称）：</div><div class="sh-val">${f('f_supName')}</div></div>
  <div class="sh-row"><div class="sh-label">（認可番号）：</div><div class="sh-val">${f('f_supLicense')}</div></div>
  <div class="sh-row"><div class="sh-label">（代表者の氏名）：</div><div class="sh-val">${f('f_supRep')}</div></div>
  <div class="sh-row"><div class="sh-label">（所在地）：</div><div class="sh-val">${f('f_supAddr')}</div></div>
  <div class="sh-row">
    <div class="sh-label">（電話番号）：</div><div style="padding-left:0.5em;padding-right:2em;">${f('f_supTel')}</div>
    <div class="sh-label">Fax ファックス番号：</div><div class="sh-val">${f('f_supFax')}</div>
  </div>
</div>

<div class="sh-sec">
  <div class="sh-secnum">2．日本の受入機関に関する情報</div>
  <div class="sh-row"><div class="sh-label">（名称）：</div><div class="sh-val">${f('f_coName')}</div></div>
  <div class="sh-row"><div class="sh-label">（認可番号）：</div><div class="sh-val">${f('f_coLicense')}</div></div>
  <div class="sh-row"><div class="sh-label">（代表者の氏名）：</div><div class="sh-val">${f('f_coRep')}</div></div>
  <div class="sh-row"><div class="sh-label">（所在地）：</div><div class="sh-val">${f('f_coAddr')}</div></div>
  <div class="sh-row">
    <div class="sh-label">（電話番号）：</div><div style="padding-left:0.5em;padding-right:2em;">${f('f_coTel')}</div>
    <div class="sh-label">Fax ファックス番号：</div><div class="sh-val">${f('f_coFax')}</div>
  </div>
</div>

<div class="sh-sec">
  <div class="sh-secnum">3．労働期間</div>
  <div class="sh-row"><div class="sh-val">${f('f_workFrom')}　から　${f('f_workTo')}　まで</div></div>
</div>

<div class="sh-sec">
  <div class="sh-secnum">4．特定技能外国人に関する情報</div>
  <div class="sh-cb"><span>${v1}　1号特定技能外国人</span><span>${v2}　2号特定技能外国人</span></div>
  <table class="sh-tbl">
    <thead>
      <tr>
        <th>項番</th><th>氏名</th><th>生年月日</th><th>性別</th>
        <th>旅券番号</th><th>従前の在留資格<sup>(*)</sup></th><th>職業</th>
      </tr>
    </thead>
    <tbody>
      ${_row(1)}${_row(2)}${_row(3)}${_row(4)}${_row(5)}
    </tbody>
  </table>
  <div class="sh-note">（*）「特定技能」へ在留資格を変更する以前の在留資格に関する情報を明記とすること。</div>
</div>

<div class="sh-foot">
  <div>　この推薦状は、署名日から1年間有効</div>
  <div class="sh-foot-date">${f('f_signPlace')}、${f('f_signDate')}</div>
  <div class="sh-foot-sign">駐日ベトナム社会主義共和国労働管理部長</div>
  <div class="sh-foot-sign" style="margin-top:1mm;">（署名及び印）</div>
</div>
</div>`;
  _fontSize = (_fontSize === 8.5) ? 10.5 : _fontSize;
  _applyFontSize();
  _applySuisenhyoFontSize();
  const lbl=document.getElementById('fontSizeLabel');if(lbl)lbl.textContent=_fontSize+'pt';
  setupPageTracker();
  fitDocToPreview();
}
function _applySuisenhyoFontSize(){
  const st=document.getElementById('_suisenhyoFontStyle')||document.createElement('style');
  st.id='_suisenhyoFontStyle'; document.head.appendChild(st);
  const s=_fontSize/10.5;
  st.textContent=[
    `.doc [style*="font-size:14pt"]{font-size:${(14*s).toFixed(2)}pt!important}`,
    `.doc .sh-title{font-size:${(14*s).toFixed(2)}pt!important}`,
    `.doc .sh-tbl{font-size:${(9.5*s).toFixed(2)}pt!important}`,
    `.doc .sh-note{font-size:${(9.5*s).toFixed(2)}pt!important}`,
  ].join('');
}

function _ymd(d){
  if(!d) return '';
  // 2025-04-01 → 2025/04/01
  const m=String(d).match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m) return `${m[1]}/${String(m[2]).padStart(2,'0')}/${String(m[3]).padStart(2,'0')}`;
  return d;
}
function _gender(g){
  if(!g) return '';
  const s=String(g);
  if(/男|male|^M$/i.test(s)) return '男';
  if(/女|female|^F$/i.test(s)) return '女';
  return s;
}

async function loadFromDB(){
  const sel=document.getElementById('caseSelect');
  if(!sel||!sel.value) return;
  let info; try{info=JSON.parse(sel.value);}catch(e){return;}
  const {caseId,companyId,companyName,orgId}=info;
  try{
    // 受入機関情報と登録支援機関情報のみを取得（人材は別UIで個別指定）
    const coQ=companyId?`companies?select=name,pref,city,address,author_name,author_title,phone,fax&id=eq.${companyId}`
      :companyName?`companies?select=name,pref,city,address,author_name,author_title,phone,fax&name=eq.${encodeURIComponent(companyName)}`:null;
    const [cases,cos,orgs]=await Promise.all([
      caseId?sb('cases?select=applicant,support_org_id&id=eq.'+caseId):Promise.resolve([]),
      coQ?sb(coQ):Promise.resolve([]),
      orgId?sb(`support_orgs?select=*&id=eq.${orgId}`):Promise.resolve([])
    ]);
    const cas=cases&&cases[0];
    const co=cos&&cos[0];
    let org=orgs&&orgs[0];
    const s=(id,val)=>{const e=document.getElementById(id);if(e&&val!==undefined&&val!==null&&val!=='')e.value=val;};

    if(!org && cas && cas.support_org_id){
      const orgs2=await sb(`support_orgs?select=*&id=eq.${cas.support_org_id}`);
      org=orgs2&&orgs2[0];
    }
    // 1. 登録支援機関
    if(org){
      s('f_supName',org.name||'');
      s('f_supLicense',org.reg_no||org.license_no||'');
      s('f_supRep',org.representative||org.rep_name||org.support_manager||'');
      s('f_supAddr',org.address||'');
      s('f_supTel',org.phone||org.tel||'');
      s('f_supFax',org.fax||'');
    }
    // 2. 受入機関（companies）
    if(co){
      s('f_coName',co.name||'');
      s('f_coAddr',((co.pref||'')+(co.city||'')+(co.address||''))||'');
      s('f_coRep',co.author_name||'');
      s('f_coTel',co.phone||'');
      s('f_coFax',co.fax||'');
    }
    if(!v('f_signDate')){
      const n=new Date();
      document.getElementById('f_signDate').value=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日`;
    }
    p(); showToast('✅ 受入機関・登録支援機関を読み込みました');
  }catch(e){showToast('⚠️ 読込エラー: '+e.message);console.error(e);}
}

/* ========== 人材選択モーダル ========== */
let _ppTargetSlot=0;        // 1-5
let _ppFilterCache=null;    // {orgs:[], companies:[]}

function openPersonPicker(slot){
  _ppTargetSlot=slot;
  document.getElementById('ppModalTitle').textContent=`人材${slot}を選択 — caseから人材情報を投入`;
  // フィルタ用 select を初回だけ構築
  _buildPpFilters();
  document.getElementById('ppTxt').value='';
  renderPersonList();
  document.getElementById('personPickerBg').classList.add('open');
  setTimeout(()=>document.getElementById('ppTxt').focus(),50);
}
function closePersonPicker(){
  document.getElementById('personPickerBg').classList.remove('open');
}
function _buildPpFilters(){
  const cases = (typeof _allCases !== 'undefined' && _allCases) ? _allCases : [];
  // キャッシュは案件数が変わったら作り直す
  if(_ppFilterCache && _ppFilterCache.count===cases.length) return;
  const orgs=[...new Set(cases.map(r=>r.org||'').filter(Boolean))].sort();
  const cos =[...new Set(cases.map(r=>r.company||'').filter(Boolean))].sort();
  const oSel=document.getElementById('ppOrgSel');
  const cSel=document.getElementById('ppCoSel');
  oSel.innerHTML='<option value="">── 登録支援機関 すべて ──</option>'+orgs.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
  cSel.innerHTML='<option value="">── 所属機関 すべて ──</option>'+cos.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
  _ppFilterCache={count:cases.length, orgs, companies:cos};
}
function renderPersonList(){
  const cases = (typeof _allCases !== 'undefined' && _allCases) ? _allCases : [];
  const orgV=document.getElementById('ppOrgSel').value||'';
  const coV=document.getElementById('ppCoSel').value||'';
  const txt=(document.getElementById('ppTxt').value||'').trim().toLowerCase();
  const words=txt?txt.split(/\s+/).filter(Boolean):[];
  const MAX=200;
  let filtered=cases.filter(r=>{
    if(orgV && (r.org||'')!==orgV) return false;
    if(coV && (r.company||'')!==coV) return false;
    if(words.length){
      const hay=((r.name||'')+' '+(r.applicant||'')+' '+(r.company||'')+' '+(r.org||'')).toLowerCase();
      if(!words.every(w=>hay.includes(w))) return false;
    }
    return true;
  });
  const list=document.getElementById('ppList');
  const foot=document.getElementById('ppFoot');
  if(filtered.length>MAX && !coV && !words.length){
    list.innerHTML='<div style="padding:24px;text-align:center;color:#888;font-size:13px;">登録支援機関・所属機関で絞り込むか、名前を入力してください</div>';
    foot.textContent=`(${filtered.length}件・絞り込んでください)`;
    return;
  }
  if(!filtered.length){
    list.innerHTML='<div style="padding:24px;text-align:center;color:#888;font-size:13px;">該当する案件がありません</div>';
    foot.textContent='(0件)';
    return;
  }
  const rows=filtered.slice(0,MAX).map(r=>{
    const nm=esc(r.applicant||r.name||'(名前なし)');
    const co=esc(r.company||'');
    const orgN=esc(r.org||'');
    const cid=esc(String(r.id||''));
    return `<div class="pp-modal-row" data-case-id="${cid}" onclick="selectPersonForSlot(this.dataset.caseId)">
      <div class="name">${nm}</div>
      <div class="sub">${co}${orgN?' / '+orgN:''}</div>
    </div>`;
  }).join('');
  list.innerHTML=rows;
  foot.textContent=`(${filtered.length>MAX?MAX+'/'+filtered.length:filtered.length}件)`;
}
async function selectPersonForSlot(caseId){
  const slot=_ppTargetSlot;
  if(!slot){return;}
  if(!caseId){closePersonPicker();return;}
  try{
    const persons=await sb('persons?select=*&case_id=eq.'+caseId);
    const rec=persons&&persons[0];
    const pd=(rec&&rec.data)||rec||{};
    const s=(id,val)=>{const e=document.getElementById(id);if(e)e.value=val||'';};
    const i=slot;
    const nm=pd.applicant_name_en||pd.name_en||pd.romaji||pd.applicant_en||pd.applicant||pd.name||'';
    s('f_p'+i+'Name',nm);
    s('f_p'+i+'Birth',_ymd(pd.birthdate||pd.birth||''));
    s('f_p'+i+'Gender',_gender(pd.gender||''));
    s('f_p'+i+'Pass',pd.passport||pd.passport_no||pd.passportNumber||'');
    s('f_p'+i+'Prev',pd.previous_residence||pd.prev_residence||pd.former_residence||pd.former_status||pd.residence||'');
    s('f_p'+i+'Job',pd.occupation||pd.profession||pd.job||'');
    // ボタン色を緑（投入済み）に
    const btn=document.getElementById('pick'+i+'Btn');
    if(btn) btn.classList.add('has-data');
    closePersonPicker();
    p();
    showToast('✅ 人材'+slot+'に投入しました');
  }catch(e){showToast('⚠️ 投入エラー: '+e.message);console.error(e);}
}
function clearPerson(slot){
  const i=slot;
  ['Name','Birth','Gender','Pass','Prev','Job'].forEach(k=>{
    const el=document.getElementById('f_p'+i+k);
    if(el) el.value='';
  });
  const btn=document.getElementById('pick'+i+'Btn');
  if(btn) btn.classList.remove('has-data');
  p();
}
// ESCで閉じる
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    const bg=document.getElementById('personPickerBg');
    if(bg && bg.classList.contains('open')) closePersonPicker();
  }
});
initCaseSelect(); p();

function fitDocToPreview(){
  requestAnimationFrame(()=>{
    const pp = document.querySelector('.pp');
    const area = document.getElementById('pageArea');
    if(!pp || !area) return;
    const ppW = pp.clientWidth - 40;
    const docW = 794;
    if(ppW < docW){
      const scale = ppW / docW;
      area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = scale; });
    } else {
      area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = 1; });
    }
  });
}
window.addEventListener('resize', fitDocToPreview);

// index.htmlからの案件選択を受信
window.addEventListener('message', async function(e){
  if(!e.data||e.data.type!=='SELECT_CASE') return;
  const info=e.data.info;
  if(!info||!info.caseId) return;
  const sel=document.getElementById('caseSelect');
  if(sel){
    let found=false;
    for(let o of sel.options){
      try{
        const d=JSON.parse(o.value);
        if(d.caseId===info.caseId){sel.value=o.value;found=true;break;}
      }catch(e2){}
    }
    if(!found){
      const opt=document.createElement('option');
      opt.value=JSON.stringify(info);
      opt.textContent='（indexから選択）';
      sel.appendChild(opt);
      sel.value=opt.value;
    }
  }
  if(typeof loadCaseToForm==='function'){ await loadCaseToForm(info, 'suisenhyo'); }
  if(typeof loadFromDB==='function') loadFromDB(info);
});
