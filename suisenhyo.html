table.sh-tbl td.col-prev{width:18%}
table.sh-tbl td.col-job{width:20%;text-align:left}
.sh-note{font-size:9.5pt;margin-top:2mm}
.sh-foot{margin-top:8mm;font-size:10.5pt;text-align:right}
.sh-foot-date{margin:3mm 0 6mm}
.sh-foot-sign{margin-top:2mm}

/* 人材枠の case ID 貼り付けUI */
.cid-row{display:flex;gap:6px;align-items:center;margin:4px 6px 4px}
.cid-row input{flex:1;padding:5px 8px;border-radius:4px;border:1px solid #cbd5e0;font-size:11px;font-family:monospace}
.cid-btn{padding:5px 12px;background:#2563eb;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600;white-space:nowrap}
.cid-btn:hover{background:#1d4ed8}
.cid-btn.has-data{background:#16a34a}
.cid-btn.has-data:hover{background:#15803d}
.person-clear-btn{padding:5px 8px;background:#f3f4f6;color:#666;border:1px solid #d1d5db;border-radius:4px;cursor:pointer;font-size:11px;white-space:nowrap}
.person-clear-btn:hover{background:#e5e7eb}
.cid-status{margin:0 6px 6px;font-size:11px;color:#666;min-height:14px;line-height:1.3;font-family:sans-serif}
.cid-status.ok{color:#16a34a}
.cid-status.warn{color:#d97706}
.cid-status.err{color:#dc2626}
/* fp-case は共通CSSで display:none だが、ここでは表示する */
.fp-case{display:block!important;padding:10px!important;background:#1e293b!important;color:#e2e8f0!important;border-bottom:1px solid #475569!important}
.fp-case label{color:#cbd5e0!important;font-size:11px!important;font-weight:600!important;display:block;margin-bottom:4px;}
@media print{
  .app-bar,.fp{display:none!important}
  .main{display:block!important}
  .doc{box-shadow:none!important;margin:0!important;padding:15mm!important}
  .f[style*="color:#aaa"]{visibility:hidden}
}
</style>

<script>
function _row(i){
  // 行に1つでも入力があれば f()（プレースホルダー付き）、無ければ完全空白でセル表示
  const ids=['Name','Birth','Gender','Pass','Prev','Job'];
  const any=ids.some(k=>v('f_p'+i+k));
  const cell=k=>any?f('f_p'+i+k):'&nbsp;';
  return `<tr>
    <td class="col-no">${i}</td>
    <td class="col-name">${cell('Name')}</td>
    <td class="col-birth">${cell('Birth')}</td>
    <td class="col-gender">${cell('Gender')}</td>
    <td class="col-pass">${cell('Pass')}</td>
    <td class="col-prev">${cell('Prev')}</td>
    <td class="col-job">${cell('Job')}</td>
  </tr>`;
}
function p(){
  if(_editMode) return;
  const w=document.getElementById('pageArea'); if(!w) return;
  const visa=document.getElementById('f_visaType');
  const v1=visa&&visa.value==='1'?'■':'□';
  const v2=visa&&visa.value==='2'?'■':'□';
  w.innerHTML=`
<div class="doc">
<div class="page-num-label">P1</div>
<div class="sh-attach">添付2</div>
<div class="sh-title">特定技能外国人表</div>

<div class="sh-sec">
  <div class="sh-secnum">1．登録支援機関に関する情報</div>
  <div class="sh-row"><div class="sh-label">（名称）：</div><div class="sh-val">${f('f_supName')}</div></div>
  <div class="sh-row"><div class="sh-label">（認可番号）：</div><div class="sh-val">${f('f_supLicense')}</div></div>
  <div class="sh-row"><div class="sh-label">（代表者の氏名）：</div><div class="sh-val">${f('f_supRep')}</div></div>
  <div class="sh-row"><div class="sh-label">（所在地）：</div><div class="sh-val">${f('f_supAddr')}</div></div>
  <div class="sh-row">
    <div class="sh-label">（電話番号）：</div><div style="padding-left:0.5em;padding-right:2em;">${f('f_supTel')}</div>
    <div class="sh-label">Fax ファックス番号：</div><div class="sh-val">${f('f_supFax')}</div>
  </div>
</div>

<div class="sh-sec">
  <div class="sh-secnum">2．日本の受入機関に関する情報</div>
  <div class="sh-row"><div class="sh-label">（名称）：</div><div class="sh-val">${f('f_coName')}</div></div>
  <div class="sh-row"><div class="sh-label">（法人番号）：</div><div class="sh-val">${f('f_coLicense')}</div></div>
  <div class="sh-row"><div class="sh-label">（代表者の氏名）：</div><div class="sh-val">${f('f_coRep')}</div></div>
  <div class="sh-row"><div class="sh-label">（所在地）：</div><div class="sh-val">${f('f_coAddr')}</div></div>
  <div class="sh-row">
    <div class="sh-label">（電話番号）：</div><div style="padding-left:0.5em;padding-right:2em;">${f('f_coTel')}</div>
    <div class="sh-label">Fax ファックス番号：</div><div class="sh-val">${f('f_coFax')}</div>
  </div>
</div>

<div class="sh-sec">
  <div class="sh-secnum">3．労働期間</div>
  <div class="sh-row"><div class="sh-val">${f('f_workFrom')}　から　${f('f_workTo')}　まで</div></div>
</div>

<div class="sh-sec">
  <div class="sh-secnum">4．特定技能外国人に関する情報</div>
  <div class="sh-cb"><span>${v1}　1号特定技能外国人</span><span>${v2}　2号特定技能外国人</span></div>
  <table class="sh-tbl">
    <thead>
      <tr>
        <th>項番</th><th>氏名</th><th>生年月日</th><th>性別</th>
        <th>旅券番号</th><th>従前の在留資格<sup>(*)</sup></th><th>職業</th>
      </tr>
    </thead>
    <tbody>
      ${_row(1)}${_row(2)}${_row(3)}${_row(4)}${_row(5)}
    </tbody>
  </table>
  <div class="sh-note">（*）「特定技能」へ在留資格を変更する以前の在留資格に関する情報を明記とすること。</div>
</div>

<div class="sh-foot">
  <div style="text-align:left;margin-bottom:3mm;">　この推薦状は、署名日から1年間有効</div>
  <div class="sh-foot-date">${f('f_signPlace')}、${v('f_signDate')?f('f_signDate'):'　　　年　　月　　日'}</div>
  <div class="sh-foot-sign">駐日ベトナム社会主義共和国労働管理部長</div>
  <div class="sh-foot-sign" style="margin-top:1mm;">（署名及び印）</div>
</div>
</div>`;
  _fontSize = (_fontSize === 8.5) ? 10.5 : _fontSize;
  _applyFontSize();
  _applySuisenhyoFontSize();
  const lbl=document.getElementById('fontSizeLabel');if(lbl)lbl.textContent=_fontSize+'pt';
  setupPageTracker();
  fitDocToPreview();
}
function _applySuisenhyoFontSize(){
  const st=document.getElementById('_suisenhyoFontStyle')||document.createElement('style');
  st.id='_suisenhyoFontStyle'; document.head.appendChild(st);
  const s=_fontSize/10.5;
  st.textContent=[
    `.doc [style*="font-size:14pt"]{font-size:${(14*s).toFixed(2)}pt!important}`,
    `.doc .sh-title{font-size:${(14*s).toFixed(2)}pt!important}`,
    `.doc .sh-tbl{font-size:${(9.5*s).toFixed(2)}pt!important}`,
    `.doc .sh-note{font-size:${(9.5*s).toFixed(2)}pt!important}`,
  ].join('');
}

function _ymd(d){
  if(!d) return '';
  // 2025-04-01 → 2025/04/01
  const m=String(d).match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m) return `${m[1]}/${String(m[2]).padStart(2,'0')}/${String(m[3]).padStart(2,'0')}`;
  return d;
}
function _gender(g){
  if(!g) return '';
  const s=String(g);
  if(/男|male|^M$/i.test(s)) return '男';
  if(/女|female|^F$/i.test(s)) return '女';
  return s;
}

/* ========== case ID 形式チェック（緩い判定） ========== */
// case_<数字> 形式 または UUID形式 を許可。それ以外は警告のみで処理は継続
const _UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const _CASE_RE=/^case_\d+$/;
function _isValidCid(s){
  if(typeof s!=='string') return false;
  return _UUID_RE.test(s) || _CASE_RE.test(s);
}
// 後方互換用エイリアス（コード内の他箇所が _isUuid を呼んでいる場合に備え）
function _isUuid(s){ return _isValidCid(s); }

/* ========== メイン case ID 貼り付け（書類全体：登録支援機関+受入機関） ========== */
function onMainCidInput(){
  const inp=document.getElementById('caseIdPaste');
  const st=document.getElementById('mainCidStatus');
  if(!inp||!st) return;
  const cid=(inp.value||'').trim();
  if(!cid){ st.textContent=''; st.style.color='#888'; return; }
  if(_isUuid(cid)){ st.textContent='UUID形式OK・Enterまたは取得で反映'; st.style.color='#16a34a'; }
  else { st.textContent='※ UUID形式ではない可能性があります'; st.style.color='#d97706'; }
}
async function importMainCase(){
  const inp=document.getElementById('caseIdPaste');
  const st=document.getElementById('mainCidStatus');
  if(!inp) return;
  const cid=(inp.value||'').trim();
  if(!cid){ if(st){st.textContent='case IDを貼り付けてください';st.style.color='#d97706';} return; }
  if(!_isUuid(cid)){ if(st){st.textContent='⚠️ UUID形式ではありません';st.style.color='#dc2626';} return; }
  if(st){ st.textContent='取得中...'; st.style.color='#888'; }
  await _loadCaseInfo({caseId:cid});
  if(st){ st.textContent='✅ 取得完了'; st.style.color='#16a34a'; }
}

/* ========== 案件情報をDBから引いてフォームに反映 ========== */
async function _loadCaseInfo(info){
  if(!info) return;
  const {caseId,companyId,companyName,orgName}=info;
  if(!caseId && !companyId && !companyName && !orgName){ return; }
  const s=(id,val)=>{const e=document.getElementById(id);if(e&&val!==undefined&&val!==null&&val!=='')e.value=val;};

  // 1. case → applicant・org
  let cas=null, orgFromCase='';
  if(caseId){
    try{
      const rows=await sb('cases?select=applicant,org,company,company_id&id=eq.'+encodeURIComponent(caseId));
      cas=rows&&rows[0];
      if(cas) orgFromCase=cas.org||'';
    }catch(e){ console.warn('cases取得スキップ:',e.message); }
  }

  // 2. 登録支援機関：orgName(渡された値) または cas.org から名前検索
  const orgN=orgName||orgFromCase;
  if(orgN){
    try{
      // DB実カラム: name, address, support_manager, reg_no, tel, rep_name
      const sos=await sb('support_orgs?select=name,address,support_manager,reg_no,tel,rep_name&name=eq.'+encodeURIComponent(orgN));
      const org=sos&&sos[0];
      if(org){
        s('f_supName',org.name||'');
        s('f_supLicense',org.reg_no||'');
        s('f_supRep',org.rep_name||org.support_manager||'');
        s('f_supAddr',org.address||'');
        s('f_supTel',org.tel||'');
        // Fax は support_orgs に該当カラムなしのため未設定（手入力）
      } else {
        // 名前だけは入れておく
        s('f_supName',orgN);
      }
    }catch(e){ console.warn('support_orgs取得スキップ:',e.message); }
  }

  // 3. 受入機関（companies）
  const coId=companyId||(cas&&cas.company_id);
  const coN=(cas&&cas.company)||companyName||'';
  let co=null;
  if(coId){
    try{
      const rows=await sb(`companies?select=name,pref,city,address,rep_name,rep_title,corp_no,tel&id=eq.${coId}`);
      co=rows&&rows[0];
    }catch(e){ console.warn('companies(id)取得スキップ:',e.message); }
  }
  if(!co && coN){
    try{
      const rows=await sb(`companies?select=name,pref,city,address,rep_name,rep_title,corp_no,tel&name=eq.${encodeURIComponent(coN)}`);
      co=rows&&rows[0];
    }catch(e){ console.warn('companies(name)取得スキップ:',e.message); }
  }
  if(co){
    s('f_coName',co.name||'');
    s('f_coLicense',co.corp_no||'');
    s('f_coAddr',((co.pref||'')+(co.city||'')+(co.address||''))||'');
    s('f_coRep',co.rep_name||'');
    s('f_coTel',co.tel||'');
    // Fax: companies テーブルに該当カラムなしのため未設定（手入力）
  }

  // 4. 契約期間（persons.contract_start / contract_end）— 案件の人材から取得
  if(caseId){
    try{
      const persons=await sb('persons?select=contract_start,contract_end&case_id=eq.'+encodeURIComponent(caseId));
      const pd=persons&&persons[0];
      if(pd){
        s('f_workFrom',_ymd(pd.contract_start||''));
        s('f_workTo',_ymd(pd.contract_end||''));
      }
    }catch(e){ console.warn('persons(契約期間)取得スキップ:',e.message); }
  }

  if(!v('f_signPlace')){
    document.getElementById('f_signPlace').value='東京';
  }
  // 署名日付は自動入力しない（ベトナム大使館側で入れる）
  p();
}

/* 旧loadFromDB互換（postMessageから呼ばれる場合）— UUIDなcaseIdのみ受け付け */
async function loadFromDB(info){
  if(info && info.caseId){
    await _loadCaseInfo(info);
  }
}

/* ========== case ID 貼り付け方式 ========== */
function onCidInput(slot){
  const inp=document.getElementById('f_p'+slot+'Cid');
  const st=document.getElementById('p'+slot+'Status');
  if(!inp||!st) return;
  const cid=(inp.value||'').trim();
  if(!cid){ st.textContent=''; st.className='cid-status'; return; }
  if(_isValidCid(cid)){
    st.textContent='case ID OK・Enterまたは投入で取得';
    st.className='cid-status ok';
  } else {
    st.textContent='※ case ID 形式ではない可能性があります（投入は試みます）';
    st.className='cid-status warn';
  }
}
async function importPerson(slot){
  const inp=document.getElementById('f_p'+slot+'Cid');
  const st=document.getElementById('p'+slot+'Status');
  const btn=document.getElementById('p'+slot+'Btn');
  if(!inp) return;
  const cid=(inp.value||'').trim();
  if(!cid){ if(st){st.textContent='case IDを貼り付けてください';st.className='cid-status warn';} return; }
  if(st){ st.textContent='取得中...'; st.className='cid-status'; }
  const s=(id,val)=>{const e=document.getElementById(id);if(e)e.value=val||'';};
  const i=slot;
  let nm='', filled=false;

  // 1. まずcasesから申請人名を取得（最低限の情報）
  let cas=null;
  try{
    const rows=await sb('cases?select=applicant&id=eq.'+encodeURIComponent(cid));
    cas=rows&&rows[0];
    if(cas && cas.applicant){
      nm=cas.applicant;
      s('f_p'+i+'Name',nm);
      filled=true;
    }
  }catch(e){ console.warn('cases取得スキップ:',e.message); }

  // 2. personsから詳細情報を取得（あれば上書き）
  let foundPersons=false;
  try{
    const persons=await sb('persons?select=*&case_id=eq.'+encodeURIComponent(cid));
    const rec=persons&&persons[0];
    if(rec){
      foundPersons=true;
      const pd=(rec&&rec.data)||rec||{};
      const pNm=pd.applicant_name_en||pd.name_en||pd.romaji||pd.applicant_en||pd.applicant||pd.name||'';
      if(pNm){ nm=pNm; s('f_p'+i+'Name',nm); }
      s('f_p'+i+'Birth',_ymd(pd.birthdate||pd.birth||''));
      s('f_p'+i+'Gender',_gender(pd.gender||''));
      s('f_p'+i+'Pass',pd.passport||pd.passport_no||pd.passportNumber||'');
      s('f_p'+i+'Prev',pd.previous_residence||pd.prev_residence||pd.former_residence||pd.former_status||pd.residence||'');
      s('f_p'+i+'Job',pd.occupation||pd.profession||pd.job||'');
      filled=true;
    }
  }catch(e){ console.warn('persons取得スキップ:',e.message); }

  if(!filled){
    if(st){ st.textContent='⚠️ caseIDに該当する人材データが見つかりません'; st.className='cid-status err'; }
    return;
  }
  if(btn) btn.classList.add('has-data');
  if(st){
    const note=foundPersons?'':'（personsレコードなし。氏名のみ取得）';
    st.textContent='✅ 投入: '+(nm||'(名無し)')+note;
    st.className=foundPersons?'cid-status ok':'cid-status warn';
  }
  p();
  showToast('✅ 人材'+slot+'に投入しました');
}
function clearPerson(slot){
  const i=slot;
  ['Name','Birth','Gender','Pass','Prev','Job','Cid'].forEach(k=>{
    const el=document.getElementById('f_p'+i+k);
    if(el) el.value='';
  });
  const btn=document.getElementById('p'+i+'Btn');
  if(btn) btn.classList.remove('has-data');
  const st=document.getElementById('p'+i+'Status');
  if(st){ st.textContent=''; st.className='cid-status'; }
  p();
}
p();

function fitDocToPreview(){
  requestAnimationFrame(()=>{
    const pp = document.querySelector('.pp');
    const area = document.getElementById('pageArea');
    if(!pp || !area) return;
    const ppW = pp.clientWidth - 40;
    const docW = 794;
    if(ppW < docW){
      const scale = ppW / docW;
      area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = scale; });
    } else {
      area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = 1; });
    }
  });
}
window.addEventListener('resize', fitDocToPreview);

// index.htmlからの案件選択を受信
window.addEventListener('message', async function(e){
  if(!e.data||e.data.type!=='SELECT_CASE') return;
  const info=e.data.info;
  if(!info||!info.caseId) return;
  // 入力欄にも反映
  const inp=document.getElementById('caseIdPaste');
  if(inp) inp.value=info.caseId;
  await _loadCaseInfo(info);
  const st=document.getElementById('mainCidStatus');
  if(st){ st.textContent='✅ indexから取得'; st.style.color='#16a34a'; }
});
</script>
