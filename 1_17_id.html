"<p class=\"vi\">(Notes)</p>",
"<p class=\"vi\">1\tColumn I: If there are multiple people who are supposed to receive support and the contents of the support are the same, for “1 Name” write, “As given in the attached name list”, and attach a name list (no set format) for the matters set out in column I. This applies only where the applications are filed simultaneously.</p>",
"<p class=\"vi\">2\tColumn II-4: Fill in this section only if the organization of affiliation of the specified skilled worker itself is to implement the support plan for specified skilled workers (i).</p>",
"<p class=\"vi\">3\tColumn III: Fill in this section only when entrusting the implementation of all support plans for specified skilled workers (i) to a registered support organization.</p>",
"<p class=\"vi\">4\t“Scheduled implementation” in Column IV-1 to 9: Select the applicable items. If the scheduled implementation is “Yes”, briefly describe the implementation time; and if “No”, describe the reasons for not implementing the support in the parentheses.</p>",
"<p class=\"vi\">5 Only tick “Yes” for the “Outsourced” section in Column IV-1 to 9, if the organization of affiliation of the specified skilled worker is to entrust part of the support to a third party (excluding the cases when it is outsourced to a registered support organization). If the organization of affiliation of the specified skilled worker itself is to provide support or entrust all of the support to a registered support organization, tick “No”.</p>",
"<p class=\"vi\">6 “Support staff or implementing staff if the support is to be outsourced” in Column IV-1 to 8: If the organization of affiliation of the specified skilled worker itself is to provide support or entrust all of the support to a registered support organization, list the names of the appointed support staff, followed by their titles in parenthesis, for each type of support given. If a third party partly entrusted by the organization of affiliation of the specified skilled worker is to provide support, list the names and addresses of the staff entrusted for the support.</p>",
"<p class=\"vi\" style=\"text-indent:0.86em\">In addition, “Support manager or support staff” in Column IV-9: If the organization of affiliation of the specified skilled worker itself is to provide support or entrust all of the support to a registered support organization, list the names of the appointed support manager or support staff, followed by their titles in parenthesis, for each type of support given. In addition, if the support work described in the same column is performed by the third party partly entrusted by the organization of affiliation of the specified skilled worker, list the names and addresses of the staff entrusted for the support in column b and the free-entry column.</p>",
"<p class=\"vi\">7\t“Implementation method” in Column IV-1 to 4, 9: Select the applicable items. If you select “Others”, give the method of implementation in the parentheses.</p>",
"<p class=\"vi\">8\tWith regard to “Size of room” in IV Cell 3-A-d, select the appropriate check box from within the parentheses.</p>",
"<p class=\"vi\">Answer ② to ④ only if you have selected “Yes” in ①.</p>",
"<p class=\"vi\">For ③, tick either “Owned property” or “Rental property.”</p>",
"<p class=\"vi\">For ④, provide a proper explanation, including the following information, for example:</p>",
"<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- If ③ accommodation provided is an owned property: The amount that can be reasonably justified, considering actual costs incurred in building or renovating the property, the useful life of the property, the number of specified skilled workers occupying the property, etc.</p>",
"<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- If ③ accommodation provided is a rental property: The amount obtained by dividing the rent required for renting the property (including management charges and common area service charges but not including the security deposit, key money, guarantee money, and agent's commissions; and the same definition applies hereinafter.) by the number of specified skilled workers occupying the property.</p>",
"<p class=\"vi\">9 “Response times” in Column IV-6, B: Give the times for the available days of the week.</p>"
],

"<p class=\"vi\">(Catatan)</p>",
"<p class=\"vi\">1\tUntuk kolom I, selama sasaran penerima bantuan ada beberapa orang dan memiliki isi bantuan yang sama, tulis “Sesuai lampiran daftar nama terpisah” pada “1. Nama” dan lampirkan Daftar Nama yang mencantumkan hal-hal pada kolom I (format bebas). Hanya berlaku untuk pengajuan permohonan yang dilakukan secara bersamaan.</p>",
"<p class=\"vi\">2\tKolom II bagian 4 diisi hanya bila organisasi afiliasi pekerja asing berketerampilan khusus itu sendiri yang menjalankan rencana bantuan pekerja asing berketerampilan khusus 1.</p>",
"<p class=\"vi\">3\tKolom III diisi hanya bila seluruh pelaksanaan rencana bantuan pekerja asing berketerampilan khusus 1 didelegasikan ke lembaga pemberi bantuan terdaftar.</p>",
"<p class=\"vi\">4\tUntuk kolom “Rencana pelaksanaan” pada kolom IV bagian 1 sampai 9, centang hanya bagian yang sesuai dan cantumkan dengan singkat periode pelaksanaannya bila memilih “Ada” untuk rencana pelaksanaan. Bila “Tidak ada”, cantumkan dalam tanda kurung alasan tidak dilakukannya bantuan tersebut.</p>",
"<p class=\"vi\">5 Untuk kolom “Ada-tidaknya pendelegasian” pada kolom IV bagian 1 sampai 8, isi “Ada” hanya bila organisasi afiliasi pekerja asing berketerampilan khusus mendelegasikan sebagian bantuan kepada pihak ketiga (kecuali bila didelegasikan kepada organisasi pemberi bantuan terdaftar), dan isi “Tidak” bila organisasi afiliasi pekerja asing berketerampilan khusus memberikan sendiri bantuan tersebut atau mendelegasikan pemberian seluruh bantuan kepada pihak ketiga.</p>",
"<p class=\"vi\">6 Untuk kolom “PIC pemberian bantuan atau PIC pelaksana penerima delegasi” pada kolom IV bagian 1 sampai 8, isi nama dan jabatan dari PIC pemberi bantuan yang dipilih untuk setiap butir bantuan bila organisasi afiliasi pekerja asing berketerampilan khusus memberikan sendiri bantuan atau mendelegasikan pemberian seluruh bantuan kepada pihak ketiga, dan isi nama dan alamat penerima delegasi bantuan bila pemberian bantuan dilakukan oleh pihak ketiga penerima delegasi sebagian bantuan dari organisasi afiliasi pekerja asing berketerampilan khusus.</p>",
"<p class=\"vi\" style=\"text-indent:0.86em\">Perlu dicatat bahwa untuk kolom “Penanggungjawab bantuan atau PIC pemberian bantuan” pada kolom IV bagian 9, isi nama dan jabatan dari Penanggungjawab bantuan atau PIC pemberian bantuan yang dipilih untuk setiap butir bantuan bila organisasi afiliasi pekerja asing berketerampilan khusus memberikan sendiri bantuan atau mendelegasikan pemberian seluruh bantuan kepada pihak ketiga, dan isi nama dan alamat penerima delegasi bantuan bila dilakukan oleh pihak ketiga penerima delegasi sebagian bantuan dari organisasi afiliasi pekerja asing berketerampilan khusus pada kolom isian bebas b.</p>",
"<p class=\"vi\">7\tUntuk kolom “Cara pelaksanaan” pada kolom IV bagian 1 hingga 4 dan 9, centang hanya bagian yang sesuai. Bila mencentang “Lainnya”, tuliskan cara pelaksanaan lainnya di dalam tanda kurung.</p>",
"<p class=\"vi\">8\tUntuk “Luas ruang tamu” pada kolom IV, bagian 3-A-d, pilih yang sesuai dari kotak centang di dalam tanda kurung.</p>",
"<p class=\"vi\">Isi ② sampai ④ hanya jika Anda telah mencentang Ada pada poin ①.</p>",
"<p class=\"vi\">Untuk ③, centang salah satu “Milik sendiri” atau “Properti sewaan”.</p>",
"<p class=\"vi\">④ harus dijelaskan dan dipaparkan secara tepat dari perspektif berikut, misalnya:</p>",
"<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- Jika ③ merupakan \"Milik sendiri\": Jumlah yang dapat dijelaskan secara wajar dengan mempertimbangkan biaya aktual untuk konstruksi dan renovasi, masa ketahanan penggunaan properti, jumlah pekerja asing berketerampilan khusus yang tinggal di sana, dll.</p>",
"<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- Jika ③ adalah “Properti sewaan”, maka biaya yang diperlukan untuk sewa tersebut (termasuk biaya pengelolaan dan biaya fasilitas umum, dll., tetapi tidak termasuk uang deposit, uang kunci, uang jaminan, dan biaya perantara; hal yang sama berlaku di bawah ini) dibagi dengan jumlah pekerja asing berketerampilan khusus yang tinggal di properti tersebut.</p>",
"<p class=\"vi\">9 Untuk kolom “Waktu penanganan” pada kolom IV bagian 6-B, cantumkan rentang waktu tersebut untuk hari ketika penanganan dapat dilakukan.</p>"
