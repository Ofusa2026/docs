/* ===== 1-17 様式固有CSS ===== */

/* ==========================================================================
   参考様式第1-17号  1号特定技能外国人支援計画書
   Screen + print stylesheet
   --------------------------------------------------------------------------
   原本: A4 横 / 本文 9pt(日本語 ＭＳ明朝) ・ 8pt(ベトナム語 Times New Roman)
   表組は Word の tblGrid をそのまま % に換算して再現しています。
   ========================================================================== */

/* --- 1. 基本設定 ------------------------------------------------------- */
:root{
  --sheet-w: 1040px;        /* A4横の本文幅 275mm 相当 @96dpi */
  --fs-base: 12px;          /* 9pt */
  --ink: #000;
  --rule: #000;
  --bg: #f4f4f5;
  --paper: #fff;
  --hair: 1px;              /* 0.25pt */
  --thin: 1px;              /* 0.50pt */
  --thick: 2px;             /* 1.50pt */
}

*, *::before, *::after{ box-sizing: border-box; }



/* --- 2. 用紙 ----------------------------------------------------------- */
.viewport{
  padding: 24px 16px 64px;
  overflow-x: auto;
}

.sheet{
  width: var(--sheet-w);
  margin:0;
  padding: 10mm 8mm 14mm;
  background: var(--paper);
  box-shadow: 0 1px 3px rgba(0,0,0,.16), 0 8px 28px rgba(0,0,0,.10);
  font-size: var(--fs-base);
}

/* --- 3. 段落 ----------------------------------------------------------- */
.sheet p{
  margin: 0;
  white-space: pre-wrap;      /* 記入用の空白（全角・半角）を保持 */
  line-height: 1.3333;
  tab-size: 4;
  overflow-wrap: break-word;
}

/* 原本は全段落 line=240exact（＝12pt固定の行送り）。
   9pt の日本語は 1.3333、8pt のベトナム語は 1.5 で同じ 12pt になる。 */
p.ja{ font-size: 1em;    line-height: 1.3333; }
p.vi{ font-size: .889em; line-height: 1.5; }

.a-center{ text-align: center; }
.a-right { text-align: right;  }
.a-both  { text-align: justify; }

/* 表紙まわりの見出し */
.doc-title{
  font-size: 1.55em;
  font-weight: bold;
  letter-spacing: .12em;
  text-align: center;
  margin: 1.1em 0 .1em;
}
.doc-title-vi{
  font-size: 1em;
  text-align: center;
  margin-bottom: 1.1em;
}
.form-no{ margin-bottom: .2em; }

/* --- 4. 表組 ----------------------------------------------------------- */
.tbl-wrap{ margin: 0 0 .9em; }

table.grid{
  width: 100%;
  table-layout: fixed;         /* colgroup の % をそのまま効かせる */
  border-collapse: collapse;
  border-spacing: 0;
}

table.grid td{
  padding: .18em .2em;         /* Word の tblCellMar 99twips 相当 */
  vertical-align: middle;      /* 原本は全セル vAlign=center */
  word-break: break-word;
  border-style: solid;
  border-color: var(--rule);
  border-width: var(--thin);   /* 既定値。実際の太さは borders.css が上書き */
}

/* 罫線の太さはセルごとに borders.css で指定（Word の tcBorders を忠実に再現）。
   クラス名 b-<上><左><下><右>   n=なし / h=0.25pt / t=0.5pt / k=1.5pt */

/* --- 5. 縦書きセル（Ⅰ〜Ⅳ の見出し） ---------------------------------- */
td.vert{
  writing-mode: vertical-rl;
  text-orientation: mixed;
  padding: .3em .1em;
}
/* 原本どおり縦書きの見出しは1行に流す（折り返すとセル幅＝縦書きの行数を
   超えて隣の欄へはみ出す）。原本の行送りは line=160exact ＝ 8pt。 */
td.vert p{
  white-space: normal;
  text-align: center;
  margin: 0 .05em;
  font-size: .9em;
  line-height: 1.25;
  letter-spacing: .02em;
}
/* 縦書きセルは内容がはみ出さないよう縦方向に収める */
td.vert{ overflow: hidden; }

/* --- 6. チェックボックス ----------------------------------------------- */
input.cb{
  -webkit-appearance: none;
  appearance: none;
  display: inline-block;
  /* 原本の □ は全角1文字ぶん。ただし 1em ちょうどだと「□有（　　　）」のような
     行が桁あふれで折り返してしまうため、わずかに小さい 0.9em とする。 */
  width: .9em;
  height: .9em;
  margin: 0;
  padding: 0;
  border: var(--thin) solid var(--ink);
  background: transparent;
  vertical-align: -.14em;
  cursor: pointer;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
/* ver.20261020.06: チェック時は ✔ ではなく塗りつぶしの ■ で表示する。
   原本の記入例が □→■ の塗りつぶしであるため。 */
input.cb:checked{
  background: var(--ink);
}
input.cb:checked::after{ content: none; }
input.cb:focus-visible{ outline: 2px solid #0b57d0; outline-offset: 1px; }

/* --- 7. 改ページ（原本の明示的な改ページ位置） ------------------------- */
.pagebreak{ break-after: page; page-break-after: always; height: 0; }

/* --- 8. ツールバー（画面のみ） ----------------------------------------- */
.sr-only{
  position: absolute; width: 1px; height: 1px;
  margin: -1px; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}




#fitmode:checked ~ 

/* --- 9. レスポンシブ ---------------------------------------------------- */

/* ver.20261029.02: 作成日の行は下線だけにする（table.grid td の細線指定に負けて上・左右にも線が出ていた） */

/* ==========================================================================
   11. 記入欄（入力フォーム）
   --------------------------------------------------------------------------
   入力欄は元の空白とまったく同じ幅で置き換え、セル全体の記入欄は絶対配置に
   しているため、組版（行の高さ・改ページ位置）は静的版と変わりません。
   ========================================================================== */
td.fld{ position: relative; }
td.fld > .sp{ visibility: hidden; }     /* 行の高さを元のまま保つための下敷き */

textarea.f{
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  margin: 0; padding: .18em .2em;
  font: inherit; line-height: 1.3333; color: inherit;
  border: 0; border-radius: 0; background: transparent;
  resize: none; overflow: auto;
}

input.bl{                                /* 行中の記入欄（〒・年月日など） */
  font: inherit; line-height: inherit; color: inherit;
  margin: 0; padding: 0; border: 0; border-radius: 0;
  background: transparent;
  vertical-align: baseline;
  text-align: center;
  min-width: 0;
}

/* 「有・無」などは○で囲んで選ぶ。
   選択肢は inline のままにする。inline-block にすると、字下げ（text-indent）
   のある段落の行頭に来たとき、その字下げ分まで箱に含まれて○が横に伸びる。 */
.chc .opt{ cursor: pointer; }
.chc .opt input{ position: absolute; opacity: 0; width: 0; height: 0; }
.chc .opt input:checked + span{
  outline: 1.2px solid currentColor;     /* outline は組版に影響しない */
  outline-offset: 1px;
  border-radius: 1em;
}
.chc .opt input:focus-visible + span{ background: #dbe9ff; }
/* ver.20261015.01: 常に〇が付く固定選択肢。

   ラジオを置かず選択済みの見た目だけを埋め込む（国籍・ほか0名と同じ方針）。
   見た目は input:checked + span と同一。 */
.chc .fixed{
  outline: 1.2px solid currentColor;
  outline-offset: 1px;
  border-radius: 1em;
}

/* ver.20261030.01: 本文の記入欄（有（　）など）は幅が固定で、長い文字が途中で切れていた。
   文字が収まらないときは欄を広げ（セルの幅まで）、それでも収まらなければ文字を小さくする。 */
function _p17FitInput(el){
  if(!el || !el.matches || !el.matches('#pageArea input.bl')) return;
  if(!el.dataset.w0) el.dataset.w0 = el.style.width || '';
  el.style.width = el.dataset.w0; el.style.fontSize = '';
  if(!el.value || el.scrollWidth <= el.clientWidth+1) return;
  var td = el.closest('td'); var room = td ? td.clientWidth - 4 : 0;
  var other = 0; if(td){ var p = el.parentNode; other = Math.max(0, (p.scrollWidth||0) - el.offsetWidth); }
  var maxW = Math.max(el.offsetWidth, room - Math.min(other, room*0.5));
  el.style.width = Math.min(el.scrollWidth + 6, maxW) + 'px';
  var fs = 100;
  while(el.scrollWidth > el.clientWidth+1 && fs > 60){ fs -= 8; el.style.fontSize = fs + '%'; }
}
function _p17FitInputs(){ document.querySelectorAll('#pageArea input.bl').forEach(_p17FitInput); }
document.addEventListener('input', function(e){ _p17FitInput(e.target); });

function _p17Look(x){
  if(!_p17ViN){ _p17ViN={}; Object.keys(P17_VI_DICT).forEach(function(k){ _p17ViN[_p17Nk(k)]=P17_VI_DICT[k]; }); }

/* 辞書の語を中に含むだけの文（例：電話 06-1234-5678）は、語を置き換えて日本語が残らなければそれを使う */
function _p17Subst(x){
  if(!_p17ViN) _p17Look('');
  var keys=Object.keys(_p17ViN).filter(function(k){ return k.length>=2; }).sort(function(a,b){ return b.length-a.length; });
  var out=String(x); try{ out=out.normalize('NFKC'); }catch(e){}
  /* ver.20261105.16: 見つけた語は目印に置き換えてから、残りに日本語が無いかを見る（訳した文字を日本語と見間違えないように） */
  var got=[];
  keys.forEach(function(k){ if(out.indexOf(k)>=0){ out=out.split(k).join(' \u0003'+got.length+'\u0004 '); got.push(_p17ViN[k]); } });
  if(!got.length) return '';
  var rest=out.replace(/\u0003\d+\u0004/g,'');
  if(_p17NeedTr(rest)) return '';
  return out.replace(/\u0003(\d+)\u0004/g, function(_m,i){ return got[+i]; }).replace(/\s+/g,' ').replace(/\s+([)）,、])/g,'$1').replace(/([(（])\s+/g,'$1').trim();
}
/* ver.20261105.16: 訳す必要がある文字か（日本語のかな・漢字が残っている）。中国語版は漢字が共通なので、辞書に無い漢字も「訳せていない」とみなす */
function _p17NeedTr(x){ x=String(x||''); return _P17_JP.test(x) || (typeof P17_LANG!=='undefined' && P17_LANG==='zh' && /[\u3400-\u9fff]/.test(x)); }
function _p17Vi(t){
  t=String(t||'').trim(); if(!t) return '';
  var hit=_p17Look(t); if(hit) return hit;
  if(!_p17NeedTr(t)) return t;   // 電話番号・メールアドレスなどはそのまま
  // 「有（適宜実施）」「直接面談(月1回)」のようなカッコ付きは、外と中を別々に訳す
  var pm=t.match(/^([^（(]+)[（(](.+)[）)]$/);
  if(pm && !/[（(]/.test(pm[2])) return _p17Vi(pm[1])+' ('+_p17Vi(pm[2])+')';
  return t.split(/／/).map(function(a){
    a=a.trim(); var h=_p17Look(a); if(h) return h;
    if(!_p17NeedTr(a)) return a;
    return a.split(/[・、,，]/).map(function(b){
      b=b.trim(); if(!b) return '';
      if(/^(電話番号記載なし|記載チェック無し|記載文言多数|確認方法(欄)?未(チェック|記載))$/.test(_p17Nk(b))) return '';   // 読み取り時のメモは出さない
      var h2=_p17Look(b) || _p17Subst(b); if(h2) return h2;
      if(!_p17NeedTr(b)) return b;
      window._p17Untr[b]=true; return '\u0001'+b+'\u0002';   // ver.20261105.16: 目印（赤表示用）
    }).filter(Boolean).join(', ');
  }).join(' / ');
}
function _p17EscMark(s){
  var esc1=function(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };

  return String(s).split(/(\u0001[^\u0001\u0002]*\u0002)/).map(function(seg){
    if(/^\u0001[\s\S]*\u0002$/.test(seg)) return '<span class="p17-untr">'+esc1(seg.slice(1,-1))+'</span>';
    return esc1(seg).replace(/[぀-ヿ㐀-鿿々〆〜「」（）：＝]+/g, function(m){ return '<span class="p17-untr">'+m+'</span>'; });
  }).join('');

/* ver.20261104.05: 入力値・チェックを HTML の属性にも書き込む。
   直接編集の開始時、Saysay共通処理（_tplSig）が書類を一度作り直して innerHTML で元に戻すため、
   画面で入れた値（属性ではない）が全部消えていた。属性に写しておけば innerHTML で戻しても残る。
   編集版の保存（saysay_html_store）にも値が残るようになる。 */
function _p17Bake(){
  var area=document.getElementById('pageArea'); if(!area) return;
  area.querySelectorAll('input').forEach(function(e){
    var t=(e.type||'text').toLowerCase();
    if(t==='checkbox'||t==='radio'){ if(e.checked) e.setAttribute('checked',''); else e.removeAttribute('checked'); }
    else if(e.getAttribute('value')!==e.value) e.setAttribute('value', e.value);
  });
  area.querySelectorAll('textarea').forEach(function(e){ if(e.textContent!==e.value){ var v=e.value; e.textContent=v; e.value=v; } });
}
document.addEventListener('input',  function(e){ if(e.target && e.target.closest && e.target.closest('#pageArea')) _p17Bake(); }, true);
document.addEventListener('change', function(e){ if(e.target && e.target.closest && e.target.closest('#pageArea')) _p17Bake(); }, true);

<div class="p17page"><div class="doc p17doc"><p class="ja">（注意）</p>
<p class="ja">１　Ⅰ欄は，支援対象者が複数名いる場合であって支援内容が同一の場合に限り，「１　氏名に「別紙の名簿のとおり」と記載し，Ⅰ欄の事項が記載された名簿（任意様式）を添付することとして差し支えない。ただし，申請を同時に行う場合に限る。</p>
<p class="ja" style="padding-left:3.00em;text-indent:-3.00em">２　Ⅱ欄４は，特定技能所属機関自らが１号特定技能外国人支援計画を実施する場合のみ記載すること。</p>
<p class="ja" style="padding-left:3.00em;text-indent:-3.00em">３　Ⅲ欄は，１号特定技能外国人支援計画の全部の実施を登録支援機関に委託する場合のみ記載すること。</p>
<p class="ja">４　Ⅳ欄１から９までの「実施予定」欄は，該当するものにチェックをし，実施予定が「有」の場合は実施時期を簡潔に記載し，「無」の場合は当該支援を実施しない理由について括弧内に記載すること。</p>
<p class="ja">５　Ⅳ欄１から９までの「委託の有無」欄は，特定技能所属機関が支援の一部を第三者に委託（登録支援機関に委託する場合を除く。）する場合にのみ「有」と記載し，特定技能所属機関が自ら支援を行う場合や登録支援機関に支援の全部を委託する場合には「無」と記載すること。</p>
<p class="ja">６　Ⅳ欄１から８までの「支援担当者又は委託を受けた支援実施者」欄は，特定技能所属機関が自ら支援を行う場合や登録支援機関に支援の全部を委託する場合に選任することとされている支援担当者を支援項目ごとに氏名及び括弧内に役職を記載し，特定技能所属機関から委託の一部を受けた第三者が支援を実施する場合は支援の委託を受けた者の氏名及び所在地を記載すること。</p>
<p class="ja" style="text-indent:1.00em">なお，Ⅳ欄９の「支援責任者又は支援担当者」欄は，特定技能所属機関が自ら支援を行う場合や登録支援機関に支援の全部を委託する場合に選任することとされている支援責任者又は支援担当者の氏名及び括弧内に役職を記載すること。このうちｂ欄及び自由記入欄については同欄の支援を特定技能所属機関から委託の一部を受けた第三者が実施する場合は支援の委託を受けた者の氏名及び所在地を記載すること。</p>
<p class="ja">７　Ⅳ欄１から４まで及び９の「実施方法」欄は，該当するものにチェックをすること。「その他」にチェックする場合は，その実施方法について括弧内に記載すること。</p>
<p class="ja">８　Ⅳ欄３アｄ「居室の広さ」について，該当するものを括弧内のチェックボックスから選択すること。</p>
<p class="ja">②から④までは、①で有にチェックを付した場合にのみ記載すること。</p>
<p class="ja">③は、「自己所有物件」、「借上物件」のいずれかにチェックを付すこと。</p>
<p class="ja">④は、例えば以下のような観点から記載し、説明が適切にされなければならない</p>
<p class="ja" style="padding-left:2.21em;text-indent:-1.11em">・	③が「自己所有物件」の場合：　実際に建設・改装等に要した費用、物件の耐用年数、入居する特定技能外国人の人数等を勘案して合理的であると説明可能な額</p>
<p class="ja" style="padding-left:2.21em;text-indent:-1.11em">・	③が「借上物件」の場合：　借上げに要する賃料（管理費・共益費等を含み、敷金・礼金・保証金・仲介手数料は含まない。以下同じ。）を、入居する特定技能外国人の人数で除した額</p>
<p class="ja">９　Ⅳ欄６イの「対応時間」欄は，対応可能曜日についてその時間帯を記載すること。</p>
<p class="vi">(Catatan)</p>
<p class="vi">1	Untuk kolom I, selama sasaran penerima bantuan ada beberapa orang dan memiliki isi bantuan yang sama, tulis “Sesuai lampiran daftar nama terpisah” pada “1. Nama” dan lampirkan Daftar Nama yang mencantumkan hal-hal pada kolom I (format bebas). Hanya berlaku untuk pengajuan permohonan yang dilakukan secara bersamaan.</p>
<p class="vi">2	Kolom II bagian 4 diisi hanya bila organisasi afiliasi pekerja asing berketerampilan khusus itu sendiri yang menjalankan rencana bantuan pekerja asing berketerampilan khusus 1.</p>
<p class="vi">3	Kolom III diisi hanya bila seluruh pelaksanaan rencana bantuan pekerja asing berketerampilan khusus 1 didelegasikan ke lembaga pemberi bantuan terdaftar.</p>
<p class="vi">4	Untuk kolom “Rencana pelaksanaan” pada kolom IV bagian 1 sampai 9, centang hanya bagian yang sesuai dan cantumkan dengan singkat periode pelaksanaannya bila memilih “Ada” untuk rencana pelaksanaan. Bila “Tidak ada”, cantumkan dalam tanda kurung alasan tidak dilakukannya bantuan tersebut.</p>
<p class="vi">5 Untuk kolom “Ada-tidaknya pendelegasian” pada kolom IV bagian 1 sampai 8, isi “Ada” hanya bila organisasi afiliasi pekerja asing berketerampilan khusus mendelegasikan sebagian bantuan kepada pihak ketiga (kecuali bila didelegasikan kepada organisasi pemberi bantuan terdaftar), dan isi “Tidak” bila organisasi afiliasi pekerja asing berketerampilan khusus memberikan sendiri bantuan tersebut atau mendelegasikan pemberian seluruh bantuan kepada pihak ketiga.</p>
<p class="vi">6 Untuk kolom “PIC pemberian bantuan atau PIC pelaksana penerima delegasi” pada kolom IV bagian 1 sampai 8, isi nama dan jabatan dari PIC pemberi bantuan yang dipilih untuk setiap butir bantuan bila organisasi afiliasi pekerja asing berketerampilan khusus memberikan sendiri bantuan atau mendelegasikan pemberian seluruh bantuan kepada pihak ketiga, dan isi nama dan alamat penerima delegasi bantuan bila pemberian bantuan dilakukan oleh pihak ketiga penerima delegasi sebagian bantuan dari organisasi afiliasi pekerja asing berketerampilan khusus.</p>
<p class="vi" style="text-indent:0.86em">Perlu dicatat bahwa untuk kolom “Penanggungjawab bantuan atau PIC pemberian bantuan” pada kolom IV bagian 9, isi nama dan jabatan dari Penanggungjawab bantuan atau PIC pemberian bantuan yang dipilih untuk setiap butir bantuan bila organisasi afiliasi pekerja asing berketerampilan khusus memberikan sendiri bantuan atau mendelegasikan pemberian seluruh bantuan kepada pihak ketiga, dan isi nama dan alamat penerima delegasi bantuan bila dilakukan oleh pihak ketiga penerima delegasi sebagian bantuan dari organisasi afiliasi pekerja asing berketerampilan khusus pada kolom isian bebas b.</p>
<p class="vi">7	Untuk kolom “Cara pelaksanaan” pada kolom IV bagian 1 hingga 4 dan 9, centang hanya bagian yang sesuai. Bila mencentang “Lainnya”, tuliskan cara pelaksanaan lainnya di dalam tanda kurung.</p>
<p class="vi">8	Untuk “Luas ruang tamu” pada kolom IV, bagian 3-A-d, pilih yang sesuai dari kotak centang di dalam tanda kurung.</p>
<p class="vi">Isi ② sampai ④ hanya jika Anda telah mencentang Ada pada poin ①.</p>
<p class="vi">Untuk ③, centang salah satu “Milik sendiri” atau “Properti sewaan”.</p>
<p class="vi">④ harus dijelaskan dan dipaparkan secara tepat dari perspektif berikut, misalnya:</p>
<p class="vi" style="padding-left:2.21em;text-indent:-1.11em">- Jika ③ merupakan "Milik sendiri": Jumlah yang dapat dijelaskan secara wajar dengan mempertimbangkan biaya aktual untuk konstruksi dan renovasi, masa ketahanan penggunaan properti, jumlah pekerja asing berketerampilan khusus yang tinggal di sana, dll.</p>
<p class="vi" style="padding-left:2.21em;text-indent:-1.11em">- Jika ③ adalah “Properti sewaan”, maka biaya yang diperlukan untuk sewa tersebut (termasuk biaya pengelolaan dan biaya fasilitas umum, dll., tetapi tidak termasuk uang deposit, uang kunci, uang jaminan, dan biaya perantara; hal yang sama berlaku di bawah ini) dibagi dengan jumlah pekerja asing berketerampilan khusus yang tinggal di properti tersebut.</p>
<p class="vi">9 Untuk kolom “Waktu penanganan” pada kolom IV bagian 6-B, cantumkan rentang waktu tersebut untuk hari ketika penanganan dapat dilakukan.</p>

async function loadFromDB(passedInfo){
  var info=passedInfo;
  if(!info){ var sel=document.getElementById('caseSelect'); if(!sel||!sel.value) return; try{info=JSON.parse(sel.value);}catch(e){return;} }
  if(!info||!info.caseId) return;
  window._p17Att = null; window._p17AttOrg = ''; window._p17ExInterp = []; window._p17MgrReal = null; window._p17OfficeNote = null;   // ver.20261105.11: 前の案件の名簿を持ち越さない
  var caseId=info.caseId, companyId=info.companyId, companyName=info.companyName;
  var _s=function(id,val){var e=document.getElementById(id); if(e&&val!=null&&val!=='') e.value=val;};
  /* ver.20261013.02: 住所文字列を 都道府県／市区町村／以降 に分割（1_17.html Word版 splitAddress と同一仕様） */
  var _splitAddr=function(str){
    if(!str) return {pref:'',city:'',rest:''};
    var pm=String(str).match(/^(北海道|東京都|(?:京都|大阪)府|.{2,3}県)/);
    var pref=pm?pm[1]:''; var r1=pm?String(str).substring(pref.length):String(str);
    var cm=r1.match(/^(.+?[市区町村郡])/);
    var city=cm?cm[1]:''; var rest=cm?r1.substring(city.length):r1;
    return {pref:pref,city:city,rest:rest};
  };
  /* ver.20261013.11: 電話番号の3分割ヘルパー(_setTel)は、全ての電話欄を
     「案シスの値をそのまま1本で表示」に統一したため不要になり削除した。 */

// プレビューをプレビュー領域の幅に収める（横長A4を自動縮小）
function p17Fit(){
  var area=document.getElementById('pageArea'); if(!area) return;
  var pages=area.querySelectorAll('.p17page'); if(!pages.length) return;
  var avail=area.clientWidth - 40;
  if(avail<=0){ requestAnimationFrame(p17Fit); return; }
  pages.forEach(function(pg){
    var d=pg.querySelector('.doc.p17doc'); if(!d) return;
    d.style.transform='none';
    var w=d.offsetWidth||1040, h=d.offsetHeight;
    var scale=Math.min(1, avail/w);
    d.style.transformOrigin='top left';
    d.style.transform='scale('+scale+')';
    pg.style.width=(w*scale)+'px';
    pg.style.height=(h*scale)+'px';
    pg.style.margin='0 0 24px 0';
    pg.style.overflow='hidden';
  });
}

/* ver.20261105.10: 印刷の直前に、各ページが紙1枚に収まるか測り、はみ出すページだけ縮める。
   ヒアリングの回答が長い案件でも、同じ言語ならいつも同じ枚数（18枚）で印刷されるようにする。
   測り方：印刷用のCSS（@media print の中身）を一時的に画面に当て、紙の幅で並べて高さを測る。 */
function _p17FitForPrint(){
  var A=document.getElementById('pageArea'); if(!A) return;
  var pages=[].slice.call(A.querySelectorAll('.p17page')); if(!pages.length) return;
  var css='';
  try{
    [].slice.call(document.styleSheets).forEach(function(ss){
      var rules; try{ rules=ss.cssRules; }catch(e){ return; }
      [].slice.call(rules||[]).forEach(function(r){
        if(r.type===4 && r.media && /print/.test(r.media.mediaText) && !/screen/.test(r.media.mediaText)){
          [].slice.call(r.cssRules).forEach(function(x){ css+=x.cssText+'\n'; });
        }
      });
    });
  }catch(e){}
  var MM=96/25.4, W=Math.floor(277*MM), H=Math.floor(190*MM*0.88);   // ver.20261105.19: 12%の余裕（Windowsの文字は画面の測り方より高く出ることがあり、1行はみ出して改ページが崩れていた）   // A4横・余白10mm
  var st=document.createElement('style'); st.id='_p17measure'; st.textContent=css+'\n#pageArea{ width:'+W+'px !important; max-width:none !important; }';
  pages.forEach(function(pg){ pg.style.setProperty('--pzfit','1'); });
  document.head.appendChild(st);
  try{
    pages.forEach(function(pg){
      var h=pg.getBoundingClientRect().height;
      if(h>H){ pg.style.setProperty('--pzfit', String(Math.floor(H/h*1000)/1000)); }
    });
  }finally{ st.remove(); }
}
window.addEventListener('beforeprint', function(){ try{ _p17FitForPrint(); }catch(e){} });

/* ver.20261105.16: 古い版が画面に残らないようにする。
   開いたとき、サーバーの最新版のバージョンと比べ、新しければ自動で読み込み直す（開いて10秒以内・未編集のとき）。
   それ以外は画面上部に「新しい版があります」と出す。読み込み直す前に表示中の案件を覚えておき、読み込み後に同じ案件を開く。 */
(function(){
  var KEY='p17_reload_case_'+location.pathname;
  var verNum=function(t){ var m=String(t||'').match(/ver\.(\d{8})\.(\d+)/); return m ? Number(m[1])*1000+Number(m[2]) : 0; };
  var cur=function(){ var e=document.querySelector('.ver'); return e ? e.textContent.trim() : ''; };
  var t0=Date.now(), touched=false;
  document.addEventListener('input', function(){ touched=true; }, true);
  document.addEventListener('mousedown', function(e){ if(e.target && e.target.closest && e.target.closest('#pageArea, .fp')) touched=true; }, true);
  // 読み込み直した直後：案件が届かなければ覚えておいた案件を開く
  try{
    var saved=sessionStorage.getItem(KEY);
    if(saved){
      sessionStorage.removeItem(KEY);
      var info=JSON.parse(saved);
      setTimeout(function(){ try{ if(!window._lastCaseInfo && info && typeof loadFromDB==='function') loadFromDB(info); }catch(e){} }, 2500);
    }
  }catch(e){}
  var reload=function(){
    try{ if(window._lastCaseInfo) sessionStorage.setItem(KEY, JSON.stringify(window._lastCaseInfo)); }catch(e){}
    var q=location.search.replace(/([?&])_r=\d+/,'$1').replace(/[?&]$/,'');
    location.replace(location.pathname + (q ? q+'&' : '?') + '_r=' + Date.now() + location.hash);
  };
  window._p17ReloadLatest=reload;
  var check=function(){
    fetch(location.pathname+'?_vchk='+Date.now(), {cache:'no-store'}).then(function(r){ return r.ok ? r.text() : ''; }).then(function(html){
      var m=String(html).match(/class="ver">(ver\.\d{8}\.\d+)</); if(!m) return;
      var latest=m[1], now=cur();
      if(verNum(latest) <= verNum(now)) return;
      var guard='p17_vchk_'+latest;
      var tried=false; try{ tried=sessionStorage.getItem(guard)==='1'; sessionStorage.setItem(guard,'1'); }catch(e){}
      if(!tried && !touched && !window._editMode && Date.now()-t0 < 10000){ reload(); return; }
      var bar=document.getElementById('p17UpdBar');
      if(!bar){ bar=document.createElement('div'); bar.id='p17UpdBar'; bar.style.cssText='position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:2147483000;background:#1e3a5f;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25)'; document.body.appendChild(bar); }
      bar.innerHTML='🔄 新しい版（'+latest+'）があります。いま表示しているのは '+now+' です。 <button type="button" style="margin-left:8px;padding:3px 10px;border:0;border-radius:6px;background:#fff;color:#1e3a5f;font-weight:700;cursor:pointer">最新版にする</button>';
      bar.querySelector('button').onclick=reload;
    }).catch(function(){});
  };
  if(document.readyState==='complete') setTimeout(check, 1500); else window.addEventListener('load', function(){ setTimeout(check, 1500); });
})();
