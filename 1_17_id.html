ntor tempat kerja sasaran penerima bantuan ${_p17PlaceFx() || `(Prefektur ${f('es_officePrefEn')}/Tokyo/Osaka/Hokkaido, kota/distrik/lingkungan/desa ${f('es_officeCityEn')})`}</p><p class=\"ja\" style=\"padding-left:6.30em\">Tanggal konfirmasi: tanggal ${v('es_symD')||'　'} bulan ${v('es_symM')||'　'} tahun ${v('es_symY')||'　　'}　<input type=\"hidden\" class=\"bl\" id=\"f397\" name=\"f397\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿\" style=\"width:2.75em\">Metode konfirmasi:　<input type=\"checkbox\" class=\"cb\" id=\"f398\" name=\"f398\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> Situs web　 <input type=\"checkbox\" class=\"cb\" id=\"f399\" name=\"f399\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> Metode lain (<input type=\"text\" class=\"bl\" id=\"f400\" name=\"f400\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿)\" style=\"width:17.00em\">)</p><p class=\"vi\" style=\"padding-left:6.30em\">Keterangan:</p><p class=\"ja\" style=\"padding-left:3.78em\">・Tempat domisili sasaran penerima bantuan</p><p class=\"vi\" style=\"padding-left:6.30em\"><input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f380s\" disabled>Sama dengan di atas</p><p class=\"ja\" style=\"padding-left:6.30em\"><input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f380d\" disabled>Lokasi berbeda dengan di atas <span class=\"p17gen\" data-gen=\"res\">(Prefektur<input type=\"text\" class=\"bl\" id=\"f401\" name=\"f401\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜(＿/Tokyo\" style=\"width:1.25em\">/Tokyo/Osaka/Hokkaido, kota/distrik/lingkungan/desa<input type=\"text\" class=\"bl\" id=\"f402\" name=\"f402\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿)\" style=\"width:10.25em\">)</span><span class=\"p17val\" data-val=\"res\" style=\"display:none\"></span></p><p class=\"ja\" style=\"padding-left:6.30em\">Tanggal konfirmasi: tanggal <span data-p17d=\"d\"></span> bulan <span data-p17d=\"m\"></span> tahun <span data-p17d=\"y\"></span>　<input type=\"hidden\" class=\"bl\" id=\"f403\" name=\"f403\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿\" style=\"width:2.75em\">Metode konfirmasi:　<input type=\"checkbox\" class=\"cb\" id=\"f404\" name=\"f404\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> Situs web　 <input type=\"checkbox\" class=\"cb\" id=\"f405\" name=\"f405\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> Metode lain (<input type=\"text\" class=\"bl\" id=\"f406\" name=\"f406\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿)\" style=\"width:17.00em\">)</p><p class=\"vi\" style=\"padding-left:6.30em\">Keterangan:</p></td>"],0,1],[2244,16,2543715452,["<p class=\"vi\">(Catatan)</p>","<p class=\"vi\">1\tUntuk kolom I, selama sasaran penerima bantuan ada beberapa orang dan memiliki isi bantuan yang sama, tulis “Sesuai lampiran daftar nama terpisah” pada “1. Nama” dan lampirkan Daftar Nama yang mencantumkan hal-hal pada kolom I (format bebas). Hanya berlaku untuk pengajuan permohonan yang dilakukan secara bersamaan.</p>","<p class=\"vi\">2\tKolom II bagian 4 diisi hanya bila organisasi afiliasi pekerja asing berketerampilan khusus itu sendiri yang menjalankan rencana bantuan pekerja asing berketerampilan khusus 1.</p>","<p class=\"vi\">3\tKolom III diisi hanya bila seluruh pelaksanaan rencana bantuan pekerja asing berketerampilan khusus 1 didelegasikan ke lembaga pemberi bantuan terdaftar.</p>","<p class=\"vi\">4\tUntuk kolom “Rencana pelaksanaan” pada kolom IV bagian 1 sampai 9, centang hanya bagian yang sesuai dan cantumkan dengan singkat periode pelaksanaannya bila memilih “Ada” untuk rencana pelaksanaan. Bila “Tidak ada”, cantumkan dalam tanda kurung alasan tidak dilakukannya bantuan tersebut.</p>","<p class=\"vi\">5 Untuk kolom “Ada-tidaknya pendelegasian” pada kolom IV bagian 1 sampai 8, isi “Ada” hanya bila organisasi afiliasi pekerja asing berketerampilan khusus mendelegasikan sebagian bantuan kepada pihak ketiga (kecuali bila didelegasikan kepada organisasi pemberi bantuan terdaftar), dan isi “Tidak” bila organisasi afiliasi pekerja asing berketerampilan khusus memberikan sendiri bantuan tersebut atau mendelegasikan pemberian seluruh bantuan kepada pihak ketiga.</p>","<p class=\"vi\">6 Untuk kolom “PIC pemberian bantuan atau PIC pelaksana penerima delegasi” pada kolom IV bagian 1 sampai 8, isi nama dan jabatan dari PIC pemberi bantuan yang dipilih untuk setiap butir bantuan bila organisasi afiliasi pekerja asing berketerampilan khusus memberikan sendiri bantuan atau mendelegasikan pemberian seluruh bantuan kepada pihak ketiga, dan isi nama dan alamat penerima delegasi bantuan bila pemberian bantuan dilakukan oleh pihak ketiga penerima delegasi sebagian bantuan dari organisasi afiliasi pekerja asing berketerampilan khusus.</p>","<p class=\"vi\" style=\"text-indent:0.86em\">Perlu dicatat bahwa untuk kolom “Penanggungjawab bantuan atau PIC pemberian bantuan” pada kolom IV bagian 9, isi nama dan jabatan dari Penanggungjawab bantuan atau PIC pemberian bantuan yang dipilih untuk setiap butir bantuan bila organisasi afiliasi pekerja asing berketerampilan khusus memberikan sendiri bantuan atau mendelegasikan pemberian seluruh bantuan kepada pihak ketiga, dan isi nama dan alamat penerima delegasi bantuan bila dilakukan oleh pihak ketiga penerima delegasi sebagian bantuan dari organisasi afiliasi pekerja asing berketerampilan khusus pada kolom isian bebas b.</p>","<p class=\"vi\">7\tUntuk kolom “Cara pelaksanaan” pada kolom IV bagian 1 hingga 4 dan 9, centang hanya bagian yang sesuai. Bila mencentang “Lainnya”, tuliskan cara pelaksanaan lainnya di dalam tanda kurung.</p>","<p class=\"vi\">8\tUntuk “Luas ruang tamu” pada kolom IV, bagian 3-A-d, pilih yang sesuai dari kotak centang di dalam tanda kurung.</p>","<p class=\"vi\">Isi ② sampai ④ hanya jika Anda telah mencentang Ada pada poin ①.</p>","<p class=\"vi\">Untuk ③, centang salah satu “Milik sendiri” atau “Properti sewaan”.</p>","<p class=\"vi\">④ harus dijelaskan dan dipaparkan secara tepat dari perspektif berikut, misalnya:</p>","<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- Jika ③ merupakan \"Milik sendiri\": Jumlah yang dapat dijelaskan secara wajar dengan mempertimbangkan biaya aktual untuk konstruksi dan renovasi, masa ketahanan penggunaan properti, jumlah pekerja asing berketerampilan khusus yang tinggal di sana, dll.</p>","<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- Jika ③ adalah “Properti sewaan”, maka biaya yang diperlukan untuk sewa tersebut (termasuk biaya pengelolaan dan biaya fasilitas umum, dll., tetapi tidak termasuk uang deposit, uang kunci, uang jaminan, dan biaya perantara; hal yang sama berlaku di bawah ini) dibagi dengan jumlah pekerja asing berketerampilan khusus yang tinggal di properti tersebut.</p>","<p class=\"vi\">9 Untuk kolom “Waktu penanganan” pada kolom IV bagian 6-B, cantumkan rentang waktu tersebut untuk hari ketika penanganan dapat dilakukan.</p>"],0,1],[2263,2,1942020107,["<p class=\"vi\" style=\"padding-left:3.00em;text-indent:-3.00em\">Bantuan di atas akan diberikan secara tepat sesuai dengan kebijakan yang diterapkan pemerintah daerah untuk mewujudkan masyarakat koeksistensi.</p>","<p class=\"vi\">Selain itu, dokumen ini telah diterjemahkan ke dalam bahasa yang mana sasaran penerima bantuan dapat memahaminya dengan baik dan telah diberikan kepada sasaran penerima bantuan serta diberikan penjelasan yang mencukupi kepadanya.</p>"],0,1],[2267,1,1846093434,["<tr><td class=\"lb\"><p class=\"ja\">特定技能所属機関の氏名又は名称</p><p class=\"vi\">Nama atau panggilan organisasi afiliasi pekerja asing berketerampilan khusus</p></td>"],0,1],[2269,1,617466521,["<tr><td class=\"lb\"><p class=\"ja\">作成責任者の氏名</p><p class=\"vi\">Nama penanggung jawab pembuat</p></td>"],0,1],[2274,2,4244995961,["<p class=\"vi\" style=\"padding-left:3.00em;text-indent:-3.00em\">Saya telah menerima dokumen ini dalam terjemahan bahasa <span class=\"p17ul\">Indonesia</span> dan telah menerima penjelasan terkait isinya dan memahaminya dengan baik.</p>","<p class=\"vi\">Kemudian saya juga telah diberikan penjelasan tentang cara melakukan wawancara rutin di Kolom IV, 9-A-a dan memahami sepenuhnya isinya. Saya meminta wawancara dilakukan  <input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f408\" disabled>secara tatap muka dan online keduanya  <input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f409\" disabled>secara tatap muka saja.</p>"],0,1],[2277,1,31155209,["<p class=\"vi p17sign-date\" style=\"margin-top:.1em\">Tanggal tanda tangan　tanggal ${v('es_createD')||'　'} bulan ${v('es_createM')||'　'} tahun ${v('es_createY')||'　　'}</p>"],0,1],[2279,1,3300998647,["<p class=\"vi\" style=\"margin-left:34%\">Tanda tangan pekerja asing berketerampilan khusus 1</p>"],0,1],[2323,4,3624395170,["    var _nat=String(pd.nationality||pd.nationality_ja||'').trim();","    if(_nat && !/インドネシア|Indonesia/i.test(_nat)){","      console.warn('[1-17id] 申請人の国籍が「'+_nat+'」ですが、この書類はインドネシア語版です。');","      if(typeof showToast==='function') showToast('⚠ 申請人の国籍は「'+_nat+'」です。インドネシア語版ではなく該当言語の1-17をお使いください。');"],0,1],[2354,1,1236495361,["    })('id');"],0,1],[2601,1,2407934466,["    lo = langs.filter(function(x){ return x && x.language_code==='id'; })[0] || null;"],0,1],[2873,1,3852557266,["    ? ((so && so.id) ? '📝 登録支援機関のヒアリング回答から入れました：' : '🤝 所属機関の自社支援の内容から入れました：') + used.join('・') + (lo.support_org_id ? '<br>（インドネシア語の言語別設定を優先）' : '')"],0,1],[2992,1,3730718881,["var P17_DOC = '1_17_id.html';"],0,1],[3128,1,320279882,["    console.log('[1-17id] SELECT_CASE received:', info);"],0,1],[3141,1,3101883588,["    }catch(_e){ console.warn('[1-17id] 入力欄クリア失敗:', _e); }"],0,1]];
