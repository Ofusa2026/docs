<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>所属機関の代表者に関する申告書</title>
<style>.fp-case{display:none!important;}</style>
<link rel="stylesheet" href="ofusa_common.css?v=1784720412">
<style>
.doc{padding:22mm 22mm!important;line-height:1.9!important;font-family:'MS Mincho','Yu Mincho','Hiragino Mincho ProN',serif;font-size:10.5pt;color:#000;}
@media print{
  .app-bar,.fp{display:none!important}
  .main{display:block!important}
  .doc{box-shadow:none!important;margin:0!important;padding:22mm 22mm!important}
}
/* ヘッダー */
.doc .hdr{display:flex;justify-content:space-between;font-size:10.5pt;line-height:1.4;}
/* タイトル: ヘッダーから空行3つ分あけて中央 */
.doc .title{font-size:13.5pt;text-align:center;letter-spacing:0.55em;margin:52px 0 0;line-height:1.5;padding-left:0.55em;}
/* セクション1: タイトルから空行2つ分 */
.doc .sec1{margin-top:44px;font-size:10.5pt;font-weight:bold;}
.doc .sec1 .num{display:inline-block;width:2.2em;font-weight:normal;text-align:left;}
/* チェック行 */
.doc .cbrow{margin:18px 0 0 3.2em;line-height:1.8;font-weight:bold;}
.doc .cb{display:inline-block;width:13px;height:13px;border:1px solid #000;text-align:center;line-height:11px;vertical-align:-2px;margin-right:12px;font-size:11pt;font-weight:normal;}
.doc .cb.checked::before{content:"\2714";font-weight:bold;font-size:10pt;}
.doc .cbrow .maru{display:inline-block;width:2.2em;}
.doc .cbrow .arw{margin:0 16px;font-weight:normal;}
.doc .cbrow .u{text-decoration:underline;text-underline-offset:3px;}
/* セクション2/3: 空行5つ分あけて */
.doc .sec2{margin-top:76px;font-size:10.5pt;font-weight:bold;}
.doc .sec2 .num{display:inline-block;width:2.2em;font-weight:normal;text-align:left;}
/* 記入欄: 見出しから空行4つ分下に下線 */
.doc .undline{
  border-bottom:1px solid #000;
  height:1px;
  margin:66px 0 0 3.4em;
  width:400px;
}
.doc .undval{
  position:relative;
  margin:0 0 0 3.4em;
  width:400px;
  height:0;
  top:-8px;
  font-size:11.5pt;
  letter-spacing:0.05em;
  white-space:nowrap;
}
.doc .undval.mono{font-family:'MS Gothic','Courier New',monospace;letter-spacing:0.28em;}
/* 警告文 */
.doc .warn{margin-top:76px;line-height:1.75;text-indent:1em;}
/* 日付行: 警告文のすぐ下、右寄り */
.doc .dater{margin-top:22px;text-align:right;padding-right:22px;letter-spacing:0.15em;}
.doc .dater .n{display:inline-block;min-width:3.2em;text-align:center;}
/* 署名欄 */
.doc .sigbox{margin-top:16px;padding-left:36%;}
.doc .sigrow{margin:8px 0;font-size:10.5pt;white-space:nowrap;}
.doc .sigrow .lbl{display:inline-block;width:8.5em;letter-spacing:0.42em;text-align:justify;text-align-last:justify;}
.doc .sigrow .val{display:inline-block;width:240px;border-bottom:1px solid #000;padding:0 4px;margin-left:6px;vertical-align:bottom;}
/* 注記 */
.doc .fnote{margin-top:8px;font-size:10pt;text-align:right;padding-right:12px;}
</style>
</head>
<body>
<div class="app-bar">
  <div>
    <div class="app-bar-title">📄 所属機関の代表者に関する申告書</div>
    <div class="ver">ver.20260820.15</div>
  </div>
  <div class="bar-btns">
    <button class="btn" id="editModeBtn" onclick="toggleEditMode()" style="background:#7c3aed;color:white;">✏️ 直接編集</button>
    <button class="btn" onclick="saveFormGeneric('shozoku_daihyou')" style="background:#16a34a;color:white;">🛢 DB保存</button>
    <button class="btn" onclick="saveEditedHTML()" style="background:#0369a1;color:white;">📥 編集保存</button>
    <button class="btn" onclick="loadEditedHTML()" style="background:#0369a1;color:white;">📂 編集呼出</button>
    <button class="btn" onclick="discardEditedFromDB()">♻️ 編集版破棄</button>
    <button class="btn btn-print" onclick="doPrint()">🖨️ 印刷・PDF</button>
  </div>
</div>
<div class="main">
<div class="fp">
  <div class="fp-case">
    <label>登録支援機関</label><select id="filterOrg" onchange="filterCases()"></select>
    <label>所属機関</label><select id="filterCompany" onchange="filterCases()"></select>
    <label>検索</label><input id="filterText" oninput="filterCases()" placeholder="名前で絞り込み">
    <label>案件選択</label>
    <select id="caseSelect" onchange="loadFromDB()"></select>
  </div>
  <div class="fp-inner">
    <div class="fs">
      <div class="fs-title">代表者の区分</div>
      <div class="fg">
        <label>該当する区分を選択</label>
        <select id="f_rep_status_type" onchange="p()">
          <option value="">（選択してください）</option>
          <option value="1">① 日本人、特別永住者（以下記入不要）</option>
          <option value="2">② 上記以外（下記2・3を記入）</option>
        </select>
      </div>
    </div>
    <div class="fs">
      <div class="fs-title">代表者情報（②の場合のみ）</div>
      <div class="fg">
        <label>代表者氏名（英字表記）</label>
        <input id="f_rep_name_en" oninput="p()" placeholder="例：Taro Yamada">
      </div>
      <div class="fg">
        <label>代表者の在留カード番号</label>
        <input id="f_rep_zairyu_card_no" oninput="p()" placeholder="例：AB12345678CD" maxlength="16">
      </div>
    </div>
    <div class="fs">
      <div class="fs-title">日付</div>
      <div class="fg"><label>年</label><input id="f_dateY" oninput="p()" placeholder="例：2026" style="width:80px;"></div>
      <div class="fg"><label>月</label><input id="f_dateM" oninput="p()" placeholder="例：8" style="width:60px;"></div>
      <div class="fg"><label>日</label><input id="f_dateD" oninput="p()" placeholder="例：20" style="width:60px;"></div>
    </div>
    <div class="fs">
      <div class="fs-title">署名欄</div>
      <div class="fg"><label>所属機関名</label><input id="f_company" oninput="p()"></div>
      <div class="fg"><label>作成者氏名</label><input id="f_author" oninput="p()" placeholder="所属機関の職員に限る"></div>
    </div>
  </div>
</div>
<div class="pp">
  <div class="page-nav">
    <span class="page-nav-label">ページ:</span>
    <button class="pn-btn pn-btn-page active" onclick="scrollToPage(1)">P1</button>
    <span class="page-nav-label" style="margin-left:12px;">文字:</span>
    <button class="pn-btn pn-btn-font" onclick="_decFont()">A-</button>
    <span id="fontSizeLabel" class="page-nav-label">8.5pt</span>
    <button class="pn-btn pn-btn-font" onclick="_incFont()">A+</button>
  </div>
  <div id="pageArea"></div>
</div>
</div>
<script src="ofusa_common.js?v=1787269005"></script>
<script>
function p(){
  if(_editMode) return;
  const w = document.getElementById('pageArea'); if(!w) return;
  const v = id => (document.getElementById(id) || {}).value || '';
  const type = v('f_rep_status_type');
  const nameEn = v('f_rep_name_en');
  const cardNo = v('f_rep_zairyu_card_no');
  const dY = v('f_dateY');
  const dM = v('f_dateM');
  const dD = v('f_dateD');
  const company = v('f_company');
  const author = v('f_author');
  const cb = (c) => `<span class="cb${c?' checked':''}"></span>`;
  const check1 = type === '1';
  const check2 = type === '2';
  w.innerHTML = `
  <div class="doc" id="docP1">
    <div class="hdr">
      <div>参考様式</div>
      <div>（在留資格決定時・更新時共通）</div>
    </div>

    <div class="title">所属機関の代表者に関する申告書</div>

    <div class="sec1"><span class="num">１</span>所属機関の代表者について、該当する□にチェックしてください。</div>

    <div class="cbrow">${cb(check1)}<span class="maru">①</span>日本人、特別永住者<span class="arw">→</span><span style="font-weight:normal;">以下記入不要です。</span></div>

    <div class="cbrow">${cb(check2)}<span class="maru">②</span>上記①以外<span class="arw">→</span><span class="u">次の２及び３を記入してください。</span></div>

    <div class="sec2"><span class="num">２</span>代表者の氏名（英字表記）</div>
    <div class="undline"></div>
    <div class="undval">${nameEn || ''}</div>

    <div class="sec2"><span class="num">３</span>代表者の在留カード番号</div>
    <div class="undline"></div>
    <div class="undval mono">${cardNo || ''}</div>

    <div class="warn">上記に事実ではない内容が含まれている場合、虚偽の申請と判断される可能性があることを理解した上で本申告書を作成しました。</div>

    <div class="dater"><span class="n">${dY || ''}</span>年<span class="n">${dM || ''}</span>月<span class="n">${dD || ''}</span>日</div>

    <div class="sigbox">
      <div class="sigrow"><span class="lbl">所属機関名</span><span class="val">${company || ''}</span></div>
      <div class="sigrow"><span class="lbl">作成者氏名</span><span class="val">${author || ''}</span></div>
    </div>
    <div class="fnote">※　作成者は所属機関の職員に限る。</div>
  </div>
  `;
  if(_fontSize !== 8.5) _applyFontSize();
  try{ if(typeof renderAllUserNotes === 'function') renderAllUserNotes(); }catch(_e){}
}

async function loadFromDB(){
  let info = null;
  const sel = document.getElementById('caseSelect');
  if(sel && sel.value){ try{ info = JSON.parse(sel.value); }catch(e){} }
  if(!info || !info.caseId){ info = window._lastCaseInfo; }
  if(!info || !info.caseId) return;
  try{
    if(info.companyId){
      const cos = await sb('companies?select=*&id=eq.' + encodeURIComponent(info.companyId));
      const co = cos && cos[0];
      if(co){
        const cEl = document.getElementById('f_company');
        if(cEl && !cEl.value) cEl.value = co.name || '';
        const saved = co.extra && co.extra.shozoku_daihyou;
        if(saved){
          const tEl = document.getElementById('f_rep_status_type');
          if(tEl && !tEl.value && saved.rep_status_type) tEl.value = saved.rep_status_type;
          const nEl = document.getElementById('f_rep_name_en');
          if(nEl && !nEl.value && saved.rep_name_en) nEl.value = saved.rep_name_en;
          const cardEl = document.getElementById('f_rep_zairyu_card_no');
          if(cardEl && !cardEl.value && saved.rep_zairyu_card_no) cardEl.value = saved.rep_zairyu_card_no;
          const authEl = document.getElementById('f_author');
          if(authEl && !authEl.value && saved.author) authEl.value = saved.author;
        }
      }
    }
    const yEl = document.getElementById('f_dateY');
    const mEl = document.getElementById('f_dateM');
    const dEl = document.getElementById('f_dateD');
    if(yEl && !yEl.value){
      const now = new Date();
      yEl.value = String(now.getFullYear());
      mEl.value = String(now.getMonth()+1);
      dEl.value = String(now.getDate());
    }
  }catch(e){ console.warn('[shozoku_daihyou] loadFromDB error:', e); }
  p();
}

window.addEventListener('message', async function(e){
  if(!e.data || e.data.type !== 'SELECT_CASE') return;
  const info = e.data.info;
  if(!info || !info.caseId) return;
  console.log('[shozoku_daihyou] SELECT_CASE received:', info);
  try{
    document.querySelectorAll('input[id^="f_"], textarea[id^="f_"]').forEach(function(el){
      if(el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.value = '';
    });
    const tEl = document.getElementById('f_rep_status_type');
    if(tEl) tEl.value = '';
  }catch(_e){}
  window._lastCaseInfo = info;
  await loadFromDB();
  if(typeof loadCaseToForm === 'function'){
    try{ await loadCaseToForm(info, 'shozoku_daihyou'); }catch(_e){}
  }
  p();
});
document.addEventListener('DOMContentLoaded', function(){
  p();
  try{ window.parent.postMessage({type:'GET_CASE_INFO'}, '*'); }catch(_e){}
});
</script>
</body>
</html>
