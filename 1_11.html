<script>
const MAX_OFF=5;      // 本体表に載せる最大役員数（これを超えたら別紙）
const MAX_OFF_ALL=20; // 別紙に載せられる最大役員数（11名以上のレアケースにも対応）
function p(){
  if(_editMode) return;
  const w=document.getElementById('pageArea'); if(!w) return;

  // 入力済み役員の件数を数える（氏名 or ふりがな or 役職のいずれかがあれば1名とみなす）
  let offCount=0;
  for(let i=1;i<=MAX_OFF_ALL;i++){
    if(v('off'+i+'Name')||v('off'+i+'Kana')||v('off'+i+'Title')) offCount=i;
  }
  const useBessi = offCount>MAX_OFF;   // 6名以上なら別紙方式

  // 役員行の生成
  const nums='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
  let offRows='';
  if(useBessi){
    // 5名以下と同じ表構造(①〜⑤の枠)を維持し、①のふりがな欄に「別紙記載」を左詰め表示
    for(let i=0;i<MAX_OFF;i++){
      const n=i+1;
      const leftCell = i===0
        ? '<td rowspan="'+(MAX_OFF*2)+'" style="width:30%;vertical-align:middle;">（ふりがな）<br>（１）役員氏名</td>'
        : '';
      // ①のふりがな行に「別紙記載」を左詰めで入れる。他の行・氏名欄は空
      const kanaCell = (i===0)
        ? '<td style="height:3em;text-align:left;vertical-align:middle;font-weight:bold;">別紙記載</td>'
        : '<td style="height:3em;"></td>';
      offRows+='<tr>'
        +leftCell
        +'<td rowspan="2" style="width:5%;text-align:center;vertical-align:middle;">'+nums[i]+'</td>'
        +kanaCell
        +'<td rowspan="2" style="width:8%;text-align:center;vertical-align:middle;">役職</td>'
        +'<td rowspan="2"></td>'
        +'</tr>'
        +'<tr>'
        +'<td style="height:3em;"></td>'
        +'</tr>';
    }
  }else{
    // 本体に全役員（最大5名）を記載。左セルはrowspan=MAX_OFF*2で1つ
    for(let i=0;i<MAX_OFF;i++){
      const n=i+1;
      const kanaKey='off'+n+'Kana', nameKey='off'+n+'Name', titleKey='off'+n+'Title';
      const leftCell = i===0
        ? '<td rowspan="'+(MAX_OFF*2)+'" style="width:30%;vertical-align:middle;">（ふりがな）<br>（１）役員氏名</td>'
        : '';
      offRows+='<tr>'
        +leftCell
        +'<td rowspan="2" style="width:5%;text-align:center;vertical-align:middle;">'+nums[i]+'</td>'
        +'<td style="height:3em;">'+f(kanaKey)+'</td>'
        +'<td rowspan="2" style="width:8%;text-align:center;vertical-align:middle;">役職</td>'
        +'<td rowspan="2">'+f(titleKey)+'</td>'
        +'</tr>'
        +'<tr>'
        +'<td style="height:3em;">'+f(nameKey)+'</td>'
        +'</tr>';
    }
  }

  // 別紙（役員名簿）ページの生成 — 6名以上のときだけ。多人数は複数ページに自動分割
  let bessiPage='';
  if(useBessi){
    const PER_PAGE=13;  // 1ページあたりの役員数（A4に収まる安全値）
    const pageN=Math.ceil(offCount/PER_PAGE);
    for(let pg=0; pg<pageN; pg++){
      const start=pg*PER_PAGE;
      const end=Math.min(start+PER_PAGE, offCount);
      const rowsInPage=end-start;
      let bessiRows='';
      for(let i=start;i<end;i++){
        const n=i+1;
        const kanaKey='off'+n+'Kana', nameKey='off'+n+'Name', titleKey='off'+n+'Title';
        const leftCell = (i===start)
          ? '<td rowspan="'+(rowsInPage*2)+'" style="width:26%;vertical-align:middle;">（ふりがな）<br>（１）役員氏名</td>'
          : '';
        bessiRows+='<tr>'
          +leftCell
          +'<td rowspan="2" style="width:5%;text-align:center;vertical-align:middle;">'+(n<=nums.length?nums[i]:n)+'</td>'
          +'<td style="height:2.6em;">'+f(kanaKey)+'</td>'
          +'<td rowspan="2" style="width:8%;text-align:center;vertical-align:middle;">役職</td>'
          +'<td rowspan="2">'+f(titleKey)+'</td>'
          +'</tr>'
          +'<tr>'
          +'<td style="height:2.6em;">'+f(nameKey)+'</td>'
          +'</tr>';
      }
      const pageLabel = pageN>1 ? ('別紙（'+(pg+1)+'/'+pageN+'）') : '別紙';
      bessiPage+=`
<div class="doc" style="page-break-before:always;">
<div class="page-num-label">${pageLabel}</div>
<div style="font-size:9pt;font-weight:bold;margin-bottom:1mm;">１　所属役員</div>
<table class="tbl">
  <tbody>${bessiRows}</tbody>
</table>
<div style="font-size:8pt;margin-top:3mm;">（注意）役員が複数名いる場合は，その全てについて記載すること。</div>
</div>`;
    }
  }

  w.innerHTML=`
<div class="doc">
<div class="page-num-label">P1</div>
<div style="font-size:9pt;margin-bottom:1mm;">参考様式第１－１１－１号</div>
<div style="font-size:16pt;font-weight:bold;text-align:center;margin-bottom:4mm;">特定技能所属機関概要書</div>

<div style="font-size:9pt;font-weight:bold;margin-bottom:1mm;">１　所属役員</div>
<table class="tbl">
  <tbody>${offRows}</tbody>
</table>
<div style="font-size:8pt;margin-bottom:3mm;">（注意）役員が複数名いる場合は，その全てについて記載すること。なお，役員を記載しきれない場合は，「別紙のとおり」と記載し，別紙を添付することとして差し支えない。</div>

<div style="font-size:9pt;font-weight:bold;margin-bottom:1mm;">２　決算状況</div>
<table class="tbl" style="margin-bottom:2mm;">
  <tr>
    <th style="width:20%;"></th>
    <th style="width:20%;">前年度</th>
    <th style="width:5%;">円</th>
    <th style="width:20%;">前々年度</th>
    <th style="width:5%;">円</th>
    <th style="width:20%;">前々々年度</th>
    <th style="width:5%;">円</th>
  </tr>
  <tr style="height:2.5em;"><td>売上高</td><td style="text-align:right;">${f('f_salesY1')}</td><td>円</td><td style="text-align:right;">${f('f_salesY2')}</td><td>円</td><td style="text-align:right;">${f('f_salesY3')}</td><td>円</td></tr>
  <tr style="height:2.5em;"><td>経常損益</td><td style="text-align:right;">${f('f_plY1')}</td><td>円</td><td style="text-align:right;">${f('f_plY2')}</td><td>円</td><td style="text-align:right;">${f('f_plY3')}</td><td>円</td></tr>
  <tr style="height:2.5em;"><td>純損益</td><td style="text-align:right;">${f('f_netY1')}</td><td>円</td><td style="text-align:right;">${f('f_netY2')}</td><td>円</td><td style="text-align:right;">${f('f_netY3')}</td><td>円</td></tr>
  <tr style="height:2.5em;"><td>純資産</td><td style="text-align:right;">${f('f_assetsY1')}</td><td>円</td><td style="text-align:right;">${f('f_assetsY2')}</td><td>円</td><td style="text-align:right;">${f('f_assetsY3')}</td><td>円</td></tr>
</table>
<div style="font-size:8pt;margin-bottom:3mm;">
（注意）<br>
１　個人事業主の場合には，純資産の欄に所得税青色申告決算書の貸借対照表における元入金を記載してください。<br>
２　前年度末において債務超過（純資産の欄がマイナス）がある場合には，中小企業診断士，税理士，公認会計士等の企業評価を行う能力があると認められる公的資格を有する第三者が改善の見通しについて評価を行った書面を添付してください。
</div>

<div style="font-size:9pt;font-weight:bold;margin-bottom:1mm;">３　基準適合性に係る事項</div>
<table class="tbl">
  <tr>
    <td rowspan="4" style="width:12%;">（１）過去１年における特定技能外国人と同種の業務に従事する労働者の離職状況</td>
    <td rowspan="2" style="width:13%;"></td>
    <td colspan="4" style="text-align:center;">離職理由</td>
  </tr>
  <tr>
    <td colspan="2" style="width:21%;text-align:center;">自発的離職者</td>
    <td colspan="2" style="width:21%;text-align:center;">非自発的離職者</td>
  </tr>
  <tr style="height:2.5em;">
    <td>日本人労働者</td>
    <td colspan="2">${f('f_jpVQ')||'0'}　名</td>
    <td colspan="2">${f('f_jpIQ')||'0'}　名</td>
  </tr>
  <tr style="height:2.5em;">
    <td>外国人労働者</td>
    <td colspan="2">${f('f_fgnVQ')||'0'}　名</td>
    <td colspan="2">${f('f_fgnIQ')||'0'}　名</td>
  </tr>

function fitDocToPreview(){
  requestAnimationFrame(()=>{
    const pp=document.querySelector('.pp');
    const area=document.getElementById('pageArea');
    if(!pp||!area) return;
    const ppW=pp.clientWidth-40; const docW=794;
    if(ppW<docW){const scale=ppW/docW;area.querySelectorAll('.doc').forEach(d=>{d.style.zoom=scale;});}
    else{area.querySelectorAll('.doc').forEach(d=>{d.style.zoom=1;});}
  });
}

async function loadFromDB(passedInfo){
  let info = passedInfo;
  if(!info){
    const sel=document.getElementById('caseSelect');
    if(!sel||!sel.value) return;
    try{info=JSON.parse(sel.value);}catch(e){return;}
  }
  if(!info || !info.caseId) return;
  const {caseId,companyId,companyName}=info;
  try{
    const SEL='name,author_name,author_title,sales_y1,sales_y2,sales_y3,ordinary_pl_y1,ordinary_pl_y2,ordinary_pl_y3,net_pl_y1,net_pl_y2,net_pl_y3,net_assets_y1,net_assets_y2,net_assets_y3,jp_voluntary_quit,jp_involuntary_quit,fn_voluntary_quit,fn_involuntary_quit,officers,extra';
    // 会社解決: companyId → companyName → cases.company_id/company フォールバック
    // ※ company_id未設定の案件でも cases.company（会社名）から会社を引けるようにする
    let co=null;
    if(companyId){ const r=await sb(`companies?select=${SEL}&id=eq.${companyId}`); co=r&&r[0]; }
    if(!co && companyName){ const r=await sb(`companies?select=${SEL}&name=eq.${encodeURIComponent(companyName)}`); co=r&&r[0]; }
    if(!co && caseId){
      const _cs=await sb(`cases?select=company,company_id&id=eq.${caseId}`); const _cas=_cs&&_cs[0];
      if(_cas){
        if(_cas.company_id){ const r=await sb(`companies?select=${SEL}&id=eq.${_cas.company_id}`); co=r&&r[0]; }
        if(!co && _cas.company){ const r=await sb(`companies?select=${SEL}&name=eq.${encodeURIComponent(_cas.company)}`); co=r&&r[0]; }
      }
    }
    if(!co) return;
    // extraフィールドに保存された財務データを展開（anken互換フォールバック）
    if(co.extra && typeof co.extra === 'object'){
      const _eKeys=['salesY1','salesY2','salesY3','ordinaryPLY1','ordinaryPLY2','ordinaryPLY3',
        'netPLY1','netPLY2','netPLY3','netAssetsY1','netAssetsY2','netAssetsY3',
        'jpVoluntaryQuit','jpInvoluntaryQuit','fnVoluntaryQuit','fnInvoluntaryQuit'];
      const _kMap={'salesY1':'sales_y1','salesY2':'sales_y2','salesY3':'sales_y3',
        'ordinaryPLY1':'ordinary_pl_y1','ordinaryPLY2':'ordinary_pl_y2','ordinaryPLY3':'ordinary_pl_y3',
        'netPLY1':'net_pl_y1','netPLY2':'net_pl_y2','netPLY3':'net_pl_y3',
        'netAssetsY1':'net_assets_y1','netAssetsY2':'net_assets_y2','netAssetsY3':'net_assets_y3',
        'jpVoluntaryQuit':'jp_voluntary_quit','jpInvoluntaryQuit':'jp_involuntary_quit',
        'fnVoluntaryQuit':'fn_voluntary_quit','fnInvoluntaryQuit':'fn_involuntary_quit'};
      _eKeys.forEach(k=>{ const col=_kMap[k]; if(!co[col] && co.extra[k]) co[col]=co.extra[k]; });
    }
    const s=(id,val)=>{const e=document.getElementById(id);if(e&&val!==undefined&&val!==null)e.value=val;};
    s('f_company',co.name||'');
    s('f_author',[co.author_title,co.author_name].filter(Boolean).join('　'));
    s('f_salesY1',co.sales_y1||'');s('f_salesY2',co.sales_y2||'');s('f_salesY3',co.sales_y3||'');
    s('f_plY1',co.ordinary_pl_y1||'');s('f_plY2',co.ordinary_pl_y2||'');s('f_plY3',co.ordinary_pl_y3||'');
    s('f_netY1',co.net_pl_y1||'');s('f_netY2',co.net_pl_y2||'');s('f_netY3',co.net_pl_y3||'');
    s('f_assetsY1',co.net_assets_y1||'');s('f_assetsY2',co.net_assets_y2||'');s('f_assetsY3',co.net_assets_y3||'');
    s('f_jpVQ',co.jp_voluntary_quit||'');s('f_jpIQ',co.jp_involuntary_quit||'');
    s('f_fgnVQ',co.fn_voluntary_quit||'');s('f_fgnIQ',co.fn_involuntary_quit||'');
    const officers=Array.isArray(co.officers)?co.officers:[];
    officers.forEach((o,i)=>{if(i>=20)return;s(`off${i+1}Kana`,o.kana||o.name_kana||'');s(`off${i+1}Name`,o.name||'');s(`off${i+1}Title`,o.title||'');});
    if(!v('f_docDate')){const n=new Date();document.getElementById('f_docDate').value=`令和${n.getFullYear()-2018}年${n.getMonth()+1}月${n.getDate()}日`;}
    p(); showToast('✅ データを読み込みました');
  }catch(e){showToast('⚠️ 読込エラー: '+e.message);console.error(e);}
}

window.addEventListener('message', async function(e){
  if(!e.data||e.data.type!=='SELECT_CASE') return;
  const info=e.data.info; if(!info||!info.caseId) return;
  const sel=document.getElementById('caseSelect');
  if(sel){
    let found=false;
    for(let o of sel.options){try{const d=JSON.parse(o.value);if(d.caseId===info.caseId){sel.value=o.value;found=true;break;}}catch(e2){}}
    if(!found){const opt=document.createElement('option');opt.value=JSON.stringify(info);opt.textContent='（indexから選択）';sel.appendChild(opt);sel.value=opt.value;}
  }
  // まず共通関数で全入力欄を埋める
  if(typeof loadCaseToForm==='function'){ await loadCaseToForm(info, '1_11'); }
  // 書類固有の追加処理があれば loadFromDB で補完
  if(typeof loadFromDB==='function') loadFromDB(info);
});
