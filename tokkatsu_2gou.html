<body>
<div class="app-bar">
  <div>
    <div class="app-bar-title">📄 移行準備説明書（特定活動→特定技能２号）</div>
    <div class="ver">ver.20261111.02</div>
  </div>
  <div class="bar-btns">

    <label>🏢 所属機関</label>

    <label>👤 案件選択 <span id="caseCount" style="color:#888;font-weight:normal;font-size:9px;"></span></label>

  </div>
  <div class="fp-inner">
    <div class="fs"><div class="fs-title">基本情報</div>

          <option value="expire">⑥ 在留期間満了日を明記</option>

      <div class="fg"><label>在留期間満了日（⑥で使用）<span class="fid">{{在留期限}}</span></label><input id="f_expire" oninput="p()" placeholder="令和〇年〇月〇日"></div>

    </div>
  </div>
</div>

<!-- プレビューエリア -->

  <div class="page-nav" id="pageNav">

    <button class="pn-btn pn-btn-page" onclick="scrollToPage(2)">P2</button>

<script src="ofusa_common.js?v=1794385659"></script>
<script>
function p(){
  if(_editMode) return;
  const w=document.getElementById('pageArea');
  if(!w) return;
  const skillVal=v('f_skill');
  const ul=s=>`<span class="underline">${s}</span>`;
  w.innerHTML=`
<div class="doc">
<div style="text-align:right;font-size:9pt;margin-bottom:4px;">＜特定技能２号への申請予定者のための「特定活動」用＞</div>
<div style="text-align:center;font-size:18pt;font-weight:bold;letter-spacing:8px;margin:8px 0 16px;">説　　明　　書</div>
<div style="padding-left:2em;margin-bottom:16px;">
  <div style="font-size:12pt;">国籍・地域　　　${f('f_nationality')}</div>
  <div style="font-size:12pt;">氏　　　名　　　${f('f_name')}</div>
  <div style="margin-top:8px;">上記の者を受け入れるに当たって、下記のとおりの事実に相違ありません。</div>
  <div style="text-align:center;margin:4px 0;">記</div>
</div>
<div style="margin-bottom:24px;">
  <div>１　在留期間の満了日までに「特定技能２号」への在留資格変更許可申請をすることができない事情</div>
  <div style="border:1px solid #555;padding:2px 12px;margin-top:6px;line-height:1.7em;background-image:linear-gradient(to bottom,transparent calc(1.7em - 1px),#bbb calc(1.7em - 1px));background-size:100% 1.7em;background-position:0 2px; min-height:13.6em;">${reasonHtml()}</div>
</div>
<div style="margin-bottom:24px;">
  <div>２　今次の受入れ機関において特定技能外国人として在留資格「特定技能２号」に該当する業務に従事するために同在留資格への在留資格変更許可申請を予定していること</div>
  <div class="indent1">
    <div>■　該当　□　非該当</div>
    <div>※　特定産業分野名：${ul('　'+f('f_field')+'　')}　／　業務区分：${ul('　'+f('f_category')+'　')}</div>
    <div style="font-size:9pt;">（注）特定技能制度における特定技能２号の特定産業分野及び業務区分を記載すること</div>
  </div>
</div>
<div style="margin-bottom:24px;">
  <div>３　申請人が今次の受入れ機関との契約に基づいて在留資格「特定技能２号」で従事する予定の業務と同様のものに従事すること</div>
  <div class="indent1">■　該当　□　非該当</div>
</div>
<div style="margin-bottom:24px;">
  <div>４　申請人が２号特定技能外国人として就労する場合に支払われる予定の報酬と同額、かつ、日本人が従事する場合と同等額以上の報酬を受けること</div>
  <div class="indent1">■　該当　□　非該当</div>
</div>
<div style="margin-bottom:24px;">
  <div>５　申請人が２号特定技能外国人として業務に従事するために必要な技能試験及び日本語試験に合格していること（実務要件を満たしていることを含む）</div>
  <div class="indent1">${skillVal?'■':'□'}　該当（該当する番号：${skillVal?f('f_skill'):'　　　　'}　）　□　非該当</div>
</div>
</div>

<div class="doc">
<div class="page-num-label">P2</div>
<div style="margin-bottom:16px;">
  <div>６　今次の受入れ機関が、申請人を適正に受け入れることが見込まれること（特定技能雇用契約及び１号特定技能外国人支援計画の基準等を定める省令に定める一定の欠格事由に該当しないこと等（注））</div>
  <div class="indent1">■　該当　□　非該当（内容：　　　　　　　　　　　　　　　　　　　）</div>
  <div>（注）次のいずれにも該当すること</div>
  <div>・　労働、社会保険及び租税に関する法令を遵守していること（保険料や税に滞納がないことを含む。）</div>
  <div>・　前科、暴力団関係等に該当しないこと</div>
  <div>・　技能実習法第16条第１項の規定により実習認定を取り消された者ではないこと（受入れ機関及びその役員が技能実習法第16条第１項の規定により実習認定を取り消された法人の役員であったことがないことを含む。）</div>
  <div>・　受入れ機関及びその役員が５年以内に出入国又は労働に関する法令に関し不正又は著しく不当な行為をしたことがないこと</div>
</div>
<div style="margin-bottom:8px;">（注１）上記２から６までについて該当するものにチェックマークを付し、必要な事項を記入してください。</div>
<div style="margin-bottom:8px;">（注２）本説明書に虚偽の記載があった場合には、入管法に関し、不正又は著しく不当な行為を行ったものとして、特定技能外国人等の受入れができないこととなることがあります。</div>
<div style="margin-bottom:24px;">（注３）本件申請に対して許可される在留資格「特定活動」は、あくまで在留資格「特定技能２号」への在留資格変更許可申請に係る準備のための在留資格であることから、許可がされたからといって在留資格「特定技能２号」への許可の基準に適合していることを確認するものではありません。したがって、申請人が今後「特定技能２号」への在留資格変更許可申請の審査において、入管法、法務省令、各分野固有の基準への適合性が求められることから、その手続等について関係機関に問合せを行うなど確認を十分に行った上、申請人が円滑に「特定技能２号」へ移行できるよう準備を行ってください。</div>
<div style="text-align:right;margin-bottom:4px;">${f('f_date')}</div>
<div style="text-align:right;">受入れ機関名　　　　　${f('f_orgName')}</div>
</div>`;

  _fontSize = (_fontSize === 8.5) ? 9.5 : _fontSize;
  _applyFontSize();
  const lbl=document.getElementById('fontSizeLabel');if(lbl)lbl.textContent=_fontSize+'pt';
  _applyIkoFontSize();
  setupPageTracker();
  fitDocToPreview();
}

function _applyIkoFontSize(){
  const st = document.getElementById('_ikoFontStyle') || document.createElement('style');
  st.id = '_ikoFontStyle';
  document.head.appendChild(st);
  const s = _fontSize / 8.5;
  st.textContent = [
    `.doc [style*="font-size:18pt"]{font-size:${(18*s).toFixed(2)}pt!important}`,
    `.doc [style*="font-size:12pt"]{font-size:${(12*s).toFixed(2)}pt!important}`,
  ].join('');
}

async function loadFromDB(passedInfo){
  let info = passedInfo;
  if(!info){
    const sel=document.getElementById('caseSelect');
    if(!sel.value) return;
    try{ info=JSON.parse(sel.value); }catch(e){ return; }
  }
  if(!info || !info.caseId) return;
  const {caseId,companyId,companyName}=info;
  try{
    const [cases,persons]=await Promise.all([
      sb('cases?select=id,name,applicant,applicant_field,org,nationality,emp_set_idx,doc_create_date,expire&id=eq.'+caseId),
      sb('persons?select=applicant_name_en,nationality,skill_eval_type&case_id=eq.'+caseId)
    ]);
    const cas=cases&&cases[0];
    const pdRaw=persons&&persons[0];
    const pd=(pdRaw&&pdRaw.data)||pdRaw;
    const personName=(pd&&(pd.applicant_name_en||pd.applicantNameEn||pd.nameEn))||(cas&&cas.applicant)||'';
    const nationality=(pd&&pd.nationality)||(cas&&cas.nationality)||'';
    const _coQuery=companyId
      ?'companies?select=id,name,emp_sets&id=eq.'+companyId
      :(companyName?'companies?select=id,name,emp_sets&name=eq.'+encodeURIComponent(companyName):null);
    let coName=companyName||'';
    let empSets=[];
    if(_coQuery){ const cos=await sb(_coQuery); if(cos&&cos[0]){ coName=cos[0].name||coName; empSets=cos[0].emp_sets||[]; } }
    const orgName=(cas&&cas.org)||'';
    let soNo='';
    // ver.20260715: 完全一致だけだと「株式会社KMT(82)」等で引けないため共通関数で3段照合
    const stripParens=s=>s?s.replace(/[（(][^）)]*[）)]/g,'').trim():s;
    const s=(id,val)=>{const e=document.getElementById(id);if(e&&val)e.value=val;};
    if(personName) s('f_name',personName);
    if(nationality) s('f_nationality',nationality);
    // ver.20261008.01: 分野は 案件(cases.applicant_field) → 雇用条件セット(applicantField) の順で取得。
    //   「建設分野（特定技能１号）」のような表記は括弧と末尾の「分野」を除き、正式な特定産業分野名（建設 等）にする
    // ver.20261023.04: 雇用条件セットが未選択なら1番目を使わず、選んでもらう（共通 resolveEmpSetIdx）
    const empSetIdx=(typeof window.resolveEmpSetIdx==='function')?await window.resolveEmpSetIdx({emp_sets:empSets,name:coName},cas,info):-1;
    const es=(empSetIdx>=0?empSets[empSetIdx]:null)||{};
    const normField=sx=>{ sx=stripParens(sx||''); return sx.replace(/分野$/,'').trim(); };
    // ver.20261008.02: 複数区分に対応（category/category2…を全部集めて「・」で連結・重複除去）
    const _collect=(obj,base,norm)=>{
      const out=[];
      [base,base+'2',base+'3',base+'4',base+'5'].forEach(k=>{
        let vv=(norm||stripParens)(obj&&obj[k]||'');
        vv=(vv||'').trim();
        if(vv && out.indexOf(vv)<0) out.push(vv);
      });
      return out;
    };
    const fieldsU=_collect(es,'applicantField',normField);
    const fieldVal=(cas&&cas.applicant_field)?normField(cas.applicant_field):fieldsU.join('・');
    if(fieldVal) s('f_field',fieldVal);
    // ver.20261106.03: 建設なら事情の文例を「国交省の認定待ち」に（本文を書き換えていないときだけ）
    { const ta=document.getElementById('f_reason'), ps=document.getElementById('f_reasonPreset');
      if(ta&&ps&&/建設/.test(fieldVal||'')&&(!ta.value.trim()||ta.value===TK2_REASON_PRESETS.std)){ ps.value='kokko'; ta.value=TK2_REASON_PRESETS.kokko; } }
    // 業務区分: emp_setsから取得（土木・建築、ライフライン・設備 など複数も連結）
    const cats=_collect(es,'category',stripParens);
    const catVal=cats.length?cats.join('・'):stripParens(es.applicantCategory||es.categoryName||'');
    if(catVal) s('f_category',catVal);
    s('f_orgName',coName);
    if(!v('f_date')){
      // ver.20260811.02: DBの doc_create_date を優先。無ければ今日の日付を自動セット
      const dbDate = cas && cas.doc_create_date;
      if(dbDate){
        // "2026-07-02" 形式を "令和8年7月2日" に変換
        const m = String(dbDate).match(/^(\d{4})-(\d{2})-(\d{2})/);
        if(m){
          const yy = parseInt(m[1],10) - 2018;
          const mm = parseInt(m[2],10);
          const dd = parseInt(m[3],10);
          s('f_date', '令和' + yy + '年' + mm + '月' + dd + '日');
        } else {
          s('f_date', String(dbDate));
        }
      } else {
        const now=new Date(); s('f_date','令和'+(now.getFullYear()-2018)+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日');
      }
    }
    // ver.20261106.01: 在留期間満了日（文例⑥で使用）。cases.expire を令和表記に
    if(!v('f_expire') && cas && cas.expire){
      const em=String(cas.expire).match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      s('f_expire', em ? ('令和'+(parseInt(em[1],10)-2018)+'年'+parseInt(em[2],10)+'月'+parseInt(em[3],10)+'日') : String(cas.expire));
    }
    p();
    showToast('✅ データを読み込みました');
  }catch(e){ showToast('⚠️ 読込エラー: '+e.message); console.error(e); }
}



// ver.20261106.02: 「１ 申請できない事情」文例（1号用の実例を2号向けに置換）
const TK2_REASON_PRESETS={
  std:'この度弊社で「特定技能２号」として雇用契約を締結することに決定したが、弊社側の特定技能２号申請への準備（書類準備等）が整っておらず、許可が出るまで、２ヶ月以上の時間がかかることが見込まれるため、特定技能２号での在留資格が取得できるまでの間、申請人の生活確保のためにも、特定活動で就労を可能にしたいと考えております。\nまた、弊社で〔分野〕に必要な指導、助言などを行うと共に、在留中の日常生活に係る支援についても、適切に行っていきます。',

function applyReasonPreset(){
  const sel=document.getElementById('f_reasonPreset'), ta=document.getElementById('f_reason');
  if(!sel||!ta) return;
  ta.value=TK2_REASON_PRESETS[sel.value]||TK2_REASON_PRESETS.std; p();
}

function linedHtml(raw,map){
  map=map||{};
  return String(raw||'').split('\n').map(line=>{
    const parts=esc(line).split(/(〔[^〕]+〕)/);
    return '<div>'+(parts.map(pt=>{
      const m=map[pt]; if(!m) return pt;
      const val=v(m[0]);
      return val?`<span class="f" data-bind="${m[0]}">${esc(val)}</span>`:`<span class="f" data-bind="${m[0]}" style="color:#aaa;font-size:0.85em;font-family:monospace;">${m[1]}</span>`;
    }).join('')||'&nbsp;')+'</div>';
  }).join('');
}

function reasonHtml(){
  const ta=document.getElementById('f_reason');
  let raw=(ta&&ta.value)||''; if(!raw.trim()) raw=TK2_REASON_PRESETS.std;
  return linedHtml(raw,{'〔分野〕':['f_field','field'],'〔在留期限〕':['f_expire','expire']});
}

    }

function fitDocToPreview(){
  requestAnimationFrame(()=>{
    const pp = document.querySelector('.pp');
    const area = document.getElementById('pageArea');
    if(!pp || !area) return;
    const ppW = pp.clientWidth - 40;
    const docW = 794;
    if(ppW < docW){
      const scale = ppW / docW;
      area.querySelectorAll('.doc').forEach(d=>{
        d.style.zoom = scale;
      });
    } else {
      area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = 1; });
    }
  });
}
window.addEventListener('resize', fitDocToPreview);

// index.htmlからの案件選択を受信
window.addEventListener('message', async function(e){
  if(!e.data||e.data.type!=='SELECT_CASE') return;
  const info=e.data.info;
  if(!info||!info.caseId) return;
  // caseSelectに値をセットしてloadFromDB()を呼ぶ
  const sel=document.getElementById('caseSelect');
  if(sel){
    // 既存のoptionを探すかなければ追加
    let found=false;
    for(let o of sel.options){
      try{
        const d=JSON.parse(o.value);
        if(d.caseId===info.caseId){sel.value=o.value;found=true;break;}
      }catch(e2){}
    }
    if(!found){
      const opt=document.createElement('option');
      opt.value=JSON.stringify(info);
      opt.textContent='（indexから選択）';
      sel.appendChild(opt);
      sel.value=opt.value;
    }
  }
  // まず共通関数で全入力欄を埋める
  if(typeof loadCaseToForm==='function'){ await loadCaseToForm(info, 'tokkatsu_2gou'); }
  // 書類固有の追加処理があれば loadFromDB で補完
  if(typeof loadFromDB==='function') loadFromDB(info);
});
