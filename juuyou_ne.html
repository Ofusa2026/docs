  // 行ごとのしるし（FNV-1a）。差し替える場所は「何行目から何行」と、その行のしるしで確かめる（本体が変わって場所がずれたら、しるしで探し直す）
  var H=new Array(L.length);
  for(var i=0;i<L.length;i++){ var s=L[i], h=0x811c9dc5; for(var j=0;j<s.length;j++){ h=Math.imul((h^s.charCodeAt(j))>>>0,0x01000193)>>>0; } H[i]=h; }

  TJ.forEach(function(pt,n){
    var at=pt[0], len=pt[1], sig=pt[2];
    if(at+len<=L.length && bh(at,len)===sig){ hits.push([at,len,pt[3]]); return; }

  if(miss.length){ window.__docErrs=window.__docErrs||[]; window.__docErrs.push('訳の差し替えができない行があります（'+miss.length+'か所：本体のjuuyou_en.htmlが変わったため）'); console.warn('[言語版] 差し替えできなかった行', miss); }
  document.write(L.join('\n'));
})();
