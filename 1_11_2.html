<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>参考様式第１－１１－２号　受け入れた中長期在留者リスト</title>
<style>.fp-case{display:none!important;}</style>
<link rel="stylesheet" href="ofusa_common.css?v=1784720412">
<style>
/* 原本（入管庁 参考様式第１－１１－２号 Word）の実寸どおり:
   A4横 297×210mm・余白 上15/右15/下12.5/左15mm・行グリッド18pt・ＭＳ明朝10.5pt
   表: 列幅(mm) 7.6/57.9/12.5/37.5/25.0/40.0/47.5/37.5・見出し行11.5mm(11pt)・明細行12mm(10pt)・外枠1.5pt/内線1pt
   注意書き: 8pt（原本はグリッドで18pt行送り→5名が1枚に収まるよう11ptに詰めている） */
.doc{width:297mm!important;height:210mm!important;min-height:0!important;padding:15mm 15mm 12.5mm 15mm!important;
  font-family:'MS Mincho','ＭＳ 明朝','Yu Mincho','Hiragino Mincho ProN',serif!important;font-size:10.5pt!important;line-height:18pt!important;overflow:hidden!important;}
.doc .g{line-height:18pt;min-height:18pt;}
.doc .r{text-align:right;}
.doc .gth{font-family:'MS Gothic','ＭＳ ゴシック','Yu Gothic','Hiragino Kaku Gothic ProN',sans-serif;padding-left:12.1pt;text-indent:-12.1pt;}
.doc .ul{display:inline-block;min-width:45mm;border-bottom:1px solid #000;line-height:15pt;text-align:left;padding:0 2pt;}
.doc .note{font-size:8pt;line-height:11pt;}
.doc .note div{min-height:11pt;}
.doc .note .n1{padding-left:8pt;text-indent:-8pt;}
.doc .note .n2{padding-left:21.6pt;text-indent:-21.6pt;}
.doc .note .b1{padding-left:12.1pt;}
.doc .note .b2{padding-left:76pt;text-indent:-64pt;}
.doc .note .b5{padding-left:12.1pt;}
.doc .lt{width:265.5mm;border-collapse:collapse;table-layout:fixed;border:1.5pt solid #000;}
.doc .lt th,.doc .lt td{border:1pt solid #000;padding:0 1mm;vertical-align:middle;overflow:hidden;word-break:break-all;}
.doc .lt th{font-weight:normal;text-align:center;font-size:11pt;line-height:13pt;height:11.5mm;}
.doc .lt td{height:12mm;font-size:10pt;line-height:12pt;}
.doc .lt td.c{text-align:center;}
.doc .lt td.r{text-align:right;white-space:nowrap;}
.doc .lt td.per{text-align:right;white-space:nowrap;line-height:15pt;}
.doc .lt td.nb{white-space:nowrap;text-align:center;}
/* 左パネル：行エディタ */
.lr-tools{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;}
.lr-tools button{font-size:11px;padding:5px 9px;border-radius:7px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;font-weight:600;color:#334155;}
.lr-tools button.pri{background:#7c3aed;color:#fff;border-color:#7c3aed;}
.lr-sum{font-size:11px;color:#64748b;margin:2px 0 6px;}
.lr-card{border:1px solid #e2e8f0;border-radius:9px;padding:7px 8px;margin-bottom:7px;background:#fff;}
.lr-card.off{background:#f8fafc;opacity:.65;}
.lr-head{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.lr-head input[type=checkbox]{width:15px;height:15px;accent-color:#7c3aed;margin:0;flex:none;}
.lr-head .lr-no{font-size:11px;font-weight:700;color:#7c3aed;flex:none;min-width:1.6em;}
.lr-head input.lr-name{flex:1;min-width:0;font-weight:600;}
.lr-head .lr-del{flex:none;border:none;background:none;color:#94a3b8;cursor:pointer;font-size:14px;padding:0 2px;}
.lr-head .lr-del:hover{color:#dc2626;}
.lr-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 6px;}
.lr-grid label{display:block;font-size:9.5px;color:#64748b;margin:0 0 1px;}
.lr-grid input,.lr-grid select{width:100%;box-sizing:border-box;font-size:11px;padding:3px 5px;}
.lr-grid .full{grid-column:1/3;}
.lr-chip{font-size:9.5px;padding:1px 6px;border-radius:9px;background:#f1f5f9;color:#475569;flex:none;}
.lr-chip.cur{background:#ede9fe;color:#6d28d9;}
@media print{
  @page{size:A4 landscape;margin:0;}
  html,body,.main,.pp,#pageArea{background:#fff!important}
  .app-bar,.fp,.page-nav,.page-num-label{display:none!important}
  .main{display:block!important}
  .pp{padding:0!important;overflow:visible!important}
  #pageArea{padding:0!important;display:block!important}
  /* page:ofusaLand … 「まとめてPDF」側の @page ofusaLand{size:A4 landscape} で横向きにする */
  .doc{page:ofusaLand;zoom:1!important;box-shadow:none!important;margin:0!important;width:297mm!important;height:210mm!important;min-height:0!important;padding:15mm 15mm 12.5mm 15mm!important;
    font-size:10.5pt!important;line-height:18pt!important;break-after:page;page-break-after:always;}
  .doc:last-child{break-after:auto;page-break-after:auto;}
  .f[style*="color:#aaa"]{visibility:hidden}
}
</style>
</head>
<body>
<div class="app-bar">
  <div>
    <div class="app-bar-title">📋 参考様式第１－１１－２号　受け入れた中長期在留者リスト</div>
    <div class="ver">ver.20261020.02</div>
  </div>
  <div class="bar-btns">
    <button class="btn" id="editModeBtn" onclick="toggleEditMode()" style="background:#7c3aed;color:white;">✏️ 直接編集</button>
    <button class="btn" id="styleModeBtn" onclick="toggleStyleMode()" style="background:#0f766e;color:white;">🎨 スタイル編集</button>
    <button class="btn" onclick="saveFormGeneric('1_11_2')" style="background:#16a34a;color:white;">🛢 DB保存</button>
    <button class="btn" onclick="saveEditedHTML()" style="background:#0369a1;color:white;">📥 編集保存</button>
    <button class="btn" onclick="loadEditedHTML()" style="background:#0369a1;color:white;">📂 編集呼出</button>
    <button class="btn btn-print" onclick="doPrint()">🖨️ 印刷・PDF</button>
  </div>
</div>
<div class="main">
<div class="fp">
  <div class="fp-case">
    <label>登録支援機関</label><select id="filterOrg" onchange="filterCases()"></select>
    <label>所属機関</label><select id="filterCompany" onchange="filterCases()"></select>
    <label>検索</label><input id="filterText" oninput="filterCases()" placeholder="名前で絞り込み">
    <label>案件選択 <span id="caseCount" style="color:#888;font-weight:normal;font-size:9px;"></span></label>
    <select id="caseSelect" onchange="loadFromDB()"></select>
  </div>
  <div class="fp-inner">
    <div id="lrItakuNote" style="display:none;margin:0 0 8px;padding:7px 9px;border-radius:8px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:11px;line-height:1.5;"></div>
    <div class="fs"><div class="fs-title">作成日・所属機関</div>
      <div class="fg"><label>作成日（年 / 月 / 日）</label><div style="display:flex;gap:4px;"><input id="f_docYear" oninput="p()" style="width:4.5em;"><input id="f_docMonth" oninput="p()" style="width:3em;"><input id="f_docDay" oninput="p()" style="width:3em;"></div></div>
      <div class="fg"><label>特定技能所属機関の氏名又は名称</label><input id="f_company" oninput="p()"></div>
      <div class="fg"><label>作成責任者 役職</label><input id="f_repTitle" oninput="p()" placeholder="代表取締役"></div>
      <div class="fg"><label>作成責任者 氏名</label><input id="f_repName" oninput="p()"></div>
    </div>
    <div class="fs"><div class="fs-title">受け入れた中長期在留者（過去２年以内）</div>
      <div style="font-size:10.5px;color:#64748b;line-height:1.5;margin-bottom:4px;">案シスで同じ所属機関の案件から自動で一覧を作ります。✔ が付いた人だけ書類に載ります（許可済みの人とこの案件の人に自動で✔）。案シスに無い人は「＋ 行を追加」で入れてください。</div>
      <div class="lr-tools">
        <button class="pri" onclick="lrReloadFromDB()">🔄 案シスから読み込み</button>
        <button id="lrFormBtn" class="pri" style="display:none;background:#0369a1;border-color:#0369a1;" onclick="lrLoadFromForm()">📝 自社支援の回答から読み込み</button>
        <button onclick="lrAdd()">＋ 行を追加</button>
        <button onclick="lrAllOn(true)">全員ON</button>
        <button onclick="lrAllOn(false)">全員OFF</button>
      </div>
      <div id="lrFormInfo" style="display:none;margin:4px 0 6px;padding:7px 9px;border-radius:8px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;font-size:11px;line-height:1.55;"></div>
      <div class="lr-sum" id="lrSum"></div>
      <div id="lrFeWarn" style="display:none;margin:0 0 6px;padding:6px 9px;border-radius:8px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;font-size:11px;line-height:1.5;"></div>
      <div id="lrList"></div>
      <textarea id="f_rowsJson" style="display:none;"></textarea>
    </div>
  </div>
</div>
<div class="pp">
  <div class="page-nav">
    <span class="page-nav-label">ページ:</span>
    <span id="pnPages"><button class="pn-btn pn-btn-page active" onclick="scrollToPage(1)">P1</button></span>
    <span style="margin-left:8px;font-size:10px;color:#aaa;font-family:sans-serif;">文字:</span>
    <button class="pn-btn" onmousedown="event.preventDefault();changeFontSize(-0.5)" style="padding:2px 7px;">A-</button>
    <button class="pn-btn" onmousedown="event.preventDefault();changeFontSize(0)" style="padding:2px 7px;" id="fontSizeLabel">10.5pt</button>
    <button class="pn-btn" onmousedown="event.preventDefault();changeFontSize(0.5)" style="padding:2px 7px;">A+</button>
  </div>
  <div id="pageArea"></div>
</div>

<script src="ofusa_common.js?v=1792475583"></script>
<script>
// ============================================================
// 参考様式第１－１１－２号　受け入れた中長期在留者リスト
//   行データは隠し欄 f_rowsJson に JSON で保持（DB保存＝companies.extra['1_11_2'] に入り、次回自動で復元）
//   保存が無い会社では、案シスの同じ所属機関の案件（人材）から自動で一覧を作る。
// ============================================================
const LR_MODE = 'ukeire';          // 'ukeire'（1-11-2） / 'soudan'（1-11-3）
const LR_P1 = 5, LR_CONT = 10;       // 1枚目5名・継続用紙10名（原本どおり）
let _lrRows = [];
let _lrCompany = '';

function _lrEsc(s){ return (typeof esc==='function') ? esc(String(s==null?'':s)) : String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// 日付の表示：2024-04-01 / 2024/4/1 → 2024年4月1日。「不明」「現在」などはそのまま
function _lrJP(d){
  const s=String(d||'').trim(); if(!s) return '';
  const m=s.match(/^(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})日?$/);
  if(m) return `${+m[1]}年${+m[2]}月${+m[3]}日`;
  return s;
}
function _lrISO(d){ const s=String(d||'').trim(); const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m?`${m[1]}-${m[2]}-${m[3]}`:s; }
function _lrToday(){ const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; }

function lrSync(){ const t=document.getElementById('f_rowsJson'); if(t) t.value=JSON.stringify(_lrRows); }
function lrLoadFromField(){
  const t=document.getElementById('f_rowsJson');
  try{ const a=JSON.parse(t&&t.value||'[]'); _lrRows=Array.isArray(a)?a:[]; }catch(e){ _lrRows=[]; }
}
function _lrBlank(){ return {on:true,name:'',gender:'',birth:'',nat:'',card:'',from:'',to:'',notif:'有',org:_lrCompany||v('f_company')||'',src:'manual'}; }
function lrAdd(){ _lrRows.push(_lrBlank()); lrSync(); lrRenderEditor(); p();
  setTimeout(()=>{ const l=document.querySelectorAll('#lrList .lr-name'); if(l.length) l[l.length-1].focus(); },30); }
function lrDel(i){ _lrRows.splice(i,1); lrSync(); lrRenderEditor(); p(); }
function lrSet(i,k,val){ if(!_lrRows[i]) return; _lrRows[i][k]=val; lrSync(); if(k==='on') lrRenderEditor(); else lrRenderSum(); p(); }
function lrAllOn(on){ _lrRows.forEach(r=>r.on=on); lrSync(); lrRenderEditor(); p(); }

function lrRenderSum(){
  const n=_lrRows.filter(r=>r.on).length;
  const pages = n<=LR_P1 ? 1 : 1+Math.ceil((n-LR_P1)/LR_CONT);
  const el=document.getElementById('lrSum');
  if(el) el.innerHTML = `記載 <b style="color:#7c3aed;">${n}名</b> / 一覧 ${_lrRows.length}名　→　${pages}ページ${n>LR_P1?'（継続用紙あり）':''}`;
  // ヒアリングフォーム（会社）で答えた「外国人従業員数」より記載が少ないときは漏れの可能性を知らせる（1-11-2のみ）
  const fw=document.getElementById('lrFeWarn');
  if(fw){
    const fe=parseInt(String(_lrFE||'').replace(/[^0-9]/g,''),10);
    if(LR_MODE==='ukeire' && !isNaN(fe) && fe>0 && n<fe){
      fw.style.display=''; fw.innerHTML=`⚠️ 所属機関の情報では、いまの外国人従業員は <b>${fe}名</b> です。<br>この一覧の記載は ${n}名 なので、載せ漏れがないか確認してください。`;
    }else fw.style.display='none';
  }
}
function lrRenderEditor(){
  const box=document.getElementById('lrList'); if(!box) return;
  if(!_lrRows.length){
    box.innerHTML='<div style="font-size:11px;color:#94a3b8;padding:10px;text-align:center;border:1px dashed #cbd5e1;border-radius:8px;">まだ一覧がありません。<br>「案シスから読み込み」か「＋ 行を追加」で入れてください。</div>';
    lrRenderSum(); return;
  }
  let no=0;
  box.innerHTML=_lrRows.map((r,i)=>{
    const n = r.on ? (++no) : '';
    const chip = r.status ? `<span class="lr-chip${r.cur?' cur':''}">${_lrEsc(r.cur?'この案件':r.status)}</span>` : (r.src==='manual'?'<span class="lr-chip">手入力</span>':'');
    const lastField = LR_MODE==='ukeire'
      ? `<div><label>外国人雇用状況届出</label><select onchange="lrSet(${i},'notif',this.value)"><option value="有"${r.notif!=='無'?' selected':''}>有</option><option value="無"${r.notif==='無'?' selected':''}>無</option></select></div>`
      : `<div class="full"><label>中長期在留者の所属機関</label><input value="${_lrEsc(r.org)}" oninput="lrSet(${i},'org',this.value)"></div>`;
    return `<div class="lr-card${r.on?'':' off'}">
      <div class="lr-head">
        <input type="checkbox"${r.on?' checked':''} onchange="lrSet(${i},'on',this.checked)" title="書類に載せる">
        <span class="lr-no">${n}</span>
        <input class="lr-name" value="${_lrEsc(r.name)}" placeholder="氏名（ローマ字）" oninput="lrSet(${i},'name',this.value)">
        ${chip}
        <button class="lr-del" onclick="lrDel(${i})" title="この行を削除">✕</button>
      </div>
      <div class="lr-grid">
        <div><label>性別</label><select onchange="lrSet(${i},'gender',this.value)"><option value=""></option>${['男','女','不明'].map(g=>`<option${r.gender===g?' selected':''}>${g}</option>`).join('')}</select></div>
        <div><label>生年月日</label><input value="${_lrEsc(r.birth)}" placeholder="1998-04-01" oninput="lrSet(${i},'birth',this.value)"></div>
        <div><label>国籍・地域</label><input value="${_lrEsc(r.nat)}" oninput="lrSet(${i},'nat',this.value)"></div>
        <div><label>在留カード番号</label><input value="${_lrEsc(r.card)}" oninput="lrSet(${i},'card',this.value)"></div>
        <div><label>受入れ期間（から）</label><input value="${_lrEsc(r.from)}" placeholder="2024-04-01" oninput="lrSet(${i},'from',this.value)"></div>
        <div><label>（まで）</label><input value="${_lrEsc(r.to)}" placeholder="2026-03-31 / 現在" oninput="lrSet(${i},'to',this.value)"></div>
        ${lastField}
      </div>
    </div>`;
  }).join('');
  lrRenderSum();
}

// ---- 書類の描画（原本Wordの実寸レイアウト: A4横）----
const LR_W=[7.6,57.9,12.5,37.5,25.0,40.0,47.5,37.5];   // 列幅 mm（原本どおり）
const LR_FW='０１２３４５６７８９';
function _lrFW(n){ return String(n).replace(/[0-9]/g,c=>LR_FW[c]); }
function _lrHeadRow(){
  const H=['','氏名（ローマ字）','性別','生年月日','国籍・地域','在留カード番号','受入れ期間','外国人雇用状況届出'];
  return '<colgroup>'+LR_W.map(w=>`<col style="width:${w}mm">`).join('')+'</colgroup><tr>'+H.map((h,i)=>`<th${i===7?` style="font-size:10pt;"`:''}>${h}</th>`).join('')+'</tr>';
}
function _lrRow(no, r, showNo){
  r = r || {};
  const per = (val, tail) => {
    const s=_lrJP(val);
    return s ? `${_lrEsc(s)}${tail}` : `　　　年　　月　　日${tail}`;
  };
  const b=_lrJP(r.birth);
  const last = LR_MODE==='ukeire'
    ? `<td class="nb">${r.name&&r.notif!=='無'?'■':'□'}　有　　${r.name&&r.notif==='無'?'■':'□'}　無</td>`
    : `<td style="font-size:9pt;line-height:11pt;">${_lrEsc(r.org||'')}</td>`;
  return `<tr>
    <td>${showNo?_lrFW(no):''}</td>
    <td>${_lrEsc(r.name||'')}</td>
    <td class="c">${_lrEsc(r.gender||'')}</td>
    <td class="r">${b?_lrEsc(b):'年　　月　　日'}</td>
    <td class="c">${_lrEsc(r.nat||'')}</td>
    <td class="c" style="white-space:nowrap;">${_lrEsc(r.card||'')}</td>
    <td class="per">${per(r.from,'から')}<br>${per(r.to,'まで')}</td>
    ${last}
  </tr>`;
}
const LR_NOTE1 = `<div class="n1">１　対象となる中長期在留者は、入管法別表第１の１の表、２の表及び５の表の上欄の在留資格（収入を伴う事業を運営する活動又は報酬を受ける活動を行うことができる在留資格に限る。）であることに留意すること。</div>
  <div class="b1">別表第１の１の表：外交、公用、教授、芸術、宗教、報道</div>
  <div class="b2">別表第１の２の表：高度専門職、経営・管理、法律・会計業務、医療、研究、教育、技術・人文知識・国際業務、企業内転勤、介護、興行、技能、特定技能、技能実習</div>
  <div class="b5">別表第１の５の表：特定活動</div>`;
const LR_NOTES_P1 = `${LR_NOTE1}
  <div class="n2">２　「外国人雇用状況届出」の欄で「無」を選択した場合には、その理由を記載した理由書（任意様式）を添付すること。</div>
  <div class="n2">３　記載できない箇所については、「不明」と記載すること。</div>
  <div class="n2">４　受け入れた全ての中長期在留者が記載しきれない場合は、本紙を複製して使用すること</div>`;
const LR_NOTES_CONT = `<div>１　受け入れた中長期在留者の６人目以降は、このページに記載すること。</div>
  <div class="n2">２　本ページにも記載しきれない場合は、本ページを複製して全ての中長期在留者について記載すること。</div>`;

function p(){
  if(_editMode) return;
  const w=document.getElementById('pageArea'); if(!w) return;
  const on=_lrRows.filter(r=>r.on);
  const y=v('f_docYear'), m=v('f_docMonth'), d=v('f_docDay');
  const dateStr = `${y?_lrEsc(y):''}年　　　　${m?_lrEsc(m):''}月　　　　${d?_lrEsc(d):''}日`;
  let html = `
<div class="doc">
<div class="page-num-label">P1</div>
<div class="g">参考様式第１－１１－２号（特定技能基準省令第２条第２項第１号イ関係）</div>
<div style="text-align:center;font-size:18pt;line-height:36pt;">受け入れた中長期在留者リスト</div>
<div class="g r" style="font-size:11pt;">${dateStr}</div>
<div class="g"></div>
<div class="g r" style="font-size:11pt;">特定技能所属機関の氏名又は名称　　<span class="ul">${f('f_company')}</span></div>
<div class="g"></div>
<div class="g r" style="font-size:11pt;">作成責任者　役職・氏名　　<span class="ul">${f('f_repTitle')}　${f('f_repName')}</span></div>
<div class="g"></div>
<div class="g gth">○　特定技能所属機関が過去２年以内に<u>受け入れた全ての中長期在留者</u>について、この用紙に記載すること。</div>
<div class="note"><div>（注意）</div>${LR_NOTES_P1}</div>
<div class="g"></div>
<table class="lt">${_lrHeadRow()}`;
  for(let i=0;i<LR_P1;i++) html += _lrRow(i+1, on[i], true);
  html += `</table>
</div>`;
  // 継続用紙（6人目以降）
  let pg=1;
  for(let start=LR_P1; start<on.length; start+=LR_CONT){
    pg++;
    html += `
<div class="doc">
<div class="page-num-label">P${pg}</div>
<div class="g" style="font-size:11pt;">参考様式第１－１１－２号（継続用紙）</div>
<div class="note"><div>（注意）</div>${LR_NOTES_CONT}</div>
<div class="g"></div>
<table class="lt">${_lrHeadRow()}`;
    for(let i=start;i<start+LR_CONT;i++) html += _lrRow(i+1, on[i], !!on[i]);
    html += `</table>
</div>`;
  }
  w.innerHTML = html;
  const pn=document.getElementById('pnPages');
  if(pn){ let b=''; for(let i=1;i<=pg;i++) b+=`<button class="pn-btn pn-btn-page${i===1?' active':''}" onclick="scrollToPage(${i})">P${i}</button>`; pn.innerHTML=b; }
  _fontSize = (_fontSize === 8.5) ? 10.5 : _fontSize;
  _applyLrFontSize();
  const lbl=document.getElementById('fontSizeLabel'); if(lbl) lbl.textContent=_fontSize+'pt';
  setupPageTracker();
  fitDocToPreview();
}
// A+/A- は表の中の文字（氏名など）だけを拡大縮小する（枠の寸法は原本どおり固定）
function _applyLrFontSize(){
  const st=document.getElementById('_lrFontStyle')||document.createElement('style');
  st.id='_lrFontStyle'; document.head.appendChild(st);
  const s=_fontSize/10.5;
  st.textContent=[
    `.doc{font-size:10.5pt!important}`,
    `.doc .lt td{font-size:${(10*s).toFixed(2)}pt!important}`,
  ].join('');
}

// ---- 案シスから人材一覧を作る ----
async function _lrResolveCompany(info){
  const caseId=info&&info.caseId;
  let cas=null, co=null;
  if(caseId){ const r=await sb('cases?select=id,company,company_id,doc_create_date&id=eq.'+caseId); cas=r&&r[0]; }
  const cid=(info&&info.companyId)||(cas&&cas.company_id);
  const SEL='id,name,rep_name,rep_title,support_org_name';
  if(cid){ const r=await sb(`companies?select=${SEL}&id=eq.${cid}`); co=r&&r[0]; }
  const cname=(info&&info.companyName)||(cas&&cas.company);
  if(!co && cname){ const r=await sb(`companies?select=${SEL}&name=eq.${encodeURIComponent(cname)}`); co=r&&r[0]; }
  return {cas, co: co||{}, cname: (co&&co.name)||cname||''};
}
async function _lrBuildFromDB(info, ctx){
  const {co, cname} = ctx;
  let cases=[];
  const CSEL='id,applicant,status,residence_status,contract_start,contract_end';
  if(co.id) cases = await sb(`cases?select=${CSEL}&company_id=eq.${co.id}&order=contract_start.asc.nullslast`) || [];
  if(!cases.length && cname) cases = await sb(`cases?select=${CSEL}&company=eq.${encodeURIComponent(cname)}&order=contract_start.asc.nullslast`) || [];
  if(!cases.length) return [];
  const byCase={}; cases.forEach(c=>byCase[c.id]=c);
  const ids=cases.map(c=>c.id); let persons=[];
  for(let i=0;i<ids.length;i+=40){
    const chunk=ids.slice(i,i+40).map(x=>`"${x}"`).join(',');
    const r=await sb(`persons?select=case_id,applicant_name_en,gender,birthdate,nationality,residence_card,contract_start,contract_end&case_id=in.(${encodeURIComponent(chunk)})`);
    if(r) persons=persons.concat(r);
  }
  const pByCase={}; persons.forEach(pp=>{ if(!pByCase[pp.case_id]) pByCase[pp.case_id]=pp; });
  // 同じ人（氏名＋生年月日）の複数案件（変更→更新など）は1行にまとめる
  const map=new Map(); const today=_lrToday();
  const NG=/取下|キャンセル|不許可|他社申請/;
  cases.forEach(c=>{
    const pp=pByCase[c.id]||{};
    const name=String(pp.applicant_name_en||c.applicant||'').trim(); if(!name) return;
    const key=name.toUpperCase().replace(/[\s　,.・]/g,'')+'|'+(pp.birthdate||'');
    const from=_lrISO(c.contract_start||pp.contract_start||''), to=_lrISO(c.contract_end||pp.contract_end||'');
    const isCur = info && c.id===info.caseId;
    const done = (c.status==='完了');
    let r=map.get(key);
    if(!r){
      r={on:false,name,gender:pp.gender||'',birth:_lrISO(pp.birthdate||''),nat:pp.nationality||'',card:pp.residence_card||'',from:'',to:'',notif:'有',org:cname,src:'db',status:c.status||'',cur:false,_done:false,_ng:true};
      map.set(key,r);
    }
    if(!r.gender && pp.gender) r.gender=pp.gender;
    if(!r.birth && pp.birthdate) r.birth=_lrISO(pp.birthdate);
    if(!r.nat && pp.nationality) r.nat=pp.nationality;
    if(pp.residence_card) r.card=pp.residence_card;   // 新しい案件のカード番号を優先
    if(from && (!r.from || from<r.from)) r.from=from;
    if(to && (!r.to || to>r.to)) r.to=to;
    if(isCur) r.cur=true;
    if(done) r._done=true;
    if(!NG.test(c.status||'')) r._ng=false;
    r.status = isCur ? r.status : (c.status||r.status);
  });
  const rows=[...map.values()].map(r=>{
    // 受入れ中（契約終了日が先）の人は「現在」まで
    if(r.to && /^\d{4}-\d{2}-\d{2}$/.test(r.to) && r.to>today) r.to='現在';
    // 自動でチェックを付けるのは「許可済み（完了）」の人と、いま開いている案件の人
    // 過去２年以内に在籍していた（終了日が２年前より後・または受入れ中）人に限る
    const n2=new Date(); n2.setFullYear(n2.getFullYear()-2);
    const twoAgo=`${n2.getFullYear()}-${String(n2.getMonth()+1).padStart(2,'0')}-${String(n2.getDate()).padStart(2,'0')}`;
    const within2y = !r.to || r.to==='現在' || !/^\d{4}-\d{2}-\d{2}$/.test(r.to) || r.to>=twoAgo;
    r.on = !r._ng && within2y && (r._done || r.cur);
    delete r._done; delete r._ng;
    return r;
  });
  rows.sort((a,b)=> (b.on-a.on) || String(a.from||'9').localeCompare(String(b.from||'9')));
  return rows;
}
// ---- ヒアリングフォーム（会社・特定技能1号）の【自社支援】の回答 ----
//   form_responses(form_type=company) の response.selfSupport（ssMode=self のとき）
//   選任の根拠 basis='1' → accept.list（1-11-2）／ basis='2' → consult.list（1-11-3）＋ rireki（1-20・1-22）
//   case_id は 'co_'+会社ID（会社用リンク）か 案件ID（案件用リンク）
// 自社支援の回答の取得：①案シスの所属機関 extra.selfSupport（「🤝 自社支援」タブで取り込み・修正したもの）を優先
//   ②まだ取り込んでいなければ ヒアリングフォーム（form_responses, form_type=company）の最新の回答
//   戻り値 {ss, src:'anshis'|'form'|'', newer:bool, fe:'外国人従業員数'}
async function _ssFetchSelfSupport(coId, caseId){
  const out={ss:null, src:'', newer:false, fe:''};
  let ssAt='';
  if(coId){
    try{
      const r=await sb(`companies?select=foreign_employees,ss:extra->selfSupport,ssAt:extra->>selfSupportAt&id=eq.${encodeURIComponent(coId)}`);
      const c=r&&r[0];
      if(c){
        if(c.ss && typeof c.ss==='object' && Object.keys(c.ss).length){ out.ss=c.ss; out.src='anshis'; ssAt=c.ssAt||''; }
        if(c.foreign_employees!=null && String(c.foreign_employees).trim()!=='') out.fe=String(c.foreign_employees);
      }
    }catch(e){ console.warn('[selfSupport]',e); }
  }
  const ids=[]; if(coId) ids.push('co_'+coId); if(caseId) ids.push(caseId);
  if(ids.length){
    const q=ids.map(x=>`"${x}"`).join(',');
    try{
      const r=await sb(`form_responses?select=response,submitted_at&form_type=eq.company&case_id=in.(${encodeURIComponent(q)})&deleted_at=is.null&order=submitted_at.desc.nullslast&limit=10`)||[];
      for(const x of r){
        const rs=x&&x.response||{};
        if(rs.ssMode==='self' && rs.selfSupport){
          if(!out.ss){ out.ss=rs.selfSupport; out.src='form'; }
          else if(out.src==='anshis' && x.submitted_at && ssAt && String(x.submitted_at)>String(ssAt)) out.newer=true;
          break;
        }
      }
      if(out.fe===''){ for(const x of r){ const rs=x&&x.response||{}; if(rs.foreignEmployees!=null && String(rs.foreignEmployees).trim()!==''){ out.fe=String(rs.foreignEmployees); break; } } }
    }catch(e){ console.warn('[form]',e); }
  }
  return out;
}
function _ssSrcHtml(r){
  let h = r.src==='anshis' ? '🤝 案シスの「自社支援」タブの内容を使っています' : '📝 ヒアリングフォーム（自社支援）の回答を使っています<br><span style="color:#64748b;">（案シスにはまだ取り込まれていません）</span>';
  if(r.newer) h+='<br><span style="color:#b45309;font-weight:700;">⚠️ 案シスに取り込んでいない新しいフォーム回答があります。案シスで取り込むと反映されます。</span>';
  return h;
}
let _lrSS=null, _lrFE='', _lrSrc={};
async function _lrFetchForm(info, ctx){
  _lrSrc=await _ssFetchSelfSupport(ctx.co&&ctx.co.id, info&&info.caseId);
  _lrSS=_lrSrc.ss; _lrFE=_lrSrc.fe;
}
function _lrFormRows(){
  const ss=_lrSS; if(!ss) return [];
  const src = LR_MODE==='ukeire' ? (ss.accept&&ss.accept.list) : (ss.consult&&ss.consult.list);
  return (src||[]).filter(x=>x&&String(x.nameEn||'').trim()).map(x=>({
    on:true, name:String(x.nameEn).trim(), gender:x.gender||'', birth:x.birth||'', nat:x.nat||'', card:x.card||'',
    from:x.from||'', to:x.to||'', notif:(x.report==='無'?'無':'有'), org:(x.org||_lrCompany||''), src:'form', status:'フォーム'
  }));
}
function _lrRenderFormInfo(){
  const el=document.getElementById('lrFormInfo'), bt=document.getElementById('lrFormBtn'); if(!el) return;
  const ss=_lrSS; const rows=_lrFormRows();
  if(bt) bt.style.display = rows.length ? '' : 'none';
  if(!ss){ el.style.display='none'; return; }
  const b=String(ss.basis||'');
  const bTxt = b==='1' ? '①受入れ実績（→ 1-11-2号）' : b==='2' ? '②生活相談の経験（→ 1-11-3号・1-20号・1-22号）' : '未回答';
  const need = LR_MODE==='ukeire' ? '1' : '2';
  let h=_ssSrcHtml(_lrSrc)+`<br>支援責任者・担当者の選任の根拠：<b>${bTxt}</b>`;
  if(b && b!==need) h+=`<br><span style="color:#b45309;font-weight:700;">⚠️ この会社は${b==='1'?'①':'②'}を選んでいるため、通常この書類（${LR_MODE==='ukeire'?'1-11-2号':'1-11-3号'}）は使いません。</span>`;
  if(LR_MODE==='ukeire' && ss.accept && ss.accept.exempt) h+='<br>（フォームでは「受入れた中長期在留者リストの提出を省略」と回答）';
  if(rows.length) h+=`<br>フォームの一覧：${rows.length}名`;
  el.innerHTML=h; el.style.display='';
}
function lrLoadFromForm(){
  const rows=_lrFormRows(); if(!rows.length){ showToast('⚠️ 自社支援の回答に一覧がありません'); return; }
  if(_lrRows.length && !confirm('いまの一覧を、自社支援の回答で作り直します（手入力した行は消えます）。よろしいですか？')) return;
  _lrRows=rows; lrSync(); lrRenderEditor(); p();
  showToast(`✅ 自社支援の回答から${rows.length}名を読み込みました`);
}
async function lrReloadFromDB(){
  const info=window._lastCaseInfo;
  if(!info||!info.caseId){ showToast('⚠️ 先に案件を選んでください'); return; }
  if(_lrRows.length && !confirm('いまの一覧を、案シスの内容で作り直します（手入力した行は消えます）。よろしいですか？')) return;
  const t=showToast('🔄 案シスから読み込み中…',0);
  try{
    const ctx=await _lrResolveCompany(info); _lrCompany=ctx.cname;
    _lrRows=await _lrBuildFromDB(info, ctx); lrSync(); lrRenderEditor(); p();
    t.remove(); showToast(`✅ ${_lrRows.length}名を読み込みました（✔ ${_lrRows.filter(r=>r.on).length}名）`);
  }catch(e){ t.remove(); showToast('⚠️ 読込エラー: '+e.message); console.error(e); }
}

async function loadFromDB(passedInfo){
  let info = passedInfo;
  if(!info){
    const sel=document.getElementById('caseSelect');
    if(!sel||!sel.value) return;
    try{info=JSON.parse(sel.value);}catch(e){return;}
  }
  if(!info || !info.caseId) return;
  window._lastCaseInfo = window._lastCaseInfo || info;
  try{
    const ctx=await _lrResolveCompany(info);
    const {cas, co, cname}=ctx; _lrCompany=cname;
    const s=(id,val)=>{const e=document.getElementById(id);if(e&&val&&!e.value)e.value=val;};
    s('f_company', cname);
    s('f_repTitle', co.rep_title||'');
    s('f_repName', co.rep_name||'');
    // 作成日 = 書類作成日（cases.doc_create_date）。無ければ今日。
    if(!v('f_docYear')){
      const dcd=(cas&&cas.doc_create_date)?String(cas.doc_create_date).split(/[-\/]/):[];
      const n=new Date();
      const yy=dcd[0]||n.getFullYear(), mm=dcd[1]||(n.getMonth()+1), dd=dcd[2]||n.getDate();
      s('f_docYear',String(parseInt(yy,10))); s('f_docMonth',String(parseInt(mm,10))); s('f_docDay',String(parseInt(dd,10)));
    }
    // 登録支援機関に全部委託している会社では、この書類は通常不要（自社支援のときに出す書類）
    const note=document.getElementById('lrItakuNote');
    const norm=x=>String(x||'').replace(/[\s　]/g,'');
    if(note){
      const org=co.support_org_name||'';
      if(org && norm(org)!==norm(cname) && !/自社/.test(org)){
        note.style.display=''; note.innerHTML=`ℹ️ この会社は登録支援機関「${_lrEsc(org)}」に支援を委託しています。<br>この書類は、通常<b>自社で支援する場合</b>に提出します。`;
      }else{ note.style.display='none'; }
    }
    // DB保存済みの一覧があればそれを使う。無ければ案シスから自動で作る
    // ヒアリングフォーム（自社支援）の回答
    await _lrFetchForm(info, ctx); _lrRenderFormInfo();
    // DB保存済みの一覧があればそれを使う。無ければ フォームの一覧 → 案シスの案件 の順で自動で作る
    lrLoadFromField();
    if(!_lrRows.length){
      const fr=_lrFormRows();
      _lrRows = fr.length ? fr : await _lrBuildFromDB(info, ctx);
      lrSync();
    }
    lrRenderEditor(); p();
    showToast('✅ データを読み込みました');
  }catch(e){showToast('⚠️ 読込エラー: '+e.message);console.error(e);}
}
initCaseSelect(); lrRenderEditor(); p();

function fitDocToPreview(){
  requestAnimationFrame(()=>{
    const pp = document.querySelector('.pp');
    const area = document.getElementById('pageArea');
    if(!pp || !area) return;
    const ppW = pp.clientWidth - 40;
    const docW = 1123;  // 297mm
    const scale = ppW < docW ? ppW / docW : 1;
    area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = scale; });
  });
}
window.addEventListener('resize', fitDocToPreview);

window.addEventListener('message', async function(e){
  if(!e.data||e.data.type!=='SELECT_CASE') return;
  const info=e.data.info;
  if(!info||!info.caseId) return;
  const sel=document.getElementById('caseSelect');
  if(sel){
    let found=false;
    for(let o of sel.options){
      try{ const d=JSON.parse(o.value); if(d.caseId===info.caseId){sel.value=o.value;found=true;break;} }catch(e2){}
    }
    if(!found){
      const opt=document.createElement('option');
      opt.value=JSON.stringify(info);
      opt.textContent='（indexから選択）';
      sel.appendChild(opt);
      sel.value=opt.value;
    }
  }
  // 前の案件の値が残らないよう、入力欄と一覧をいったん空にする
  ['f_docYear','f_docMonth','f_docDay','f_company','f_repTitle','f_repName','f_rowsJson'].forEach(id=>{const el=document.getElementById(id); if(el) el.value='';});
  _lrRows=[]; _lrSS=null; _lrFE=''; _lrSrc={};
  if(typeof loadCaseToForm==='function'){ await loadCaseToForm(info, '1_11_2'); }
  if(typeof loadFromDB==='function') loadFromDB(info);
});
