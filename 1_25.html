<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>参考様式第１－２５号</title>
<style>.fp-case{display:none!important;}</style>
<link rel="stylesheet" href="ofusa_common.css?v=1784720412">
<style>
.doc{padding:15mm!important;line-height:1.52!important;min-height:auto!important}
@media print{
  .app-bar,.fp{display:none!important}
  .main{display:block!important}
  .doc{box-shadow:none!important;margin:0!important;padding:15mm!important}
  .f[style*="color:#aaa"]{visibility:hidden}
}
</style>
</head>
<body>
<div class="app-bar">
  <div>
    <div class="app-bar-title">📄 参考様式第１－２５号　登録支援機関との支援委託契約に関する説明書</div>
    <div class="ver">ver.20260821.07</div>
  </div>
  <div class="bar-btns">
    <button class="btn" id="editModeBtn" onclick="toggleEditMode()" style="background:#7c3aed;color:white;">✏️ 直接編集</button>
    <button class="btn" id="styleModeBtn" onclick="toggleStyleMode()" style="background:#0f766e;color:white;">🎨 スタイル編集</button>
    <button class="btn" onclick="saveFormGeneric('1_25')" style="background:#16a34a;color:white;">🛢 DB保存</button>
    <button class="btn" onclick="saveEditedHTML()" style="background:#0369a1;color:white;">📥 編集保存</button>
    <button class="btn" onclick="loadEditedHTML()" style="background:#0369a1;color:white;">📂 編集呼出</button>
    <button class="btn btn-print" onclick="doPrint()">🖨️ 印刷・PDF</button>
  </div>
</div>
<div class="main">
<div class="fp">
  <div class="fp-case">
    <label>登録支援機関</label><select id="filterOrg" onchange="filterCases()"></select>
    <label>所属機関</label><select id="filterCompany" onchange="filterCases()"></select>
    <label>検索</label><input id="filterText" oninput="filterCases()" placeholder="名前で絞り込み">
    <label>案件選択 <span id="caseCount" style="color:#888;font-weight:normal;font-size:9px;"></span></label>
    <select id="caseSelect" onchange="loadFromDB()"></select>
  </div>
  <div class="fp-inner">
    <div class="fs"><div class="fs-title">基本情報</div>
      <div class="fg"><label>書類作成日</label><input id="f_docDate" oninput="p()"></div>
      <div class="fg"><label>契約年月日（契約開始日）</label><input id="f_contractStart" oninput="p()"></div>
      <div class="fg"><label>申請人氏名</label><input id="f_applicant" oninput="p()"></div>
      <div class="fg"><label>所属機関名</label><input id="f_company" oninput="p()"></div>
      <div class="fg"><label>作成責任者役職・氏名</label><input id="f_author" oninput="p()"></div>
    </div>
    <div class="fs"><div class="fs-title">登録支援機関</div>
      <div class="fg"><label>登録支援機関名</label><input id="f_soName" oninput="p()"></div>
      <div class="fg"><label>登録番号</label><input id="f_soNo" oninput="p()"></div>
    </div>
    <div class="fs"><div class="fs-title">雇用条件</div>
      <div class="fg"><label>契約終了日</label><input id="f_contractEnd" oninput="p()"></div>
      <div class="fg"><label>委託料（月額）</label><input id="f_supportFee" oninput="p()"></div>
    </div>
  </div>
</div>
<div class="pp">
  <div class="page-nav">
    <span class="page-nav-label">ページ:</span>
    <button class="pn-btn pn-btn-page active" onclick="scrollToPage(1)">P1</button>
    <span style="margin-left:8px;font-size:10px;color:#aaa;font-family:sans-serif;">文字:</span>
    <button class="pn-btn" onmousedown="event.preventDefault();changeFontSize(-0.5)" style="padding:2px 7px;">A-</button>
    <button class="pn-btn" onmousedown="event.preventDefault();changeFontSize(0)" style="padding:2px 7px;" id="fontSizeLabel">14pt</button>
    <button class="pn-btn" onmousedown="event.preventDefault();changeFontSize(0.5)" style="padding:2px 7px;">A+</button>
  </div>
  <div id="pageArea"></div>
</div>
</div>
<script src="ofusa_common.js?v=1788154394"></script>
<script>
let _itekiHatou = ''; // ''=未選択 'gaitou'=該当 'higaitou'=非該当

function p(){
  if(_editMode) return;
  const w=document.getElementById('pageArea'); if(!w) return;
  w.innerHTML=`
<div class="doc">
<div class="page-num-label">P1</div>
<div style="text-align:left;font-size:11pt;margin-bottom:16px;">参考様式第１－２５号</div>
<div style="font-weight:bold;text-align:center;margin:4mm 0 24px 0;">登録支援機関との支援委託契約に関する説明書</div>
<div style="font-size:14pt;margin-bottom:32px;">　登録支援機関との１号特定技能外国人支援計画の全部の委託契約の概要は<br>下記のとおりです。</div>
<div style="margin-top:8px;margin-bottom:16px;">記</div>
<table style="width:100%;border-collapse:collapse;margin-bottom:24px;font-size:11pt;">
  <tr>
    <td style="border:1px solid #555;padding:3px 6px;width:5%;text-align:center;">１</td>
    <td style="border:1px solid #555;padding:3px 6px;width:30%;">申請人（支援対象者）</td>
    <td style="border:1px solid #555;padding:3px 6px;" colspan="2">${f('f_applicant')}</td>
  </tr>
  <tr>
    <td style="border:1px solid #555;padding:3px 6px;text-align:center;">２</td>
    <td style="border:1px solid #555;padding:3px 6px;">契約の相手方（登録支援機関）</td>
    <td style="border:1px solid #555;padding:3px 6px;">${f('f_soName')}</td>
    <td style="border:1px solid #555;padding:3px 6px;white-space:nowrap;">（${f('f_soNo')}）</td>
  </tr>
  <tr>
    <td style="border:1px solid #555;padding:3px 6px;text-align:center;">３</td>
    <td style="border:1px solid #555;padding:3px 6px;">契約年月日</td>
    <td style="border:1px solid #555;padding:3px 6px;" colspan="2">${f('f_contractStart')}</td>
  </tr>
  <tr>
    <td style="border:1px solid #555;padding:3px 6px;text-align:center;">４</td>
    <td style="border:1px solid #555;padding:3px 6px;">委託する支援業務（１号特定技能外国人支援計画の全部であること）</td>
    <td style="border:1px solid #555;padding:3px 6px;" colspan="2"><span class="cb cb-click" onclick="toggleIteki('gaitou')" id="cb_gaitou">□</span>　該当　　<span class="cb cb-click" onclick="toggleIteki('higaitou')" id="cb_higaitou">□</span>　非該当</td>
  </tr>
  <tr>
    <td style="border:1px solid #555;padding:3px 6px;text-align:center;">５</td>
    <td style="border:1px solid #555;padding:3px 6px;">委託料（１名当たりの月額）</td>
    <td style="border:1px solid #555;padding:3px 6px;" colspan="2">${f('f_supportFee')} 円</td>
  </tr>
  <tr>
    <td style="border:1px solid #555;padding:3px 6px;text-align:center;">６</td>
    <td style="border:1px solid #555;padding:3px 6px;">契約期間</td>
    <td style="border:1px solid #555;padding:3px 6px;" colspan="2">${f('f_contractStart')}から${f('f_contractEnd')}まで</td>
  </tr>
</table>
<div style="font-size:9pt;margin-bottom:16px;">
（注意）<br>
１　項番１に関し、複数の申請人（同時申請に限る。）について、全ての項目の内容が同一の場合には「別紙のとおり」として別紙を添付して差し支えない。<br>
２　項番２に関し、登録支援機関登録簿に登録された氏名又は名称を記載すること。
</div>
<div style="font-size:9pt;text-align:right;margin-top:2em;margin-bottom:2em;">${f('f_docDate')}</div>
<div style="font-size:9pt;text-align:right;margin-bottom:2em;">特定技能所属機関の氏名又は名称　　${f('f_company')}</div>
<div style="font-size:9pt;text-align:right;">作成責任者　役職・氏名　　${f('f_author')}</div>
</div>`;
  _fontSize = (_fontSize === 8.5) ? 14 : _fontSize;
  _applyFontSize();
  _apply1_25FontSize();
  const lbl=document.getElementById('fontSizeLabel');if(lbl)lbl.textContent=_fontSize+'pt';
  setupPageTracker();
  fitDocToPreview();
}
function _apply1_25FontSize(){
  const st=document.getElementById('_1_25FontStyle')||document.createElement('style');
  st.id='_1_25FontStyle'; document.head.appendChild(st);
  const s=_fontSize/14;
  // 9ptと11ptを14pt基準でスケール
  st.textContent=[
    `.doc [style*="font-size:9pt"]{font-size:${(9*s).toFixed(2)}pt!important}`,
    `.doc [style*="font-size:11pt"]{font-size:${(11*s).toFixed(2)}pt!important}`,
    `.doc [style*="font-size:14pt"]{font-size:${(14*s).toFixed(2)}pt!important}`,
    `.doc [style*="font-size:7pt"]{font-size:${(7*s).toFixed(2)}pt!important}`,
    `.doc [style*="font-size:11pt;margin-bottom:16px"]{font-size:${(11*s).toFixed(2)}pt!important}`,
  ].join('');
}
async function loadFromDB(passedInfo){
  let info = passedInfo;
  if(!info){
    const sel=document.getElementById('caseSelect');
    if(!sel.value) return;
    try{info=JSON.parse(sel.value);}catch(e){return;}
  }
  if(!info || !info.caseId) return;
  const {caseId,companyId,companyName}=info;
  try{
    const [cases,cos]=await Promise.all([
      sb('cases?select=applicant,emp_set_idx,contract_end,contract_start,support_fee,org,doc_create_date&id=eq.'+caseId),
      companyId?sb(`companies?select=name,author_name,author_title,support_org_name,support_org_no,emp_sets&id=eq.${companyId}`)
        :companyName?sb(`companies?select=name,author_name,author_title,support_org_name,support_org_no,emp_sets&name=eq.${encodeURIComponent(companyName)}`):Promise.resolve([])
    ]);
    const cas=cases&&cases[0]; const co=cos&&cos[0];
    const s=(id,val)=>{const e=document.getElementById(id);if(e&&val)e.value=val;};
    if(cas) s('f_applicant',cas.applicant||'');
    if(co){
      s('f_company',co.name||'');
      s('f_author',[co.author_title,co.author_name].filter(Boolean).join('　'));
      s('f_soName',(cas&&cas.org)||co.support_org_name||'');
      const idx=parseInt((cas&&cas.emp_set_idx)||0)||0;
      const es=(co.emp_sets||[])[idx]||{};
      // 支援委託費は案件(cases.support_fee)に保存されている。旧データ用にemp_setsもフォールバック
      const _sf=(cas&&cas.support_fee)||es.supportFee||'';
      if(_sf) s('f_supportFee',_sf);
    }
    const fmtJDate=(v)=>{const m=String(v||'').match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);return m?`${m[1]}年${parseInt(m[2])}月${parseInt(m[3])}日`:'';};
    // 契約終了日: 案件(cases.contract_end)を優先、無ければ人材(persons.contract_end)を使う
    let _cEnd = cas && cas.contract_end ? fmtJDate(cas.contract_end) : '';
    if(!_cEnd){
      const persons=await sb('persons?select=contract_end&case_id=eq.'+caseId);
      const pd=persons&&persons[0];
      if(pd&&pd.contract_end) _cEnd=fmtJDate(pd.contract_end);
    }
    if(_cEnd) s('f_contractEnd',_cEnd);
    // 登録番号(soNo): ①登録支援機関マスタ(reg_no)優先 → ②所属機関(support_org_no) → ③同名他社の最頻値
    const _soNm=(cas&&cas.org)||(co&&co.support_org_name)||'';
    let _soNo='';
    if(_soNm){
      try{
        const so=await sb('support_orgs?select=reg_no&name=eq.'+encodeURIComponent(_soNm)+'&reg_no=not.is.null');
        const _rn=so&&so[0]&&((so[0].reg_no)||'').trim();
        if(_rn) _soNo=_rn;
      }catch(_e){}
    }
    if(!_soNo) _soNo=(co&&co.support_org_no)||'';
    if(!_soNo && _soNm){
      try{
        const rows=await sb('companies?select=support_org_no&support_org_name=eq.'+encodeURIComponent(_soNm)+'&support_org_no=not.is.null');
        const cnt={};
        (rows||[]).forEach(r=>{const x=((r&&r.support_org_no)||'').trim();if(x) cnt[x]=(cnt[x]||0)+1;});
        const best=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
        if(best) _soNo=best; // 表記ゆれ・誤入力対策として最頻値を採用
      }catch(_e){}
    }
    if(_soNo) s('f_soNo',_soNo);
    // 書類作成日(f_docDate): 案件のdoc_create_dateを西暦で。無ければcontract_start→今日(西暦)
    let _dd=(cas&&cas.doc_create_date)?fmtJDate(cas.doc_create_date):'';
    if(!_dd && cas && cas.contract_start) _dd=fmtJDate(cas.contract_start);
    if(!_dd){const n=new Date();_dd=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日`;}
    document.getElementById('f_docDate').value=_dd;
    // 契約年月日(f_contractStart): 案件のcontract_startを西暦で。無ければdoc_create_date→今日(西暦)
    let _cs=(cas&&cas.contract_start)?fmtJDate(cas.contract_start):'';
    if(!_cs && cas && cas.doc_create_date) _cs=fmtJDate(cas.doc_create_date);
    if(!_cs){const n=new Date();_cs=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日`;}
    { const _e=document.getElementById('f_contractStart'); if(_e)_e.value=_cs; }
    p(); showToast('✅ データを読み込みました');
  }catch(e){showToast('⚠️ 読込エラー: '+e.message);console.error(e);}
}
initCaseSelect(); p();

function toggleIteki(val){
  _itekiHatou = (_itekiHatou === val) ? '' : val;
  document.getElementById('cb_gaitou').textContent  = (_itekiHatou === 'gaitou')   ? '■' : '□';
  document.getElementById('cb_higaitou').textContent = (_itekiHatou === 'higaitou') ? '■' : '□';
}

function fitDocToPreview(){
  requestAnimationFrame(()=>{
    const pp = document.querySelector('.pp');
    const area = document.getElementById('pageArea');
    if(!pp || !area) return;
    const ppW = pp.clientWidth - 40;
    const docW = 794;
    if(ppW < docW){
      const scale = ppW / docW;
      area.querySelectorAll('.doc').forEach(d=>{
        d.style.zoom = scale;
      });
    } else {
      area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = 1; });
    }
  });
}
window.addEventListener('resize', fitDocToPreview);

// index.htmlからの案件選択を受信
window.addEventListener('message', async function(e){
  if(!e.data||e.data.type!=='SELECT_CASE') return;
  const info=e.data.info;
  if(!info||!info.caseId) return;
  // caseSelectに値をセットしてloadFromDB()を呼ぶ
  const sel=document.getElementById('caseSelect');
  if(sel){
    // 既存のoptionを探すかなければ追加
    let found=false;
    for(let o of sel.options){
      try{
        const d=JSON.parse(o.value);
        if(d.caseId===info.caseId){sel.value=o.value;found=true;break;}
      }catch(e2){}
    }
    if(!found){
      const opt=document.createElement('option');
      opt.value=JSON.stringify(info);
      opt.textContent='（indexから選択）';
      sel.appendChild(opt);
      sel.value=opt.value;
    }
  }
  // まず共通関数で全入力欄を埋める
  if(typeof loadCaseToForm==='function'){ await loadCaseToForm(info, '1_25'); }
  // 書類固有の追加処理があれば loadFromDB で補完
  if(typeof loadFromDB==='function') loadFromDB(info);
});
</script>
</body>
</html>
