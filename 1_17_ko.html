left:6.30em\">확인일: <span data-p17d=\"d\"></span>/<span data-p17d=\"m\"></span>/<span data-p17d=\"y\"></span>　<input type=\"hidden\" class=\"bl\" id=\"f403\" name=\"f403\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿\" style=\"width:2.75em\">확인 방법:　<input type=\"checkbox\" class=\"cb\" id=\"f404\" name=\"f404\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> 웹사이트　 <input type=\"checkbox\" class=\"cb\" id=\"f405\" name=\"f405\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> 기타 방법 (<input type=\"text\" class=\"bl\" id=\"f406\" name=\"f406\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿)\" style=\"width:17.00em\">)</p><p class=\"vi\" style=\"padding-left:6.30em\">비고:</p></td>"],0,1],[2244,16,2543715452,["<p class=\"vi\">(주의)</p>","<p class=\"vi\">1\tⅠ란은, 지원 대상자가 다수 있는 경우이며 지원 내용이 동일한 경우에 한해, 「1 성명」에 「별지의 명부대로」라고 기재하고, Ⅰ란의 사항이 기재된 명부(임의 양식)을 첨부하는 것으로 지장없다. 다만, 신청을 동시에 실시하는 경우에 한한다.</p>","<p class=\"vi\">2\tⅡ란 4는, 특정 기능 소속 기관 스스로가 1호 특정 기능 외국인 지원 계획을 실시하는 경우만 기재할 것.</p>","<p class=\"vi\">3\tⅢ란은, 1호 특정 기능 외국인 지원 계획의 전부의 실시를 등록 지원 기관에 위탁하는 경우만 기재할 것.</p>","<p class=\"vi\">4\tⅣ란 1에서 9까지의 「실시 예정」란은 해당하는 것에 체크를 하고, 실시 예정이 「유」인 경우는 실시 시기를 간결하게 기재하고, 「무」의 경우는 해당 지원을 실시하지 않는 이유에 대해서 괄호내에 기재하는 것.</p>","<p class=\"vi\">5 Ⅳ란 1에서 9까지의 「위탁의 유무」란은, 특정 기능 소속 기관이 지원의 일부를 제3자에게 위탁(등록 지원 기관에 위탁하는 경우를 제외한다)하는 경우에만 「유」라고 기재하고, 특정 기능 소속 기관이 스스로 지원을 실시하는 경우나 등록 지원 기관에 지원의 전부를 위탁하는 경우에는 「무」라고 기재하는 것.</p>","<p class=\"vi\">6 Ⅳ란 1에서 8까지의 「지원 담당자 또는 위탁을 받은 지원 실시자」란은, 특정 기능 소속 기관이 스스로 지원을 실시하는 경우나 등록 지원 기관에 지원의 전부를 위탁하는 경우에 선임하는 것이라고 되어 있는 지원 담당자를 지원 항목마다 성명 및 괄호내에 직책을 기재하고, 특정 기능 소속 기관으로부터 위탁의 일부를 받은 제3자가 지원을 실시하는 경우는 지원의 위탁을 받은 자의 성명 및 소재지를 기재할 것.</p>","<p class=\"vi\" style=\"text-indent:0.86em\">또한, Ⅳ란 9의 「지원 책임자 또는 지원 담당자」란은, 특정 기능 소속 기관이 스스로 지원을 실시하는 경우나 등록 지원 기관에 지원의 전부를 위탁하는 경우에 선임하는 것으로 되어 있는 지원 책임자 또는 지원 담당자의 성명 및 괄호 안에 직책을 기재하고, 이 중 b란 및 자유 기입란에 대해서는 동란의 지원을, 특정 기능 소속 기관으로부터 위탁의 일부를 받은 제3자가 지원을 실시하는 경우는 지원의 위탁을 받은 사람의 성명 및 소재지를 기재하는 것.</p>","<p class=\"vi\">7\tⅣ란 1부터 4까지 및 9의 「실시방법」란은 해당하는 것에 체크를 하는 것. 「기타」에 체크하는 경우는, 그 실시 방법에 대해서 괄호내에 기재하는 것.</p>","<p class=\"vi\">8\tⅣ란 3 가 d 「거실의 넓이」에 대해서, 해당하는 것을 괄호내의 체크 박스로부터 선택하는 것.</p>","<p class=\"vi\">①에서 「유」에 체크한 경우에만 ②부터 ④까지를 기재할 것.</p>","<p class=\"vi\">③은 「자기 소유 물건」 또는 「임차 물건」 중 어느 하나에 체크할 것.</p>","<p class=\"vi\">④는 예를 들어 다음 내용을 포함하여 적절히 설명할 것:</p>","<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- ③ 제공하는 숙박시설이 「자기 소유 물건」인 경우: 건축·개축 등에 든 실비, 물건의 내용연수, 입주하는 1호 특정기능 외국인의 수 등을 고려하여 합리적으로 산정된 금액</p>","<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- ③ 제공하는 숙박시설이 「임차 물건」인 경우: 해당 물건을 임차하는 데 필요한 임대료(관리비·공익비를 포함하고 보증금·사례금·예치금·중개수수료는 제외. 이하 같음)를 입주하는 1호 특정기능 외국인의 수로 나눈 금액</p>","<p class=\"vi\">9 Ⅳ란 6 나의 「대응 시간」란은, 대응 가능요일에 대해서 그 시간대를 기재하는 것.</p>"],0,1],[2263,2,1942020107,["<p class=\"vi\" style=\"padding-left:3.00em;text-indent:-3.00em\">위와 같이 지원을 실시합니다.</p>","<p class=\"vi\">또한 본 서면은 지원대상자가 충분히 이해할 수 있는 언어로 번역하여 지원대상자에게 교부함과 동시에 내용을 충분히 설명하였습니다.</p>"],0,1],[2267,1,1846093434,["<tr><td class=\"lb\"><p class=\"ja\">特定技能所属機関の氏名又は名称</p><p class=\"vi\">특정 기능 소속 기관의 성명 또는 명칭</p></td>"],0,1],[2269,1,617466521,["<tr><td class=\"lb\"><p class=\"ja\">作成責任者の氏名</p><p class=\"vi\">작성 책임자의 이름</p></td>"],0,1],[2274,2,4244995961,["<p class=\"vi\" style=\"padding-left:3.00em;text-indent:-3.00em\">서면에 대해 <span class=\"p17ul\">한국어</span>로 번역문을 교부하고 그 내용에 대해 설명을 받아 충분히 이해했습니다.</p>","<p class=\"vi\">또한 Ⅳ란 9 가 a의 정기 면담 실시 방법에 대해서도 설명을 들어 충분히 이해하였으며, 다음을 희망합니다.  <input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f408\" disabled>대면과 온라인 병용 면담  <input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f409\" disabled>대면 면담만</p>"],0,1],[2277,1,31155209,["<p class=\"vi p17sign-date\" style=\"margin-top:.1em\">서명일　${v('es_createY')||'　　'}년 ${v('es_createM')||'　'}월 ${v('es_createD')||'　'}일</p>"],0,1],[2279,1,3300998647,["<p class=\"vi\" style=\"margin-left:34%\">1호 특정 기능 외국인의 서명</p>"],0,1],[2324,3,337976243,["    if(_nat && !/韓国|大韓民国|KOREA/i.test(_nat)){","      console.warn('[1-17ko] 申請人の国籍が「'+_nat+'」ですが、この書類は韓国語版です。');","      if(typeof showTo
