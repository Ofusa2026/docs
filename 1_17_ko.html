"<td class=\"b-ttkk\" colspan=\"4\" rowspan=\"2\"><p class=\"ja a-center\">支援の中立性を確保していることの有無</p><p class=\"ja a-center\">支援責任者及び支援担当者が，支援対象者と異なる部署の職員であるなど，当該対象者に対する指揮命令権を有しない者であること、また，異なる部署であっても，当該対象者に指揮命令をし得る立場にないこと</p><p class=\"vi a-center\">Has neutrality of support been secured?</p><p class=\"vi\" style=\"padding-left:0.86em\">The person responsible for support and the person in charge of support do not have the authority to give the recipient of support orders (for example, employees in a different department from the recipient of support) or even where they are in different departments, they are not in a position where they have the authority to give the recipient of support orders.</p><p class=\"ja\" style=\"text-indent:9.00em\"><span class=\"chc\"><label class=\"opt\"><input type=\"radio\" name=\"f023\" value=\"有\" data-label=\"Ⅱ 特定技能所属機関 ＞ 名\"><span>有</span></label>　　　　　　<label class=\"opt\"><input type=\"radio\" name=\"f023\" value=\"無\" data-label=\"Ⅱ 特定技能所属機関 ＞ 名\"><span>無</span></label></span></p><p class=\"vi\" style=\"text-indent:9.00em\">Yes          No</p></td>"

"<p class=\"vi\">(Notes)</p>",
"<p class=\"vi\">1\tColumn I: If there are multiple people who are supposed to receive support and the contents of the support are the same, for “1 Name” write, “As given in the attached name list”, and attach a name list (no set format) for the matters set out in column I. This applies only where the applications are filed simultaneously.</p>",
"<p class=\"vi\">2\tColumn II-4: Fill in this section only if the organization of affiliation of the specified skilled worker itself is to implement the support plan for specified skilled workers (i).</p>",
"<p class=\"vi\">3\tColumn III: Fill in this section only when entrusting the implementation of all support plans for specified skilled workers (i) to a registered support organization.</p>",
"<p class=\"vi\">4\t“Scheduled implementation” in Column IV-1 to 9: Select the applicable items. If the scheduled implementation is “Yes”, briefly describe the implementation time; and if “No”, describe the reasons for not implementing the support in the parentheses.</p>",
"<p class=\"vi\">5 Only tick “Yes” for the “Outsourced” section in Column IV-1 to 9, if the organization of affiliation of the specified skilled worker is to entrust part of the support to a third party (excluding the cases when it is outsourced to a registered support organization). If the organization of affiliation of the specified skilled worker itself is to provide support or entrust all of the support to a registered support organization, tick “No”.</p>",
"<p class=\"vi\">6 “Support staff or implementing staff if the support is to be outsourced” in Column IV-1 to 8: If the organization of affiliation of the specified skilled worker itself is to provide support or entrust all of the support to a registered support organization, list the names of the appointed support staff, followed by their titles in parenthesis, for each type of support given. If a third party partly entrusted by the organization of affiliation of the specified skilled worker is to provide support, list the names and addresses of the staff entrusted for the support.</p>",
"<p class=\"vi\" style=\"text-indent:0.86em\">In addition, “Support manager or support staff” in Column IV-9: If the organization of affiliation of the specified skilled worker itself is to provide support or entrust all of the support to a registered support organization, list the names of the appointed support manager or support staff, followed by their titles in parenthesis, for each type of support given. In addition, if the support work described in the same column is performed by the third party partly entrusted by the organization of affiliation of the specified skilled worker, list the names and addresses of the staff entrusted for the support in column b and the free-entry column.</p>",
"<p class=\"vi\">7\t“Implementation method” in Column IV-1 to 4, 9: Select the applicable items. If you select “Others”, give the method of implementation in the parentheses.</p>",
"<p class=\"vi\">8\tWith regard to “Size of room” in IV Cell 3-A-d, select the appropriate check box from within the parentheses.</p>",
"<p class=\"vi\">Answer ② to ④ only if you have selected “Yes” in ①.</p>",
"<p class=\"vi\">For ③, tick either “Owned property” or “Rental property.”</p>",
"<p class=\"vi\">For ④, provide a proper explanation, including the following information, for example:</p>",
"<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- If ③ accommodation provided is an owned property: The amount that can be reasonably justified, considering actual costs incurred in building or renovating the property, the useful life of the property, the number of specified skilled workers occupying the property, etc.</p>",
"<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- If ③ accommodation provided is a rental property: The amount obtained by dividing the rent required for renting the property (including management charges and common area service charges but not including the security deposit, key money, guarantee money, and agent's commissions; and the same definition applies hereinafter.) by the number of specified skilled workers occupying the property.</p>",
"<p class=\"vi\">9 “Response times” in Column IV-6, B: Give the times for the available days of the week.</p>"
],
[
"<p class=\"vi\">(주의)</p>",
"<p class=\"vi\">1\tⅠ란은, 지원 대상자가 다수 있는 경우이며 지원 내용이 동일한 경우에 한해, 「1 성명」에 「별지의 명부대로」라고 기재하고, Ⅰ란의 사항이 기재된 명부(임의 양식)을 첨부하는 것으로 지장없다. 다만, 신청을 동시에 실시하는 경우에 한한다.</p>",
"<p class=\"vi\">2\tⅡ란 4는, 특정 기능 소속 기관 스스로가 1호 특정 기능 외국인 지원 계획을 실시하는 경우만 기재할 것.</p>",
"<p class=\"vi\">3\tⅢ란은, 1호 특정 기능 외국인 지원 계획의 전부의 실시를 등록 지원 기관에 위탁하는 경우만 기재할 것.</p>",
"<p class=\"vi\">4\tⅣ란 1에서 9까지의 「실시 예정」란은 해당하는 것에 체크를 하고, 실시 예정이 「유」인 경우는 실시 시기를 간결하게 기재하고, 「무」의 경우는 해당 지원을 실시하지 않는 이유에 대해서 괄호내에 기재하는 것.</p>",
"<p class=\"vi\">5 Ⅳ란 1에서 9까지의 「위탁의 유무」란은, 특정 기능 소속 기관이 지원의 일부를 제3자에게 위탁(등록 지원 기관에 위탁하는 경우를 제외한다)하는 경우에만 「유」라고 기재하고, 특정 기능 소속 기관이 스스로 지원을 실시하는 경우나 등록 지원 기관에 지원의 전부를 위탁하는 경우에는 「무」라고 기재하는 것.</p>",
"<p class=\"vi\">6 Ⅳ란 1에서 8까지의 「지원 담당자 또는 위탁을 받은 지원 실시자」란은, 특정 기능 소속 기관이 스스로 지원을 실시하는 경우나 등록 지원 기관에 지원의 전부를 위탁하는 경우에 선임하는 것이라고 되어 있는 지원 담당자를 지원 항목마다 성명 및 괄호내에 직책을 기재하고, 특정 기능 소속 기관으로부터 위탁의 일부를 받은 제3자가 지원을 실시하는 경우는 지원의 위탁을 받은 자의 성명 및 소재지를 기재할 것.</p>",
"<p class=\"vi\" style=\"text-indent:0.86em\">또한, Ⅳ란 9의 「지원 책임자 또는 지원 담당자」란은, 특정 기능 소속 기관이 스스로 지원을 실시하는 경우나 등록 지원 기관에 지원의 전부를 위탁하는 경우에 선임하는 것으로 되어 있는 지원 책임자 또는 지원 담당자의 성명 및 괄호 안에 직책을 기재하고, 이 중 b란 및 자유 기입란에 대해서는 동란의 지원을, 특정 기능 소속 기관으로부터 위탁의 일부를 받은 제3자가 지원을 실시하는 경우는 지원의 위탁을 받은 사람의 성명 및 소재지를 기재하는 것.</p>",
"<p class=\"vi\">7\tⅣ란 1부터 4까지 및 9의 「실시방법」란은 해당하는 것에 체크를 하는 것. 「기타」에 체크하는 경우는, 그 실시 방법에 대해서 괄호내에 기재하는 것.</p>",
"<p class=\"vi\">8\tⅣ란 3 가 d 「거실의 넓이」에 대해서, 해당하는 것을 괄호내의 체크 박스로부터 선택하는 것.</p>",
"<p class=\"vi\">①에서 「유」에 체크한 경우에만 ②부터 ④까지를 기재할 것.</p>",
"<p class=\"vi\">③은 「자기 소유 물건」 또는 「임차 물건」 중 어느 하나에 체크할 것.</p>",
"<p class=\"vi\">④는 예를 들어 다음 내용을 포함하여 적절히 설명할 것:</p>",
"<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- ③ 제공하는 숙박시설이 「자기 소유 물건」인 경우: 건축·개축 등에 든 실비, 물건의 내용연수, 입주하는 1호 특정기능 외국인의 수 등을 고려하여 합리적으로 산정된 금액</p>",
"<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- ③ 제공하는 숙박시설이 「임차 물건」인 경우: 해당 물건을 임차하는 데 필요한 임대료(관리비·공익비를 포함하고 보증금·사례금·예치금·중개수수료는 제외. 이하 같음)를 입주하는 1호 특정기능 외국인의 수로 나눈 금액</p>",
"<p class=\"vi\">9 Ⅳ란 6 나의 「대응 시간」란은, 대응 가능요일에 대해서 그 시간대를 기재하는 것.</p>"
