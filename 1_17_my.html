"<td class=\"b-tttk\" colspan=\"7\"><p class=\"ja\" style=\"padding-left:2.52em\">本計画の作成に当たり、地方公共団体が実施する共生社会の実現のための施策（共生施策）を確認しています。</p><p class=\"ja\" style=\"padding-left:2.52em\">共生施策を確認した地方公共団体（市区町村）名</p><p class=\"ja\" style=\"padding-left:3.78em\">・支援対象者が活動する事業所の所在地 （${_p17PlaceJa() || `${_p17fStrip('es_officePref',/[都道府県]$/)}都・道・府・県${_p17fStrip('es_officeCity',/[市区町村]$/)}市・区・町・村`}　）</p><p class=\"ja\" style=\"padding-left:6.30em\">確認日：${f('es_symY')}年${f('es_symM')}月${f('es_symD')}日　　確認方法：　<input type=\"checkbox\" class=\"cb\" id=\"f384\" name=\"f384\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> ホームページ　 <input type=\"checkbox\" class=\"cb\" id=\"f385\" name=\"f385\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> その他の方法（<input type=\"text\" class=\"bl\" id=\"f386\" name=\"f386\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜の他の方法（＿）\" style=\"width:17.00em\">）</p><p class=\"ja\" style=\"padding-left:6.30em\">備考：</p><p class=\"ja\" style=\"padding-left:3.78em\">・支援対象者の住居地</p><p class=\"ja\" style=\"padding-left:6.30em\"><!-- ver.20261104.02: 原本どおり「同上」「異なる地方公共団体」にチェック欄 --><input type=\"checkbox\" class=\"cb\" id=\"f380s\" name=\"f380s\" data-label=\"Ⅴ共生施策関係 ＞ 住居地｜同上\">同上</p><p class=\"ja\" style=\"padding-left:6.30em\"><input type=\"checkbox\" class=\"cb\" id=\"f380d\" name=\"f380d\" data-label=\"Ⅴ共生施策関係 ＞ 住居地｜異なる地方公共団体\">異なる地方公共団体（<input type=\"text\" class=\"bl\" id=\"f387\" name=\"f387\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜方公共団体（＿都・道・府・\" style=\"width:5.00em\"><span class=\"p17lbl\" data-for=\"f387\">都・道・府・県</span><input type=\"text\" class=\"bl\" id=\"f388\" name=\"f388\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜・道・府・県＿市・区・町・\" style=\"width:5.00em\"><span class=\"p17lbl\" data-for=\"f388\">市・区・町・村</span>　）</p><p class=\"ja\" style=\"padding-left:6.30em\">確認日：<input type=\"text\" class=\"bl\" id=\"f389\" name=\"f389\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜確認日：＿年 月\" style=\"width:3.50em\">年<input type=\"text\" class=\"bl\" id=\"f390\" name=\"f390\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜年＿月 日\" style=\"width:3.00em\">月<input type=\"text\" class=\"bl\" id=\"f391\" name=\"f391\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜年 月＿日 確認方\" style=\"width:3.00em\">日　　確認方法：　<input type=\"checkbox\" class=\"cb\" id=\"f392\" name=\"f392\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> ホームページ　 <input type=\"checkbox\" class=\"cb\" id=\"f393\" name=\"f393\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> その他の方法（<input type=\"text\" class=\"bl\" id=\"f394\" name=\"f394\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜の他の方法（＿）\" style=\"width:17.00em\">）</p><p class=\"ja\" style=\"padding-left:6.30em\">備考：</p><p class=\"vi\" style=\"padding-left:2.52em\">ဤစီမံကိန်းရေးဆွဲရာတွင် ဒေသန္တရအစိုးရအဖွဲ့အစည်းများမှ လုပ်ဆောင်သော အတူယှဉ်တွဲနေထိုင်သည့်လူ့ဘောင်ပေါ်ထွန်းရန်အတွက်မူဝါဒ (အတူယှဉ်တွဲနေထိုင်ရေးမူဝါဒ) ကို အတည်ပြုလျက်ရှိပါသည်။</p><p class=\"vi\" style=\"padding-left:2.52em\">အတူယှဉ်တွဲနေထိုင်ရေးမူဝါဒကို အတည်ပြုထားသည့် ဒေသန္တရအစိုးရအဖွဲ့အစည်း (မြို့နယ်ရပ်ကွက်ကျေးရွာ) အမည်</p><p class=\"ja\" style=\"padding-left:3.78em\">・အကူအညီပေးခြင်းနှင့်အကျုံးဝင်သူ လုပ်ဆောင်မည့် လုပ်ငန်း၏တည်နေရာ ${_p17PlaceFx() || `(ခရိုင် ${f('es_officePrefEn')}/Tokyo/Osaka/Hokkaido၊ မြို့နယ်ရပ်ကွက်ကျေးရွာ ${f('es_officeCityEn')})`}</p><p class=\"ja\" style=\"padding-left:6.30em\">အတည်ပြုမည့်ရက် - ${v('es_symY')||'　　'} နှစ် ${v('es_symM')||'　'} လ ${v('es_symD')||'　'} ရက်　<input type=\"hidden\" class=\"bl\" id=\"f397\" name=\"f397\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿\" style=\"width:2.75em\">အတည်ပြုမည့်နည်းလမ်း -　<input type=\"checkbox\" class=\"cb\" id=\"f398\" name=\"f398\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> ဝက်ဘ်ဆိုက်　 <input type=\"checkbox\" class=\"cb\" id=\"f399\" name=\"f399\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> အခြားနည်းလမ်း (<input type=\"text\" class=\"bl\" id=\"f400\" name=\"f400\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿)\" style=\"width:17.00em\">)</p><p class=\"vi\" style=\"padding-left:6.30em\">မှတ်ချက် -</p><p class=\"ja\" style=\"padding-left:3.78em\">・အကူအညီပေးခြင်းနှင့်အကျုံးဝင်သူ၏လိပ်စာ</p><p class=\"vi\" style=\"padding-left:6.30em\"><input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f380s\" disabled>အလားတူဖြစ်</p><p class=\"ja\" style=\"padding-left:6.30em\"><input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f380d\" disabled>မတူသောဒေသန္တရအစိုးရအဖွဲ့အစည်း <span class=\"p17gen\" data-gen=\"res\">(ခရိုင်<input type=\"text\" class=\"bl\" id=\"f401\" name=\"f401\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜(＿/Tokyo\" style=\"width:1.25em\">/Tokyo/Osaka/Hokkaido၊ မြို့နယ်ရပ်ကွက်ကျေးရွာ<input type=\"text\" class=\"bl\" id=\"f402\" name=\"f402\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿)\" style=\"width:10.25em\">)</span><span class=\"p17val\" data-val=\"res\" style=\"display:none\"></span></p><p class=\"ja\" style=\"padding-left:6.30em\">အတည်ပြုမည့်ရက် - <span data-p17d=\"y\"></span> နှစ် <span data-p17d=\"m\"></span> လ <span data-p17d=\"d\"></span> ရက်　<input type=\"hidden\" class=\"bl\" id=\"f403\" name=\"f403\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿\" style=\"width:2.75em\">အတည်ပြုမည့်နည်းလမ်း -　<input type=\"checkbox\" class=\"cb\" id=\"f404\" name=\"f404\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> ဝက်ဘ်ဆိုက်　 <input type=\"checkbox\" class=\"cb\" id=\"f405\" name=\"f405\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> အခြားနည်းလမ်း (<input type=\"text\" class=\"bl\" id=\"f406\" name=\"f406\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿)\" style=\"width:17.00em\">)</p><p class=\"vi\" style=\"padding-left:6.30em\">မှတ်ချက် -</p></td>"

"<p class=\"vi\">(Notes)</p>",
"<p class=\"vi\">1\tColumn I: If there are multiple people who are supposed to receive support and the contents of the support are the same, for “1 Name” write, “As given in the attached name list”, and attach a name list (no set format) for the matters set out in column I. This applies only where the applications are filed simultaneously.</p>",
"<p class=\"vi\">2\tColumn II-4: Fill in this section only if the organization of affiliation of the specified skilled worker itself is to implement the support plan for specified skilled workers (i).</p>",
"<p class=\"vi\">3\tColumn III: Fill in this section only when entrusting the implementation of all support plans for specified skilled workers (i) to a registered support organization.</p>",
"<p class=\"vi\">4\t“Scheduled implementation” in Column IV-1 to 9: Select the applicable items. If the scheduled implementation is “Yes”, briefly describe the implementation time; and if “No”, describe the reasons for not implementing the support in the parentheses.</p>",
"<p class=\"vi\">5 Only tick “Yes” for the “Outsourced” section in Column IV-1 to 9, if the organization of affiliation of the specified skilled worker is to entrust part of the support to a third party (excluding the cases when it is outsourced to a registered support organization). If the organization of affiliation of the specified skilled worker itself is to provide support or entrust all of the support to a registered support organization, tick “No”.</p>",
"<p class=\"vi\">6 “Support staff or implementing staff if the support is to be outsourced” in Column IV-1 to 8: If the organization of affiliation of the specified skilled worker itself is to provide support or entrust all of the support to a registered support organization, list the names of the appointed support staff, followed by their titles in parenthesis, for each type of support given. If a third party partly entrusted by the organization of affiliation of the specified skilled worker is to provide support, list the names and addresses of the staff entrusted for the support.</p>",
"<p class=\"vi\" style=\"text-indent:0.86em\">In addition, “Support manager or support staff” in Column IV-9: If the organization of affiliation of the specified skilled worker itself is to provide support or entrust all of the support to a registered support organization, list the names of the appointed support manager or support staff, followed by their titles in parenthesis, for each type of support given. In addition, if the support work described in the same column is performed by the third party partly entrusted by the organization of affiliation of the specified skilled worker, list the names and addresses of the staff entrusted for the support in column b and the free-entry column.</p>",
"<p class=\"vi\">7\t“Implementation method” in Column IV-1 to 4, 9: Select the applicable items. If you select “Others”, give the method of implementation in the parentheses.</p>",
"<p class=\"vi\">8\tWith regard to “Size of room” in IV Cell 3-A-d, select the appropriate check box from within the parentheses.</p>",
"<p class=\"vi\">Answer ② to ④ only if you have selected “Yes” in ①.</p>",
"<p class=\"vi\">For ③, tick either “Owned property” or “Rental property.”</p>",
"<p class=\"vi\">For ④, provide a proper explanation, including the following information, for example:</p>",
"<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- If ③ accommodation provided is an owned property: The amount that can be reasonably justified, considering actual costs incurred in building or renovating the property, the useful life of the property, the number of specified skilled workers occupying the property, etc.</p>",
"<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- If ③ accommodation provided is a rental property: The amount obtained by dividing the rent required for renting the property (including management charges and common area service charges but not including the security deposit, key money, guarantee money, and agent's commissions; and the same definition applies hereinafter.) by the number of specified skilled workers occupying the property.</p>",
"<p class=\"vi\">9 “Response times” in Column IV-6, B: Give the times for the available days of the week.</p>"

"<p class=\"vi\">(သတိပြုရန်)</p>",
"<p class=\"vi\">1\tအကူအညီယူမည့်သူဦးရေ တစ်ဦးထက်ပိုပြီး အကူအညီပေးရေးလုပ်ငန်းအကြောင်းအရာသည်လည်း တစ်ခုတည်းဖြစ်နေလျှင် ကော်လံ I ရှိ [၁ အမည်အပြည့်အစုံ] နေရာတွင် [သီးခြားလူစာရင်းစာရွက်အတိုင်း] ဟု ရေးသားဖော်ပြပြီး ကော်လံ I ပါကိစ္စရပ်များကို (စိတ်ကြိုက်ပုံစံဖြင့်) ရေးသားဖော်ပြထားသော လူစာရင်းကို ပူးတွဲတင်ပြ၍ ရပါသည်။ သို့သော် တစ်ချိန်တည်းလျှောက်ထားရပါမည်။</p>",
"<p class=\"vi\">2\tအထူးကျွမ်းကျင်လုပ်သားဆောင်ရွက်မည့်အဖွဲ့အစည်းကိုယ်တိုင်မှ အမှတ် ၁ နိုင်ငံခြားသားအထူးကျွမ်းကျင်လုပ်သားကူညီထောက်ပံ့ရေးအစီအစဉ်ကို ဆောင်ရွက်မှသာလျှင် ကော်လံ II ၄ ကို ဖော်ပြရမည်။</p>",
"<p class=\"vi\">3\tအမှတ် ၁ နိုင်ငံခြားသားအထူးကျွမ်းကျင်လုပ်သားကူညီထောက်ပံ့ရေးအစီအစဉ်ဆောင်ရွက်မှုအားလုံးကို မှတ်ပုံတင်ခြင်းအကူအညီပေးရေးအဖွဲ့အစည်းသို့ ကန်ထရိုက်အပ်နှံဆောင်ရွက်စေမှသာလျှင် ကော်လံ III တွင် ရေးသားဖော်ပြရမည်။</p>",
"<p class=\"vi\">4\tကော်လံ IV ရှိ နံပါတ် ၁ မှ ၉ အထိရှိသော [ဆောင်ရွက်မည့်အစီအစဉ်] ကော်လံတွင် သက်ဆိုင်သည်များအားလုံးကို အမှန်ခြစ်ပြီး ဆောင်ရွက်မည့်အစီအစဉ် [ရှိ] လျှင် ဆောင်ရွက်မည့်အချိန်ကာလကို လိုတိုရှင်း ရေးသားဖော်ပြပြီး [မရှိ] လျှင် သက်ဆိုင်ရာအကူအညီများ မပေးရသည့်အကြောင်းရင်းနှင့်ပတ်သက်၍ လက်သည်းကွင်းအတွင်း ရေးသားဖော်ပြရမည်။</p>",
"<p class=\"vi\">5 ကော်လံ IV ရှိ နံပါတ် ၁ မှ ၉ အထိရှိသော [ကန်ထရိုက်ပေး၊မပေး] ကော်လံတွင် အထူးကျွမ်းကျင်လုပ်သားဆောင်ရွက်မည့်အဖွဲ့အစည်းမှ အကူအညီပေးရေးလုပ်ငန်းတစ်စိတ်တစ်ဒေသကို အခြားသူထံ ကန်ထရိုက် (မှတ်ပုံတင်ခြင်းအကူအညီပေးရေးအဖွဲ့အစည်းထံ ကန်ထရိုက်အပ်နှံဆောင်ရွက်ထားခြင်းကို ချန်လှပ်သည်။) အပ်နှံထားသည့်အခါတွင်သာလျှင် [ပေး] ဟုရေးသားဖော်ပြပြီး၊ အထူးကျွမ်းကျင်လုပ်သားဆောင်ရွက်မည့်အဖွဲ့အစည်းမှ ကိုယ်တိုင်အကူအညီပေးရေးလုပ်ငန်းကို ဆောင်ရွက်ပေးသည့်အခါနှင့် မှတ်ပုံတင်ခြင်းအကူအညီပေးရေးအဖွဲ့အစည်းထံ အကူအညီပေးရေးလုပ်ငန်းအားလုံးကို ကန်ထရိုက်အပ်နှံထားသည့်အခါတွင် [မပေး] ဟုရေးသားဖော်ပြရမည်။</p>",
"<p class=\"vi\">6 ကော်လံ IV ရှိ နံပါတ် ၁ မှ ၈ အထိရှိသော [အကူအညီပေးရေးတာဝန်ယူလုပ်ကိုင်သူ သို့မဟုတ် ကန်ထရိုက်ယူ၍ဆောင်ရွက်သူ] ကော်လံတွင် အထူးကျွမ်းကျင်လုပ်သားဆောင်ရွက်မည့်အဖွဲ့အစည်းမှ ကိုယ်တိုင်အကူအညီပေးရေးလုပ်ငန်းကို ဆောင်ရွက်ပေးသည့်အခါနှင့် မှတ်ပုံတင်ခြင်းအကူအညီပေးရေးအဖွဲ့အစည်းထံ အကူအညီပေးရေးလုပ်ငန်းအားလုံးကို ကန်ထရိုက်အပ်နှံထားသည့်အခါကို ရွေးချယ်ထားသည်ဆိုလျှင် အကူအညီပေးရေးလုပ်ငန်းအသီးသီးအလိုက် တာဝန်ရှိသူအမည်နှင့် လက်သည်းကွင်းအတွင်း ရာထူးကိုရေးသားဖော်ပြပြီး၊ အထူးကျွမ်းကျင်လုပ်သားဆောင်ရွက်မည့်အဖွဲ့အစည်းမှ အကူအညီပေးရေးလုပ်ငန်းတစ်စိတ်တစ်ဒေသကို လက်ခံထားသည့်အခြားသူမှ အကူအညီပေးရေးလုပ်ငန်းဆောင်ရွက်မည်ဆိုပါက အကူအညီပေးရေးလုပ်ငန်း ကန်ထရိုက်ယူ၍ဆောင်ရွက်သူအမည်နှင့် နေရပ်လိပ်စာကို ရေးသားဖော်ပြရမည်။</p>",
"<p class=\"vi\" style=\"text-indent:0.86em\">ထို့အပြင် ကော်လံ IV-9 ရှိ [ပံ့ပိုးကူညီမှုတာဝန်ခံ သို့မဟုတ် ပံ့ပိုးကူညီသူဝန်ထမ်း] ကော်လံသည် အထူးကျွမ်းကျင်လုပ်သားများဆိုင်ရာအဖွဲ့အစည်းများမှ ကိုယ်တိုင်ပံ့ပိုးကူညီမှုကိုပြုလုပ်ခြင်းနှင့် စာရင်းသွင်းထားသော ပံ့ပိုးသည့်အဖွဲ့အစည်းများသို့ ပံ့ပိုးကူညီမှုအလုံးစုံကို အပ်နှံထားခြင်းတို့မှ ရွေးချယ်ခန့်အပ်ထားသည့် ပံ့ပိုးကူညီမှုတာဝန်ခံ သို့မဟုတ် ပံ့ပိုးကူညီသူဝန်ထမ်းများ၏ အမည်နာမနှင့် လက်သည်းကွင်းအတွင်းတွင် ရာထူးတာဝန်ကိုပါ ဖော်ပြရပါမည်။ ကော်လံ b သို့မဟုတ် လွတ်လပ်စွာဖြည့်စွက်နိုင်သည့် ကော်လံတွင်မူ တူညီသောကော်လံမှ ပံ့ပိုးကူညီမှု၊ အထူးကျွမ်းကျင်လုပ်သားများဆိုင်ရာ အဖွဲ့အစည်းမှ အပ်နှံထားသည့် တစ်စိတ်တစ်ပိုင်းကိုလက်ခံထားသည့် တတိယပုဂ္ဂိုလ်က ပံ့ပိုးကူညီမှုကို ဆောင်ရွက်သည့်အခါ အဆိုပါလက်ခံဆောင်ရွက်သူ၏ အမည်နာမနှင့် နေရပ်လိပ်စာကို ဖြည့်စွက်ရပါမည်။</p>",
"<p class=\"vi\">7\tကော်လံ IV ရှိ နံပါတ် ၁ မှ ၄ အထိနှင့် ၉ ရှိ [ဆောင်ရွက်ပုံနည်းလမ်း] ကော်လံတွင် သက်ဆိုင်သည်များကို အမှန်ခြစ်ရမည်။ [အခြား] ကို အမှန်ခြစ်ပါက ထိုဆောင်ရွက်ပုံနည်းလမ်းကို လက်သည်းကွင်းအတွင်း ရေးသားပြရမည်။</p>",
"<p class=\"vi\">8\tကော်လံ IV ရှိ နံပါတ် ၃ - က - ဃ ပါ [အခန်းအကျယ်အဝန်း] နှင့်ပတ်သက်၍ ကိုက်ညီမှုရှိသည့်အရာကို ကွင်းခတ်ထားသည့် ချက်ဘောက်ထဲမှ ရွေးချယ်ပေးရမည်။</p>",
"<p class=\"vi\">② မှ ④ အထိကို ① တွင် ရှိသည်ဟု အမှန်ခြစ်ထားခဲ့သည့်အခါ၌သာ ဖော်ပြရပါမည်။</p>",
"<p class=\"vi\">③ ကို [ကိုယ်ပိုင်အဆောက်အဦ]၊ [ငှားရမ်းထားသည့်အဆောက်အဦ] တစ်ခုခုတွင် အမှန်ခြစ်ပြုလုပ်ရပါမည်။</p>",
"<p class=\"vi\">④ ကို ဥပမာအားဖြင့် အောက်ပါကဲ့သို့သော ရှုထောင့်မှဖော်ပြရမည်ဖြစ်ပြီး ရှင်းလင်းချက်ကို လျော်ကန်အောင် လုပ်ဆောင်ရပါမည်။</p>",
"<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- ③ သည် [ကိုယ်ပိုင်အဆောက်အဦ] ဖြစ်ပါက - အမှန်တကယ်ဆောက်လုပ်ခြင်း၊ မွမ်းမံခြင်းတို့ လုပ်ရာ၌ လိုအပ်သောကုန်ကျစရိတ်၊ အဆောက်အဦ၏ခံနိုင်ရည်ရှိသည့်နှစ်အရေအတွက်၊ နေထိုင်မည့် နိုင်ငံခြားသား အထူးကျွမ်းကျင်လုပ်သားဦးရေစသည်တို့ကို ထည့်သွင်းစဉ်းစားပြီး ဆီလျော်မှုရှိကြောင်းရှင်းပြနိုင်သော ပမာဏ</p>",
"<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- ③ သည် [ငှားရမ်းထားသည့်အဆောက်အဦ] ဖြစ်ပါက - ငှားရမ်းရာ၌လိုအပ်မည့် ငှားရမ်းခ (စီမံထိန်းသိမ်းစရိတ်၊ စုပေါင်းကျခံရသောစရိတ်စသည်တို့အပါအဝင်၊ စပေါ်၊ ပွဲခ၊ အာမခံကြေး၊ ပွဲစားခစသည်တို့မပါဝင်ပါ။ အောက်တွင် အလားတူဖြစ်။) ကို နေထိုင်မည့် နိုင်ငံခြားသား အထူးကျွမ်းကျင်လုပ်သားဦးရေဖြင့် စားထားသောပမာဏ</p>",
"<p class=\"vi\">9 ဖြေရှင်းဆောင်ရွက်ပေးနိုင်သောနေ့ရက်များနှင့်ပတ်သက်၍ ထိုနေ့ရက်ကာလအပိုင်းအခြားကို ကော်လံ IV ရှိ နံပါတ် ၆ - ခ ပါ [ဖြေရှင်းဆောင်ရွက်ပေးမည့်အချိန်] ကော်လံတွင် ရေးသားဖော်ပြရမည်။</p>"

"<p class=\"vi\">ထို့အပြင် ကော်လံ IV ရှိ နံပါတ် ၉ - က - က ပါ ပုံသေကာလအလိုက် တွေ့ဆုံမှုပြုသည့်နည်းလမ်းနှင့်ပတ်သက်ပြီး ရှင်းပြသည်တို့ကိုခံယူကာ အဆိုပါ အကြောင်းအရာများကို အပြည့်အဝ နားလည်သဘောပေါက်ထားပြီး  <input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f408\" disabled>မျက်နှာချင်းဆိုင်နှင့် အွန်လိုင်းမှတွေ့ခြင်းနှစ်မျိုးလုံး  <input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f409\" disabled>မျက်နှာချင်းဆိုင်တွေ့ခြင်းသာ  တို့ဖြင့် လုပ်ဆောင်ရန် အလိုရှိပါသည်။</p>"
