လုပ်နည်းဆိုင်ရာ ကိစ္စရပ်များနှင့် လိုအပ်သလို လိုက်ပါဆောင်ရွက်ပြီး လုပ်ထုံးလုပ်နည်းများကို ကူညီပေးခြင်း</p></td>"],0,1],[1831,1,2222434627,["<td class=\"b-nttt\"><p class=\"ja\" style=\"padding-left:2.00em;text-indent:-1.00em\">ｃ．相談・苦情の連絡先，申出をすべき国又は地方公共団体の機関の連絡先</p><p class=\"vi\">တိုင်ပင်ဆွေးနွေးခြင်းနှင့် တိုင်ကြားခြင်းအတွက် ဆက်သွယ်ရမည့်လိပ်စာ၊ ၎င်းတို့ကို တင်ပြလျှောက်ထားရမည့် နိုင်ငံ သို့မဟုတ် ဒေသတွင်း ပြည်သူပိုင်အဖွဲ့အစည်းများထံသို့ ဆက်သွယ်ရမည့်လိပ်စာ</p></td>"],0,1],[1844,4,485439812,["<td class=\"b-hknt vert\" rowspan=\"8\"><p class=\"ja a-center\" style=\"padding-left:0.63em\">Ⅳ　支援内容（続き）</p><p class=\"vi a-center\" style=\"padding-left:0.63em\">IV. အကူအညီပေးရေးအကြောင်းအရာ (အဆက်)</p></td>","<td class=\"b-httt vert\" rowspan=\"6\"><p class=\"ja a-center\" style=\"padding-left:0.63em\">４　生活オリエンテーションの実施（続き）</p><p class=\"vi a-center\" style=\"padding-left:0.63em\">4. ရှင်သန်နေထိုင်ရေး နေသားကျစေရန် ဆောင်ရွက်ခြင်း</p></td>","<td class=\"b-httt vert\" rowspan=\"4\"><p class=\"ja a-center\" style=\"padding-left:0.63em\">ア　情報提供内容等（続き）</p><p class=\"vi a-center\" style=\"padding-left:0.63em\">A. ထုတ်ပြန်ပေးသော သတင်းအချက်အလက်အကြောင်းအရာ စသည် (အဆက်)</p></td>","<td class=\"b-httt\"><p class=\"ja\" style=\"padding-left:2.00em;text-indent:-1.00em\">ｄ．十分に理解することができる言語により医療を受けることができる医療機関に関する事項</p><p class=\"vi\">အပြည့်အဝနားလည်နိုင်သော ဘာသာစကားဖြင့် ဆေးကုသမှုခံယူနိုင်သော ဆေးကုသရေးအဖွဲ့အစည်းများဆိုင်ရာ ကိစ္စရပ်များ</p></td>"],0,1],[1850,1,3083627127,["<td class=\"b-nttt fld\" rowspan=\"3\"><p class=\"ja a-center\">別紙参照</p><p class=\"vi a-center\">ပူးတွဲစာရွက်ကို ကြည့်ပါ။</p></td>"],0,1],[1855,1,262496505,["<td class=\"b-tttt\"><p class=\"ja\" style=\"padding-left:2.00em;text-indent:-1.00em\">ｅ．防災・防犯に関する事項，急病その他の緊急時における対応に必要な事項</p><p class=\"vi\">သဘာဝဘေးနှင့် ရာဇဝတ်မှုကာကွယ်ခြင်းဆိုင်ရာ ကိစ္စရပ်များ၊ ရုတ်တရက်ဖျားနာခြင်းအပြင် အရေးပေါ်ဖြစ်ပွားချိန်တွင် ဖြေရှင်းဆောင်ရွက်ရန် လိုအပ်သောကိစ္စရပ်များ</p></td>"],0,1],[1858,1,2318424075,["<td class=\"b-tttt\"><p class=\"ja\" style=\"padding ndent:-1.00em\">ａ．１号特定技能外国人の労働状況や生活状況を確認するため，当該外国人及びその監督をする立場にある者それぞれと定期的な面談（3か月に1回以上）を実施する</p><p class=\"vi\">အမှတ် ၁ နိုင်ငံခြားသားအထူးကျွမ်းကျင်လုပ်သား၏ အလုပ်လုပ်မှုအခြေအနေနှင့် ရှင်သန်နေထိုင်ရေးအခြေအနေကို စစ်ဆေးအတည်ပြုရန် သက်ဆိုင်ရာ နိုင်ငံခြားသား၊ ၎င်း၏ကြီးကြပ်သူအသီးသီးတို့နှင့် (၃ လလျှင် ၁ ကြိမ်နှင့်အထက်) ပုံမှန် တွေ့ဆုံမေးမြန်းရမည်။</p></td>","<td class=\"b-tttt\"><p class=\"ja a-center\"><input type=\"checkbox\" class=\"cb\" id=\"f353\" name=\"f353\" data-label=\"Ⅳ 支援内容（続き） ＞ ａ．１号特定技能外国人の労働状況や生活状況を確認するため，当\">有（${f('es_meetSchedule')}）</p><p class=\"vi\"> ရှိ (${_p17TrOr('es_meetSchedule','&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;')})</p><p class=\"ja a-center\"><input type=\"checkbox\" class=\"cb\" id=\"f355\" name=\"f355\" data-label=\"Ⅳ 支援内容（続き） ＞ ａ．１号特定技能外国人の労働状況や生活状況を確認するため，当\">無（<input type=\"text\" class=\"bl\" id=\"f356\" name=\"f356\" data-label=\"Ⅳ 支援内容（続き） ＞ ａ．１号特定技能外国人の労働状況や生活状況を確認するため，当｜無（＿）\" style=\"width:9.00em\">）</p><p class=\"vi\">မရှိ (                 )</p></td>","<td class=\"b-ttnt\"><p class=\"ja a-center\">無</p><p class=\"vi a-center\">မရှိ</p></td>","<td class=\"b-tttt fld\"><p class=\"ja a-center\">別紙参照</p><p class=\"vi a-center\">ပူးတွဲစာရွက်ကို ကြည့်ပါ။</p></td>"],0,1],[2180,5,437522589,["<td class=\"b-tttk\"><p class=\"ja\"><input type=\"checkbox\" class=\"cb\" id=\"f360\" name=\"f360\" data-label=\"Ⅳ 支援内容（続き） ＞ 有・無\">　対面 မျက်နှာချင်းဆိုင်</p><p class=\"ja\" style=\"padding-left:3.39em;text-indent:-1.69em\"><input type=\"checkbox\" class=\"cb\" id=\"f361\" name=\"f361\" data-label=\"Ⅳ 支援内容（続き） ＞ 有・無\">　対面とオンラインで実施","မျက်နှာချင်းဆိုင်နှင့် အွန်လိုင်းဖြင့် လုပ်ဆောင်ခြင်း</p><p class=\"ja\" style=\"padding-left:2.14em;text-indent:-1.07em\">※次の場合は対面で面談を実施","အောက်ပါအခြေအနေဖြစ်ပါက မျက်နှာချင်းဆိုင် တွေ့ဆုံမှု လုပ်ဆောင်ခြင်း</p><p class=\"ja\" style=\"padding-left:2.63em;text-indent:-1.09em\">・面談対象者がオンライン面談に同意していない","အွန်လိုင်းမှတွေ့ဆုံခြင်းကို တွေ့ဆုံမည့်သူမှ သဘောမတူခြင်း</p><p class=\"ja\" style=\"padding-left:2.63em;text-indent:-1.09em\">・面談対象者が対面の面談を希望","တွေ့ဆုံမည့်သူသည် မျက်နှာချင်းဆိုင်တွေ့ဆုံရန် လိုလားခြင်း</p><p class=\"ja\"><input type=\"checkbox\" class=\"cb\" id=\"f362\" name=\"f362\" data-label=\"Ⅳ 支援内容（続き） ＞ 有・無\">　無線や船舶電話（漁船漁業のみ）</p><p class=\"vi\" style=\"padding-left:1.19em\">ကြိုးမဲ့ သို့မဟုတ် သင်္ဘောဖုန်း (ရေလုပ်ငန်းလုပ်သားများသာ)</p></td>"],0,1],[2187,1,1573578129,["<td class=\"b-tttt\"><p class=\"ja\" style=\"padding-left:2.00em;text-indent:-1.00em\">ｂ．再確認のため，生活オリエンテーションにおいて提供した情報について，改めて提供する</p><p class=\"vi\">ထပ်မံစစ်ဆေးအတည်ပြုရန် ရှင်သန်နေထိုင်ရေးနေသားကျစေရန် ပေးအပ်ထားသော သတင်းအချက်အလက်များနှင့် ပတ်သက်၍ အသစ်တဖန် ပေးအပ်ရမည်။</p></td>"],0,1],[2195,2,447853142,["<td class=\"b-tttt\"><p class=\"ja\" style=\"padding-left:2.00em;text-indent:-1.00em\">ｃ．労働基準法その他の労働に関する法令の規定に違反していることを知ったときは，労働基準監督署その他の関係行政機関へ通報する</p><p class=\"vi\">အလုပ်သမားစံသတ်မှတ်ချက်ဥပဒေအပြင် အခြားအလုပ်သမားဆိုင်ရာ ဥပဒေပြဋ္ဌာန်းချက်များ ချိုးဖောက်ကြောင်းတွေ့ရှိလျှင် အလုပ်သမားစံသတ်မှတ်ချက်ကြီးကြပ်ရေးမှူးအပြင် အခြားသက်ဆိုင်ရာအုပ်ချုပ်ရေးအဖွဲ့အစည်းများကိုပါ သတင်းပို့ရမည်။</p></td>","<td class=\"b-tttt\" rowspan=\"2\"><p class=\"ja\"><input type=\"checkbox\" class=\"cb\" id=\"f368\" name=\"f368\" data-label=\"Ⅳ 支援内容（続き） ＞ ｃ．労働基準法その他の労働に関する法令の規定に違反しているこ\">有（認知次第実施）</p><p class=\"vi\"> ရှိ (အသိအမှတ်ပြုပြီးသည်နှင့် ဆောင်ရွက်ခြင်း)</p><p class=\"ja\"><input type=\"checkbox\" class=\"cb\" id=\"f369\" name=\"f369\" data-label=\"Ⅳ 支援内容（続き） ＞ ｃ．労働基準法その他の労働に関する法令の規定に違反しているこ\">無（<input type=\"text\" class=\"bl\" id=\"f370\" name=\"f370\" data-label=\"Ⅳ 支援内容（続き） ＞ ｃ．労働基準法その他の労働に関する法令の規定に違反しているこ｜無（＿）\" style=\"width:9.00em\">）</p><p class=\"vi\">မရှိ (                 )</p></td>"],0,1],[2198,1,2900127609,["<td class=\"b-nttt cont\" rowspan=\"2\"><!-- ver.20261104.01: 通報の担当者 --><p class=\"ja a-center\">別紙参照</p><p class=\"vi a-center\">ပူးတွဲစာရွက်ကို ကြည့်ပါ။</p></td>"],0,1],[2203,1,3700974454,["<td class=\"b-tttt\"><p class=\"ja\" style=\"padding-left:2.00em;text-indent:-1.00em\">ｄ．資格外活動等の入管法違反又は旅券及び在留カードの取上げ等その他の問題の発生を知ったときは，その旨を地方出入国在留管理局に通報する</p><p class=\"vi\">သတ်မှတ်ဖော်ပြပါကျွမ်းကျင်မှုအရည်အချင်းနှင့်မဆိုင်သော လှုပ်ရှားဆောင်ရွက်မှု စသည် လူဝင်မှုကြီးကြပ်ရေးဥပဒေချိုးဖောက်ခြင်း သို့မဟုတ် ပတ်စ်ပို့နှင့် နေထိုင်ခွင့်ကဒ်သိမ်းယူခြင်း စသည် အခြားပြဿနာများ ဖြစ်ပွားမှုကို သိရှိလျှင် ထိုကိစ္စကို ဒေသခံလူဝင်မှုကြီးကြပ်ရေးနှင့် နေထိုင်ရေးစီမံခန့်ခွဲမှုရုံးသို့ သတင်းပို့ရမည်။</p></td>"],0,1],[2206,4,410412277,["<td class=\"b-tttt\"><p class=\"ja\">（自由記入）</p><p class=\"vi\"> (လွတ်လပ်စွာရေးဖြည့်ပါ။)</p></td>","<td class=\"b-tttt\"><p class=\"ja a-center\"><input type=\"checkbox\" class=\"cb\" id=\"f371\" name=\"f371\" data-label=\"Ⅳ 支援内容（続き） ＞ （自由記入）\">有（<input type=\"text\" class=\"bl\" id=\"f372\" name=\"f372\" data-label=\"Ⅳ 支援内容（続き） ＞ （自由記入）｜有（＿）\" style=\"width:9.00em\">）</p><p class=\"vi\"> ရှိ (                   )</p><p class=\"ja a-center\"><input type=\"checkbox\" class=\"cb\" id=\"f373\" name=\"f373\" data-label=\"Ⅳ 支援内容（続き） ＞ （自由記入）\">無（<input type=\"text\" class=\"bl\" id=\"f374\" name=\"f374\" data-label=\"Ⅳ 支援内容（続き） ＞ （自由記入）｜無（＿）\" style=\"width:9.00em\">）</p><p class=\"vi\">မရှိ (                 )</p></td>","<td class=\"b-tttt\"><p class=\"ja a-center\">無</p><p class=\"vi a-center\">မရှိ</p></td>","<td class=\"b-tttt fld\"><p class=\"ja a-center\">別紙参照</p><p class=\"vi a-center\">ပူးတွဲစာရွက်ကို ကြည့်ပါ။</p></td>"],0,1],[2214,2,4169505430,["<td class=\"b-tttt\" colspan=\"2\"><p class=\"ja\">イ　実施言語</p><p class=\"vi\"> B. ဆောင်ရွက်မည့်ဘာသာစကား</p></td>","<td class=\"b-tttk\" colspan=\"5\"><!-- ver.20261030.01: 1-イと同じく、ミャンマー語版なので実施言語を固定し、通訳者は別紙の名簿を参照する。 --><p class=\"ja\" style=\"padding-left:0.06em\">ミャンマー語　（支援担当者以外の者が通訳を担う場合）通訳者の所属・氏名　　別紙参照</p><p class=\"vi\">မြန်မာဘာသာ\t(အကူအညီပေးရေးတာဝန်ခံမဟုတ်သူမှ စကားပြန်လုပ်ပေးခြင်းဖြစ်ပါက) စကားပြန်ပေးသူ၏ အဖွဲ့အစည်းနှင့်အမည်　ပူးတွဲစာရွက်ကို ကြည့်ပါ။</p></td>"],0,1],[2222,2,353320171,["<td class=\"b-tktt vert\" colspan=\"2\"><p class=\"ja a-center\" style=\"padding-left:0.63em\">Ⅴ共生施策関係</p><p class=\"vi a-center\" style=\"padding-left:0.63em\">V. အတူယှဉ်တွဲနေထိုင်ရေးမူဝါဒနှင့် ဆက်နွယ်မှု</p></td>","<td class=\"b-tttk\" colspan=\"7\"><p class=\"ja\" style=\"padding-left:2.52em\">本計画の作成に当たり、地方公共団体が実施する共生社会の実現のための施策（共生施策）を確認しています。</p><p class=\"ja\" style=\"padding-left:2.52em\">共生施策を確認した地方公共団体（市区町村）名</p><p class=\"ja\" style=\"padding-left:3.78em\">・支援対象者が活動する事業所の所在地 （${_p17PlaceJa() || `${_p17fStrip('es_officePref',/[都道府県]$/)}都・道・府・県${_p17fStrip('es_officeCity',/[市区町村]$/)}市・区・町・村`}　）</p><p class=\"ja\" style=\"padding-left:6.30em\">確認日：${f('es_symY')}年${f('es_symM')}月${f('es_symD')}日　　確認方法：　<input type=\"checkbox\" class=\"cb\" id=\"f384\" name=\"f384\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> ホームページ　 <input type=\"checkbox\" class=\"cb\" id=\"f385\" name=\"f385\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> その他の方法（<input type=\"text\" class=\"bl\" id=\"f386\" name=\"f386\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜の他の方法（＿）\" style=\"width:17.00em\">）</p><p class=\"ja\" style=\"padding-left:6.30em\">備考：</p><p class=\"ja\" style=\"padding-left:3.78em\">・支援対象者の住居地</p><p class=\"ja\" style=\"padding-left:6.30em\"><!-- ver.20261104.02: 原本どおり「同上」「異なる地方公共団体」にチェック欄 --><input type=\"checkbox\" class=\"cb\" id=\"f380s\" name=\"f380s\" data-label=\"Ⅴ共生施策関係 ＞ 住居地｜同上\">同上</p><p class=\"ja\" style=\"padding-left:6.30em\"><input type=\"checkbox\" class=\"cb\" id=\"f380d\" name=\"f380d\" data-label=\"Ⅴ共生施策関係 ＞ 住居地｜異なる地方公共団体\">異なる地方公共団体（<input type=\"text\" class=\"bl\" id=\"f387\" name=\"f387\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜方公共団体（＿都・道・府・\" style=\"width:5.00em\"><span class=\"p17lbl\" data-for=\"f387\">都・道・府・県</span><input type=\"text\" class=\"bl\" id=\"f388\" name=\"f388\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜・道・府・県＿市・区・町・\" style=\"width:5.00em\"><span class=\"p17lbl\" data-for=\"f388\">市・区・町・村</span>　）</p><p class=\"ja\" style=\"padding-left:6.30em\">確認日：<input type=\"text\" class=\"bl\" id=\"f389\" name=\"f389\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜確認日：＿年 月\" style=\"width:3.50em\">年<input type=\"text\" class=\"bl\" id=\"f390\" name=\"f390\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜年＿月 日\" style=\"width:3.00em\">月<input type=\"text\" class=\"bl\" id=\"f391\" name=\"f391\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜年 月＿日 確認方\" style=\"width:3.00em\">日　　確認方法：　<input type=\"checkbox\" class=\"cb\" id=\"f392\" name=\"f392\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> ホームページ　 <input type=\"checkbox\" class=\"cb\" id=\"f393\" name=\"f393\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> その他の方法（<input type=\"text\" class=\"bl\" id=\"f394\" name=\"f394\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜の他の方法（＿）\" style=\"width:17.00em\">）</p><p class=\"ja\" style=\"padding-left:6.30em\">備考：</p><p class=\"vi\" style=\"padding-left:2.52em\">ဤစီမံကိန်းရေးဆွဲရာတွင် ဒေသန္တရအစိုးရအဖွဲ့အစည်းများမှ လုပ်ဆောင်သော အတူယှဉ်တွဲနေထိုင်သည့်လူ့ဘောင်ပေါ်ထွန်းရန်အတွက်မူဝါဒ (အတူယှဉ်တွဲနေထိုင်ရေးမူဝါဒ) ကို အတည်ပြုလျက်ရှိပါသည်။</p><p class=\"vi\" style=\"padding-left:2.52em\">အတူယှဉ်တွဲနေထိုင်ရေးမူဝါဒကို အတည်ပြုထားသည့် ဒေသန္တရအစိုးရအဖွဲ့အစည်း (မြို့နယ်ရပ်ကွက်ကျေးရွာ) အမည်</p><p class=\"ja\" style=\"padding-left:3.78em\">・အကူအညီပေးခြင်းနှင့်အကျုံးဝင်သူ လုပ်ဆောင်မည့် လုပ်ငန်း၏တည်နေရာ ${_p17PlaceFx() || `(ခရိုင် ${f('es_officePrefEn')}/Tokyo/Osaka/Hokkaido၊ မြို့နယ်ရပ်ကွက်ကျေးရွာ ${f('es_officeCityEn')})`}</p><p class=\"ja\" style=\"padding-left:6.30em\">အတည်ပြုမည့်ရက် - ${v('es_symY')||'　　'} နှစ် ${v('es_symM')||'　'} လ ${v('es_symD')||'　'} ရက်　<input type=\"hidden\" class=\"bl\" id=\"f397\" name=\"f397\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿\" style=\"width:2.75em\">အတည်ပြုမည့်နည်းလမ်း -　<input type=\"checkbox\" class=\"cb\" id=\"f398\" name=\"f398\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> ဝက်ဘ်ဆိုက်　 <input type=\"checkbox\" class=\"cb\" id=\"f399\" name=\"f399\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> အခြားနည်းလမ်း (<input type=\"text\" class=\"bl\" id=\"f400\" name=\"f400\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿)\" style=\"width:17.00em\">)</p><p class=\"vi\" style=\"padding-left:6.30em\">မှတ်ချက် -</p><p class=\"ja\" style=\"padding-left:3.78em\">・အကူအညီပေးခြင်းနှင့်အကျုံးဝင်သူ၏လိပ်စာ</p><p class=\"vi\" style=\"padding-left:6.30em\"><input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f380s\" disabled>အလားတူဖြစ်</p><p class=\"ja\" style=\"padding-left:6.30em\"><input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f380d\" disabled>မတူသောဒေသန္တရအစိုးရအဖွဲ့အစည်း <span class=\"p17gen\" data-gen=\"res\">(ခရိုင်<input type=\"text\" class=\"bl\" id=\"f401\" name=\"f401\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜(＿/Tokyo\" style=\"width:1.25em\">/Tokyo/Osaka/Hokkaido၊ မြို့နယ်ရပ်ကွက်ကျေးရွာ<input type=\"text\" class=\"bl\" id=\"f402\" name=\"f402\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿)\" style=\"width:10.25em\">)</span><span class=\"p17val\" data-val=\"res\" style=\"display:none\"></span></p><p class=\"ja\" style=\"padding-left:6.30em\">အတည်ပြုမည့်ရက် - <span data-p17d=\"y\"></span> နှစ် <span data-p17d=\"m\"></span> လ <span data-p17d=\"d\"></span> ရက်　<input type=\"hidden\" class=\"bl\" id=\"f403\" name=\"f403\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿\" style=\"width:2.75em\">အတည်ပြုမည့်နည်းလမ်း -　<input type=\"checkbox\" class=\"cb\" id=\"f404\" name=\"f404\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> ဝက်ဘ်ဆိုက်　 <input type=\"checkbox\" class=\"cb\" id=\"f405\" name=\"f405\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> အခြားနည်းလမ်း (<input type=\"text\" class=\"bl\" id=\"f406\" name=\"f406\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿)\" style=\"width:17.00em\">)</p><p class=\"vi\" style=\"padding-left:6.30em\">မှတ်ချက် -</p></td>"],0,1],[2244,16,2543715452,["<p class=\"vi\">(သတိပြုရန်)</p>","<p class=\"vi\">1\tအကူအညီယူမည့်သူဦးရေ တစ်ဦးထက်ပိုပြီး အကူအညီပေးရေးလုပ်ငန်းအကြောင်းအရာသည်လည်း တစ်ခုတည်းဖြစ်နေလျှင် ကော်လံ I ရှိ [၁ အမည်အပြည့်အစုံ] နေရာတွင် [သီးခြားလူစာရင်းစာရွက်အတိုင်း] ဟု ရေးသားဖော်ပြပြီး ကော်လံ I ပါကိစ္စရပ်များကို (စိတ်ကြိုက်ပုံစံဖြင့်) ရေးသားဖော်ပြထားသော လူစာရင်းကို ပူးတွဲတင်ပြ၍ ရပါသည်။ သို့သော် တစ်ချိန်တည်းလျှောက်ထားရပါမည်။</p>","<p class=\"vi\">2\tအထူးကျွမ်းကျင်လုပ်သားဆောင်ရွက်မည့်အဖွဲ့အစည်းကိုယ်တိုင်မှ အမှတ် ၁ နိုင်ငံခြားသားအထူးကျွမ်းကျင်လုပ်သားကူညီထောက်ပံ့ရေးအစီအစဉ်ကို ဆောင်ရွက်မှသာလျှင် ကော်လံ II ၄ ကို ဖော်ပြရမည်။</p>","<p class=\"vi\">3\tအမှတ် ၁ နိုင်ငံခြားသားအထူးကျွမ်းကျင်လုပ်သားကူညီထောက်ပံ့ရေးအစီအစဉ်ဆောင်ရွက်မှုအားလုံးကို မှတ်ပုံတင်ခြင်းအကူအညီပေးရေးအဖွဲ့အစည်းသို့ ကန်ထရိုက်အပ်နှံဆောင်ရွက်စေမှသာလျှင် ကော်လံ III တွင် ရေးသားဖော်ပြရမည်။</p>","<p class=\"vi\">4\tကော်လံ IV ရှိ နံပါတ် ၁ မှ ၉ အထိရှိသော [ဆောင်ရွက်မည့်အစီအစဉ်] ကော်လံတွင် သက်ဆိုင်သည်များအားလုံးကို အမှန်ခြစ်ပြီး ဆောင်ရွက်မည့်အစီအစဉ် [ရှိ] လျှင် ဆောင်ရွက်မည့်အချိန်ကာလကို လိုတိုရှင်း ရေးသားဖော်ပြပြီး [မရှိ] လျှင် သက်ဆိုင်ရာအကူအညီများ မပေးရသည့်အကြောင်းရင်းနှင့်ပတ်သက်၍ လက်သည်းကွင်းအတွင်း ရေးသားဖော်ပြရမည်။</p>","<p class=\"vi\">5 ကော်လံ IV ရှိ နံပါတ် ၁ မှ ၉ အထိရှိသော [ကန်ထရိုက်ပေး၊မပေး] ကော်လံတွင် အထူးကျွမ်းကျင်လုပ်သားဆောင်ရွက်မည့်အဖွဲ့အစည်းမှ အကူအညီပေးရေးလုပ်ငန်းတစ်စိတ်တစ်ဒေသကို အခြားသူထံ ကန်ထရိုက် (မှတ်ပုံတင်ခြင်းအကူအညီပေးရေးအဖွဲ့အစည်းထံ ကန်ထရိုက်အပ်နှံဆောင်ရွက်ထားခြင်းကို ချန်လှပ်သည်။) အပ်နှံထားသည့်အခါတွင်သာလျှင် [ပေး] ဟုရေးသားဖော်ပြပြီး၊ အထူးကျွမ်းကျင်လုပ်သားဆောင်ရွက်မည့်အဖွဲ့အစည်းမှ ကိုယ်တိုင်အကူအညီပေးရေးလုပ်ငန်းကို ဆောင်ရွက်ပေးသည့်အခါနှင့် မှတ်ပုံတင်ခြင်းအကူအညီပေးရေးအဖွဲ့အစည်းထံ အကူအညီပေးရေးလုပ်ငန်းအားလုံးကို ကန်ထရိုက်အပ်နှံထားသည့်အခါတွင် [မပေး] ဟုရေးသားဖော်ပြရမည်။</p>","<p class=\"vi\">6 ကော်လံ IV ရှိ နံပါတ် ၁ မှ ၈ အထိရှိသော [အကူအညီပေးရေးတာဝန်ယူလုပ်ကိုင်သူ သို့မဟုတ် ကန်ထရိုက်ယူ၍ဆောင်ရွက်သူ] ကော်လံတွင် အထူးကျွမ်းကျင်လုပ်သားဆောင်ရွက်မည့်အဖွဲ့အစည်းမှ ကိုယ်တိုင်အကူအညီပေးရေးလုပ်ငန်းကို ဆောင်ရွက်ပေးသည့်အခါနှင့် မှတ်ပုံတင်ခြင်းအကူအညီပေးရေးအဖွဲ့အစည်းထံ အကူအညီပေးရေးလုပ်ငန်းအားလုံးကို ကန်ထရိုက်အပ်နှံထားသည့်အခါကို ရွေးချယ်ထားသည်ဆိုလျှင် အကူအညီပေးရေးလုပ်ငန်းအသီးသီးအလိုက် တာဝန်ရှိသူအမည်နှင့် လက်သည်းကွင်းအတွင်း ရာထူးကိုရေးသားဖော်ပြပြီး၊ အထူးကျွမ်းကျင်လုပ်သားဆောင်ရွက်မည့်အဖွဲ့အစည်းမှ အကူအညီပေးရေးလုပ်ငန်းတစ်စိတ်တစ်ဒေသကို လက်ခံထားသည့်အခြားသူမှ အကူအညီပေးရေးလုပ်ငန်းဆောင်ရွက်မည်ဆိုပါက အကူအညီပေးရေးလုပ်ငန်း ကန်ထရိုက်ယူ၍ဆောင်ရွက်သူအမည်နှင့် နေရပ်လိပ်စာကို ရေးသားဖော်ပြရမည်။</p>","<p class=\"vi\" style=\"text-indent:0.86em\">ထို့အပြင် ကော်လံ IV-9 ရှိ [ပံ့ပိုးကူညီမှုတာဝန်ခံ သို့မဟုတ် ပံ့ပိုးကူညီသူဝန်ထမ်း] ကော်လံသည် အထူးကျွမ်းကျင်လုပ်သားများဆိုင်ရာအဖွဲ့အစည်းများမှ ကိုယ်တိုင်ပံ့ပိုးကူညီမှုကိုပြုလုပ်ခြင်းနှင့် စာရင်းသွင်းထားသော ပံ့ပိုးသည့်အဖွဲ့အစည်းများသို့ ပံ့ပိုးကူညီမှုအလုံးစုံကို အပ်နှံထားခြင်းတို့မှ ရွေးချယ်ခန့်အပ်ထားသည့် ပံ့ပိုးကူညီမှုတာဝန်ခံ သို့မဟုတ် ပံ့ပိုးကူညီသူဝန်ထမ်းများ၏ အမည်နာမနှင့် လက်သည်းကွင်းအတွင်းတွင် ရာထူးတာဝန်ကိုပါ ဖော်ပြရပါမည်။ ကော်လံ b သို့မဟုတ် လွတ်လပ်စွာဖြည့်စွက်နိုင်သည့် ကော်လံတွင်မူ တူညီသောကော်လံမှ ပံ့ပိုးကူညီမှု၊ အထူးကျွမ်းကျင်လုပ်သားများဆိုင်ရာ အဖွဲ့အစည်းမှ အပ်နှံထားသည့် တစ်စိတ်တစ်ပိုင်းကိုလက်ခံထားသည့် တတိယပုဂ္ဂိုလ်က ပံ့ပိုးကူညီမှုကို ဆောင်ရွက်သည့်အခါ အဆိုပါလက်ခံဆောင်ရွက်သူ၏ အမည်နာမနှင့် နေရပ်လိပ်စာကို ဖြည့်စွက်ရပါမည်။</p>","<p class=\"vi\">7\tကော်လံ IV ရှိ နံပါတ် ၁ မှ ၄ အထိနှင့် ၉ ရှိ [ဆောင်ရွက်ပုံနည်းလမ်း] ကော်လံတွင် သက်ဆိုင်သည်များကို အမှန်ခြစ်ရမည်။ [အခြား] ကို အမှန်ခြစ်ပါက ထိုဆောင်ရွက်ပုံနည်းလမ်းကို လက်သည်းကွင်းအတွင်း ရေးသားပြရမည်။</p>","<p class=\"vi\">8\tကော်လံ IV ရှိ နံပါတ် ၃ - က - ဃ ပါ [အခန်းအကျယ်အဝန်း] နှင့်ပတ်သက်၍ ကိုက်ညီမှုရှိသည့်အရာကို ကွင်းခတ်ထားသည့် ချက်ဘောက်ထဲမှ ရွေးချယ်ပေးရမည်။</p>","<p class=\"vi\">② မှ ④ အထိကို ① တွင် ရှိသည်ဟု အမှန်ခြစ်ထားခဲ့သည့်အခါ၌သာ ဖော်ပြရပါမည်။</p>","<p class=\"vi\">③ ကို [ကိုယ်ပိုင်အဆောက်အဦ]၊ [ငှားရမ်းထားသည့်အဆောက်အဦ] တစ်ခုခုတွင် အမှန်ခြစ်ပြုလုပ်ရပါမည်။</p>","<p class=\"vi\">④ ကို ဥပမာအားဖြင့် အောက်ပါကဲ့သို့သော ရှုထောင့်မှဖော်ပြရမည်ဖြစ်ပြီး ရှင်းလင်းချက်ကို လျော်ကန်အောင် လုပ်ဆောင်ရပါမည်။</p>","<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- ③ သည် [ကိုယ်ပိုင်အဆောက်အဦ] ဖြစ်ပါက - အမှန်တကယ်ဆောက်လုပ်ခြင်း၊ မွမ်းမံခြင်းတို့ လုပ်ရာ၌ လိုအပ်သောကုန်ကျစရိတ်၊ အဆောက်အဦ၏ခံနိုင်ရည်ရှိသည့်နှစ်အရေအတွက်၊ နေထိုင်မည့် နိုင်ငံခြားသား အထူးကျွမ်းကျင်လုပ်သားဦးရေစသည်တို့ကို ထည့်သွင်းစဉ်းစားပြီး ဆီလျော်မှုရှိကြောင်းရှင်းပြနိုင်သော ပမာဏ</p>","<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- ③ သည် [ငှားရမ်းထားသည့်အဆောက်အဦ] ဖြစ်ပါက - ငှားရမ်းရာ၌လိုအပ်မည့် ငှားရမ်းခ (စီမံထိန်းသိမ်းစရိတ်၊ စုပေါင်းကျခံရသောစရိတ်စသည်တို့အပါအဝင်၊ စပေါ်၊ ပွဲခ၊ အာမခံကြေး၊ ပွဲစားခစသည်တို့မပါဝင်ပါ။ အောက်တွင် အလားတူဖြစ်။) ကို နေထိုင်မည့် နိုင်ငံခြားသား အထူးကျွမ်းကျင်လုပ်သားဦးရေဖြင့် စားထားသောပမာဏ</p>","<p class=\"vi\">9 ဖြေရှင်းဆောင်ရွက်ပေးနိုင်သောနေ့ရက်များနှင့်ပတ်သက်၍ ထိုနေ့ရက်ကာလအပိုင်းအခြားကို ကော်လံ IV ရှိ နံပါတ် ၆ - ခ ပါ [ဖြေရှင်းဆောင်ရွက်ပေးမည့်အချိန်] ကော်လံတွင် ရေးသားဖော်ပြရမည်။</p>"],0,1],[2263,2,1942020107,["<p class=\"vi\" style=\"padding-left:3.00em;text-indent:-3.00em\">အထက်တွင်ဖော်ပြထားသည့် အကူအညီပေးရေးလုပ်ငန်းများကို ဒေသန္တရအစိုးရအဖွဲ့အစည်းများမှ လုပ်ဆောင်သော အတူယှဉ်တွဲနေထိုင်သည့်လူ့ဘောင် ဖော်ဆောင်ရေးမူဝါဒကို အခြေခံကာ လျော်ကန်စွာ ဆောင်ရွက်ပါမည်။</p>","<p class=\"vi\">ထို့အပြင် အကူအညီယူမည့်သူ အပြည့်အဝနားလည်နိုင်သော ဘာသာစကားဖြင့် ဤစာတမ်းကို ဘာသာပြန်ဆိုကာ အကူအညီယူမည့်သူထံ ထုတ်ပေးထားပြီး စာပါအကြောင်းအရာများနှင့်ပတ်သက်၍ အပြည့်အဝ ရှင်းပြထားပါသည်။</p>"],0,1],[2267,1,1846093434,["<tr><td class=\"lb\"><p class=\"ja\">特定技能所属機関の氏名又は名称</p><p class=\"vi\">အထူးကျွမ်းကျင်လုပ်သားဆောင်ရွက်မည့်အဖွဲ့အစည်း၏ အမည်အပြည့်အစုံ သို့မဟုတ် အခေါ်အဝေါ်</p></td>"],0,1],[2269,1,617466521,["<tr><td class=\"lb\"><p class=\"ja\">作成責任者の氏名</p><p class=\"vi\">စာတမ်းရေးဆွဲသူ၏ အမည်အပြည့်အစုံ</p></td>"],0,1],[2274,2,4244995961,["<p class=\"vi\" style=\"padding-left:3.00em;text-indent:-3.00em\">ဤစာတမ်းနှင့်ပတ်သက်၍ <span class=\"p17ul\">မြန်မာ</span>ဘာသာဖြင့် ဘာသာပြန်စာ ထုတ်ပေးသည်ကို လက်ခံရရှိပြီး ၎င်းအကြောင်းအရာများနှင့်ပတ်သက်၍ ရှင်းပြခံရပြီးဖြစ်ကာ အပြည့်အဝနားလည်ပါသည်။</p>","<p class=\"vi\">ထို့အပြင် ကော်လံ IV ရှိ နံပါတ် ၉ - က - က ပါ ပုံသေကာလအလိုက် တွေ့ဆုံမှုပြုသည့်နည်းလမ်းနှင့်ပတ်သက်ပြီး ရှင်းပြသည်တို့ကိုခံယူကာ အဆိုပါ အကြောင်းအရာများကို အပြည့်အဝ နားလည်သဘောပေါက်ထားပြီး  <input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f408\" disabled>မျက်နှာချင်းဆိုင်နှင့် အွန်လိုင်းမှတွေ့ခြင်းနှစ်မျိုးလုံး  <input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f409\" disabled>မျက်နှာချင်းဆိုင်တွေ့ခြင်းသာ  တို့ဖြင့် လုပ်ဆောင်ရန် အလိုရှိပါသည်။</p>"],0,1],[2277,1,31155209,["<p class=\"vi p17sign-date\" style=\"margin-top:.1em\">လက်မှတ်ထိုးသောနေ့စွဲ　${v('es_createY')||'　　'} နှစ် ${v('es_crea
