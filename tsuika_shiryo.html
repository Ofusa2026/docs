<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>追加資料提出</title>
<style>.fp-case{display:none!important;}</style>
<link rel="stylesheet" href="ofusa_common.css?v=1784720412">
<style>
.doc{padding:25mm 25mm 25mm 25mm!important;font-size:11pt!important;line-height:1.9!important;min-height:auto!important;}
.doc .p{margin:0;}
.doc .ttl{text-align:center;font-size:14pt;letter-spacing:2px;margin-bottom:14mm;}
.doc .sig{text-align:right;}
.doc .ul{display:inline-block;min-width:8em;border-bottom:1px solid #000;text-align:left;padding:0 2px;}
@media print{
  html,body,.main,.pp,#pageArea{background:#fff!important}
  .app-bar,.fp{display:none!important}
  .main{display:block!important}
  .doc{box-shadow:none!important;margin:0!important;padding:25mm!important;font-size:11pt!important}
  .f[style*="color:#aaa"]{visibility:hidden}
}
</style>
</head>
<body>
<div class="app-bar">
  <div>
    <div class="app-bar-title">📄 追加資料提出</div>
    <div class="ver">ver.20260917.01</div>
  </div>
  <div class="bar-btns">
    <button class="btn" id="editModeBtn" onclick="toggleEditMode()" style="background:#7c3aed;color:white;">✏️ 直接編集</button>
    <button class="btn" id="styleModeBtn" onclick="toggleStyleMode()" style="background:#0f766e;color:white;">🎨 スタイル編集</button>
    <button class="btn" onclick="saveFormGeneric('tsuika_shiryo')" style="background:#16a34a;color:white;">🛢 DB保存</button>
    <button class="btn" onclick="saveEditedHTML()" style="background:#0369a1;color:white;">📥 編集保存</button>
    <button class="btn" onclick="loadEditedHTML()" style="background:#0369a1;color:white;">📂 編集呼出</button>
    <button class="btn btn-print" onclick="doPrint()">🖨️ 印刷・PDF</button>
  </div>
</div>
<div class="main">
<div class="fp">
  <div class="fp-case">
    <label>登録支援機関</label><select id="filterOrg" onchange="filterCases()"></select>
    <label>所属機関</label><select id="filterCompany" onchange="filterCases()"></select>
    <label>検索</label><input id="filterText" oninput="filterCases()" placeholder="名前で絞り込み">
    <label>案件選択 <span id="caseCount" style="color:#888;font-weight:normal;font-size:9px;"></span></label>
    <select id="caseSelect" onchange="loadFromDB()"></select>
  </div>
  <div class="fp-inner">
    <div class="fs"><div class="fs-title">案件IDから関連をまとめて選択</div>
      <div class="fg"><label>案件ID（case_〜 を貼り付け／受付番号・氏名でも可）</label>
        <div style="display:flex;gap:4px;">
          <input id="ms_key" placeholder="case_1789…" style="flex:1;min-width:0;" onkeydown="if(event.key==='Enter'){event.preventDefault();msSearch();}">
          <button type="button" onclick="msSearch()" style="background:#2563eb;color:#fff;border:none;border-radius:4px;padding:4px 12px;cursor:pointer;font-size:12px;flex-shrink:0;">検索</button>
        </div>
      </div>
      <div id="ms_hit" style="display:none;font-size:11px;background:#eef4ff;border:1px solid #b9cbe8;border-radius:4px;padding:6px 8px;margin-bottom:6px;line-height:1.55;color:#1e3a5f;"></div>
      <div id="ms_tabs" style="display:none;gap:4px;margin-bottom:6px;flex-wrap:wrap;"></div>
      <div id="ms_ctrl" style="display:none;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:11px;color:#8ab;">
        <span id="ms_count">選択中 1件</span>
        <span>
          <button type="button" onclick="msAll(true)" style="font-size:11px;cursor:pointer;">全選択</button>
          <button type="button" onclick="msAll(false)" style="font-size:11px;cursor:pointer;">解除</button>
        </span>
      </div>
      <div id="ms_list" style="display:none;border:1px solid #ccc;border-radius:4px;max-height:200px;overflow:auto;background:#fff;"></div>
      <div class="fg" style="margin-top:6px;">
        <button type="button" id="ms_apply" onclick="msApply()" style="display:none;width:100%;background:#16a34a;color:#fff;border:none;border-radius:4px;padding:7px;cursor:pointer;font-size:12px;">▼ 選択した案件を書類へ反映</button>
      </div>
      <div id="ms_warn" style="display:none;font-size:11px;background:#fef3c7;border:1px solid #f59e0b;border-radius:4px;padding:6px 8px;margin-top:6px;color:#92400e;line-height:1.5;"></div>
    </div>
    <div class="fs"><div class="fs-title">テンプレート</div>
      <input id="f_title" type="hidden" value="追加資料提出">
      <div class="fg"><label>本文テンプレ（選ぶと即反映・タイトルも切替）</label>
        <select id="f_tpl" onchange="applyTemplate()">
          <option value="">— テンプレを選択 —</option>
          <option value="tsuika_std">追加資料｜添付漏れのお詫び（標準）</option>
          <option value="tsuika_shiteki">追加資料｜指摘事項に沿って提出</option>
          <option value="tsuika_list">追加資料｜提出書類の一覧つき</option>
        </select>
      </div>
    </div>
    <div class="fs"><div class="fs-title">提出先</div>
      <div class="fg"><label>提出先（申請受付番号から自動・編集可）</label><input id="f_bureau" oninput="p()" placeholder="例：東京出入国在留管理局"></div>
      <div class="fg"><label>部門（任意）</label><input id="f_busho" oninput="p()" placeholder="例：就労審査第三部門"></div>
      <div class="fg"><label>日付（任意・空なら非表示）</label><input id="f_date" oninput="p()" placeholder="例：2026年9月11日"></div>
    </div>
    <div class="fs"><div class="fs-title">案件情報</div>
      <div class="fg"><label>申請番号（複数行OK・氏名併記OK）</label><textarea id="f_receiptNo" oninput="p()" rows="3" placeholder="例：東オンCV12345&#10;　　東オンCV12346　NGUYEN VAN B"></textarea></div>
      <div class="fg"><label>申請人（空なら行ごと非表示）</label><input id="f_applicant" oninput="p()"></div>
      <div class="fg"><label>所属機関名（空なら行ごと非表示）</label><input id="f_company" oninput="p()"></div>
    </div>
    <div class="fs"><div class="fs-title">本文（自由に編集できます）</div>
      <div class="fg"><textarea id="f_body" oninput="p()" rows="14" style="font-size:12px;line-height:1.6;" placeholder="テンプレを選んで「本文に反映」か、直接入力してください"></textarea></div>
    </div>
    <div class="fs"><div class="fs-title">署名</div>
      <div class="fg"><label>申請取次行政書士</label>
        <select id="f_gyosei" onchange="p()">
          <option value="田中　綾美">田中　綾美</option>
          <option value="中林　俊介">中林　俊介</option>
          <option value="大房　明良">大房　明良</option>
        </select>
      </div>
    </div>
  </div>
</div>
<div class="pp">
  <div class="page-nav">
    <span class="page-nav-label">ページ:</span>
    <button class="pn-btn pn-btn-page active" onclick="scrollToPage(1)">P1</button>
    <span style="margin-left:8px;font-size:10px;color:#aaa;font-family:sans-serif;">文字:</span>
    <button class="pn-btn" onmousedown="event.preventDefault();changeFontSize(-0.5)" style="padding:2px 7px;">A-</button>
    <button class="pn-btn" onmousedown="event.preventDefault();changeFontSize(0)" style="padding:2px 7px;" id="fontSizeLabel">11pt</button>
    <button class="pn-btn" onmousedown="event.preventDefault();changeFontSize(0.5)" style="padding:2px 7px;">A+</button>
  </div>
  <div id="pageArea"></div>
</div>
</div>
<script src="ofusa_common.js?v=1789607432"></script>
<script>
// 受付番号の先頭文字 → 提出先（フル名称・支局対応）
var BUREAU_FULL={
  '東':'東京出入国在留管理局',
  '横':'東京出入国在留管理局横浜支局',
  '名':'名古屋出入国在留管理局',
  '阪':'大阪出入国在留管理局',
  '神':'大阪出入国在留管理局神戸支局',
  '札':'札幌出入国在留管理局',
  '仙':'仙台出入国在留管理局',
  '福':'福岡出入国在留管理局',
  '那':'福岡出入国在留管理局那覇支局',
  '広':'広島出入国在留管理局',
  '中':'広島出入国在留管理局',
  '高':'高松出入国在留管理局'
};
function bureauFullFromReceipt(rno){
  var s=String(rno||'').trim(); if(!s) return '';
  return BUREAU_FULL[s.charAt(0)]||'';
}
var TPL = {
  tsuika_std: { title:'追加資料提出', body:
'先般申請いたしました資料におきまして、申請書類の添付漏れがございました。\nご迷惑をお掛けし、誠に申し訳ございません。\n申請資料一式を送付いたしますので、ご査収のほどよろしくお願いいたします。\n\nこちらの不手際によりお手数をお掛けし、大変恐縮でございます。\nお忙しいところ誠に恐れ入りますが、何卒よろしくお願い申し上げます。' },
  tsuika_shiteki: { title:'追加資料提出', body:
'追加資料をお送りいたしますので、ご確認よろしくお願いいたします。\n\n＊指摘事項1\n（ここに指摘への回答・提出物を記載）\n\n書類の不備等多々ありお手数お掛け致しました。\nお忙しいところ大変恐れ入りますが、何卒よろしくお願いいたします。' },
  tsuika_list: { title:'追加資料提出', body:
'追加資料をお送りいたしますので、ご確認よろしくお願いいたします。\n\n１．提出資料一覧の表紙\n２．雇用条件書（参考様式第１－５号）\n３．雇用契約書（参考様式第１－６号）\n４．賃金の支払（参考様式第１－６号別紙）\n\n書類の不備等多々ありお手数お掛け致しました。\nお忙しいところ大変恐れ入りますが、何卒よろしくお願いいたします。' }
};
function applyTemplate(){
  // ver.20260911.02: 選択と同時に即反映（確認ダイアログ・反映ボタン廃止）
  var k=(document.getElementById('f_tpl')||{}).value||'';
  if(!k||!TPL[k]) return;
  var body=document.getElementById('f_body');
  body.value=TPL[k].body;
  var t=document.getElementById('f_title'); if(t) t.value=TPL[k].title;
  p(); showToast('📄 テンプレを反映しました');
}
function _ml(id, ph){
  var val=v(id)||'';
  if(!val) return '<span class="f" style="color:#aaa;background:#fff59d;padding:0 3px;">'+ph+'</span>';
  return esc(val).replace(/\n/g,'<br>');
}
function p(){
  if(_editMode) return;
  const w=document.getElementById('pageArea'); if(!w) return;
  const title=v('f_title')||'追加資料提出';
  const busho=v('f_busho')||'';
  const date=v('f_date')||'';
  const showApplicant=!!v('f_applicant');
  const showCompany=!!v('f_company');
  const applicantLabel=(title==='理由書')?'氏名':'申請人';
  w.innerHTML=`
<div class="doc">
<div class="page-num-label">P1</div>
<div class="ttl">${esc(title)}</div>
${date?`<div class="p" style="text-align:right;margin-bottom:4mm;">${esc(date)}</div>`:''}
<div class="p" style="margin-bottom:10mm;"><span class="f">${f('f_bureau')}</span>${busho?'　'+esc(busho):''}　御中</div>
<div class="p">申請番号：</div>
<div class="p" style="margin-bottom:6mm;">${_ml('f_receiptNo','es.receiptNo')}</div>
${showApplicant?`<div class="p" style="margin-bottom:6mm;">${applicantLabel}：${f('f_applicant')}</div>`:''}
${showCompany?`<div class="p" style="margin-bottom:10mm;">所属機関名：　${f('f_company')}</div>`:''}
<div class="p" style="margin-bottom:16mm;">${_ml('f_body','（本文：テンプレを選んで反映、または直接入力）')}</div>
<div class="p sig">大房行政書士法人</div>
<div class="p sig">申請取次行政書士　${f('f_gyosei')}</div>
</div>`;
  _fontSize = (_fontSize === 8.5) ? 11 : _fontSize;
  _applyTsuikaFontSize();
  const lbl=document.getElementById('fontSizeLabel');if(lbl)lbl.textContent=_fontSize+'pt';
  setupPageTracker();
  fitDocToPreview();
}
function _applyTsuikaFontSize(){
  const st=document.getElementById('_tsuikaFontStyle')||document.createElement('style');
  st.id='_tsuikaFontStyle'; document.head.appendChild(st);
  const s=_fontSize/11;
  st.textContent=`.doc{font-size:${(11*s).toFixed(2)}pt!important} .doc .ttl{font-size:${(14*s).toFixed(2)}pt!important}`;
}
async function loadFromDB(passedInfo){
  let info = passedInfo;
  if(!info){
    const sel=document.getElementById('caseSelect');
    if(!sel||!sel.value) return;
    try{info=JSON.parse(sel.value);}catch(e){return;}
  }
  if(!info||!info.caseId) return;
  const {caseId,companyId,companyName}=info;
  try{
    const [cases,cos]=await Promise.all([
      sb('cases?select=applicant,company,receipt_no,case_no&id=eq.'+caseId),
      companyId?sb('companies?select=name&id=eq.'+companyId):Promise.resolve([])
    ]);
    const cas=cases&&cases[0]; const co=cos&&cos[0];
    // 初回は標準テンプレ（追加資料・添付漏れ）を本文にセット
    const body=document.getElementById('f_body');
    if(body && body.value.trim()===''){ body.value=TPL.tsuika_std.body; }
    // ver.20260917.01: 二重入力の解消。申請番号などは「まとめて選択」に集約し、
    //   案件を選んだ時点で関連案件を検索→同一案件名で全選択→一括反映する（手動の再入力不要）。
    //   起点1件だけの先行セットは行わない（msApplyが f_receiptNo 等をまとめて入れる）。
    if(cas && typeof msSearch==='function'){
      const keyEl=document.getElementById('ms_key');
      if(keyEl){ keyEl.value=caseId; }
      await msSearch();            // _msRows を同一案件名スコープで取得・起点を選択
      // 同一案件名の関連案件を全選択（＝左で選んだ案件のまとまりをそのまま反映）
      if(typeof msAll==='function') msAll(true);
      if(typeof msApply==='function') msApply();  // 選択分を書類へ一括反映
    } else if(cas){
      // フォールバック（まとめ選択UIが無い場合のみ）
      const sf=(id,val)=>{const e=document.getElementById(id);if(e&&val)e.value=val;};
      sf('f_receiptNo', (cas.receipt_no||cas.case_no||'').trim());
      sf('f_applicant', cas.applicant||'');
      sf('f_company', (co&&co.name)||cas.company||companyName||'');
      const b=bureauFullFromReceipt(cas.receipt_no||cas.case_no||'');
      if(b) sf('f_bureau', b);
    }
    p(); showToast('✅ データを読み込みました');
  }catch(e){showToast('⚠️ 読込エラー: '+e.message);console.error(e);}
}
// ===== 案件IDから関連をまとめて選択 =====
var _msBase=null,_msScope='name',_msRows=[],_msSel={};
async function msSearch(){
  var key=(document.getElementById('ms_key').value||'').trim();
  if(!key){ showToast('⚠️ 案件IDを入力してください'); return; }
  try{
    var sel='id,name,applicant,org,company,receipt_no,case_no';
    var rows=[];
    if(/^case_/i.test(key)){
      rows=await sb('cases?select='+sel+'&id=eq.'+encodeURIComponent(key));
    }
    if(!rows||!rows.length){
      var k=encodeURIComponent('*'+key+'*');
      rows=await sb('cases?select='+sel+'&or=(receipt_no.ilike.'+k+',case_no.ilike.'+k+',applicant.ilike.'+k+',id.ilike.'+k+')&limit=5');
    }
    if(!rows||!rows.length){ showToast('⚠️ 見つかりませんでした'); return; }
    _msBase=rows[0]; _msScope='name'; _msSel={}; _msSel[_msBase.id]=true;
    var hit=document.getElementById('ms_hit');
    hit.style.display='block';
    hit.innerHTML='<b>'+esc(_msBase.applicant||'（申請人未設定）')+'</b>　／　'+esc(_msBase.company||'')+'　／　'+esc(_msBase.org||'')+'<br>案件名：'+esc(_msBase.name||'');
    await msLoadScope();
  }catch(e){ showToast('⚠️ 検索エラー: '+e.message); console.error(e); }
}
async function msLoadScope(){
  var b=_msBase; if(!b) return;
  var sel='id,name,applicant,org,company,receipt_no,case_no';
  var q;
  if(_msScope==='name') q='name=eq.'+encodeURIComponent(b.name||'');
  else if(_msScope==='company') q='company=eq.'+encodeURIComponent(b.company||'');
  else q='org=eq.'+encodeURIComponent(b.org||'');
  try{
    var rows=await sb('cases?select='+sel+'&'+q+'&order=name.asc,applicant.asc&limit=200');
    _msRows=(rows||[]).filter(function(r){return r&&r.id;});
    _msRows.sort(function(a,c){return (a.id===b.id?-1:0)-(c.id===b.id?-1:0);});
    var keep={}; keep[b.id]=true;
    _msRows.forEach(function(r){ if(_msSel[r.id]) keep[r.id]=true; });
    _msSel=keep;
    msRenderTabs(); msRenderList();
  }catch(e){ showToast('⚠️ 読込エラー: '+e.message); }
}
function msRenderTabs(){
  var t=document.getElementById('ms_tabs');
  t.style.display='flex';
  var defs=[['name','同じ案件名'],['company','同じ所属機関'],['org','同じ登録支援機関']];
  t.innerHTML=defs.map(function(d){
    var on=(_msScope===d[0]);
    return '<button type="button" onclick="msSetScope(\''+d[0]+'\')" style="font-size:11px;padding:3px 10px;border-radius:999px;cursor:pointer;border:1px solid '+(on?'#2563eb':'#889')+';background:'+(on?'#2563eb':'transparent')+';color:'+(on?'#fff':'#9ab')+';">'+d[1]+'</button>';
  }).join('');
}
function msSetScope(s){ _msScope=s; msLoadScope(); }
function msRenderList(){
  var w=document.getElementById('ms_list');
  w.style.display='block';
  document.getElementById('ms_ctrl').style.display='flex';
  document.getElementById('ms_apply').style.display='block';
  w.innerHTML=_msRows.map(function(r){
    var base=(r.id===_msBase.id);
    var no=(r.receipt_no||r.case_no||'').trim();
    var label=(no?esc(no)+'　':'')+esc(r.applicant||'（申請人未設定）')+(base?'（起点）':'')+(no?'':'<span style="color:#b45309;">　※受付番号なし</span>');
    return '<label style="display:flex;gap:6px;align-items:flex-start;padding:6px 8px;border-bottom:1px solid #eee;font-size:12px;color:#333;cursor:pointer;'+(base?'background:#f0f6ff;':'')+'">'
      +'<input type="checkbox" '+(_msSel[r.id]?'checked ':'')+(base?'disabled ':'')+'onchange="msToggle(\''+r.id+'\',this.checked)" style="margin-top:2px;">'
      +'<span style="line-height:1.5;">'+label+'<br><span style="color:#888;font-size:10px;">'+esc(r.name||'')+'</span></span></label>';
  }).join('');
  msCount();
}
function msToggle(id,on){ if(_msBase&&id===_msBase.id) return; _msSel[id]=on; msCount(); }
function msAll(on){
  _msRows.forEach(function(r){ _msSel[r.id]=on||(r.id===_msBase.id); });
  msRenderList();
}
function msCount(){
  var n=_msRows.filter(function(r){return _msSel[r.id];}).length;
  document.getElementById('ms_count').textContent='選択中 '+n+'件';
}
function msSelectedRows(){ return _msRows.filter(function(r){return _msSel[r.id];}); }
function msWarn(msg){
  var w=document.getElementById('ms_warn');
  if(!msg){ w.style.display='none'; return; }
  w.style.display='block'; w.innerHTML=msg;
}
function msApply(){
  var rows=msSelectedRows();
  if(!rows.length){ showToast('⚠️ 反映する案件を選択してください'); return; }
  if(typeof isFormMode==='function' && isFormMode()){
    if(rows.length>1){ showToast('⚠️ 旅券様式は1名用です。1件だけ選択してください'); return; }
    var e0=document.getElementById('f_r_name'); if(e0) e0.value=rows[0].applicant||'';
    p(); showToast('✅ 反映しました'); return;
  }
  var lines=rows.map(function(r){
    var no=(r.receipt_no||r.case_no||'').trim();
    return no ? no+'　'+(r.applicant||'') : (r.applicant||'')+'（受付番号なし）';
  });
  var s=function(id,val){var e=document.getElementById(id);if(e)e.value=val;};
  s('f_receiptNo', lines.join('\n'));
  var comps={}; rows.forEach(function(r){ comps[(r.company||'').trim()]=1; });
  var compKeys=Object.keys(comps).filter(function(k){return k;});
  s('f_company', compKeys.length===1?compKeys[0]:'');
  s('f_applicant', rows.length===1?(rows[0].applicant||''):'');
  var bureaus={};
  rows.forEach(function(r){ var b=bureauFullFromReceipt(r.receipt_no||r.case_no||''); if(b) bureaus[b]=1; });
  var bk=Object.keys(bureaus);
  if(bk.length===1){ s('f_bureau', bk[0]); }
  var warns=[];
  if(bk.length>1) warns.push('⚠️ 提出先の入管局が混在しています（'+bk.join('／')+'）。局ごとに分けて作成してください。');
  if(rows.some(function(r){return !(r.receipt_no||r.case_no);})) warns.push('※ 受付番号のない案件があります（黄色表示ではなく「受付番号なし」と記載）。');
  if(compKeys.length>1) warns.push('※ 所属機関が複数のため所属機関欄は空にしました。');
  msWarn(warns.join('<br>'));
  p(); showToast('✅ '+rows.length+'件を反映しました');
}

initCaseSelect(); p();

function fitDocToPreview(){
  requestAnimationFrame(()=>{
    const pp = document.querySelector('.pp');
    const area = document.getElementById('pageArea');
    if(!pp || !area) return;
    const ppW = pp.clientWidth - 40;
    const docW = 794;
    if(ppW < docW){
      const scale = ppW / docW;
      area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = scale; });
    } else {
      area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = 1; });
    }
  });
}
window.addEventListener('resize', fitDocToPreview);

window.addEventListener('message', async function(e){
  if(!e.data||e.data.type!=='SELECT_CASE') return;
  const info=e.data.info;
  if(!info||!info.caseId) return;
  const sel=document.getElementById('caseSelect');
  if(sel){
    let found=false;
    for(let o of sel.options){
      try{ const d=JSON.parse(o.value); if(d.caseId===info.caseId){sel.value=o.value;found=true;break;} }catch(e2){}
    }
    if(!found){
      const opt=document.createElement('option');
      opt.value=JSON.stringify(info);
      opt.textContent='（indexから選択）';
      sel.appendChild(opt);
      sel.value=opt.value;
    }
  }
  if(typeof loadCaseToForm==='function'){ await loadCaseToForm(info, 'tsuika_shiryo', {skipFieldRestore:true}); }
  if(typeof loadFromDB==='function') loadFromDB(info);
});
</script>
