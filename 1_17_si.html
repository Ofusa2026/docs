 සඳහන් කරන්න.</p>","<p class=\"vi\">5 Ⅳ තීරුව 1 සිට 9 දක්වා “බාහිරින් සහාය ලබා ගන්නා නොගන්නා බව” “ඔව්” වන්නේ විශේෂිත නිපුණතාවය සඳහා අනුබද්ධ ආයතනය තෙවන පාර්ශවයකට සහාය කොටසක් භාර දෙන විට පමණි (ලියාපදිංචි ආධාරක සංවිධානයකට භාර දී ඇති අවස්ථා හැර). නිශ්චිත නිපුණතාවය අයත් වන සංවිධානය තමන්ගේම සහය ලබා දෙන්නේ නම්, හෝ සහාය සඳහා ලියාපදිංචි සංවිධානය සියලු සහාය ලබා දෙන්නේ නම් “නැත” යනුවෙන් සඳහන් කරන්න.</p>","<p class=\"vi\">6 Ⅳ වන තීරුවේ 1 සිට 8 දක්වා (සහාය භාරකාරී පුද්ගලයා හෝ බාහිරින් සහාය ලබා ගන්නා විට සහාය ක්‍රියාත්මක කරන පුද්ගලයා) යන තීරුව විශේෂිත නිපුණතා සඳහා අනුබද්ධ ආයතනය තමා විසින්ම සහාය ලබා දෙන අවස්ථාවේ හෝ සහාය සඳහා ලියාපදිංචි සංවිධානය හරහා සියළුම සහාය පිටතින් ලබා ගන්නා අවස්ථාවේදී අත්කර ගන්නා සහාය සඳහා භාරකාරී පුද්ගලයා විසින් ලබා දෙන සහාය කරුණු වශයෙන් සඳහන් කරන අතර තනතුර සඳහන් කළ යුතු වේ. විශේෂ නිපුණතා සඳහා අනුබද්ධ ආයතනය මගින් තුන් වන පාර්ශවයකින් අර්ධ වශයෙන් සහාය ලබා ගැනීමක් කර ඇත්නම් එසේ සහාය ලබා දී ඇති පුද්ගලයාගේ නම සහ ලිපිනය සඳහන් කළ යුතුය.</p>","<p class=\"vi\" style=\"text-indent:0.86em\">එසේම, IV-9 තීරුවේ “සහාය කළමනාකරු හෝ සහායක කාර්ය මණ්ඩලය”: ආයතනයම සහාය ලබා දෙන්නේ නම් හෝ සියලු සහාය ලියාපදිංචි සහාය සංවිධානයකට පවරන්නේ නම්, එක් එක් සහාය සඳහා පත් කළ සහාය කළමනාකරු හෝ සහායක කාර්ය මණ්ඩලයේ නම සහ වරහන් තුළ තනතුර සඳහන් කරන්න. එම තීරුවේ සහාය ආයතනය විසින් කොටසක් පවරන ලද තුන්වන පාර්ශ්වයක් සිදු කරන්නේ නම්, b තීරුවේ සහ නිදහස් විස්තර තීරුවේ පැවරුම් ලත් කාර්ය මණ්ඩලයේ නම සහ ලිපිනය සඳහන් කරන්න.</p>","<p class=\"vi\">7\tⅣ තීරුවේ 1 සිට 4 සහ 9 තීරුවල “ක්‍රියාත්මක කිරීමේ ක්‍රමය” තීරුවේ අදාළ අයිතම සලකුණු කරන්න. ඔබ “වෙනත්” සලකුණු කරන්නේ නම්, වරහන් තුළ ක්‍රියාත්මක කිරීමේ ක්‍රමය විස්තර කරන්න.</p>","<p class=\"vi\">8\tⅣ තීරුව 3 A d “කාමරයේ විශාලත්වය” සඳහා, වරහන් තුළ ඇති සලකුණු කොටු වලින් සුදුසු අයිතමය තෝරන්න.</p>","<p class=\"vi\">① හි “ඔව්” තෝරා ඇත්නම් පමණක් ② සිට ④ දක්වා පිළිතුරු දෙන්න.</p>","<p class=\"vi\">③ සඳහා “තමන්ගේම දේපළ” හෝ “බදු දේපළ” යන දෙකෙන් එකක් සලකුණු කරන්න.</p>","<p class=\"vi\">④ සඳහා, උදාහරණයක් ලෙස පහත තොරතුරු ඇතුළත්ව නිසි පැහැදිලි කිරීමක් කරන්න:</p>","<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- ③ නවාතැන “තමන්ගේම දේපළ” නම්: ඉදිකිරීමේ සහ ප්‍රතිසංස්කරණයේ සැබෑ පිරිවැය, දේපළෙහි ප්‍රයෝජනවත් ආයු කාලය, පදිංචිව සිටින නිශ්චිත කුසලතා අංක 1 විදේශීය ජාතිකයින් සංඛ්‍යාව ආදිය සැලකිල්ලට ගනිමින් සාධාරණ ලෙස පැහැදිලි කළ හැකි මුදල.</p>","<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- ③ නවාතැන “බදු දේපළ” නම්: දේපළ කුලියට ගැනීමට අවශ්‍ය කුලිය (කළමනාකරණ ගාස්තු සහ පොදු ප්‍රදේශ ගාස්තු ඇතුළුව, ආරක්ෂක තැන්පතු, යතුරු මුදල්, ඇප මුදල් සහ තැරැව්කාර ගාස්තු හැර) පදිංචිව සිටින නිශ්චිත කුසලතා අංක 1 විදේශීය ජාතිකයින් සංඛ්‍යාවෙන් බෙදීමෙන් ලැබෙන මුදල.</p>","<p class=\"vi\">9 Ⅳ තීරුව 6 B හි (සහාය ලබා දිය හැකි වේලාව) තීරයට සහාය ලබා දිය හැකි දිනයේ අදාල පැය ගණන ඉදිරිපත් කරන්න.</p>"],0,1],[2263,2,1942020107,["<p class=\"vi\" style=\"padding-left:3.00em;text-indent:-3.00em\">ඉහත සඳහන් කර ඇති ආකාරයට අප විසින් සහාය ලබා දෙන්නෙමු.</p>","<p class=\"vi\">තවද, මෙම ලේඛනය සහාය ලබන්නාට සම්පූර්ණයෙන් තේරුම් ගත හැකි භාෂාවකට පරිවර්තනය කර, සහාය ලබා ගන්නා පුද්ගලයාගේ අතට ලබා දී, අන්තර්ගතය සම්පූර්ණයෙන්ම පැහැදිලි කර ඇත.</p>"],0,1],[2267,1,1846093434,["<tr><td class=\"lb\"><p class=\"ja\">特定技能所属機関の氏名又は名称</p><p class=\"vi\">විශේෂිත නිපුණතා සඳහා අනුබද්ධ ආයතනයේ නම</p></td>"],0,1],[2269,1,617466521,["<tr><td class=\"lb\"><p class=\"ja\">作成責任者の氏名</p><p class=\"vi\">මෙම ලේඛනය සකස් කළ පුද්ගලයාගේ නම</p></td>"],0,1],[2274,2,4244995961,["<p class=\"vi\" style=\"padding-left:3.00em;text-indent:-3.00em\">මෙම ලේඛනයේ <span class=\"p17ul\">සිංහල</span> පරිවර්ථනයක් ලබා ගතිමි, තවද මෙහි අන්තර්ගතය සම්පූර්ණ වශයෙන් පැහැදිලි කර දුන් අතර ඒ පිළිබඳ මනා අවබෝධයක් ලබා ගතිමි.</p>","<p class=\"vi\">IV 9-A-a තීරුවේ නිතිපතා සම්මුඛ සාකච්ඡා පැවැත්වීමේ ක්‍රමය පිළිබඳවද මට පැහැදිලි කර ඇති අතර, මට එය සම්පූර්ණයෙන්ම වැටහේ. මම කැමති වන්නේ  <input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f408\" disabled>මුහුණට මුහුණ සහ මාර්ගගත යන දෙආකාරයෙන්ම සම්මුඛ සාකච්ඡා  <input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f409\" disabled>මුහුණට මුහුණ සම්මුඛ සාකච්ඡා පමණි.</p>"],0,1],[2277,1,31
