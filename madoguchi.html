    font-size: 8.5pt; color: #000;

  .madoguchi-page .dept-cell { text-align: left; padding: 2px 4px; }

  .madoguchi-page .re-opt {

  .madoguchi-page .re-opt input[type=radio] { width: 10px; height: 10px; margin: 0; }

  .madoguchi-page .chk-cell input[type=checkbox] { width: 12px; height: 12px; cursor: pointer; }

  .madoguchi-page .biko-lbl {

  /* 2ページ目以降：表ヘッダーを各ページ先頭に repeat させる */

  /* ページ単位の改ページ */

  @media print { body { padding: 0; } }

<div class="app-bar">
  <div>
    <div class="app-bar-title">📄 オンライン申請（窓口受領用）</div>
    <div class="ver">ver.20260710.06</div>
  </div>
  <div class="bar-btns">
    <button class="btn btn-print" onclick="doPrint()">🖨️ 印刷・PDF</button>
  </div>
</div>
<div class="main">
<div class="fp">
  <div class="fp-case">
    <label>案件ID貼り付け</label>
    <div id="slotList"></div>
    <button class="addBtn" id="addPageBtn" onclick="addPage()">＋ ページ追加（次の10件）</button>
    <div class="rowCount" id="rowCountLabel">0件登録済み</div>
    <div class="hint">
      ・案シスの案件詳細を開いたときのURLに含まれる <code>caseId=...</code> の値を、各枠に貼り付けてください。<br>
      ・対応する申請受付番号は「東オン」「横オン」のみです。それ以外の拠点の案件はエラー表示になります。<br>
      ・11件目以降は「＋ページ追加」を押すと次の10件分の枠が増えます（2ページ目は1ページ目と同じ構成で印刷されます）。<br>
      ・各枠の「✕」で取り消せます。

  </div>

<div class="pp">
<div id="ppOuter">

<div id="pageArea">
<!-- ページ全体はJSで生成（renderMadoguchiPages） -->
</div>
</div>

<script src="ofusa_common.js?v=1787298369"></script>
<script>
// ===========================================================
// 窓口の紙：案件ID貼り付け → 申請受付番号・担当部門 自動反映
// サイドバーに常に10件単位の入力枠（スロット）を表示し、各枠に貼り付けると該当行が埋まる。
// 「＋ページ追加」で次の10件分の枠を増やす。11件目以降は新ページ（例行+項番1〜10）が増える。
// ===========================================================

const ROWS_PER_PAGE = 10;
// _slots: 常に10の倍数の長さを保つ配列。各要素は以下のいずれか
//   null                                            … 未入力
//   {status:'loading', caseId}                       … 取得中
//   {status:'filled', caseId, receiptNoRaw, residenceStatus, parsed, deptKey}
//   {status:'error', caseId, message}                … ID不正・取得失敗等
let _slots = new Array(ROWS_PER_PAGE).fill(null);

// ---- 担当部門マッピング ----
// 労1: 技術・人文知識・国際業務／法律・会計業務／研究／企業内転勤／高度専門職1号イ・ロ・ハ
// 労2: 技能／経営・管理／興行／公用／教授／教育／芸術／宗教／報道／医療／介護
// 労3: 特定技能1号／特定技能2号／特定活動
// 研・短: 技能実習1号・2号・3号／文化活動／研修
// 留学: 留学
// 永住: 日本人の配偶者等／永住者の配偶者等／定住者
const DEPT_MAP = [
  { key: 'labor3', test: s => /特定技能(１|1)号|特定技能(２|2)号|特定活動/.test(s) },
  { key: 'labor1', test: s => /技術・人文知識・国際業務|法律・会計業務|研究|企業内転勤|高度専門職(１|1)号/.test(s) },
  { key: 'labor2', test: s => /技能(?!実習)|経営・管理|興行|公用|教授|教育|芸術|宗教|報道|医療|介護/.test(s) },
  { key: 'kenTan', test: s => /技能実習|文化活動|研修/.test(s) },
  { key: 'ryugaku', test: s => /留学/.test(s) },
  { key: 'eiju', test: s => /日本人の配偶者等|永住者の配偶者等|定住者/.test(s) },
];

function judgeDept(residenceStatusRaw){
  if(!residenceStatusRaw) return null;
  // 「特定活動⇒特定技能1号」のような矢印付き表記は、矢印の右側（変更後）で判定する
  let s = String(residenceStatusRaw);
  const arrowMatch = s.match(/[⇒→](.+)$/);
  if(arrowMatch) s = arrowMatch[1];
  for(const d of DEPT_MAP){
    if(d.test(s)) return d.key;
  }
  return null;
}

// ---- 申請受付番号パース ----
// 例: "東オンＥＮ26013073" → 拠点:東オン, コード:EN, 番号:26013073
// 全角英字は半角に正規化してから判定する
function zenkakuToHankaku(s){
  return s.replace(/[Ａ-Ｚａ-ｚ０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
}

function parseReceiptNo(raw){
  if(!raw) return { error: '申請受付番号が空です' };
  const s = zenkakuToHankaku(String(raw).trim());
  const m = s.match(/^(東オン|横オン)([A-Za-z認]{1,2})(.+)$/);
  if(!m){
    return { error: '「東オン」「横オン」以外の拠点、または想定外の形式です（実データ: ' + esc(raw) + '）' };
  }
  return { branch: m[1], code: m[2], number: m[3] };
}

// スロットslotIdx（0始まり、全体通し番号）にIDを貼り付けたときの処理
async function loadSlot(slotIdx, caseId){
  caseId = (caseId || '').trim();
  if(!caseId){
    _slots[slotIdx] = null;
    renderAll();
    return;
  }
  const dup = _slots.some((s, i) => i !== slotIdx && s && s.caseId === caseId);
  if(dup){
    _slots[slotIdx] = { status: 'error', caseId: caseId, message: 'この案件IDは既に他の枠で使われています' };
    renderAll();
    return;
  }

  _slots[slotIdx] = { status: 'loading', caseId: caseId };
  renderSlotList();

  try{
    const cases = await sb('cases?select=id,receipt_no,applicant,residence_status&id=eq.' + encodeURIComponent(caseId));
    const cas = cases && cases[0];
    if(!cas){
      _slots[slotIdx] = { status: 'error', caseId: caseId, message: '該当する案件が見つかりません' };
      renderAll();
      return;
    }
    const parsed = parseReceiptNo(cas.receipt_no);
    const deptKey = judgeDept(cas.residence_status);
    _slots[slotIdx] = {
      status: 'filled',
      caseId: cas.id,
      applicant: cas.applicant || '',
      receiptNoRaw: cas.receipt_no || '',
      residenceStatus: cas.residence_status || '',
      parsed: parsed,
      deptKey: deptKey
    };
    renderAll();
  }catch(e){
    _slots[slotIdx] = { status: 'error', caseId: caseId, message: '取得に失敗しました: ' + e.message };
    renderAll();
  }
}

function removeSlot(slotIdx){
  _slots[slotIdx] = null;
  renderAll();
}

function addPage(){
  for(let i = 0; i < ROWS_PER_PAGE; i++) _slots.push(null);
  renderAll();
}

function deptCheckboxHtml(deptKey){
  // dept-row 3行（労1/2/3、留学/研短、永住/その他）を生成。deptKeyに該当するものだけ☑にする
  const chk = (key) => deptKey === key ? 'checked' : '';
  return ''
    + '<div class="dept-row">'
    +   '<label><input type="checkbox" ' + chk('labor1') + '>労1</label>'
    +   '<label><input type="checkbox" ' + chk('labor2') + '>労2</label>'
    +   '<label><input type="checkbox" ' + chk('labor3') + '>労3</label>'
    + '</div>'
    + '<div class="dept-row">'
    +   '<label><input type="checkbox" ' + chk('ryugaku') + '>留学</label>'
    +   '<label><input type="checkbox" ' + chk('kenTan') + '>研・短</label>'
    + '</div>'
    + '<div class="dept-row">'
    +   '<label><input type="checkbox" ' + chk('eiju') + '>永住</label>'
    +   '<label><input type="checkbox">その他</label>'
    + '</div>';
}

// 1行分（項番itemNo、slotデータ。slotがnull/undefinedなら空枠）のtr HTMLを生成
function buildRowHtml(itemNo, slot, globalIdx){
  if(!slot){
    // 空枠（未入力）
    return ''
      + '<tr>'
      + '<td>' + itemNo + '</td>'
      + '<td class="ofc-cell"><label style="display:block;text-align:center;">東オン</label><label style="display:block;text-align:center;">横オン</label></td>'
      + '<td class="en-cell"></td>'
      + '<td class="num-cell"><input type="text"></td>'
      + '<td class="dept-cell">' + deptCheckboxHtml(null) + '</td>'
      + '<td><div class="re-opt"><input type="radio" name="r' + itemNo + '_' + globalIdx + '" value="あり"><span>あり</span></div><div class="re-opt"><input type="radio" name="r' + itemNo + '_' + globalIdx + '" value="なし"><span>なし</span></div></td>'
      + '<td class="chk-cell"><input type="checkbox"></td>'
      + '<td><label class="biko-lbl"><input type="checkbox">メール画面確認</label></td>'
      + '<td></td>'
      + '<td class="knin-cell"></td>'
      + '</tr>';
  }

  if(slot.status === 'loading'){
    return ''
      + '<tr>'
      + '<td>' + itemNo + '</td>'
      + '<td class="ofc-cell" style="color:#999;">…</td>'
      + '<td class="en-cell"></td>'
      + '<td class="num-cell" style="color:#999;font-size:6.5pt;">取得中…</td>'
      + '<td class="dept-cell">' + deptCheckboxHtml(null) + '</td>'
      + '<td><div class="re-opt"><input type="radio" name="r' + itemNo + '_' + globalIdx + '" value="あり"><span>あり</span></div><div class="re-opt"><input type="radio" name="r' + itemNo + '_' + globalIdx + '" value="なし" checked><span>なし</span></div></td>'
      + '<td class="chk-cell"><input type="checkbox"></td>'
      + '<td><label class="biko-lbl"><input type="checkbox">メール画面確認</label></td>'
      + '<td></td>'
      + '<td class="knin-cell"></td>'
      + '</tr>';
  }

  if(slot.status === 'error' || (slot.parsed && slot.parsed.error)){
    // エラー行：番号セルにエラーメッセージを表示し、担当部門・再入国は空欄のまま
    const msg = slot.status === 'error' ? slot.message : slot.parsed.error;
    return ''
      + '<tr>'
      + '<td>' + itemNo + '</td>'
      + '<td class="ofc-cell" style="color:#dc2626;font-weight:700;">⚠</td>'
      + '<td class="en-cell"></td>'
      + '<td class="num-cell" style="color:#dc2626;font-size:6.3pt;text-align:left;padding-left:4px;">' + esc(msg) + '</td>'
      + '<td class="dept-cell">' + deptCheckboxHtml(null) + '</td>'
      + '<td><div class="re-opt"><input type="radio" name="r' + itemNo + '_' + globalIdx + '" value="あり"><span>あり</span></div><div class="re-opt"><input type="radio" name="r' + itemNo + '_' + globalIdx + '" value="なし" checked><span>なし</span></div></td>'
      + '<td class="chk-cell"><input type="checkbox"></td>'
      + '<td><label class="biko-lbl"><input type="checkbox">メール画面確認</label></td>'
      + '<td></td>'
      + '<td class="knin-cell"></td>'
      + '</tr>';
  }

  const p = slot.parsed;
  const ofcHtml = (p.branch === '東オン')
    ? '<label style="display:block;text-align:center;"><span class="ex-sel">東オン</span></label><label style="display:block;text-align:center;">横オン</label>'
    : '<label style="display:block;text-align:center;">東オン</label><label style="display:block;text-align:center;"><span class="ex-sel">横オン</span></label>';

  return ''
    + '<tr>'
    + '<td>' + itemNo + '</td>'
    + '<td class="ofc-cell">' + ofcHtml + '</td>'
    + '<td class="en-cell">' + esc(p.code) + '</td>'
    + '<td class="num-cell"><input type="text" value="' + esc(p.number) + '"></td>'
    + '<td class="dept-cell">' + deptCheckboxHtml(slot.deptKey) + '</td>'
    + '<td><div class="re-opt"><input type="radio" name="r' + itemNo + '_' + globalIdx + '" value="あり"><span>あり</span></div><div class="re-opt"><input type="radio" name="r' + itemNo + '_' + globalIdx + '" value="なし" checked><span>なし</span></div></td>'
    + '<td class="chk-cell"><input type="checkbox"></td>'
    + '<td><label class="biko-lbl"><input type="checkbox">メール画面確認</label></td>'
    + '<td></td>'
    + '<td class="knin-cell"></td>'
    + '</tr>';
}

// 例行（固定）のHTML
const EXAMPLE_ROW_HTML = ''
  + '<tr>'
  + '<td style="font-size:8pt; font-weight:bold; background:#e8e8e8;">例</td>'
  + '<td style="font-size:6.5pt; background:#e8e8e8;"><span class="ex-sel">東オン</span><br>横オン</td>'
  + '<td style="font-size:8pt; font-weight:bold; background:#e8e8e8;">EN</td>'
  + '<td style="font-size:8pt; background:#e8e8e8;">24000×××</td>'
  + '<td class="dept-cell" style="background:#e8e8e8; font-size:7pt;">'
  +   '<div class="dept-row"><span>&#9745;労1</span><span>&#9744;労2</span><span>&#9744;労3</span></div>'
  +   '<div class="dept-row"><span>&#9744;留学</span><span>&#9744;研・短</span></div>'
  +   '<div class="dept-row"><span>&#9744;永住</span><span>&#9744;その他</span></div>'
  + '</td>'
  + '<td style="background:#e8e8e8;">'
  +   '<div class="re-opt">&#9745;あり</div>'
  +   '<div class="re-opt">&#9744;なし</div>'
  + '</td>'
  + '<td colspan="4" class="diag" style="background:#e8e8e8;"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="0" x2="100" y2="100" stroke="#000" stroke-width="1"/></svg></td>'
  + '</tr>';

// 1ページ分（ヘッダーテーブル＋メインテーブル＋注釈）のHTMLを生成
// pageIdx: 0始まり。pageIdx===0 のときだけヘッダー欄が実体（id付き入力欄）、1以降は値表示用の複製（同期はJSで行う）
function buildPageHtml(pageIdx, rowsForThisPage){
  const isFirst = pageIdx === 0;
  const idSuffix = isFirst ? '' : '_p' + pageIdx;

  let rowsHtml = EXAMPLE_ROW_HTML;
  for(let i = 0; i < ROWS_PER_PAGE; i++){
    const itemNo = i + 1;
    const globalIdx = pageIdx * ROWS_PER_PAGE + i;
    const row = rowsForThisPage[i] || null;
    rowsHtml += buildRowHtml(itemNo, row, globalIdx);
  }

  return ''
    + '<div class="doc madoguchi-page madoguchi-page-block">'
    + '<div class="page">'
    + '<div class="top-right">受付担当者</div>'
    + '<div class="form-title">オンライン申請（窓口受領用）</div>'
    + '<table class="htbl">'
    + '<tr><td class="uline" style="width:480px;"><input type="text" class="f_year" id="f_year' + idSuffix + '" style="width:55px;flex:none;" ' + (isFirst ? '' : 'readonly') + '>　年(YEAR)　　<input type="text" class="f_month" id="f_month' + idSuffix + '" style="width:40px;flex:none;" ' + (isFirst ? '' : 'readonly') + '>　月(MONTH)　　<input type="text" class="f_day" id="f_day' + idSuffix + '" style="width:40px;flex:none;" ' + (isFirst ? '' : 'readonly') + '>　日(DAY)</td></tr>'
    + '<tr><td class="uline" style="width:480px;">受領者名 (NAME)　　'
    +   (isFirst
          ? '<select class="f_receiver" id="f_receiver' + idSuffix + '" style="border:none;outline:none;font-family:inherit;font-size:9pt;background:transparent;flex:1;padding:0 0 0 6px;"><option value="">-- 選択 --</option><option value="中林俊介">中林俊介</option><option value="田中綾美">田中綾美</option></select>'
          : '<input type="text" class="f_receiver" id="f_receiver' + idSuffix + '" readonly style="border:none;outline:none;font-family:inherit;font-size:9pt;background:transparent;flex:1;padding:0;">')
    + '</td></tr>'
    + '<tr><td class="uline" style="width:480px;">電話番号 (TEL)　　<input type="text" class="f_tel" id="f_tel' + idSuffix + '" value="03-6424-8849" ' + (isFirst ? '' : 'readonly') + '></td></tr>'
    + '<tr style="position:relative;"><td style="position:absolute; left:-78px; bottom:1px; font-size:8pt; white-space:nowrap; border:none; padding:0;">（取次の場合）</td><td class="uline" style="width:480px; border-bottom:1.5px solid #000;">所属機関名　　<input type="text" class="f_company" id="f_company' + idSuffix + '" value="大房行政書士法人" ' + (isFirst ? '' : 'readonly') + '></td></tr>'
    + '</table>'
    + '<div class="instruction">太枠内を記入してください。</div>'
    + '<table class="mtbl">'
    + '<colgroup><col style="width:4%"><col style="width:9%"><col style="width:4%"><col style="width:22%"><col style="width:19%"><col style="width:8%"><col style="width:9%"><col style="width:14%"><col style="width:5.5%"><col style="width:5.5%"></colgroup>'
    + '<thead>'
    + '<tr><th rowspan="2">項番</th><th colspan="3" rowspan="2">申請受付番号</th><th rowspan="2">担当部門<br>（※1）</th><th rowspan="2" style="font-size:6.5pt;">再入国<br>許可<br>申請<br>（※2）</th><th colspan="2">職員記入欄</th><th rowspan="2" style="font-size:6.5pt;">証印等<br>発行者</th><th rowspan="2">確認者</th></tr>'
    + '<tr><th style="font-size:6.5pt;">みなし<br>再入国<br>の説明</th><th style="font-size:6.5pt;">備考欄</th></tr>'
    + '</thead>'
    + '<tbody>' + rowsHtml + '</tbody>'
    + '</table>'
    + '<div class="notes">'
    + '<div class="note-blk"><div class="note-ttl">※1　担当部門一覧</div><div class="note-box">'
    +   '<div class="note-li">【労１】技術・人文知識・国際業務／法律・会計業務／研究／企業内転勤／高度専門職１号イ・ロ・ハ</div>'
    +   '<div class="note-li">【労２】技能／経営・管理／興行／公用／教授／教育／芸術／宗教／報道／医療／介護</div>'
    +   '<div class="note-li">【労３】特定技能１号　　　　　【研・短】技能実習１号・２号・３号／文化活動／研修</div>'
    +   '<div class="note-li">【留学】留学　　　　　　　　【永住】日本人の配偶者等／永住者の配偶者等／定住者</div>'
    +   '<div class="note-li2">◆「家族滞在」の期間更新または資格変更の方は、扶養者の在留資格に該当する担当部門に☑してください。</div>'
    +   '<div class="note-li2">◆「特定活動」の期間更新または資格変更の方で、担当部門がご不明の場合は職員にお声かけください。</div>'
    + '</div></div>'
    + '<div class="note-blk"><div class="note-ttl">※2　みなし再入国許可とは</div><div class="note-box">'
    +   '<div class="note-li">出国後１年が経過する日又は在留期間が満了する日のいずれか早い日までに再入国を予定する方は、出国の際にその旨申し出ることにより再入国許可を受けることなく出国し、再入国することができます。</div>'
    + '</div></div>'
    + '</div>'
    + '</div>'
    + '</div>';
}

// ヘッダー入力欄（1ページ目）の値を2ページ目以降の表示用欄にコピーする
function syncHeaderToOtherPages(){
  const fields = ['f_year','f_month','f_day','f_receiver','f_tel','f_company'];
  fields.forEach(name => {
    const master = document.getElementById(name); // pageIdx 0（idSuffix無し）
    if(!master) return;
    const val = master.value;
    document.querySelectorAll('.' + name).forEach(el => {
      if(el.id !== name) el.value = val;
    });
  });
}

function attachHeaderSyncListeners(){
  const fields = ['f_year','f_month','f_day','f_receiver','f_tel','f_company'];
  fields.forEach(name => {
    const master = document.getElementById(name);
    if(master) master.addEventListener('input', syncHeaderToOtherPages);
    if(master) master.addEventListener('change', syncHeaderToOtherPages);
  });
}

function renderMadoguchiPages(){
  // 1ページ目入力中の値を退避（再描画で消えないように）
  const savedHeader = {};
  ['f_year','f_month','f_day','f_receiver','f_tel','f_company'].forEach(name => {
    const el = document.getElementById(name);
    if(el) savedHeader[name] = el.value;
  });

  const pageCount = Math.max(1, Math.ceil(_slots.length / ROWS_PER_PAGE));
  let html = '';
  for(let pageIdx = 0; pageIdx < pageCount; pageIdx++){
    const start = pageIdx * ROWS_PER_PAGE;
    const slotsForThisPage = _slots.slice(start, start + ROWS_PER_PAGE);
    html += buildPageHtml(pageIdx, slotsForThisPage);
  }
  document.getElementById('pageArea').innerHTML = html;

  // 年(YEAR)は初回のみ今日の日付を自動セット（編集可能）
  if(savedHeader.f_year === undefined || savedHeader.f_year === ''){
    const today = new Date();
    savedHeader.f_year = String(today.getFullYear());
    savedHeader.f_month = String(today.getMonth() + 1);
    savedHeader.f_day = String(today.getDate());
  }

  // 退避していた値を1ページ目に復元
  Object.keys(savedHeader).forEach(name => {
    const el = document.getElementById(name);
    if(el && savedHeader[name] !== undefined) el.value = savedHeader[name];
  });

  attachHeaderSyncListeners();
  syncHeaderToOtherPages();
}

// サイドバーのスロット入力欄一覧を描画
function renderSlotList(){
  const wrap = document.getElementById('slotList');
  const pageCount = Math.ceil(_slots.length / ROWS_PER_PAGE);
  let html = '';
  for(let p = 0; p < pageCount; p++){
    html += '<div class="slot-pagehead">' + (p === 0 ? '1ページ目（項番1〜10）' : (p + 1) + 'ページ目（項番1〜10）') + '</div>';
    for(let i = 0; i < ROWS_PER_PAGE; i++){
      const idx = p * ROWS_PER_PAGE + i;
      const slot = _slots[idx];
      let cls = 'slot-input';
      let val = '';
      let errMsg = '';
      if(slot){
        val = slot.caseId || '';
        if(slot.status === 'loading') cls += ' loading';
        else if(slot.status === 'error'){ cls += ' error'; errMsg = slot.message; }
        else if(slot.status === 'filled'){
          if(slot.parsed && slot.parsed.error){ cls += ' error'; errMsg = slot.parsed.error; }
          else cls += ' filled';
        }
      }
      html += '<div class="slot-row">'
        + '<span class="slot-no">' + (i + 1) + '</span>'
        + '<input type="text" class="' + cls + '" data-idx="' + idx + '" value="' + esc(val) + '" placeholder="caseId=...の値" autocomplete="off"'
        + " onkeydown=\"if(event.key==='Enter'){this.blur();}\""
        + ' onchange="loadSlot(' + idx + ', this.value)">'
        + '<button type="button" class="slot-del" data-idx="' + idx + '" onclick="removeSlot(' + idx + ')"' + (slot ? '' : ' disabled') + '>✕</button>'
        + '</div>';
      if(errMsg) html += '<div class="slot-errtext">' + esc(errMsg) + '</div>';
    }
  }
  wrap.innerHTML = html;

  const filledCount = _slots.filter(s => s && s.status === 'filled' && !(s.parsed && s.parsed.error)).length;
  const errorCount = _slots.filter(s => s && (s.status === 'error' || (s.parsed && s.parsed.error))).length;
  let label = filledCount + '件登録済み';
  if(errorCount > 0) label += '（エラー' + errorCount + '件）';
  document.getElementById('rowCountLabel').textContent = label;
}

function renderAll(){
  renderSlotList();
  renderMadoguchiPages();
}

function doPrint(){ window.print(); }

// 初期描画
renderAll();
</script>
