施策関係｜＿)\" style=\"width:17.00em\">)</p><p class=\"vi\" style=\"padding-left:6.30em\">หมายเหตุ:</p></td>"],0,1],[2244,16,2543715452,["<p class=\"vi\">(หมายเหตุ)</p>","<p class=\"vi\">1\tสำหรับช่อง I เฉพาะในกรณีที่มีผู้รับการช่วยเหลือหลายคนและมีเนื้อหาการช่วยเหลือเหมือนกันเท่านั้น สามารถที่จะกรอกใน “ช่อง 1 ชื่อ-นามสกุล” ว่า “ตามรายชื่อในเอกสารแนบ” แล้วแนบรายชื่อที่เขียนไว้ในช่องที่ I ดังกล่าว (รูปแบบตามอิสระ) ได้ ทั้งนี้ เฉพาะในกรณีที่ยื่นขอพร้อมกันเท่านั้น</p>","<p class=\"vi\">2\tสำหรับข้อที่ 4 ในช่อง II ให้กรอกเฉพาะในกรณีที่องค์กรที่แรงงานเฉพาะทางสังกัดได้ดำเนินการตามแผนการช่วยเหลือแรงงานเฉพาะทางชาวต่างชาติที่ 1 เองเท่านั้น</p>","<p class=\"vi\">3\tสำหรับช่องที่ III ให้กรอกเฉพาะในกรณีที่จ้างวานองค์กรที่ให้การช่วยเหลือที่ได้จดทะเบียนแล้ว ให้เป็นผู้ดำเนินการตามแผนการช่วยเหลือแรงงานเฉพาะทางชาวต่างชาติที่ 1 ทั้งหมดเท่านั้น</p>","<p class=\"vi\">4\tในช่อง “แผนในการดำเนินการ” ของตั้งแต่ข้อที่ 1 ถึงข้อที่ 9 ในช่อง IV ให้ใส่เครื่องหมายถูกตามจริง ในกรณีที่ตอบว่า “มี” ในช่องแผนในการดำเนินการ ให้กรอกช่วงระยะเวลาในการดำเนินการอย่างง่ายๆ และในกรณีที่ตอบว่า “ไม่มี” ในช่องแผนในการดำเนินการ ให้กรอกเหตุผลที่ไม่มีดำเนินการช่วยเหลือลงในวงเล็บ</p>","<p class=\"vi\">5 ในช่อง “มีการจ้างวานภายนอกหรือไม่” ของตั้งแต่ข้อที่ 1 ถึง 9 ในช่อง IV ให้กรอกว่า “มี” เฉพาะในกรณีที่องค์กรที่แรงงานเฉพาะทางสังกัดได้จ้างวานบุคคลที่สามให้ดำเนินการช่วยเหลือในบางส่วน (ยกเว้นในกรณีที่จ้างวานองค์กรที่ให้การช่วยเหลือที่ได้จดทะเบียนแล้ว) และในกรณีที่องค์กรที่แรงงานเฉพาะทางสังกัดได้ดำเนินการช่วยเหลือเอง หรือจ้างวานองค์กรที่ให้การช่วยเหลือที่ได้จดทะเบียนแล้วดำเนินการช่วยเหลือทั้งหมด ให้กรอกว่า “ไม่มี”</p>","<p class=\"vi\">6 ในช่อง “ผู้มีหน้าที่ในการช่วยเหลือหรือผู้ที่มีหน้าที่ดำเนินการจากงานที่ได้รับการจ้างวาน” ของตั้งแต่ข้อที่ 1 ถึง 8 ในช่อง IV ให้กรอกชื่อ-นามสกุล และในวงเล็บให้กรอกตำแหน่งของผู้รับผิดชอบในการช่วยเหลือที่ถูกแต่งตั้งขึ้นในกรณีที่องค์กรที่แรงงานเฉพาะทางสังกัดได้ดำเนินการช่วยเหลือเอง หรือจ้างวานองค์กรที่ให้การช่วยเหลือที่ได้จดทะเบียนแล้วดำเนินการช่วยเหลือทั้งหมดลงในแต่ละหัวข้อการช่วยเหลือ ในกรณีที่บุคคลที่สามซึ่งได้รับการจ้างวานบางส่วนจากองค์กรที่แรงงานเฉพาะทางสังกัดเป็นผู้ดำเนินการช่วยเหลือ ให้กรอกชื่อ-นามสกุลและที่อยู่ของผู้ที่รับการจ้างวานให้ดำเนินการช่วยเหลือ</p>","<p class=\"vi\" style=\"text-indent:0.86em\">อนึ่ง ในช่อง “ผู้รับผิดชอบในการช่วยเหลือหรือผู้มีหน้าที่ในการช่วยเหลือ” ของข้อที่ 9 ช่อง IV ให้กรอกชื่อ-นามสกุล และในวงเล็บให้กรอกตำแหน่งของผู้รับผิดชอบหรือผู้มีหน้าที่ในการช่วยเหลือที่ถูกแต่งตั้งขึ้นในกรณีที่องค์กรที่แรงงานเฉพาะทางสังกัดได้ดำเนินการช่วยเหลือเอง หรือกรณีจ้างวานองค์กรที่ให้การช่วยเหลือที่ได้จดทะเบียนแล้วดำเนินการช่วยเหลือทั้งหมด โดยในการกรอกข้อมูลเหล่านี้ ในช่อง b และช่องกรอกข้อความอิสระ กรณีที่บุคคลที่สามซึ่งได้รับการจ้างวานจากองค์กรที่แรงงานเฉพาะทางสังกัดให้ดำเนินการบางส่วนในการช่วยเหลือตามที่ระบุในช่องเดียวกัน ให้กรอกชื่อ-นามสกุลและที่อยู่ของผู้รับจ้างวานการช่วยเหลือนั้น</p>","<p class=\"vi\">7\tในช่อง “วิธีการดำเนินการ” ของข้อที่ 1 ถึงข้อที่ 4 และข้อที่ 9 ในช่อง IV ให้ใส่เครื่องหมายถูกในข้อที่ดำเนินการ และในกรณีที่ใส่เครื่องหมายถูกที่ “อื่นๆ” ให้กรอกวิธีการดำเนินการลงในวงเล็บด้วย</p>","<p class=\"vi\">8\tในส่วนของ “ความกว้างของห้อง” ในช่อง IV-3-A-d ให้เลือกช่องใส่เครื่องหมายถูกในวงเล็บในข้อที่ดำเนินการ</p>","<p class=\"vi\">ข้อ② ถึงข้อ④ จะต้องระบุเฉพาะในกรณีที่เลือก “มี” ในข้อ①</p>","<p class=\"vi\">ข้อ③ ให้เลือก “เป็นทรัพย์สินของตนเอง” หรือ “เป็นทรัพย์สินที่เช่า”</p>","<p class=\"vi\">ข้อ④ ควรระบุตามแนวทางต่อไปนี้ และต้องมีการอธิบายอย่างเหมาะสม</p>","<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- กรณีข้อ③ เลือก “เป็นทรัพย์สินของตนเอง”: จำนวนค่าใช้จ่ายที่ใช้ในการก่อสร้างหรือปรับปรุง อายุการใช้งานของทรัพย์สิน จำนวนคนงานต่างชาติทักษะเฉพาะทางที่เข้าพัก เป็นต้น ควรอธิบายให้สามารถให้เหตุผลได้ว่าเป็นจำนวนเงินที่สมเหตุสมผล</p>","<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- กรณีข้อ③ เลือก “เป็นทรัพย์สินที่เช่า”: ค่าเช่าที่ต้องชำระ (รวมถึงค่าบริการจัดการ ค่าบริการร่วมใช้ ฯลฯ แต่ไม่รวมเงินมัดจำ ค่าธรรมเนียม ค่าประกัน ค่าธรรมเนียมการจัดหา) หารด้วยจำนวนคนงานต่างชาติทักษะเฉพาะทางที่เข้าพัก</p>","<p class=\"vi\">9 ในส่วนของ “เวลาที่ให้คำปรึกษา” ในช่อง IV-6-B ให้กรอกช่วงเวลาลงในวันที่สามารถให้คำปรึกษาได้</p>"],0,1],[2263,2,1942020107,["<p class=\"vi\" style=\"padding-left:3.00em;text-indent:-3.00em\">การช่วยเหลือตามที่ได้กล่าวมานี้ จะดำเนินการอย่างเหมาะสมโดยคำนึงถึงนโยบายที่องค์กรท้องถิ่นดำเนินการเพื่อบรรลุสังคมที่อยู่ร่วมกัน</p>","<p class=\"vi\">นอกจากนี้แล้ว ทางเราได้แปลเอกสารนี้เป็นภาษาที่ผู้รับการช่วยเหลือเข้าใจเป็นอย่างดี และได้มอบให้กับผู้รับการช่วยเหลือพร้อมกับอธิบายเนื้อหาอย่างเพียงพอ</p>"],0,1],[2267,1,1846093434,["<tr><td class=\"lb\"><p class=\"ja\">特定技能所属機関の氏名又は名称</p><p class=\"vi\">ชื่อ-นามสกุลหรือชื่อองค์กรที่แรงงานเฉพาะทางสังกัด</p></td>"],0,1],[2269,1,617466521,["<tr><td class=\"lb\"><p class=\"ja\">作成責任者の氏名</p><p class=\"vi\">ชื่อ-นามสกุลของผู้รับผิดชอบในการจัดทำ</p></td>"],0,1],[2274,2,4244995961,["<p class=\"vi\" style=\"padding-left:3.00em;text-indent:-3.00em\">ข้าพเจ้าได้รับเอกสารฉบับแปลเป็นภาษา<span class=\"p17ul\">ไทย</span>ของเอกสารฉบับนี้ และได้รับการอธิบายเกี่ยวกับเนื้อหาในเอกสารและเข้าใจเป็นอย่างดี</p>","<p class=\"vi\">นอกจากนี้ ข้าพเจ้าได้รับคำอธิบายเกี่ยวกับวิธีการดำเนินการสัมภาษณ์พูดคุยเป็นระยะตามข้อ 9-A-a ช่อง IV และเข้าใจเนื้อหานั้นอย่างครบถ้วน และขอเลือกดำเนินการตามแบบที่ต้องการ  <input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f408\" disabled>การผสมผสานระหว่างแบบซึ่งหน้าและออนไลน์  <input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f409\" disabled>แบบซึ่งหน้าเท่านั้น</p>"],0,1],[2277,1,31155209,["<p class=\"vi p17sign-date\" style=\"margin-top:.1em\">วันที่ลงลายมือชื่อ　วันที่ ${v('es_createD')||'　'} เดือน ${v('es_createM')||'　'} ปี ${v('es_createY')||'　　'}</p>"],0,1],[2279,1,3300998647,["<p class=\"vi\" style=\"margin-left:34%\">ลายมือชื่อของแรงงานเฉพาะทางชาวต่างชาติที่ 1</p>"],0,1],[2323,4,3624395170,["    var _nat=String(pd.nationality||pd.nationality_ja||'').trim();","    if(_nat && !/タイ|Thai/i.test(_nat)){","      console.warn('[1-17th] 申請人の国籍が「'+_nat+'」ですが、この書類はタイ語版です。');","      if(typeof showToast==='func
