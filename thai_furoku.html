<script>
function _esc(t){ return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function _join(ids){ return ids.map(i=>String(v(i)||'').trim()).filter(Boolean).join('　'); }
function _joinEn(ids){ return ids.map(i=>String(v(i)||'').trim()).filter(Boolean).join('  '); }
// 線の上は日本語、かっこの中は英語だけ
function _par(en){
  if(!en) return '（　　　　　　　　　　　　　　　　　　）';
  return `<span class="bk">（</span><span class="in"><div class="en">${_esc(en)}</div></span><span class="bk">）</span>`;
}
function _ln(jp){ return `<div class="ln">${jp?_esc(jp):''}</div>`; }
// 役職の英訳（案シスに英語が無いときに使う）
const _TITLE_EN=[[/^代表取締役(社長)?$/,'CEO'],[/^代表取締役会長$/,'Chairman and CEO'],[/^代表取締役副社長$/,'Executive Vice President'],[/^取締役社長$/,'President'],[/^社長$/,'President'],[/^(取締役)?会長$/,'Chairman'],[/^取締役$/,'Director'],[/^代表理事(長)?$/,'Representative Director'],[/^理事長$/,'Chairman'],[/^組合長$/,'Chairman'],[/^代表社員$/,'Representative Partner'],[/^業務執行社員$/,'Executive Partner'],[/^院長$/,'Director'],[/^園長$/,'Director'],[/^施設長$/,'Facility Director'],[/^(個人)?事業主$/,'Owner'],[/^代表(者)?$/,'Representative']];
function _titleEn(jp){
  const t=String(jp||'').replace(/[\s　]+/g,''); if(!t) return '';
  for(const [re,en] of _TITLE_EN){ if(re.test(t)) return en; }
  // 決まった形でないとき（「取締役CEO社長」など）は、含まれる言葉で訳す
  if(/CEO/i.test(t)) return 'CEO';
  if(/代表取締役/.test(t)) return 'CEO';
  if(/会長/.test(t)) return 'Chairman';
  if(/社長/.test(t)) return 'President';
  if(/理事長|組合長/.test(t)) return 'Chairman';
  if(/代表/.test(t)) return 'Representative';
  if(/取締役/.test(t)) return 'Director';
  return '';
}
// 登録支援機関（証人）の役職の英訳：1-17号（1_17_en.html の _P17_TITLE_EN・_p17TitleEn）と同じ表・同じ引き方
const _P17_TITLE_EN=[['代表取締役社長','President and CEO'],['代表取締役会長','Chairman and CEO'],['代表取締役','Representative Director'],['取締役社長','President'],['専務取締役','Senior Managing Director'],['常務取締役','Managing Director'],['取締役','Director'],['代表理事','Representative Director'],['理事長','Chairperson'],['専務理事','Executive Director'],['常務理事','Managing Director'],['理事','Director'],['代表社員','Representative Partner'],['事務局長','Secretary General'],['統括事務長','Chief Administrator'],['事務長','Administrator'],['管理本部長','General Manager, Administration'],['本部長','General Manager'],['事業部長','Division Manager'],['部長','General Manager'],['次長','Deputy General Manager'],['課長','Section Manager'],['係長','Chief'],['主任','Chief'],['室長','Office Manager'],['支店長','Branch Manager'],['所長','Office Manager'],['シニアマネージャー','Senior Manager'],['マネージャー','Manager'],['マネジャー','Manager'],['リーダー','Leader'],['社長','President'],['会長','Chairman'],['代表','Representative'],['一般社員','Staff'],['社員','Staff'],['職員','Staff'],['スタッフ','Staff'],['総務','General Affairs'],['職業紹介責任者','Employment Placement Manager'],['支援責任者','Support Manager'],['支援担当者','Support Staff'],['役職なし','None'],['なし','None'],['無','None']];
function _p17TitleEn(t){
  t=String(t||'').replace(/\s/g,'');
  if(!t) return '';
  for(var i=0;i<_P17_TITLE_EN.length;i++) if(t===_P17_TITLE_EN[i][0]) return _P17_TITLE_EN[i][1];
  for(var j=0;j<_P17_TITLE_EN.length;j++){ var k=_P17_TITLE_EN[j][0]; if(k.length>=2 && !/なし|^無$/.test(k) && t.slice(-k.length)===k) return _P17_TITLE_EN[j][1]; }
  return '';
}
// ふりがな → ローマ字（ヘボン式・大文字）
function _kanaRoma(k){
  // ひらがなのふりがなだけをローマ字にする（カタカナの外国人名は読みが合わないので使わない）
  let t=String(k||'').trim();
  if(!t || /[^\u3041-\u3096ー\s　・]/.test(t)) return '';
  const Y={'きゃ':'kya','きゅ':'kyu','きょ':'kyo','しゃ':'sha','しゅ':'shu','しょ':'sho','ちゃ':'cha','ちゅ':'chu','ちょ':'cho','にゃ':'nya','にゅ':'nyu','にょ':'nyo','ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo','みゃ':'mya','みゅ':'myu','みょ':'myo','りゃ':'rya','りゅ':'ryu','りょ':'ryo','ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo','じゃ':'ja','じゅ':'ju','じょ':'jo','びゃ':'bya','びゅ':'byu','びょ':'byo','ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo'};
  const M={'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko','さ':'sa','し':'shi','す':'su','せ':'se','そ':'so','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to','な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no','は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho','ま':'ma','み':'mi','む':'mu','め':'me','も':'mo','や':'ya','ゆ':'yu','よ':'yo','ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':'o','ん':'n','が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo','だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo','ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po','ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o','ゔ':'vu'};
  const words=t.split(/[\s　・]+/).filter(Boolean).map(w=>{
    let o='',i=0;
    while(i<w.length){
      const two=w.substr(i,2), c=w[i];
      if(c==='っ'){ const nx=Y[w.substr(i+1,2)]||M[w[i+1]]||''; o+=nx.startsWith('ch')?'t':(nx[0]||''); i++; continue; }
      if(c==='ー'){ i++; continue; }
      if(Y[two]){ o+=Y[two]; i+=2; continue; }
      if(M[c]!=null){ o+=M[c]; i++; continue; }
      i++;
    }
    return o.replace(/ou/g,'o').replace(/uu/g,'u');
  });
  return words.map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
}
// 外国人の氏名：あだ名・番号・カタカナを外してパスポートのローマ字だけにする
function _cleanApp(t){
  let x=String(t||'').replace(/[\r\n]+/g,' ');
  const m=x.match(/[（(]\s*([A-Za-z][A-Za-z\s　.\-']+?)\s*[)）]/);   // カタカナ(ROMAN) の形
  if(m && /[\u30a0-\u30ff]/.test(x.replace(m[0],''))) x=m[1];
  x=x.replace(/[（(][^）)]*[）)]/g,' ');                    // (あだ名)・(2) を外す
  x=x.replace(/[\s　]+/g,' ').trim();
  return /^[A-Za-z][A-Za-z .\-']*$/.test(x)?x.toUpperCase():'';
}
function _sp(t){ return String(t||'').replace(/[\s　]+/g,' ').trim(); }
// 印刷前の空欄チェック
function _tfCheck(){
  const box=document.getElementById('tfWarn'); if(!box) return;
  const need=[['f_company','所属機関名'],['f_repTitle','所属機関 代表者の役職'],['f_repName','所属機関 代表者の氏名'],['f_companyEn','所属機関名（英語）'],['f_repTitleEn','所属機関 代表者の役職（英語）'],['f_repNameEn','所属機関 代表者の氏名（英語）'],['f_applicant','外国人の氏名（ローマ字）'],['f_soName','登録支援機関名'],['f_soTitle','登録支援機関 代表者の役職'],['f_soRep','登録支援機関 代表者の氏名'],['f_soNameEn','登録支援機関名（英語）'],['f_soTitleEn','登録支援機関 代表者の役職（英語）'],['f_soRepEn','登録支援機関 代表者の氏名（英語）']];
  const miss=need.filter(([id])=>!String(v(id)||'').trim()).map(x=>x[1]);
  const nick=/[（(]|[^A-Za-z .\-']/.test(String(v('f_applicant')||'').trim());
  if(!miss.length && !nick){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display='block';
  box.innerHTML='⚠️ <b>印刷前に入れてください</b><br>'+(miss.length?('空欄：'+miss.join('、')):'')+(nick?((miss.length?'<br>':'')+'外国人の氏名にローマ字以外（あだ名・カタカナなど）が入っています。パスポートのとおりに直してください'):'');
}

  if(_editMode) return;
  _tfCheck();
  const w=document.getElementById('pageArea'); if(!w) return;
  w.innerHTML=`
<div class="doc">
<div class="page-num-label">P1</div>
<div class="bd" style="font-size:12pt;">
<div class="c th" style="font-size:16pt;">บันทึกแนบท้ายสัญญาจ้าง</div>
<div class="c" style="font-size:16pt;">雇用契約書の付録</div>
<div class="gap"></div><div class="gap"></div>
<div class="th">องค์กรที่แรงงานที่มีทักษะเฉพาะสังกัด　<span class="ul">${f('f_company')}</span></div>

<div class="gap"></div><div class="gap"></div>
<div class="sg"><div>特定技能所属機関<br><span class="th" style="font-size:11.5pt;">องค์กรที่แรงงานที่มีทักษะเฉพาะสังกัด</span></div>${_ln(_join(['f_company','f_repTitle','f_repName']))}<div>㊞</div></div>
<div class="sg" style="margin-top:3pt;"><div class="pr">${_par(_joinEn(['f_companyEn','f_repTitleEn','f_repNameEn']))}</div></div>

async function loadFromDB(passedInfo){
  let info = passedInfo;
  if(!info){
    const sel=document.getElementById('caseSelect');
    if(!sel.value) return;
    try{info=JSON.parse(sel.value);}catch(e){return;}
  }
  if(!info || !info.caseId) return;
  const {caseId}=info;
  const s=(id,val)=>{const e=document.getElementById(id); if(e&&val!=null&&String(val).trim()!=='') e.value=String(val).trim();};
  // 案件を選び直したとき、前の案件の値を残さない
  ['f_company','f_repTitle','f_repName','f_companyEn','f_repTitleEn','f_repNameEn','f_applicant','f_soName','f_soTitle','f_soRep','f_soNameEn','f_soTitleEn','f_soRepEn'].forEach(i=>{const e=document.getElementById(i); if(e) e.value='';});
  try{
    const [cases,persons]=await Promise.all([
      sb('cases?select=applicant,company,company_id,org&id=eq.'+caseId),
      sb('persons?select=applicant_name_en&case_id=eq.'+caseId)
    ]);
    const cas=cases&&cases[0], pd=persons&&persons[0];
    // 実在する列だけを指定する（無い列を混ぜると全部止まる）
    const cs='name,rep_title,rep_name,name_en,rep_title_en,rep_name_en';
    let co=null; const cid=info.companyId||(cas&&cas.company_id);
    if(cid){ const r=await sb('companies?select='+cs+'&id=eq.'+cid); co=r&&r[0]; }
    if(!co){ const nm=info.companyName||info.company||(cas&&cas.company); if(nm){ const r=await sb('companies?select='+cs+'&name=eq.'+encodeURIComponent(nm)); co=r&&r[0]; } }
    s('f_applicant',_cleanApp(pd&&pd.applicant_name_en)||_cleanApp(cas&&cas.applicant)||_cleanApp(info.applicant)||_sp((pd&&pd.applicant_name_en)||(cas&&cas.applicant)||''));
    s('f_company',(co&&co.name)||(cas&&cas.company)||info.companyName||info.company||'');
    if(co){
      s('f_repTitle',_sp(co.rep_title)); s('f_repName',_sp(co.rep_name).replace(/ /g,'　'));
      s('f_companyEn',_sp(co.name_en));
      s('f_repTitleEn',_sp(co.rep_title_en).replace(/^Directors$/i,'Director')||_titleEn(co.rep_title)||(co.rep_name?'Representative':''));
      s('f_repNameEn',_sp(co.rep_name_en));
      // 役職が案シスに無いときは「代表者」
      if(!String(v('f_repTitle')||'').trim() && co.rep_name) s('f_repTitle','代表者');
    }
    // 証人＝案件の登録支援機関（自社支援のときは入れない）
    const orgName=String((cas&&cas.org)||info.orgName||'').trim();
    if(orgName && !/自社/.test(orgName) && typeof findSupportOrg==='function'){
      // ver.20261124.01: 1-17号の登録支援機関欄と同じ列（support_orgs の rep_name / rep_name_en / rep_name_kana）から取る。
      //   役職は support_orgs.rep_title（無ければ「代表者」）。英語は rep_title_en → 1-17号と同じ英訳表 → Representative の順
      const so=await findSupportOrg(orgName,'name,name_en,rep_title,rep_title_en,rep_name,rep_name_en,rep_name_kana');
      s('f_soName',(so&&so.name)||orgName);
      if(so){
        s('f_soNameEn',_sp(so.name_en)); s('f_soRep',_sp(so.rep_name).replace(/ /g,'　')); s('f_soRepEn',_sp(so.rep_name_en)||_kanaRoma(so.rep_name_kana));
        if(so.rep_name){
          const tj=_sp(so.rep_title)||'代表者';
          const tn=_sp(so.rep_title_en)||_p17TitleEn(tj)||'Representative';
          const t=document.getElementById('f_soTitle'); if(t&&!t.value) t.value=tj;
          const te=document.getElementById('f_soTitleEn'); if(te&&!te.value) te.value=tn;
        }
      }
    }
    p(); showToast('✅ データを読み込みました');
  }catch(e){showToast('⚠️ 読込エラー: '+e.message);console.error(e);}
}
initCaseSelect(); p();

function fitDocToPreview(){
  requestAnimationFrame(()=>{
    const pp=document.querySelector('.pp'); const area=document.getElementById('pageArea');
    if(!pp||!area) return;
    const ppW=pp.clientWidth-40, docW=794;
    area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom=(ppW<docW)?(ppW/docW):1; });
  });
}
window.addEventListener('resize', fitDocToPreview);

// index.htmlからの案件選択を受信
window.addEventListener('message', async function(e){
  if(!e.data||e.data.type!=='SELECT_CASE') return;
  const info=e.data.info;
  if(!info||!info.caseId) return;
  const sel=document.getElementById('caseSelect');
  if(sel){
    let found=false;
    for(let o of sel.options){ try{ const d=JSON.parse(o.value); if(d.caseId===info.caseId){sel.value=o.value;found=true;break;} }catch(e2){} }
    if(!found){ const opt=document.createElement('option'); opt.value=JSON.stringify(info); opt.textContent='（indexから選択）'; sel.appendChild(opt); sel.value=opt.value; }
  }
  if(typeof loadCaseToForm==='function'){ await loadCaseToForm(info, 'thai_furoku'); }
  if(typeof loadFromDB==='function') loadFromDB(info);
});
