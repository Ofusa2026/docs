t\" class=\"bl\" id=\"f400\" name=\"f400\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿)\" style=\"width:17.00em\">)</p><p class=\"vi\" style=\"padding-left:6.30em\">Nota:</p><p class=\"ja\" style=\"padding-left:3.78em\">・Lugar ng tinitirahan ng sinusuportahan</p><p class=\"vi\" style=\"padding-left:6.30em\"><input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f380s\" disabled>Katulad ng nasa itaas</p><p class=\"ja\" style=\"padding-left:6.30em\"><input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f380d\" disabled>Ibang lokal na pamahalaan <span class=\"p17gen\" data-gen=\"res\">(<input type=\"text\" class=\"bl\" id=\"f401\" name=\"f401\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜(＿/Tokyo\" style=\"width:1.25em\"> Prepektura, <input type=\"text\" class=\"bl\" id=\"f402\" name=\"f402\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿)\" style=\"width:10.25em\"> Munisipalidad)</span><span class=\"p17val\" data-val=\"res\" style=\"display:none\"></span></p><p class=\"ja\" style=\"padding-left:6.30em\">Petsa ng kompirmasyon: <span data-p17d=\"d\"></span>/<span data-p17d=\"m\"></span>/<span data-p17d=\"y\"></span>　<input type=\"hidden\" class=\"bl\" id=\"f403\" name=\"f403\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿\" style=\"width:2.75em\">Paraan ng kompirmasyon:　<input type=\"checkbox\" class=\"cb\" id=\"f404\" name=\"f404\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> Homepage　 <input type=\"checkbox\" class=\"cb\" id=\"f405\" name=\"f405\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> Iba pang paraan (<input type=\"text\" class=\"bl\" id=\"f406\" name=\"f406\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿)\" style=\"width:17.00em\">)</p><p class=\"vi\" style=\"padding-left:6.30em\">Nota:</p></td>"],0,1],[2244,16,2543715452,["<p class=\"vi\">(Nota)</p>","<p class=\"vi\">1 Sa Seksyon I, kung sakaling ang bibigyan ng suporta ay hindi lamang iisa, at ang nilalaman o detalye ng isusuporta ay pareho din lang, isulat ang [1 Pangalan (Tingnan ang Listahan na nasa ibang papel)]. Ok lamang ito at walang problema kung isasama ang listahan na nasa ibang papel. Subalit ito ay pwede lamang kung ang pag-apply ay gagawin ng sabay.</p>","<p class=\"vi\">2 Sa numero 4 ng Seksyon II, dapat lamang itong sulatan kung ang gagawing plano sa suporta ay gagawin mismo ng ahensya na diretsong tatanggap sa mangagawa.</p>","<p class=\"vi\">3 Sa Seksyon III, ito ay dapat lamang sulatan kung ang planong pag-suporta sa manggagawa ay gagawin ng ibang ahensya na pakikiusapan.</p>","<p class=\"vi\">4 Sa Seksyon IV numero 1 hanggang 9 (Isasagawang Plano), markahan ang nararapat na box, kung sakaling (MERON) ang napili, isulat ng maikli ang petsa kung kelan ito isasagawa, kung (WALA) naman, isulat ang dahilan kung bakit hindi isasagawa.</p>","<p class=\"vi\">5 Sa Seksyon IV numero 1 hanggang 9 (May gagawa bang iba?), markahan ang (MERON) kung ang ahensyang tatanggap ay ipapagawa sa ibang ahensya ang ibang parte ng suporta (maliban kung ipapagawa sa mga rehistradong ahensyang nagbibigay ng suporta). Markahan ang (WALA) kung ang ahensyang tatanggap ay ang sariling magbibigay ng suporta o ipapagawa lahat sa ibang rehistradong ahensya ang pagsuporta.</p>","<p class=\"vi\">6 Sa Seksyon IV numero 1 hanggang 8 (Impormasyon ng magsu-suporta o Gagawa ng suporta), isulat sa bawat support item ang pangalan at ilagay sa parenthesis ang katungkulan ng taong inatasang sumuporta sa oras na sariling magbibigay ng suporta ang ahensyang tatanggap o kaya naman ay kung ipapagawa lahat suporta sa ibang rehistradong ahensya.</p>","<p class=\"vi\" style=\"text-indent:0.86em\">Gayundin, sa Seksyon IV numero 9 (Tagapamahala ng suporta o gagawa ng suporta), dapat na isulat ang pangalan at ilagay sa parenthesis ang katungkulan ng taong inatasang tagapamahala ng suporta o magbibigay ng suporta sa oras na sariling magbibigay ng suporta ang ahensyang tatanggap o kaya naman ay kung ipapagawa lahat suporta sa ibang rehistradong ahensya, at para sa seksyon b at seksyon ng malayang pagsulat, isulat ang pangalan at address ng taong inatasang sumuporta sa oras na magbibigay ng suporta sa parehong seksyon kung ikatlong partido ang inatasang ng institusyong papasukan ng teknikal na manggagawa na magbigay ng parte ng suportang nakasulat sa seksyon na ito.</p>","<p class=\"vi\">7 Sa Seksyon IV, numero 1 hanggang 4, at numero 9 (Paraan ng Pagsasagawa), markahan ang naaangkop na box, kung ang napili ay (Iba pa), isulat sa loob ang detalye nito.</p>","<p class=\"vi\">8 Sa Seksyon IV, numero 3ア d para sa [Luwang ng kwarto], piliin ang naaangkop mula sa check box sa loob ng panaklong.</p>","<p class=\"vi\">Punan lamang ang mula sa ② hanggang sa ④ kung nilagyan ng tsek ang “Mayroon” sa ①.</p>","<p class=\"vi\">Sa ③, lagyan lamang ng tsek ang alinman sa “Sariling ari-arian” o “Naupahang ari-arian”.</p>","<p class=\"vi\">Sa ④, dapat na isulat at ipaliwanag nang naaangkop mula sa mga sumusunod na pananaw:</p>","<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">・Kapag “Sariling ari-arian” ang ③: Halagang maaaring ipaliwanag bilang makatwiran na isinasaalang-alang ang aktwal na ginastos sa pagpapatayo, pagkukumpuni, atbp., durasyon ng napapakinabangan ang ari-arian, bilang ng mga taong titira, atbp.</p>","<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">・Kapag “Naupahang ari-arian” ang ③: Ang renta na kinakailangan para sa pagpapaupa (kabilang ang mga bayarin sa pamamahala at mga bayarin sa maintenance, atbp., ngunit hindi kasama ang mga deposito sa seguridad, key money, garantiyang pera, at mga bayarin sa brokerage) na hinati sa bilang ng mga manggagawang naninirahan sa ari-arian.</p>","<p class=\"vi\">9 Sa Seksyon IV, numero 6 イ [Oras ng Pag-Aksyon], isulat kung anong araw at oras gagawin ang aksyon.</p>"],0,1],[2263,2,1942020107,["<p class=\"vi\" style=\"padding-left:3.00em;text-indent:-3.00em\">Ang suporta sa itaas ay isasagawa nang naaangkop nang isinasaalang-alang ang mga patakarang ipinatupad ng mga lokal na pamahalaan upang maisakatuparan ang lipunang magkakasamang mamuhay.</p>","<p class=\"vi\">Bilang karagdagan, ang mga nilalaman sa dokumentong ito ay isinalin ng magsusuporta sa salitang maiintindihan ng manggagawa, ibinigay ito sa kanila at ipinaliwanag mabuti ang mga nilalaman nito.</p>"],0,1],[2267,1,1846093434,["<tr><td class=\"lb\"><p class=\"ja\">特定技能所属機関の氏名又は名称</p><p class=\"vi\">Pangalan o Tawag sa Ahensya ng Tatanggap</p></td>"],0,1],[2269,1,617466521,["<tr><td class=\"lb\"><p class=\"ja\">作成責任者の氏名</p><p class=\"vi\">Pangalan ng Gumawa at In-Charge</p></td>"],0,1],[2274,2,4244995961,["<p class=\"vi\" style=\"padding-left:3.00em;text-indent:-3.00em\">Ang dokumentong ito na isinalin sa salitang <span class=\"p17ul\">Tagalog</span> ay aking natanggap, at ipinaliwanag nang wasto at aking naintindihan.</p>","<p class=\"vi\">IV 9-A-a: Bilang karagdagan, matapos ipaliwanag sa akin ang tungkol sa paraan ng pagsasagawa ng mga regular na panayam sa IV, 9アa, at lubos na maunawaan ko ang mga nilalaman, nais kong hilingin na isagawa ang mga panayam:  <input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f408\" disabled>sa kumbinasyon ng harapan at online na panayam  <input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f409\" disabled>nang harapan lamang.</p>"],0,1],[2277,1,31155209,["<p class=\"vi p17sign-date\" style=\"margin-top:.1em\">Petsa ng Pagpirma　${v('es_createD')||'　'}/${v('es_createM')||'　'}/${v('es_createY')||'　　'}</p>"],0,1],[2279,1,3300998647,["<p class=\"vi\" style=\"margin-left:34%\">Pirma ng Teknikal na Dayuhang Manggagawa</p>"],0,1],[2324,3,337976243,["    if(_nat && !/フィリピン|PHILIPPIN|FILIPIN/i.test(_nat)){","      console.warn('[1-17mn] 申請人の国籍が「'+_nat+'」ですが、この書類はタガログ語版です。');","      if(typeof showToast==='function') showToast('⚠ 申請人の国籍は「'+_nat+'」です。タガログ語版ではなく該当言語の1-17をお使いください。');"],0,1],[2601,1,2407934466,["    lo = langs.filter(function(x){ return x && x.language_code==='tl'; })[0] || langs.filter(function(x){ return x && x.language_code==='en'; })[0] || null;"],0,1],[2957,1,2593411922,["    if(window._p17MgrReal.name){ set('es_coMgrKana','
