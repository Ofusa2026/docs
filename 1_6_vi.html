077,4,635394049,["      <div>１．自己都合退職の手続&emsp;（退職する&nbsp;${f('es_resignNoticeDays')}&nbsp;日前に社長・工場長等に届けること）<br><span class=\"id\" style=\"font-size:7.5pt;\" data-key=\"103\">1. Thủ tục nghỉ việc do lý do cá nhân (Báo cáo cho giám đốc/xưởng trưởng ${f('es_resignNoticeDays')} ngày trước khi nghỉ việc)</span></div>","      <div style=\"margin-top:4px;\">２．解雇の事由及び手続<br><span class=\"id\" style=\"font-size:7.5pt;\" data-key=\"104\">2. Lý do và thủ tục sa thải</span></div>","      <div style=\"margin-left:8px;\">解雇は，やむを得ない事由がある場合に限り少なくとも30日前に予告をするか，又は30日分以上の平均賃金を支払って解雇する。特定技能外国人の責めに帰すべき事由に基づいて解雇する場合には，所轄労働基準監督署長の認定を受けることにより予告も平均賃金の支払も行わず即時解雇されることもあり得る。${v('es_severanceCondition')?'<br>'+f('es_severanceCondition'):''}<br><span class=\"id\" style=\"font-size:7pt;margin-left:8px;\" data-key=\"105\">Việc sa thải phải báo trước ít nhất 30 ngày, hoặc phải thanh toán tiền lương trung bình của trên 30 ngày rồi mới sa thải.${v('es_severanceConditionEn')?'<br>'+f('es_severanceConditionEn'):''}</span></div>","      <div style=\"font-size:7.5pt;\">○詳細は，就業規則　${_wr('Retire')}<br><span class=\"id\" style=\"font-size:7pt;\" data-key=\"106\">${_wrHas('Retire')?_wrTR('Retire','vi'):`◦Chi tiết xem trong Nội quy lao động Điều (&emsp;〜&emsp;),điều (&emsp;〜&emsp;),điều (&emsp;〜&emsp;)`}</span></div>"],0,1],[1092,1,1130085713,["    <div style=\"font-size:9pt;font-weight:bold;margin-bottom:3px;\">Ⅸ．その他<br><span style=\"font-size:8pt;font-weight:normal;\">IX. Các nội dung khác</span></div>"],0,1],[1095,8,3439845903,["      <div style=\"margin-left:16px;\">${cb(false,\"ins_kokumin\")}&nbsp;国民年金，${cb(false,\"ins_kokumin_kenko\")}&nbsp;国民健康保険，${cb(!!otherIns(),\"ins_other\")}&nbsp;その他（${otherIns()?'&nbsp;'+esc(otherIns())+'&nbsp;':'&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;'}））<br><span class=\"id\" style=\"font-size:7pt;\" data-key=\"107\">1. Tình trạng tham gia bảo hiểm xã hội/tình trạng áp dụng bảo hiểm lao động (${cb(insEnrolled('insPension'),\"ins_kousei_id\")} Tiền lươn     if(f.length===pt[5]) hits.push([f[pt[4]],len,pt[3]]); else miss.push(n+1);
  });
  hits.sort(function(p,q){ return q[0]-p[0]; }).forEach(function(h){ L.splice.apply(L,[h[0],h[1]].concat(h[2])); });
  if(miss.length){ window.__docErrs=window.__docErrs||[]; window.__docErrs.push('訳の差し替えができない行があります（'+miss.length+'か所：本体の1_6.htmlが変わったため）'); console.warn('[言語版] 差し替えできなかった行', miss); }
  document.write(L.join('\n'));
})();
</script>
