<script>
function _term(n){
  // 見本どおり1行: 「2023年　4月　1日～ 2025年 3月 25日」
  const u=(id)=>`<span class="ul">${f(id)}</span>`;
  const y=(id)=>`<span class="ul uly">${f(id)}</span>`;
  return `${y('f_s'+n+'y')}年${u('f_s'+n+'m')}月${u('f_s'+n+'d')}日～ ${y('f_e'+n+'y')}年${u('f_e'+n+'m')}月${u('f_e'+n+'d')}日`;
}
function _days(id){ return `<span class="ul" style="min-width:4em;">${f(id)}</span>　日`; }
function _total(){
  let t=v('f_total'); if(t) return t;
  let sum=0, any=false;
  for(let i=1;i<=3;i++){ const x=parseInt((v('f_n'+i)||'').replace(/[^0-9]/g,''),10); if(!isNaN(x)){sum+=x;any=true;} }
  return any?String(sum):'';
}
function p(){
  if(_editMode) return;
  const w=document.getElementById('pageArea'); if(!w) return;
  const tot=_total();
  const dateLine=`${f('f_docYear')}年　　${f('f_docMonth')}月　　${f('f_docDay')}日`;
  // ④ は入力があればそれ、無ければ別紙の合計
  const days2 = v('f_days2') ? f('f_days2') : (tot ? '<span class="f">'+tot+'日</span>' : f('f_days2'));
  w.innerHTML=`
<div class="doc">
<div class="page-num-label">P1</div>
<div class="p" style="font-size:11pt;">分野参考様式第６－３号（特定技能外国人）</div>

<div class="p" style="text-align:center;">２号特定技能外国人に求められる実務経験に係る申告書</div>
<div class="p">出入国在留管理庁長官　殿</div>
<div class="p" style="padding-left:75mm;">申請者</div>
<div class="p" style="padding-left:83mm;">氏名 ${f('f_applicant')}</div>
<div class="p" style="padding-left:83mm;">性別 ${f('f_gender')}</div>
<div class="p" style="padding-left:83mm;">国籍・地域　${f('f_nationality')}</div>
<div class="p" style="padding-left:83mm;">生年月日 ${f('f_birthdate')}</div>
<div class="p" style="text-indent:1em;">建設分野における特定技能の在留資格に係る制度の運用に関する方針に規定する２号特定技能外国人に求められる実務経験については下記のとおりです。</div>
<div class="p" style="text-align:center;">記</div>
<div class="p" style="font-size:11pt;">〇建設キャリアアップシステム（以下CCUSという）の技能者情報に必要な実務経験が蓄積されている場合</div>
<table class="t63">
  <tr><td class="k">①　申請する業務区分に対応する職種</td><td class="v">${f('f_job')}</td></tr>
  <tr><td class="k">②　CCUSにおける技能評価基準の呼称（以下、呼称）</td><td class="v">${f('f_call')}</td></tr>
  <tr><td class="k">③　①、②で選択した職種及び呼称のCCUSの技能者情報に基づく就業日数(職長＋班長)</td><td class="v">${f('f_days1')}</td></tr>
</table>
<div class="p note">（注意）</div>
<div class="p note hang">１　実務経験申告の前に、以下ア～ウについて、国土交通省ホームページ掲載の資料をご確認ください。</div>
<div class="p note sub" style="word-break:break-all;">https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/content/001499418.pdf</div>
<div class="p note sub">ア ２号特定技能外国人の業務区分に対応するCCUSの能力評価基準がある職種について</div>
<div class="p note sub">イ ２号特定技能外国人に求める実務経験として各職種に必要な就業日数について</div>
<div class="p note sub">ウ 実務経験の確認書類について</div>
<div class="p note hang">２　③には実務経験に必要な就業日数以上（記載例：1年（215日）以上）であることを確認して記載すること。CCUSのレベル判定を受けている場合は「能力評価（レベル判定）結果通知書」のレベル３以上のものの写しを添付すること。CCUSのレベル判定を受けていない場合は、CCUSにおける就業日数の表示画面の写しを添付すること</div>
<div class="p" style="font-size:11pt;">〇CCUSの技能者情報に必要な実務経験が全て蓄積されていない場合</div>
<table class="t63">
  <tr><td class="k">④　①、②で選択した職種及び呼称の経歴証明書に基づく就業日数(職長＋班長)</td><td class="v">${days2}</td></tr>
</table>
<div class="p note">（注意）</div>
<div class="p note hang1">３　③と④の合計が実務経験に必要な就業日数以上であることを確認して記載すること。また、③についてはCCUSにおける表示画面の写しを添付し、④については、別紙経歴証明書を添付すること。</div>
</div>
<div class="doc">
<div class="page-num-label">P2</div>
<div class="p" style="font-size:11pt;">別　紙</div>
<div class="p" style="text-align:right;">${dateLine}</div>
<div class="p" style="text-align:center;font-size:11pt;">経　歴　証　明　書</div>
<div class="p">出入国在留管理庁長官　殿</div>
<div class="p" style="padding-left:67mm;">証明者　</div>
<div class="p" style="padding-left:71mm;">事業者名　${f('f_certCo')}</div>
<div class="p" style="padding-left:71mm;">役職名　${f('f_certTitle')}</div>
<div class="p" style="padding-left:71mm;">氏名　${f('f_certName')}</div>
<div class="p" style="padding-left:71mm;">建設キャリアアップシステム事業者ID<br>${f('f_certCcusId')}</div>
<div class="p">下記に示す申請者の建設分野における特定技能の在留資格に係る制度の運用に関する方針に規定する２号特定技能外国人に求められる実務経験のうち、建設キャリアアップシステムに蓄積されてない就業日数については下記のとおりです。</div>
<div class="p" style="text-align:center;">記</div>
<div class="p">（１）申請者</div>
<table class="tb">
  <tr><td class="k">氏名</td><td class="v">${f('f_applicant')}</td></tr>
  <tr><td class="k">建設キャリアアップシステム技能者ID</td><td class="v">${f('f_ccusId')}</td></tr>
  <tr><td class="k">申請する業務区分に対応する職種</td><td class="v">${f('f_job')}</td></tr>
  <tr><td class="k">技能評価基準の呼称</td><td class="v">${f('f_call')}</td></tr>
</table>
<div class="p">（２）職長、班長としての就業日数</div>
<table class="tb">
  <colgroup><col style="width:8mm"><col style="width:89.5mm"><col style="width:52.5mm"></colgroup>
  <tr><td class="c" colspan="2">就業期間</td><td class="c">就業日数</td></tr>
  <tr><td>①</td><td class="m">${_term(1)}</td><td class="r">${_days('f_n1')}</td></tr>
  <tr><td>②</td><td class="m">${_term(2)}</td><td class="r">${_days('f_n2')}</td></tr>
  <tr><td>③</td><td class="m">${_term(3)}</td><td class="r">${_days('f_n3')}</td></tr>
  <tr><td class="c" colspan="2">合計</td><td class="r"><span class="ul" style="min-width:4em;">${tot?'<span class="f">'+tot+'</span>':f('f_total')}</span>　日</td></tr>
</table>
<div class="p">※必要に応じ行を追加すること。</div>
<div class="p">※転職や離職などによって職長、班長として就労していない期間がある場合は、就労していた期間ごとに入力すること。</div>
<div class="p">誓約欄</div>
<div class="p" style="text-indent:1em;">この証明事項に事実と相違がある場合には、在留資格が取り消されても異存の無いことを誓約いたします。</div>
<div class="p" style="padding-left:71mm;">申請者氏名　　${f('f_applicant')}　　</div>
</div>`;
  _fontSize = (_fontSize === 8.5) ? 10.5 : _fontSize;
  _apply6_3FontSize();
  const lbl=document.getElementById('fontSizeLabel');if(lbl)lbl.textContent=_fontSize+'pt';
  setupPageTracker();
  fitDocToPreview();
}
function _apply6_3FontSize(){
  const st=document.getElementById('_6_3FontStyle')||document.createElement('style');
  st.id='_6_3FontStyle'; document.head.appendChild(st);
  const s=_fontSize/10.5;
  st.textContent=[
    `.doc{font-size:${(10.5*s).toFixed(2)}pt!important;line-height:${(18*s).toFixed(2)}pt!important}`,
    `.doc .t63 td,.doc .tb td{font-size:${(10.5*s).toFixed(2)}pt!important;line-height:${(18*s).toFixed(2)}pt!important}`,
    `.doc [style*="font-size:11pt"]{font-size:${(11*s).toFixed(2)}pt!important}`,
  ].join('');
}
function _ymd63(d){ if(!d) return ''; const x=new Date(d); if(isNaN(x)) return d; return `${x.getFullYear()}年${x.getMonth()+1}月${x.getDate()}日`; }
async function loadFromDB(passedInfo){
  let info = passedInfo;
  if(!info){
    const sel=document.getElementById('caseSelect');
    if(!sel.value) return;
    try{info=JSON.parse(sel.value);}catch(e){return;}
  }
  if(!info || !info.caseId) return;
  const {caseId,companyId,companyName}=info;
  try{
    const [cases,persons,cos]=await Promise.all([
      caseId?sb('cases?select=applicant,doc_create_date&id=eq.'+caseId):Promise.resolve([]),
      caseId?sb('persons?select=applicant_name_en,gender,nationality,birthdate,ccus_worker_id&case_id=eq.'+caseId):Promise.resolve([]),
      companyId?sb(`companies?select=name,author_title,author_name,rep_name,rep_title,ccus_company_id&id=eq.${companyId}`)
        :companyName?sb(`companies?select=name,author_title,author_name,rep_name,rep_title,ccus_company_id&name=eq.${encodeURIComponent(companyName)}`):Promise.resolve([])
    ]);
    const cas=cases&&cases[0]; const pd=persons&&persons[0]; const co=cos&&cos[0];
    const s=(id,val)=>{const e=document.getElementById(id);if(e&&val&&!e.value)e.value=val;};
    const sf=(id,val)=>{const e=document.getElementById(id);if(e&&val)e.value=val;};
    if(pd&&pd.applicant_name_en){ s('f_applicant',pd.applicant_name_en); }
    if(cas){ s('f_applicant',cas.applicant||''); }
    if(pd){
      const g=(pd.gender||'').trim(); s('f_gender', g==='男'?'男性':g==='女'?'女性':g);
      s('f_nationality',pd.nationality||'');
      s('f_birthdate',_ymd63(pd.birthdate));
      s('f_ccusId',pd.ccus_worker_id||'');
    }
    if(co){
      // 証明者 = 特定技能所属機関（代表者優先）
      s('f_certCo',co.name||'');
      s('f_certTitle',(co.rep_title||co.author_title||'').trim());
      s('f_certName',(co.rep_name||co.author_name||'').trim());
      s('f_certCcusId',co.ccus_company_id||'');
    }
    // 作成年月日 = 雇用契約書の作成日 (cases.doc_create_date)。無ければ今日。
    const dcd=(cas&&cas.doc_create_date)?String(cas.doc_create_date).split(/[-\/]/):[];
    if(dcd.length>=3&&dcd[0]&&dcd[1]&&dcd[2]){
      sf('f_docYear',String(parseInt(dcd[0],10)));sf('f_docMonth',String(parseInt(dcd[1],10)));sf('f_docDay',String(parseInt(dcd[2],10)));
    }else if(!v('f_docYear')){
      const n=new Date();sf('f_docYear',String(n.getFullYear()));sf('f_docMonth',String(n.getMonth()+1));sf('f_docDay',String(n.getDate()));
    }
    p(); showToast('✅ データを読み込みました');
  }catch(e){showToast('⚠️ 読込エラー: '+e.message);console.error(e);}
}
initCaseSelect(); p();

function fitDocToPreview(){
  requestAnimationFrame(()=>{
    const pp = document.querySelector('.pp');
    const area = document.getElementById('pageArea');
    if(!pp || !area) return;
    const ppW = pp.clientWidth - 40;
    const docW = 794;
    if(ppW < docW){
      const scale = ppW / docW;
      area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = scale; });
    } else {
      area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = 1; });
    }
  });
}
window.addEventListener('resize', fitDocToPreview);

window.addEventListener('message', async function(e){
  if(!e.data||e.data.type!=='SELECT_CASE') return;
  const info=e.data.info;
  if(!info||!info.caseId) return;
  const sel=document.getElementById('caseSelect');
  if(sel){
    let found=false;
    for(let o of sel.options){
      try{ const d=JSON.parse(o.value); if(d.caseId===info.caseId){sel.value=o.value;found=true;break;} }catch(e2){}
    }
    if(!found){
      const opt=document.createElement('option');
      opt.value=JSON.stringify(info);
      opt.textContent='（indexから選択）';
      sel.appendChild(opt);
      sel.value=opt.value;
    }
  }
  if(typeof loadCaseToForm==='function'){ await loadCaseToForm(info, '6_3'); }
  if(typeof loadFromDB==='function') loadFromDB(info);
});
</script>
