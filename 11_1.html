<div class="doc">

    <td></td>
    <td style="padding-top:1.5mm;padding-left:2em;">国籍・地域</td>
    <td style="padding-top:1.5mm;">${f('f_nationality')}</td>

    <td></td>
    <td style="padding-top:1.5mm;padding-left:2em;">生 年 月 日</td>

  </tr>
</table>
<div style="text-align:center;font-size:12pt;margin:2mm 0;">記</div>
<div style="font-size:10.5pt;margin-bottom:2mm;">　農業分野における上記の特定技能外国人を受け入れるに当たり、以下の事項について誓約します。</div>
<div style="border:1px solid #000;padding:2mm 4mm;font-size:10.5pt;">
  <div style="margin-bottom:2mm;">【誓約事項】</div>
  <div style="text-indent:-1.5em;padding-left:1.5em;margin-bottom:1mm;">１　１号特定技能外国人（出入国管理及び難民認定法（昭和２６年政令第３１９号）別表第１の２の表の特定技能の在留資格（同表の特定技能の項の下欄第１号に係るものに限る。）をもって在留する外国人をいう。）に従事させる業務が、耕種農業全般（栽培管理、農産物の集出荷・選別等）又は畜産農業全般（飼養管理、畜産物の集出荷・選別等）であること。</div>
  <div style="text-indent:-1.5em;padding-left:1.5em;margin-bottom:1mm;">２　２号特定技能外国人（出入国管理及び難民認定法（昭和２６年政令第３１９号）別表第１の２の表の特定技能の在留資格（同表の特定技能の項の下欄第２号に係るものに限る。）をもって在留する外国人をいう。）に従事させる業務が、耕種農業全般（栽培管理、農産物の集出荷・選別等）又は畜産農業全般（飼養管理、畜産物の集出荷・選別等）及び当該業務に関する管理業務であること。</div>
  <div style="text-indent:-1.5em;padding-left:1.5em;margin-bottom:0.5mm;">３　過去５年以内に同一の労働者を６か月以上継続して雇用した経験又はこれに準ずる経験を有すること（該当する項目を記入すること。）。</div>
  <div style="padding-left:1.5em;">
    <div style="text-indent:-1.5em;padding-left:1.5em;">①　ア　雇用経験が６か月以上ある場合</div>
    <div style="padding-left:3em;margin-bottom:0.5mm;">雇用した時期：　${f('f_exp1aFrom')}　　～　　${f('f_exp1aTo')}</div>
    <div style="text-indent:-1.5em;padding-left:3em;">イ　法人として雇用経験が６か月に満たないものの、業務を執行する役員が個人事業主として雇用経験が６か月以上ある場合</div>
    <div style="padding-left:3em;">業務を執行する役員の氏名：　${f('f_exp1bName')}</div>
    <div style="padding-left:3em;margin-bottom:0.5mm;">雇用した時期：　${f('f_exp1bFrom')}　　～　　${f('f_exp1bTo')}</div>
    <div style="text-indent:-1.5em;padding-left:1.5em;">②　これに準ずる経験（労務管理の経験）がある場合（①の条件を満たしていない場合）</div>
    <div style="padding-left:3em;">労務管理の経験のある者（※）の氏名：　${f('f_exp2Name')}</div>
    <div style="padding-left:3em;">労務管理に従事した時期：　${f('f_exp2From')}　　～　　${f('f_exp2To')}</div>
    <div style="padding-left:3em;">労務管理をした機関名：　${f('f_exp2Org')}</div>
    <div style="padding-left:3em;margin-bottom:1mm;font-size:9pt;">※法人の場合は業務を執行する役員に限る。</div>
  </div>
  <div style="text-indent:-1.5em;padding-left:1.5em;margin-bottom:1mm;">４　農林水産省が設置する農業分野における特定技能外国人の受入れに関する協議会（以下「農業特定技能協議会」という。）の構成員であること。</div>
  <div style="text-indent:-1.5em;padding-left:1.5em;margin-bottom:1mm;">５　農業特定技能協議会が行う情報の提供、意見の聴取、調査その他の活動に対し、必要な協力を行うこと。</div>
  <div style="text-indent:-1.5em;padding-left:1.5em;margin-bottom:1mm;">６　登録支援機関に１号特定技能外国人支援計画の全部の実施を委託する場合にあっては、５に規定する必要な協力を行う登録支援機関に委託していること。</div>
  <div style="text-indent:-1.5em;padding-left:1.5em;">７　特定技能外国人（出入国管理及び難民認定法（昭和２６年政令第３１９号）別表第１の２の</div>
</div>

<div class="doc">
<div class="page-num-label">P2</div>
<div style="border:1px solid #000;border-top:none;padding:0 5mm 3mm;font-size:10.5pt;">
  <div style="padding-left:1.5em;">表の特定技能の在留資格をもって在留する外国人をいう。）からの求めに応じ、実務経験を証明する書面（電磁的記録を含む。）を交付し、又は提供すること。</div>
</div>
<div style="font-size:10.5pt;margin-top:3mm;margin-bottom:2mm;text-indent:-3.2em;padding-left:3.2em;">（注１）誓約事項を遵守することができなくなった場合は、その旨出入国在留管理庁長官及び当該分野を所管する関係行政機関の長に対し、報告を行うこと。</div>
<div style="font-size:10.5pt;margin-bottom:4mm;text-indent:-3.2em;padding-left:3.2em;">（注２）農業特定技能協議会の構成員であることを確認できる書類を添付すること。</div>
<div style="font-size:10.5pt;margin-bottom:2mm;text-align:right;">作成年月日　${f('f_docDate')}</div>
<div style="font-size:10.5pt;text-align:right;">作成責任者　${f('f_author')}</div>

  _fontSize = (_fontSize === 8.5) ? 10.5 : _fontSize;
  _applyFontSize();
  _apply11_1FontSize();
  const lbl=document.getElementById('fontSizeLabel');if(lbl)lbl.textContent=_fontSize+'pt';

function _apply11_1FontSize(){
  const st=document.getElementById('_11_1FontStyle')||document.createElement('style');
  st.id='_11_1FontStyle'; document.head.appendChild(st);
  const s=_fontSize/10.5;
  st.textContent=[
    `.doc [style*="font-size:14pt"]{font-size:${(14*s).toFixed(2)}pt!important}`,
    `.doc [style*="font-size:12pt"]{font-size:${(12*s).toFixed(2)}pt!important}`,
    `.doc [style*="font-size:10.5pt"]{font-size:${(10.5*s).toFixed(2)}pt!important}`,
    `.doc [style*="font-size:9pt"]{font-size:${(9*s).toFixed(2)}pt!important}`,
  ].join('');
}
async function loadFromDB(passedInfo){
  let info = passedInfo;
  if(!info){
    const sel=document.getElementById('caseSelect');
    if(!sel.value) return;
    try{info=JSON.parse(sel.value);}catch(e){return;}
  }
  if(!info || !info.caseId) return;
  const {caseId,companyId,companyName}=info;
  try{
    const [cases,cos]=await Promise.all([
      caseId?sb('cases?select=applicant,org&id=eq.'+caseId):Promise.resolve([]),
      companyId?sb(`companies?select=name,pref,city,address,detail_address,author_name,author_title,rep_name,rep_title&id=eq.${companyId}`)
        :companyName?sb(`companies?select=name,pref,city,address,detail_address,author_name,author_title,rep_name,rep_title&name=eq.${encodeURIComponent(companyName)}&order=address.desc.nullslast,author_name.desc.nullslast&limit=5`):Promise.resolve([])
    ]);
    const cas=cases&&cases[0]; 
    // ver.20260810.02: 同名会社が複数ある場合、空データを避けて実データが入ってる行を優先
    const co = (cos||[]).find(x => x && (x.address || x.pref || x.author_name || x.rep_name)) || (cos&&cos[0]);
    const s=(id,val)=>{const e=document.getElementById(id);if(e&&val)e.value=val;};
    // 11-1号は「特定技能所属機関（直接雇用）」の誓約書のため、作成責任者は所属機関側の代表者。
    // 11-4号のように support_orgs（登録支援機関）からは引かない。
    if(co){
      s('f_coName',co.name||'');
      s('f_coAddr',((co.pref||'')+(co.city||'')+(co.address||'')+(co.detail_address||''))||'');
      s('f_author',((co.author_title||'')+' '+(co.author_name||'')).trim());
    }
    if(cas){
      s('f_applicant',cas.applicant||'');
    }
    if(caseId){
      const persons=await sb('persons?select=gender,nationality,birthdate&case_id=eq.'+caseId);
      const pd=persons&&persons[0];
      if(pd){
        s('f_gender',pd.gender||'');
        s('f_nationality',pd.nationality||'');
        s('f_birthdate',pd.birthdate||'');
      }
    }
    if(!v('f_docDate')){const n=new Date();document.getElementById('f_docDate').value=`令和${n.getFullYear()-2018}年${n.getMonth()+1}月${n.getDate()}日`;}
    p(); showToast('✅ データを読み込みました');
  }catch(e){showToast('⚠️ 読込エラー: '+e.message);console.error(e);}
}
initCaseSelect(); p();

function fitDocToPreview(){
  requestAnimationFrame(()=>{
    const pp = document.querySelector('.pp');
    const area = document.getElementById('pageArea');
    if(!pp || !area) return;
    const ppW = pp.clientWidth - 40;
    const docW = 794;
    if(ppW < docW){
      const scale = ppW / docW;
      area.querySelectorAll('.doc').forEach(d=>{
        d.style.zoom = scale;
      });
    } else {
      area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = 1; });
    }
  });
}
window.addEventListener('resize', fitDocToPreview);

// index.htmlからの案件選択を受信
window.addEventListener('message', async function(e){
  if(!e.data||e.data.type!=='SELECT_CASE') return;
  const info=e.data.info;
  if(!info||!info.caseId) return;
  const sel=document.getElementById('caseSelect');
  if(sel){
    let found=false;
    for(let o of sel.options){
      try{
        const d=JSON.parse(o.value);
        if(d.caseId===info.caseId){sel.value=o.value;found=true;break;}
      }catch(e2){}
    }
    if(!found){
      const opt=document.createElement('option');
      opt.value=JSON.stringify(info);
      opt.textContent='（indexから選択）';
      sel.appendChild(opt);
      sel.value=opt.value;
    }
  }
  // まず共通関数で全入力欄を埋める
  if(typeof loadCaseToForm==='function'){ await loadCaseToForm(info, '11_1'); }
  // 書類固有の追加処理があれば loadFromDB で補完
  if(typeof loadFromDB==='function') loadFromDB(info);
});
