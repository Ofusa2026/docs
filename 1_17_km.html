owspan=\"2\"><p class=\"ja a-center\">支援責任者</p><p class=\"vi a-center\">អ្នកទទួលខុសត្រូវគាំទ្រ</p></td>","<td class=\"b-tttt\" rowspan=\"2\"><p class=\"ja a-center\">（ふりがな）</p><p class=\"ja a-center\">氏　　名</p><p class=\"vi a-center\">(ហ្វឹរីហ្គាណា)","ឈ្មោះ</p></td>"],0,1],[1484,1,517750305,["<td class=\"b-tttt\" colspan=\"2\" rowspan=\"2\"><p class=\"ja a-center\">役　　職</p><p class=\"vi a-center\">តួនាទី</p></td>"],0,1],[1491,3,2932874545,["<td class=\"b-tttt\"><p class=\"ja a-center\">支援を行っている</p><p class=\"ja a-center\">１号特定技能外国人数</p><p class=\"vi a-center\">ចំនួនជនបរទេសក្នុងជំនាញជាក់លាក់លេខទី 1 ដែលកំពុងទទួលការគាំទ្រ</p></td>","<td class=\"b-tttt\" colspan=\"3\"><p class=\"ja a-right\"><input type=\"text\" class=\"bl\" id=\"f023n\" name=\"f023n\" style=\"width:6em\">名</p><p class=\"vi a-right\">នាក់</p></td>","<td class=\"b-ttkk\" colspan=\"4\" rowspan=\"2\"><p class=\"ja a-center\">支援の中立性を確保していることの有無</p><p class=\"ja a-center\">支援責任者及び支援担当者が，支援対象者と異なる部署の職員であるなど，当該対象者に対する指揮命令権を有しない者であること、また，異なる部署であっても，当該対象者に指揮命令をし得る立場にないこと</p><p class=\"vi a-center\">តើមានការធានានូវភាពមិនលំអៀងឬទេ ក្នុងការជួយ</p><p class=\"vi\" style=\"padding-left:0.86em\">អ្នកទទួលខុសត្រូវគាំទ្រ និងអ្នកទទួលបន្ទុកជួយ គឺជាបុគ្គលិកនៃផ្នែកផ្សេងពីអ្នកដែលជាមុខសញ្ញានៃជំនួយ ជាដើម, គឺជាអ្នកដែលគ្មានសិទ្ធិអំណាចបញ្ជាអ្នកដែលជាមុខសញ្ញានៃជំនួយនេះ , ឬទោះជាអ្នកនៅផ្នែកផ្សេងក៏ដោយ គឺគ្មានតួនាទីបញ្ជាអ្នកដែលជាមុខសញ្ញានៃជំនួយទេ</p><p class=\"ja\" style=\"text-indent:9.00em\"><span class=\"chc\"><label class=\"opt\"><input type=\"radio\" name=\"f023\" value=\"有\" data-label=\"Ⅱ 特定技能所属機関 ＞ 名\"><span>有</span></label>　　　　　　<label class=\"opt\"><input type=\"radio\" name=\"f023\" value=\"無\" data-label=\"Ⅱ 特定技能所属機関 ＞ 名\"><span>無</span></label></span></p><p class=\"vi\" style=\"text-indent:9.00em\">មាន          គ្មានទេ</p></td>"],0,1],[1496,2,2140139892,["<td class=\"b-ttkt\"><p class=\"ja a-center\">支援担当者数</p><p class=\"vi a-center\">ចំនួនអ្នកទទួលខុសត្រូវគាំទ្រ</p></td>","<td class=\"b-ttkt\" colspan=\"3\"><p class=\"ja a-rig tចំពោះកូឡោនទី Ⅰ បើក្នុងករណីដែលអ្នកត្រូវទទួលបានការគាំទ្រមានចំនួនច្រើននាក់ ហើយមាតិកានៃការគាំទ្រគឺដូចគ្នា នោះត្រូវសរសេរនៅចំនុចទី 1 ឈ្មោះ ថា \"ដូចតាមបញ្ជីឈ្មោះនៃឯកសារភ្ជាប់\"។ អ្នកអាចភ្ជាប់ជាមួយបញ្ជីរាយឈ្មោះ (រចនាប័ទ្មនៃឯកសារគឺមិនកំណត់) នៃកូឡោនទី Ⅰ។ ប៉ុន្តែកំណត់ចំពោះតែករណីការស្នើសុំទាំងឡាយណាដែលធ្វើឡើងក្នុងពេលដំណាលគ្នា។</p>","<p class=\"vi\">2\tចំពោះកូឡោនទី Ⅱ ចំនុចទី 4 គឺត្រូវបំពេញចំពោះតែក្នុងករណីដែលស្ថាប័នជនបរទេសក្នុងជំនាញជាក់លាក់ធ្វើការ ជាអ្នកអនុវត្តផែនការគាំទ្រសំរាប់ជនបរទេសក្នុងជំនាញជាក់លាក់លេខទី 1។</p>","<p class=\"vi\">3\tចំពោះកូឡោនទី Ⅲ គឺត្រូវបំពេញចំពោះតែក្នុងករណីដែលគ្រប់ការអនុវត្តន៌ផែនការគាំទ្រទាំងអស់សំរាប់ជនបរទេសក្នុងជំនាញជាក់លាក់លេខទី 1 ត្រូវបានទទួលធ្វើដោយស្ថាប័នគាំទ្រដែលបានចុះបញ្ជី។</p>","<p class=\"vi\">4\tចំពោះកូឡោនទី Ⅳ ពីចំនុចទី 1 ដល់ចំនុចទី 9 នៃកូឡោន \"គម្រោងអនុវត្ត\" គឺត្រូវគូសសញ្ញាគ្រីសត្រង់ចំនុចដែលសមស្រប។ បើគូសសញ្ញាគ្រីសថា \"មាន\" គម្រោងអនុវត្ត គឺត្រូវសរសេរសង្ខេបងាយៗអំពីរយៈពេលអនុវត្ត ហើយបើគូសសញ្ញាគ្រីសថា \"គ្មាន\" គម្រោងអនុវត្ត គឺត្រូវសរសេរក្នុងវង់ក្រចកនូវមូលហេតុដែលមិនអនុវត្ដការគាំទ្រទាំងនោះ។</p>","<p class=\"vi\">5 ចំពោះកូឡោនទី Ⅳ ពីចំនុចទី 1 ដល់ចំនុចទី 9 នៃកូឡោន \"មានឬគ្មានការងារពីខាងក្រៅ\" គឺត្រូវគូសសញ្ញាគ្រីសថា \"មាន\" ចំពោះតែក្នុងករណីដែលស្ថាប័នជនបរទេសក្នុងជំនាញជាក់លាក់ធ្វើការ ប្រគល់ការងារគាំទ្រមួយផ្នែកអោយទៅភាគីទីបីជាអ្នកអនុវត្ត (លើកលែងតែការប្រគល់ការងារទៅឱ្យស្ថាប័នគាំទ្រដែលបានចុះបញ្ជីជាអ្នកអនុវត្ត) ហើយចំពោះ ករណីដែលស្ថាប័នជនបរទេសក្នុងជំនាញជាក់លាក់ធ្វើការផ្ទាល់ជាអ្នកអនុវត្តការងារគាំទ្រ ឬ ករណីដែលប្រគល់ការងារគាំទ្រទាំងស្រុងទៅឱ្យស្ថាប័នគាំទ្រដែលបានចុះបញ្ជីជាអ្នកអនុវត្ត គឺត្រូវគូសសញ្ញាគ្រីសថា \"គ្មាន\"។</p>","<p class=\"vi\">6 ចំពោះកូឡោនទី Ⅳ ពីចំនុចទី 1 ដល់ចំនុចទី 8 នៃកូឡោន \"អ្នកទទួលខុសត្រូវគាំទ្រ ឬ អ្នកទទួលខុសត្រូវក្នុងការអនុវត្តន៍ដែលទទួលការងារបន្តពីខាងក្រៅ\" ក្នុងករណីដែលស្ថាប័នជនបរទេសក្នុងជំនាញជាក់លាក់ធ្វើការផ្ទាល់ជាអ្នកអនុវត្តការងារគាំទ្រ ឬ ករណីដែលប្រគល់ការងារគាំទ្រទាំងស្រុងទៅឱ្យស្ថាប័នគាំទ្រដែលបានចុះបញ្ជីជាអ្នកអនុវត្ត នោះអ្នកទទួលខុសត្រូវក្នុងការងារគាំទ្រដែលត្រូវបានគេចាត់តាំងគឺត្រូវសរសេរឈ្មោះនិងតួនាទីក្នុងវង់ក្រចកចំពោះគ្រប់ការងារគាំទ្រនីមួយៗ ហើយចំពោះករណីដែលភាគីទីបីជាអ្នកអនុវត្តការគាំទ្រដោយទទួលការងារមួយផ្នែកបន្តពីស្ថាប័នដែលជនបរទេសក្នុងជំនាញជាក់លាក់ធ្វើការ នោះអ្នកដែលទទួលការងារគាំទ្របន្តពីខាងក្រៅគឺត្រូវសរសេរឈ្មោះ និង អាសយដ្ឋាន។</p>","<p class=\"vi\" style=\"text-indent:0.86em\">គួរបញ្ជាក់ថា ចំពោះកូឡោន “អ្នកទទួលខុសត្រូវគាំទ្រ ឬអ្នកទទួលបន្ទុកគាំទ្រ” ដែលនៅកូឡោនទី IV ចំណុចទី 9 ត្រូវបំពេញឈ្មោះនិងក្នុងរង្វង់ក្រចកបំពេញមុខតំណែង របស់អ្នកទទួលខុសត្រូវគាំទ្រ ឬអ្នកទទួលបន្ទុកគាំទ្រ ដែលត្រូវបានជ្រើសតាំងនៅក្នុងករណីដែលស្ថាប័នដែលជនបរទេសក្នុងជំនាញជាក់លាក់ធ្វើការ អនុវត្តការងារគាំទ្រដោយខ្លួនឯង ឬក្នុងករណីដែលពឹងពាក់ស្ថាប័នគាំទ្រដែលបានចុះបញ្ជីឲ្យអនុវត្តការងារគាំទ្រទាំងអស់ ហើយនៅក្នុងនេះ ចំពោះកូឡោន b និងកូឡោនបំពេញដោយសេរី ករណីការងារគាំទ្រក្នុងកូឡោននេះគឺអនុវត្តដោយបុគ្គលទីបីដែលទទួលបានការពឹងពាក់ឲ្យអនុវត្តការងារគាំទ្រមួយផ្នែក ដោយស្ថាប័នដែលជនបរទេសក្នុងជំនាញជាក់លាក់ធ្វើការ ត្រូវបំពេញឈ្មោះនិងអាសយដ្ឋានរបស់អ្នកដែលទទួលបានការពឹងពាក់ឲ្យធ្វើការងារគាំទ្រ។</p>","<p class=\"vi\">7\tចំពោះកូឡោនទី Ⅳ ពីចំនុចទី 1 ដល់ចំនុចទី 4 និងចំនុចទី 9 នៃកូឡោន \"វិធីសាស្រ្តក្នុងការអនុវត្តន៍\" គឺត្រូវគូសសញ្ញាគ្រីសត្រង់ចំនុចដែលសមស្រប។ ប្រសិនបើគូសសញ្ញាគ្រីសត្រង់ \"ផ្សេងទៀត\" គឺត្រូវសរសេរក្នុងវង់ក្រចកនូវវិធីសាស្រ្តក្នុងការអនុវត្តន៍ទាំងនោះ។</p>","<p class=\"vi\">8\tចំពោះកូឡោនទី Ⅳ ចំនុចទី 3アｄ អំពី \"ទំហំបន្ទប់\" សូមជ្រើសរើសដោយធិកប្រអប់ដែលសមស្របនៅក្នុងវង់ក្រចក។</p>","<p class=\"vi\">ត្រូវបំពេញពីចំណុច ② ដល់ ④ ក្នុងករណីដែលបានធិកថា “មាន” នៅក្នុងចំណុច ①។</p>","<p class=\"vi\">ស្ដីពី ③ ត្រូវធិកក្នុងប្រអប់ណាមួយនៃ “ផ្ទះកម្មសិទ្ធិផ្ទាល់ខ្លួន” និង “ផ្ទះជួលពីគេ”។</p>","<p class=\"vi\">ស្ដីពីចំណុច ④ ត្រូវពន្យល់ឱ្យបានសមស្របតាមចក្ខុវិស័យ ឧទាហរណ៍ដូចខាងក្រោយនេះ។</p>","<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- ក្នុងករណីដែលបានធិក “ផ្ទះកម្មសិទ្ធិផ្ទាល់ខ្លួន” ក្នុងចំណុច ③៖ ទឹកប្រាក់ដែលអាចពន្យល់ឱ្យសមស្រប ដោយពិចារណាអំពីចំណាយចាំបាច់សម្រាប់ការសាងសង់ ឬជួសជុលជាក់ស្ដែង ជាអាទិ៍, ចំនួនឆ្នាំដែលអាចប្រើអាគារបាន, ចំនួនកម្មសិក្សាការីជំនាញជាក់លាក់ដែលចូលរស់នៅជាអាទិ៍</p>","<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- ក្នុងករណីដែលបានធិក “ផ្ទះជួលពីគេ” ក្នុងចំណុច ③៖ ថ្លៃឈ្នួលផ្ទះ (រួមទាំងចំណាយលើការគ្រប់គ្រង ចំណាយលើផលប្រយោជន៍រួម ជាអាទិ៍, មិនរួមបញ្ចូលនូវប្រាក់កក់ ប្រាក់សគុណ ប្រាក់ធានា កម្រៃឈ្នួញកណ្ដាល ទេ) ចែកនឹងចំនួនកម្មសិក្សាការីជំនាញជាក់លាក់</p>","<p class=\"vi\">9 ចំពោះកូឡោនទី Ⅳ ចំនុចទី 6イ នៃកូឡោន \"ពេលវេលានៃការឆ្លងឆ្លើយ\" គឺត្រូវបំពេញចន្លោះម៉ោងនៃថ្ងៃនីមួយៗដែលអាចធ្វើការឆ្លងឆ្លើយបាន។</p>"],0,1],[2263,2,1942020107,["<p class=\"vi\" style=\"padding-left:3.00em;text-indent:-3.00em\">ការគាំទ្រនេះត្រូវបានអនុវត្តសមស្របដោយស្ថាប័នសាធារណៈ ដោយផ្អែកលើវិធានការដើម្បីសម្រេចបាននូវសង្គមមួយដែលអាចរួមរស់ជាមួយគ្នាបាន។</p>","<p class=\"vi\">ម្យ៉ាងទៀត ឯកសារនេះត្រូវបានបកប្រែជាភាសាដែលអ្នកទទួលបានការគាំទ្រអាចយល់បានច្បាស់លាស់ ហើយបានផ្ដល់ និងពន្យល់បានពេញលេញចំពោះអ្នកទទួលការគាំទ្រនោះ។</p>"],0,1],[2267,1,1846093434,["<tr><td class=\"lb\"><p class=\"ja\">特定技能所属機関の氏名又は名称</p><p class=\"vi\">ឈ្មោះស្ថាប័នដែលជនបរទេសក្នុងជំនាញជាក់លាក់ធ្វើការ</p></td>"],0,1],[2269,1,617466521,["<tr><td class=\"lb\"><p class=\"ja\">作成責任者の氏名</p><p class=\"vi\">ឈ្មោះអ្នកទទួលខុសត្រូវធ្វើឯកសារនេះ</p></td>"],0,1],[2274,2,4244995961,["<p class=\"vi\" style=\"padding-left:3.00em;text-indent:-3.00em\">ចំពោះឯកសារនេះ ខ្ញុំបានទទួលអត្ថបទបកប្រែជាភាសា <span class=\"p17ul\">ខ្មែរ</span> ហើយខ្ញុំបានទទួលការពន្យល់ និងបានយល់ច្បាស់អំពីខ្លឹមសាររបស់វា។</p>","<p class=\"vi\">ម្យ៉ាងទៀត ខ្ញុំបានទទួលការពន្យល់ស្ដីពីវិធីអនុវត្តការសម្ភាសទៀងទាត់នៃចំណុច Ⅳ កូឡោន 9アａ ហើយបានយល់ច្បាស់លាស់ ព្រមទាំងចង់ឱ្យអនុវត្ត  <input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f408\" disabled>ដោយផ្ទាល់មុខ និង តាមអនឡាញ  <input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f409\" disabled>ដោយតែផ្ទាល់មុខ។</p>"],0,1],[2277,1,31155209,["<p class=\"vi p17sign-date\" style=\"margin-top:.1em\">កាលបរិច្ឆេទនៃការចុះហត្ថលេខា　ថ្ងៃទី ${v('es_createD')||'　'} ខែ ${v('es_createM')||'　'} ឆ្នាំ ${v('es_createY')||'　　'}</p>"],0,1],[2279,1,3300998647,["<p class=\"vi\" style=\"margin-left:34%\">ហត្ថលេខារបស់ជនបរទេសក្នុងជំនាញជាក់លាក់លេខទី 1</p>"],0,1],[2323,4,3624395170,["    var _nat=String(pd.nationality||pd.nationality_ja||'').trim();","    if(_nat &
