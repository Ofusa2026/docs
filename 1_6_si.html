ont-size:7.5pt;\">1. තමාගේ අවශ්‍යතාවය මත රැකියාව නතර කිරීමේදී ක්‍රියාපටිපාටිය (&emsp;${f('es_resignNoticeDays')}&emsp;දිනකට පෙර සමාගම් සභාපතිට හෝ ආයතන ප්‍රධානියාට දැනුම් දිය යුතුය)</span></div>","      <div style=\"margin-top:4px;\">２．解雇の事由及び手続<br><span class=\"id\" style=\"font-size:7.5pt;\">2. සේවයෙන් පහ කිරීමට හේතු සහ ක්‍රියාපටිපාටිය</span></div>","      <div style=\"margin-left:8px;\">解雇は，やむを得ない事由がある場合に限り少なくとも30日前に予告をするか，又は30日分以上の平均賃金を支払って解雇する。特定技能外国人の責めに帰すべき事由に基づいて解雇する場合には，所轄労働基準監督署長の認定を受けることにより予告も平均賃金の支払も行わず即時解雇されることもあり得る。${v('es_severanceCondition')?'<br>'+f('es_severanceCondition'):''}<br><span class=\"id\" style=\"font-size:7pt;margin-left:8px;\">සේවයෙන් පහ කිරීම, අවම වශයෙන් දින 30 කට පෙර අදාල පුද්ගලයාට දැනුම් දිය යුතු වන අතර නොවැළැක්විය හැකි හේතුවකදී පමණක් දින 30ක හෝ ඊට වැඩි කාලයක් සඳහා වන සාමාන්‍ය වැටුප් ගෙවීමක් සිදු කිරීමෙන් පසුව සේවයෙන් පහ කිරීම කළ යුතුය. නිශ්චිත කුසලතා වෘත්තීය විදේශිකයාගේ වරදක් මත සේවයෙන් පහ කිරීමේදී, ප්‍රාදේශීය කම්කරු ප්‍රමිති පරීක්‍ෂණ කාර්යාලයේ අධ්‍යක්‍ෂවරයාගෙන් අනුමැතිය ලබා ගැනීමෙන් පසුව, පෙර දැනුම්දීමකින් හෝ සාමාන්‍ය වැටුප් ගෙවීමකින් තොරව සේවයෙන් පහ කිරීම වහාම සිදු කළ හැකිය.${v('es_severanceConditionEn')?'<br>'+f('es_severanceConditionEn'):''}</span></div>","      <div style=\"font-size:7.5pt;\">○詳細は，就業規則　${_wr('Retire')}<br><span class=\"id\" style=\"font-size:7pt;\">${_wrHas('Retire')?_wrTR('Retire','si'):`○විස්තර සඳහා, සේවා නීතිරීතිවල වගන්ති ～ වගන්ති, වගන්ති ～ වගන්ති, වගන්ති ～ වගන්ති බලන්න.`}</span></div>"],0,1],[1157,1,1130085713,["    <div style=\"font-size:9pt;font-weight:bold;margin-bottom:3px;\">Ⅸ．その他<br><span style=\"font-size:8pt;font-weight:normal;\">IX. වෙනත්</span></div>"],0,1],[1160,8,3439845903,["      <div style=\"margin-left:16px;\">${cb(false,\"ins_kokumin\")}&nbsp;国民年金，${cb(false,\"ins_kokumin_kenko\")}&nbsp;国民健康保険，${cb(!!otherIns(),\"ins_other\")}&nbsp;その他（${otherIns()?'&nbsp;'+esc(otherIns())+'&nbsp;':'&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;'}））<br><span class=\"id\" style=\"font-size
