"      <div style=\"margin-left:8px;\">解雇は，やむを得ない事由がある場合に限り少なくとも30日前に予告をするか，又は30日分以上の平均賃金を支払って解雇する。特定技能外国人の責めに帰すべき事由に基づいて解雇する場合には，所轄労働基準監督署長の認定を受けることにより予告も平均賃金の支払も行わず即時解雇されることもあり得る。${v('es_severanceCondition')?'<br>'+f('es_severanceCondition'):''}<br><span class=\"id\" style=\"font-size:7pt;margin-left:8px;\">PHK dilakukan bila ada alasan yang tidak dapat dihindari dan pekerja yang bersangkutan diberikan pemberitahuan awal setidaknya 30 hari sebelum PHK atau diberikan minimal 30 hari upah rata-rata. Untuk PHK berdasarkan alasan yang disebabkan oleh kesalahan pekerja asing berketerampilan khusus, ada kemungkinan PHK dilakukan dengan segera tanpa pemberitahuan awal maupun pembayaran upah rata-rata setelah mendapatkan persetujuan dari Kepala Kantor Pengawasan Standar Kerja terkait.${v('es_severanceConditionEn')?'<br>'+f('es_severanceConditionEn'):''}</span></div>",

"      <div style=\"margin-left:8px;\">解雇は，やむを得ない事由がある場合に限り少なくとも30日前に予告をするか，又は30日分以上の平均賃金を支払って解雇する。特定技能外国人の責めに帰すべき事由に基づいて解雇する場合には，所轄労働基準監督署長の認定を受けることにより予告も平均賃金の支払も行わず即時解雇されることもあり得る。${v('es_severanceCondition')?'<br>'+f('es_severanceCondition'):''}<br><span class=\"id\" style=\"font-size:7pt;margin-left:8px;\">සේවයෙන් පහ කිරීම, අවම වශයෙන් දින 30 කට පෙර අදාල පුද්ගලයාට දැනුම් දිය යුතු වන අතර නොවැළැක්විය හැකි හේතුවකදී පමණක් දින 30ක හෝ ඊට වැඩි කාලයක් සඳහා වන සාමාන්‍ය වැටුප් ගෙවීමක් සිදු කිරීමෙන් පසුව සේවයෙන් පහ කිරීම කළ යුතුය. නිශ්චිත කුසලතා වෘත්තීය විදේශිකයාගේ වරදක් මත සේවයෙන් පහ කිරීමේදී, ප්‍රාදේශීය කම්කරු ප්‍රමිති පරීක්‍ෂණ කාර්යාලයේ අධ්‍යක්‍ෂවරයාගෙන් අනුමැතිය ලබා ගැනීමෙන් පසුව, පෙර දැනුම්දීමකින් හෝ සාමාන්‍ය වැටුප් ගෙවීමකින් තොරව සේවයෙන් පහ කිරීම වහාම සිදු කළ හැකිය.${v('es_severanceConditionEn')?'<br>'+f('es_severanceConditionEn'):''}</span></div>",
