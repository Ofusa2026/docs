var J1510={"num": "နယ်ပယ်ရည်ညွှန်းပုံစံအမှတ် ၁၅-၁၀", "title": "မော်တော်ယာဉ်မောင်းအထူးကျွမ်းကျင်လုပ်သားအတွက် ကြိုတင်ပြင်ဆင်သည့် နိုင်ငံခြားသားများအား", "count": "အကူအညီပေးနေသော အမှတ် ၁ နိုင်ငံခြားသား အထူးကျွမ်းကျင်လုပ်သားဦးရေနှင့် မော်တော်ယာဉ်မောင်းအထူး ကျွမ်းကျင်လုပ်သားအတွက် ကြိုတင်ပြင်ဆင်သည့် နိုင်ငံခြားသားများ စုစုပေါင်းဦးရေ", "sched": "အကူအညီပေးရေးလုပ် ငန်းပိုင်းစတင်မည့်နေ့စွဲ", "done": "အထက်တွင်ဖော်ပြထားသည့်အတိုင်း အကူအညီပေးရေးလုပ်ငန်းများကို ဆောင်ရွက်ပါမည်။", "sign": "မော်တော်ယာဉ်မောင်းအထူးကျွမ်းကျင်လုပ်သားအတွက် ကြိုတင်ပြင်ဆင်သည့် နိုင်ငံခြားသား၏ ထိုးမြဲလက်မှတ်", "n2": "၂မော်တော်ယာဉ်မောင်း အထူးကျွမ်းကျင်လုပ်သား ကြိုတင်ပြင်ဆင်မှု ဆောင်ရွက်မည့်အဖွဲ့အစည်း ကိုယ်တိုင်မှ မော်တော်ယာဉ်မောင်းအထူးကျွမ်းကျင်လုပ်သားအတွက် ကြိုတင်ပြင်ဆင်သည့် နိုင်ငံခြားသားများ ကူညီထောက်ပံ့ရေးအစီအစဉ်ကို ဆောင်ရွက်မှသာလျှင် ကော်လံ II ၄ ကို ဖော်ပြရမည်။", "n3": "၃မော်တော်ယာဉ်မောင်းအထူးကျွမ်းကျင်လုပ်သားအတွက် ကြိုတင်ပြင်ဆင်သည့် နိုင်ငံခြားသားများ ကူညီထောက်ပံ့ရေးအစီအစဉ်ဆောင်ရွက်မှုအားလုံးကို မှတ်ပုံတင်ခြင်းအကူအညီပေးရေးအဖွဲ့အစည်းသို့ ကန်ထရိုက်အပ်နှံဆောင်ရွက်စေမှသာလျှင် ကော်လံ III တွင်ရေးသားဖော်ပြရမည်။", "n5": "၅ ကော်လံ IV ရှိ နံပါတ် ၁ မှ ၉ အထိရှိသော [ကန်ထရိုက်ပေး၊မပေး] ကော်လံတွင် မော်တော်ယာဉ်မောင်း အထူးကျွမ်းကျင်လုပ်သား ကြိုတင်ပြင်ဆင်မှု ဆောင်ရွက်မည့်အဖွဲ့အစည်းမှ အကူအညီပေးရေးလုပ်ငန်းတစ်စိတ်တစ်ဒေသကို အခြားသူထံ ကန်ထရိုက်（မှတ်ပုံတင်ခြင်းအကူအညီပေးရေးအဖွဲ့အစည်းထံ ကန်ထရိုက်အပ်နှံ ဆောင်ရွက်ထားခြင်းကို ချန်လှပ်သည်။）အပ်နှံထားသည့်အခါတွင်သာလျှင်[ပေး] ဟုရေးသားဖော်ပြပြီး၊ မော်တော်ယာဉ်မောင်း အထူးကျွမ်းကျင်လုပ်သား ကြိုတင်ပြင်ဆင်မှု ဆောင်ရွက်မည့်အဖွဲ့အစည်းမှ ကိုယ်တိုင်အကူအညီပေးရေးလုပ်ငန်းကို ဆောင်ရွက်ပေးသည့်အခါနှင့် မှတ်ပုံတင်ခြင်းအကူအညီပေးရေးအဖွဲ့အစည်းထံမှ အကူအညီပေးရေးလုပ်ငန်းအားလုံးကို ကန်ထရိုက်အပ်နှံထားသည့်အခါတွင် [မပေး] ဟုရေးသားဖော်ပြရမည်။", "n6": "၆ ကော်လံ IV ရှိ နံပါတ် ၁ မှ ၈ အထိရှိသော [အကူအညီပေးရေးတာဝန်ယူလုပ်ကိုင်သူ သို့မဟုတ် ကန်ထရိုက်ယူ၍ဆောင်ရွက်သူ] ကော်လံတွင် မော်တော်ယာဉ်မောင်း အထူးကျွမ်းကျင်လုပ်သား ကြိုတင်ပြင်ဆင်မှု ဆောင်ရွက်မည့်အဖွဲ့အစည်း မှ ကိုယ်တိုင်အကူအညီပေးရေးလုပ်ငန်းကို ဆောင်ရွက်ပေးသည့်အခါနှင့် မှတ်ပ
