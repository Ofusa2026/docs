"<td class=\"b-ttkk\" colspan=\"4\" rowspan=\"2\"><p class=\"ja a-center\">支援の中立性を確保していることの有無</p><p class=\"ja a-center\">支援責任者及び支援担当者が，支援対象者と異なる部署の職員であるなど，当該対象者に対する指揮命令権を有しない者であること、また，異なる部署であっても，当該対象者に指揮命令をし得る立場にないこと</p><p class=\"vi a-center\">Has neutrality of support been secured?</p><p class=\"vi\" style=\"padding-left:0.86em\">The person responsible for support and the person in charge of support do not have the authority to give the recipient of support orders (for example, employees in a different department from the recipient of support) or even where they are in different departments, they are not in a position where they have the authority to give the recipient of support orders.</p><p class=\"ja\" style=\"text-indent:9.00em\"><span class=\"chc\"><label class=\"opt\"><input type=\"radio\" name=\"f023\" value=\"有\" data-label=\"Ⅱ 特定技能所属機関 ＞ 名\"><span>有</span></label>　　　　　　<label class=\"opt\"><input type=\"radio\" name=\"f023\" value=\"無\" data-label=\"Ⅱ 特定技能所属機関 ＞ 名\"><span>無</span></label></span></p><p class=\"vi\" style=\"text-indent:9.00em\">Yes          No</p></td>"

t type=\"text\" class=\"bl\" id=\"f391\" name=\"f391\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜年 月＿日 確認方\" style=\"width:3.00em\">日　　確認方法：　<input type=\"checkbox\" class=\"cb\" id=\"f392\" name=\"f392\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> ホームページ　 <input type=\"checkbox\" class=\"cb\" id=\"f393\" name=\"f393\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> その他の方法（<input type=\"text\" class=\"bl\" id=\"f394\" name=\"f394\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜の他の方法（＿）\" style=\"width:17.00em\">）</p><p class=\"ja\" style=\"padding-left:6.30em\">備考：</p><p class=\"vi\" style=\"padding-left:2.52em\">Khi lập kế hoạch này, đã kiểm tra chính sách nhằm thực hiện xã hội cộng sinh do đoàn thể công cộng địa phương triển khai (chính sách cộng sinh).</p><p class=\"vi\" style=\"padding-left:2.52em\">Tên đoàn thể công cộng địa phương (thành phố/quận/thị trấn/làng) đã kiểm tra chính sách công cộng</p><p class=\"ja\" style=\"padding-left:3.78em\">・Địa chỉ công ty nơi đối tượng được hỗ trợ hoạt động ${_p17PlaceFx() || `(Tỉnh${f('es_officePrefEn')}/Tokyo/Osaka/Hokkaido, Thành phố/quận/thị trấn/làng${f('es_officeCityEn')})`}</p><p class=\"ja\" style=\"padding-left:6.30em\">Ngày kiểm tra: Ngày ${v('es_symD')||'　'} tháng ${v('es_symM')||'　'} năm ${v('es_symY')||'　　'}　<input type=\"hidden\" class=\"bl\" id=\"f397\" name=\"f397\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜năm＿Cách k\" style=\"width:2.75em\">Cách kiểm tra:　<input type=\"checkbox\" class=\"cb\" id=\"f398\" name=\"f398\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> Trang Web　 <input type=\"checkbox\" class=\"cb\" id=\"f399\" name=\"f399\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係\"> Cách khác (<input type=\"text\" class=\"bl\" id=\"f400\" name=\"f400\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜khác (＿)\" style=\"width:17.00em\">)</p><p class=\"vi\" style=\"padding-left:6.30em\">Ghi chú:</p><p class=\"ja\" style=\"padding-left:3.78em\">・Nơi cư trú của đối tượng được hỗ trợ</p><p class=\"vi\" style=\"padding-left:6.30em\"><input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f380s\" disabled>Như trê "<p class=\"vi\">(Notes)</p>",
"<p class=\"vi\">1\tColumn I: If there are multiple people who are supposed to receive support and the contents of the support are the same, for “1 Name” write, “As given in the attached name list”, and attach a name list (no set format) for the matters set out in column I. This applies only where the applications are filed simultaneously.</p>",
"<p class=\"vi\">2\tColumn II-4: Fill in this section only if the organization of affiliation of the specified skilled worker itself is to implement the support plan for specified skilled workers (i).</p>",
"<p class=\"vi\">3\tColumn III: Fill in this section only when entrusting the implementation of all support plans for specified skilled workers (i) to a registered support organization.</p>",
"<p class=\"vi\">4\t“Scheduled implementation” in Column IV-1 to 9: Select the applicable items. If the scheduled implementation is “Yes”, briefly describe the implementation time; and if “No”, describe the reasons for not implementing the support in the parentheses.</p>",
"<p class=\"vi\">5 Only tick “Yes” for the “Outsourced” section in Column IV-1 to 9, if the organization of affiliation of the specified skilled worker is to entrust part of the support to a third party (excluding the cases when it is outsourced to a registered support organization). If the organization of affiliation of the specified skilled worker itself is to provide support or entrust all of the support to a registered support organization, tick “No”.</p>",
"<p class=\"vi\">6 “Support staff or implementing staff if the support is to be outsourced” in Column IV-1 to 8: If the organization of affiliation of the specified skilled worker itself is to provide support or entrust all of the support to a registered support organization, list the names of the appointed support staff, followed by their titles in parenthesis, for each type of support given. If a third party partly entrusted by the organization of affiliation of the specified skilled worker is to provide support, list the names and addresses of the staff entrusted for the support.</p>",
"<p class=\"vi\" style=\"text-indent:0.86em\">In addition, “Support manager or support staff” in Column IV-9: If the organization of affiliation of the specified skilled worker itself is to provide support or entrust all of the support to a registered support organization, list the names of the appointed support manager or support staff, followed by their titles in parenthesis, for each type of support given. In addition, if the support work described in the same column is performed by the third party partly entrusted by the organization of affiliation of the specified skilled worker, list the names and addresses of the staff entrusted for the support in column b and the free-entry column.</p>",
"<p class=\"vi\">7\t“Implementation method” in Column IV-1 to 4, 9: Select the applicable items. If you select “Others”, give the method of implementation in the parentheses.</p>",
"<p class=\"vi\">8\tWith regard to “Size of room” in IV Cell 3-A-d, select the appropriate check box from within the parentheses.</p>",
"<p class=\"vi\">Answer ② to ④ only if you have selected “Yes” in ①.</p>",
"<p class=\"vi\">For ③, tick either “Owned property” or “Rental property.”</p>",
"<p class=\"vi\">For ④, provide a proper explanation, including the following information, for example:</p>",
"<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- If ③ accommodation provided is an owned property: The amount that can be reasonably justified, considering actual costs incurred in building or renovating the property, the useful life of the property, the number of specified skilled workers occupying the property, etc.</p>",
"<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- If ③ accommodation provided is a rental property: The amount obtained by dividing the rent required for renting the property (including management charges and common area service charges but not including the security deposit, key money, guarantee money, and agent's commissions; and the same definition applies hereinafter.) by the number of specified skilled workers occupying the property.</p>",
"<p class=\"vi\">9 “Response times” in Column IV-6, B: Give the times for the available days of the week.</p>"

"<p class=\"vi\">(Chú ý)</p>",
"<p class=\"vi\">1\tMục I là trường hợp có nhiều đối tượng được hỗ trợ, chỉ trong trường hợp nội dung hỗ trợ như nhau thì ghi vào “1 Họ và tên là “như danh sách tên trong tài liệu đi kèm”, rồi đính kèm danh sách tên đã có điền các mục của cột I (mẫu bất kỳ). Tuy nhiên chỉ xét cho trường hợp thực hiện cùng lúc với khi nộp đơn yêu cầu.</p>",
"<p class=\"vi\">2\tPhần 4 mục II chỉ điền trong trường hợp cơ quan liên kết chức năng đặc định tự mình thực hiện kế hoạch hỗ trợ người nước ngoài có kỹ năng đặc định số 1.</p>",
"<p class=\"vi\">3\tMục III chỉ điền trong trường hợp ủy thác toàn bộ việc thực hiện kế hoạch hỗ trợ người nước ngoài có kỹ năng đặc định số 1 cho cơ quan hỗ trợ có đăng ký.</p>",
"<p class=\"vi\">4\tCột “Dự kiến thực hiện” từ 1 đến 9 trong mục IV, đánh dấu vào những chỗ tương ứng, nếu “Có” dự kiến thực hiện thì ghi đơn giản thời gian thực thiện, nếu “không” thì ghi lý do không thực hiện hỗ trợ tương ứng trong ngoặc đơn.</p>",
"<p class=\"vi\">5 Cột “Có ủy thác không” từ 1 đến 9 trong mục IV điền “Có” chỉ trong trường hợp cơ quan liên kết chức năng đặc định ủy thác một phần hỗ trợ cho bên thứ ba (ngoại trừ trường hợp ủy thác cho cơ quan hỗ trợ có đăng ký), điền “không” trong trường hợp cơ quan liên kết chức năng đặc định tự mình tiến hành hỗ trợ hoặc ủy thác toàn bộ hỗ trợ cho cơ quan hỗ trợ có đăng ký.</p>",
"<p class=\"vi\">6 Cột “Người phụ trách hỗ trợ hoặc người phụ trách thực hiện đã nhận ủy thác” từ 1 đến 8 trọng mục IV thì điền họ tên và chức vụ trong ngoặc của người phụ trách hỗ trợ được tuyển chọn ở từng hạng mục hỗ trợ trong trường hợp cơ quan liên kết chức năng đặc định tự mình tiến hành hỗ trợ hoặc trong trường hợp ủy thác toàn bộ hỗ trợ cho cơ quan hỗ trợ có đăng ký, trường hợp bên thứ ba nhận một phần ủy thác từ cơ quan liên kết chức năng đặc định thì phải điền họ tên và địa chỉ trụ sở của bên được ủy thác hỗ trợ.</p>",
"<p class=\"vi\" style=\"text-indent:0.86em\">Ngoài ra, cột “Người chịu trách nhiệm hỗ trợ hoặc người phụ trách hỗ trợ” của phần 9 mục IV thì điền rõ họ tên và chức vụ trong ngoặc của người chịu trách nhiệm hỗ trợ hoặc người phụ trách hỗ trợ được tuyển chọn trong trường hợp cơ quan liên kết chức năng đặc định tự tiến hành hỗ trợ hay trường hợp ủy thác toàn bộ hỗ trợ cho cơ quan hỗ trợ có đăng ký. Trong đó, đối với cột b và cột điền tự do, trường hợp việc hỗ trợ tại các cột này được bên thứ ba nhận một phần ủy thác thực hiện từ cơ quan liên kết chức năng đặc định, thì phải điền họ tên và địa chỉ trụ sở của bên nhận ủy thác hỗ trợ.</p>",
"<p class=\"vi\">7\tCột “Phương pháp thực hiện” từ 1 đến 4, 9 trong mục IV, đánh dấu vào những nội dung tương ứng. Trường hợp đánh vào “Khác” thì phải ghi phương pháp thực hiện đó vào trong ngoặc đơn.</p>",
"<p class=\"vi\">8\tVề “Diện tích phòng ở” 3Ad mục IV,” phải chọn nội dung tương ứng từ các hộp đánh dấu trong ngoặc đơn.</p>",
"<p class=\"vi\">Từ ② đến ④, chỉ điền trong trường hợp đã đánh dấu “Có” ở ①.</p>",
"<p class=\"vi\">③ thì đánh dấu vào “Cơ sở do bản thân sở hữu” hoặc “Cơ sở thuê”.</p>",
"<p class=\"vi\">④ thì ví dụ như phải ghi quan điểm như sau và giải thích phù hợp.</p>",
"<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- Trường hợp ③ là “Cơ sở do bản thân sở hữu”: Là số tiền có thể giải thích hợp lý với việc xem xét đến chi phí cần để xây dựng và cải tạo, v.v. trong thực tế, tuổi thọ sử dụng của cơ sở, số lượng người nước ngoài kỹ năng đặc định vào ở, v.v.</p>",
"<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- Trường hợp ③ là “Cơ sở thuê”: Là số tiền được tính bằng cách chia tiền thuê cần để thuê cơ sở (bao gồm phí quản lý, phí tiện ích, v.v., không bao gồm tiền đặt cọc, tiền lễ, tiền bảo đảm, phí môi giới. Sau đây cũng áp dụng tương tự.) cho số lượng người nước ngoài kỹ năng đặc định vào ở.</p>",
"<p class=\"vi\">9 Cột “Thời gian giải quyết” 6C trong mục IV, điền thứ trong tuần có thể giải quyết được và khoảng thời gian đó.</p>"
