/* ===== 1-17 様式固有CSS ===== */

/* ==========================================================================
   参考様式第1-17号  1号特定技能外国人支援計画書
   Screen + print stylesheet
   --------------------------------------------------------------------------
   原本: A4 横 / 本文 9pt(日本語 ＭＳ明朝) ・ 8pt(ベトナム語 Times New Roman)
   表組は Word の tblGrid をそのまま % に換算して再現しています。
   ========================================================================== */

/* --- 1. 基本設定 ------------------------------------------------------- */
:root{
  --sheet-w: 1040px;        /* A4横の本文幅 275mm 相当 @96dpi */
  --fs-base: 12px;          /* 9pt */
  --ink: #000;
  --rule: #000;
  --bg: #f4f4f5;
  --paper: #fff;
  --hair: 1px;              /* 0.25pt */
  --thin: 1px;              /* 0.50pt */
  --thick: 2px;             /* 1.50pt */
}

*, *::before, *::after{ box-sizing: border-box; }



/* --- 2. 用紙 ----------------------------------------------------------- */
.viewport{
  padding: 24px 16px 64px;
  overflow-x: auto;
}

.sheet{
  width: var(--sheet-w);
  margin:0;
  padding: 10mm 8mm 14mm;
  background: var(--paper);
  box-shadow: 0 1px 3px rgba(0,0,0,.16), 0 8px 28px rgba(0,0,0,.10);
  font-size: var(--fs-base);
}

/* --- 3. 段落 ----------------------------------------------------------- */
.sheet p{
  margin: 0;
  white-space: pre-wrap;      /* 記入用の空白（全角・半角）を保持 */
  line-height: 1.3333;
  tab-size: 4;
  overflow-wrap: break-word;
}

/* 原本は全段落 line=240exact（＝12pt固定の行送り）。
   9pt の日本語は 1.3333、8pt のベトナム語は 1.5 で同じ 12pt になる。 */
p.ja{ font-size: 1em;    line-height: 1.3333; }
p.vi{ font-size: .889em; line-height: 1.5; }

.a-center{ text-align: center; }
.a-right { text-align: right;  }
.a-both  { text-align: justify; }

/* 表紙まわりの見出し */
.doc-title{
  font-size: 1.55em;
  font-weight: bold;
  letter-spacing: .12em;
  text-align: center;
  margin: 1.1em 0 .1em;
}
.doc-title-vi{
  font-size: 1em;
  text-align: center;
  margin-bottom: 1.1em;
}
.form-no{ margin-bottom: .2em; }

/* --- 4. 表組 ----------------------------------------------------------- */
.tbl-wrap{ margin: 0 0 .9em; }

table.grid{
  width: 100%;
  table-layout: fixed;         /* colgroup の % をそのまま効かせる */
  border-collapse: collapse;
  border-spacing: 0;
}

table.grid td{
  padding: .18em .2em;         /* Word の tblCellMar 99twips 相当 */
  vertical-align: middle;      /* 原本は全セル vAlign=center */
  word-break: break-word;
  border-style: solid;
  border-color: var(--rule);
  border-width: var(--thin);   /* 既定値。実際の太さは borders.css が上書き */
}

/* 罫線の太さはセルごとに borders.css で指定（Word の tcBorders を忠実に再現）。
   クラス名 b-<上><左><下><右>   n=なし / h=0.25pt / t=0.5pt / k=1.5pt */

/* --- 5. 縦書きセル（Ⅰ〜Ⅳ の見出し） ---------------------------------- */
td.vert{
  writing-mode: vertical-rl;
  text-orientation: mixed;
  padding: .3em .1em;
}
/* 原本どおり縦書きの見出しは1行に流す（折り返すとセル幅＝縦書きの行数を
   超えて隣の欄へはみ出す）。原本の行送りは line=160exact ＝ 8pt。 */
td.vert p{
  white-space: normal;        /* 縦書きで長い見出しは折り返して隣列へ（はみ出し防止） */
  text-align: center;
  margin: 0 .05em;
  font-size: .82em;
  line-height: 1.05;
}
/* 縦書きセルは内容がはみ出さないよう縦方向に収める */
td.vert{ overflow: hidden; }

/* --- 6. チェックボックス ----------------------------------------------- */
input.cb{
  -webkit-appearance: none;
  appearance: none;
  display: inline-block;
  /* 原本の □ は全角1文字ぶん。ただし 1em ちょうどだと「□有（　　　）」のような
     行が桁あふれで折り返してしまうため、わずかに小さい 0.9em とする。 */
  width: .9em;
  height: .9em;
  margin: 0;
  padding: 0;
  border: var(--thin) solid var(--ink);
  background: transparent;
  vertical-align: -.14em;
  cursor: pointer;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
input.cb:checked::after{
  content: "\2714";
  display: block;
  margin-top: -.30em;
  font-size: 1.05em;
  line-height: 1;
  text-align: center;
}
input.cb:focus-visible{ outline: 2px solid #0b57d0; outline-offset: 1px; }

/* --- 7. 改ページ（原本の明示的な改ページ位置） ------------------------- */
.pagebreak{ break-after: page; page-break-after: always; height: 0; }

/* --- 8. ツールバー（画面のみ） ----------------------------------------- */
.sr-only{
  position: absolute; width: 1px; height: 1px;
  margin: -1px; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}




#fitmode:checked ~ 

/* --- 9. レスポンシブ ---------------------------------------------------- */
/* 既定: 画面幅がシートより狭い場合は用紙全体を縮小して全幅表示 */
@media (max-width: 1100px){
  .viewport{ padding: 12px 0 40px; }
  .sheet{
    width: 100%;
    font-size: 1.16vw;         /* 12px / 1040px = 1.1538% */
    padding: 2.4vw 1.6vw 3vw;
    box-shadow: none;
  }
}
/* 「原寸表示」ON = 原寸固定 + 横スクロール（スマホで拡大して読む用） */
#fitmode:checked ~ .viewport .sheet{
  width: var(--sheet-w);
  font-size: var(--fs-base);
  padding: 10mm 8mm 14mm;
}
@media (max-width: 640px){
  
}

/* --- 10. 印刷 ----------------------------------------------------------- */
@page{
  size: A4 landscape;
  margin: 13mm 11mm;
}

@media print{
  html, body{ background: #fff; }
  
  .viewport{ padding: 0; overflow: visible; }
  .sheet{
    width: 100%;
    padding: 0;
    margin: 0;
    box-shadow: none;
    font-size: 9pt;
  }
  table.grid{ break-inside: auto; }
  /* Word と同じ挙動: 既定の行はページをまたいで分割してよい。
     w:cantSplit が指定された行だけ分割を禁止する。 */
  tr.nosplit{ break-inside: avoid; page-break-inside: avoid; }
  input.cb{ border-color: #000; }
  :root{ --hair: .25pt; --thin: .5pt; --thick: 1.5pt; }
}
/* 自動生成: Word の罫線 (tcBorders) を忠実に再現するルール
   クラス名 b-<上><左><下><右>  n=なし h=0.25pt t=0.5pt k=1.5pt */

.b-hknt{border-width:var(--hair) var(--thin) 0 var(--thick)}
.b-htnt{border-width:var(--hair) var(--thin) 0 var(--thin)}
.b-httk{border-width:var(--hair) var(--thick) var(--thin) var(--thin)}
.b-httt{border-width:var(--hair) var(--thin) var(--thin) var(--thin)}
.b-kkkt{border-width:var(--thick) var(--thin) var(--thick) var(--thick)}
.b-kknt{border-width:var(--thick) var(--thin) 0 var(--thick)}
.b-ktnt{border-width:var(--thick) var(--thin) 0 var(--thin)}
.b-kttk{border-width:var(--thick) var(--thick) var(--thin) var(--thin)}
.b-kttt{border-width:var(--thick) var(--thin) var(--thin) var(--thin)}
.b-nkht{border-width:0 var(--thin) var(--hair) var(--thick)}
.b-nkkt{border-width:0 var(--thin) var(--thick) var(--thick)}
.b-nknt{border-width:0 var(--thin) 0 var(--thick)}
.b-nktt{border-width:0 var(--thin) var(--thin) var(--thick)}
.b-nnkn{border-width:0 0 var(--thick) 0}
.b-nthk{border-width:0 var(--thick) var(--hair) var(--thin)}
.b-ntht{border-width:0 var(--thin) var(--hair) var(--thin)}
.b-nttk{border-width:0 var(--thick) var(--thin) var(--thin)}
.b-nttt{border-width:0 var(--thin) var(--thin) var(--thin)}
.b-tktt{border-width:var(--thin) var(--thin) var(--thin) var(--thick)}
.b-tntk{border-width:var(--thin) var(--thick) var(--thin) 0}
.b-ttht{border-width:var(--thin) var(--thin) var(--hair) var(--thin)}
.b-ttkk{border-width:var(--thin) var(--thick) var(--thick) var(--thin)}
.b-ttkt{border-width:var(--thin) var(--thin) var(--thick) var(--thin)}
.b-ttnk{border-width:var(--thin) var(--thick) 0 var(--thin)}
.b-ttnt{border-width:var(--thin) var(--thin) 0 var(--thin)}
.b-tttk{border-width:var(--thin) var(--thick) var(--thin) var(--thin)}
.b-tttn{border-width:var(--thin) 0 var(--thin) var(--thin)}
.b-tttt{border-width:var(--thin) var(--thin) var(--thin) var(--thin)}
/* ==========================================================================
   11. 記入欄（入力フォーム）
   --------------------------------------------------------------------------
   入力欄は元の空白とまったく同じ幅で置き換え、セル全体の記入欄は絶対配置に
   しているため、組版（行の高さ・改ページ位置）は静的版と変わりません。
   ========================================================================== */
td.fld{ position: relative; }
td.fld > .sp{ visibility: hidden; }     /* 行の高さを元のまま保つための下敷き */

textarea.f{
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  margin: 0; padding: .18em .2em;
  font: inherit; line-height: 1.3333; color: inherit;
  border: 0; border-radius: 0; background: transparent;
  resize: none; overflow: auto;
}

input.bl{                                /* 行中の記入欄（〒・年月日など） */
  font: inherit; line-height: inherit; color: inherit;
  margin: 0; padding: 0; border: 0; border-radius: 0;
  background: transparent;
  vertical-align: baseline;
  text-align: center;
  min-width: 0;
}

/* 「有・無」などは○で囲んで選ぶ。
   選択肢は inline のままにする。inline-block にすると、字下げ（text-indent）
   のある段落の行頭に来たとき、その字下げ分まで箱に含まれて○が横に伸びる。 */
.chc .opt{ cursor: pointer; }
.chc .opt input{ position: absolute; opacity: 0; width: 0; height: 0; }
.chc .opt input:checked + span{
  outline: 1.2px solid currentColor;     /* outline は組版に影響しない */
  outline-offset: 1px;
  border-radius: 1em;
}
.chc .opt input:focus-visible + span{ background: #dbe9ff; }

/* 記入欄の位置を分かりやすくする（画面のみ・切替可能） */
body.hl textarea.f,
body.hl input.bl{ background: #fffbe8; }
body.hl input.cb:not(:checked){ background: #fffbe8; }
body.hl textarea.f:hover,
body.hl input.bl:hover{ background: #fff4cc; }
textarea.f:focus,
input.bl:focus{ background: #e8f0fe; outline: 1px solid #4285f4; outline-offset: -1px; }

.vi-cb{ opacity: .45; }                  /* 対訳側のチェックは日本語側と連動 */





@media print{
  td.fld > .sp{ visibility: hidden; }
  textarea.f, input.bl{
    background: transparent !important;
    overflow: hidden;
    outline: 0 !important;
  }
  body.hl textarea.f, body.hl input.bl, body.hl input.cb{ background: transparent !important; }
  .chc .opt input:checked + span{ outline-color: #000; }
}

/* pageArea内のsheetは左寄せ・原寸 */
#pageArea{ overflow:auto !important; padding:16px !important; display:flex !important; flex-direction:column !important; align-items:center !important; }
#docP1{ margin:0 auto !important; }
#pageArea .sheet{ box-shadow:none; margin:0; transform-origin:top left; }

/* ver.20260913.32: 版面を厳密に1040px固定＋セル内変数箱の横溢れ防止 */
#pageArea .sheet{ width:1040px !important; max-width:1040px !important; }

/* ver.20260913.32: sheetのpaddingはみ出し修正（box-sizing強制） */
#pageArea .sheet{ box-sizing:border-box !important; }
#pageArea .sheet, #pageArea .sheet *{ box-sizing:border-box; }

#pageArea .sheet table.grid{ width:100% !important; table-layout:fixed !important; }

/* ================= ver.20260913.32: 印刷専用（1-6シェル対応） ================= */
@media print{
  @page{ size: A4 landscape; margin: 10mm; }
  html, body{ background:#fff !important; }
  /* シェル(サイドバー・上部メニュー・ページタブ)を全部隠す */
  .app-bar, .fp, .page-nav, #pageNav, .fp-case, .fp-inner{ display:none !important; }
  .main{ display:block !important; }
  .pp, #ppOuter, #pageArea{
    display:block !important; overflow:visible !important;
    padding:0 !important; margin:0 !important; width:auto !important; height:auto !important;
    background:#fff !important;
  }
  /* 縮小(transform/zoom)を解除して原寸で印刷 */
  #pageArea .sheet, .sheet{
    transform:none !important; zoom:1 !important;
    width:100% !important; max-width:100% !important;
    margin:0 !important; padding:0 !important; box-shadow:none !important;
    box-sizing:border-box !important;
  }
  #docP1{ width:auto !important; height:auto !important; overflow:visible !important; }
  /* 変数箱の背景ハイライトを消す（罫線・文字は残す） */
  .f{ background:transparent !important; }
  .f[style]{ background:transparent !important; }
  span.f{ color:#000 !important; }
  /* 未入力の変数プレースホルダ（灰色）は印刷しない */
  .f[data-bind]:empty{ display:none; }
  /* テーブルはページ跨ぎ可、cantSplit行のみ分割禁止 */
  table.grid{ break-inside:auto; }
  tr.nosplit{ break-inside:avoid; page-break-inside:avoid; }
}

@media print{
  td.vert p{ white-space:normal !important; font-size:.8em !important; line-height:1.05 !important; }
  td.vert{ overflow:hidden !important; }
}
/* ver.20260913.32: Word改ページ位置＝テーブル行の直前で改ページ */
#pageArea tr.pgrow > td{ border-top:3px double #4a5263 !important; }   /* 画面: 区切りを視認 */
@media print{
  tr.pgrow{ break-before:page; page-break-before:always; }
  #pageArea tr.pgrow > td{ border-top-width:var(--thin) !important; border-top-style:solid !important; } /* 印刷は通常罫線 */
}

/* ver.20260913.32: 各Word表を1ページに収めるための印刷圧縮 */
@media print{
  .sheet{ font-size:8pt !important; }
  .sheet p.ja{ line-height:1.15 !important; }
  .sheet p.vi{ line-height:1.2 !important; font-size:.8em !important; }
  table.grid td{ padding:.05em .12em !important; }
  table.grid tr{ height:auto !important; }
  /* 空の記入セル・textareaの最小高を詰める */
  td.fld > .sp{ line-height:1 !important; }
  .f{ min-height:0 !important; }
  /* 各分割テーブルはページ途中で割らない（1表1ページを強制） */
  #pageArea table.grid{ break-inside:avoid; page-break-inside:avoid; }
}

/* ver.20260913.32: 空ページ防止＝各表の前で改ページ（div.pagebreak廃止） */
@media print{
  .tbl-wrap.pgstart{ break-before:page; page-break-before:always; }
  #pageArea .tbl-wrap{ break-inside:avoid; page-break-inside:avoid; }
}
/* 画面プレビューでは表の間に区切り線 */
#pageArea .tbl-wrap.pgstart{ border-top:2px dashed #999; margin-top:14px; padding-top:14px; }

/* ver.20260913.32: 1ページ超の表は分割許可（空ページ防止） */
@media print{
  #t3, #t4c, #t8b, #t8c{ break-inside:auto !important; page-break-inside:auto !important; }
}

/* ver.20260913.32: 1-6式ページ分割（各テーブル=1 doc、横A4） */
#pageArea{ display:block !important; padding:16px !important; background:#888 !important; }
#pageArea .sheet{ width:auto !important; max-width:none !important; transform:none !important; zoom:1 !important; background:transparent !important; box-shadow:none !important; padding:0 !important; }
#pageArea .doc.p17doc{
  background:#fff !important; width:1040px !important; min-height:auto !important;
  margin:0 auto 24px auto !important; padding:10mm 8mm !important;
  box-shadow:0 4px 20px rgba(0,0,0,.5) !important; box-sizing:border-box !important;
  overflow:visible !important; page-break-after:always; break-after:page;
  font-size:12px !important; line-height:1.33 !important;
}
#pageArea .doc.p17doc .tbl-wrap{ margin:0 !important; border:0 !important; padding:0 !important; }
/* 画面で横A4を領域幅に収める縮小はJSのp17Fitで各docにzoom */
@media print{
  #pageArea .doc.p17doc{ width:100% !important; margin:0 !important; box-shadow:none !important; padding:0 !important; zoom:1 !important; }
  .app-bar,.fp,.page-nav,#pageNav{ display:none !important; }
}

<p class="ja">（注意）</p>
<p class="ja">１　Ⅰ欄は，支援対象者が複数名いる場合であって支援内容が同一の場合に限り，「１　氏名に「別紙の名簿のとおり」と記載し，Ⅰ欄の事項が記載された名簿（任意様式）を添付することとして差し支えない。ただし，申請を同時に行う場合に限る。</p>
<p class="ja" style="padding-left:3.00em;text-indent:-3.00em">２　Ⅱ欄４は，特定技能所属機関自らが１号特定技能外国人支援計画を実施する場合のみ記載すること。</p>
<p class="ja" style="padding-left:3.00em;text-indent:-3.00em">３　Ⅲ欄は，１号特定技能外国人支援計画の全部の実施を登録支援機関に委託する場合のみ記載すること。</p>
<p class="ja">４　Ⅳ欄１から９までの「実施予定」欄は，該当するものにチェックをし，実施予定が「有」の場合は実施時期を簡潔に記載し，「無」の場合は当該支援を実施しない理由について括弧内に記載すること。</p>
<p class="ja">５　Ⅳ欄１から９までの「委託の有無」欄は，特定技能所属機関が支援の一部を第三者に委託（登録支援機関に委託する場合を除く。）する場合にのみ「有」と記載し，特定技能所属機関が自ら支援を行う場合や登録支援機関に支援の全部を委託する場合には「無」と記載すること。</p>
<p class="ja">６　Ⅳ欄１から８までの「支援担当者又は委託を受けた支援実施者」欄は，特定技能所属機関が自ら支援を行う場合や登録支援機関に支援の全部を委託する場合に選任することとされている支援担当者を支援項目ごとに氏名及び括弧内に役職を記載し，特定技能所属機関から委託の一部を受けた第三者が支援を実施する場合は支援の委託を受けた者の氏名及び所在地を記載すること。</p>
<p class="ja" style="text-indent:1.00em">なお，Ⅳ欄９の「支援責任者又は支援担当者」欄は，特定技能所属機関が自ら支援を行う場合や登録支援機関に支援の全部を委託する場合に選任することとされている支援責任者又は支援担当者の氏名及び括弧内に役職を記載すること。このうちｂ欄及び自由記入欄については同欄の支援を特定技能所属機関から委託の一部を受けた第三者が実施する場合は支援の委託を受けた者の氏名及び所在地を記載すること。</p>
<p class="ja">７　Ⅳ欄１から４まで及び９の「実施方法」欄は，該当するものにチェックをすること。「その他」にチェックする場合は，その実施方法について括弧内に記載すること。</p>
<p class="ja">８　Ⅳ欄３アｄ「居室の広さ」について，該当するものを括弧内のチェックボックスから選択すること。</p>
<p class="ja">②から④までは、①で有にチェックを付した場合にのみ記載すること。</p>
<p class="ja">③は、「自己所有物件」、「借上物件」のいずれかにチェックを付すこと。</p>
<p class="ja">④は、例えば以下のような観点から記載し、説明が適切にされなければならない</p>
<p class="ja" style="padding-left:2.21em;text-indent:-1.11em">・	③が「自己所有物件」の場合：　実際に建設・改装等に要した費用、物件の耐用年数、入居する特定技能外国人の人数等を勘案して合理的であると説明可能な額</p>
<p class="ja" style="padding-left:2.21em;text-indent:-1.11em">・	③が「借上物件」の場合：　借上げに要する賃料（管理費・共益費等を含み、敷金・礼金・保証金・仲介手数料は含まない。以下同じ。）を、入居する特定技能外国人の人数で除した額</p>
<p class="ja">９　Ⅳ欄６イの「対応時間」欄は，対応可能曜日についてその時間帯を記載すること。</p>
<p class="vi">(Chú ý)</p>
<p class="vi">1	Mục I là trường hợp có nhiều đối tượng được hỗ trợ, chỉ trong trường hợp nội dung hỗ trợ như nhau thì ghi vào “1 Họ và tên là “như danh sách tên trong tài liệu đi kèm”, rồi đính kèm danh sách tên đã có điền các mục của cột I (mẫu bất kỳ). Tuy nhiên chỉ xét cho trường hợp thực hiện cùng lúc với khi nộp đơn yêu cầu.</p>
<p class="vi">2	Phần 4 mục II chỉ điền trong trường hợp cơ quan liên kết chức năng đặc định tự mình thực hiện kế hoạch hỗ trợ người nước ngoài có kỹ năng đặc định số 1.</p>
<p class="vi">3	Mục III chỉ điền trong trường hợp ủy thác toàn bộ việc thực hiện kế hoạch hỗ trợ người nước ngoài có kỹ năng đặc định số 1 cho cơ quan hỗ trợ có đăng ký.</p>
<p class="vi">4	Cột “Dự kiến thực hiện” từ 1 đến 9 trong mục IV, đánh dấu vào những chỗ tương ứng, nếu “Có” dự kiến thực hiện thì ghi đơn giản thời gian thực thiện, nếu “không” thì ghi lý do không thực hiện hỗ trợ tương ứng trong ngoặc đơn.</p>
<p class="vi">5 Cột “Có ủy thác không” từ 1 đến 9 trong mục IV điền “Có” chỉ trong trường hợp cơ quan liên kết chức năng đặc định ủy thác một phần hỗ trợ cho bên thứ ba (ngoại trừ trường hợp ủy thác cho cơ quan hỗ trợ có đăng ký), điền “không” trong trường hợp cơ quan liên kết chức năng đặc định tự mình tiến hành hỗ trợ hoặc ủy thác toàn bộ hỗ trợ cho cơ quan hỗ trợ có đăng ký.</p>
<p class="vi">6 Cột “Người phụ trách hỗ trợ hoặc người phụ trách thực hiện đã nhận ủy thác” từ 1 đến 8 trọng mục IV thì điền họ tên và chức vụ trong ngoặc của người phụ trách hỗ trợ được tuyển chọn ở từng hạng mục hỗ trợ trong trường hợp cơ quan liên kết chức năng đặc định tự mình tiến hành hỗ trợ hoặc trong trường hợp ủy thác toàn bộ hỗ trợ cho cơ quan hỗ trợ có đăng ký, trường hợp bên thứ ba nhận một phần ủy thác từ cơ quan liên kết chức năng đặc định thì phải điền họ tên và địa chỉ trụ sở của bên được ủy thác hỗ trợ.</p>
<p class="vi" style="text-indent:0.86em">Ngoài ra, cột “Người chịu trách nhiệm hỗ trợ hoặc người phụ trách hỗ trợ” của phần 9 mục IV thì điền rõ họ tên và chức vụ trong ngoặc của người chịu trách nhiệm hỗ trợ hoặc người phụ trách hỗ trợ được tuyển chọn trong trường hợp cơ quan liên kết chức năng đặc định tự tiến hành hỗ trợ hay trường hợp ủy thác toàn bộ hỗ trợ cho cơ quan hỗ trợ có đăng ký. Trong đó, đối với cột b và cột điền tự do, trường hợp việc hỗ trợ tại các cột này được bên thứ ba nhận một phần ủy thác thực hiện từ cơ quan liên kết chức năng đặc định, thì phải điền họ tên và địa chỉ trụ sở của bên nhận ủy thác hỗ trợ.</p>
<p class="vi">7	Cột “Phương pháp thực hiện” từ 1 đến 4, 9 trong mục IV, đánh dấu vào những nội dung tương ứng. Trường hợp đánh vào “Khác” thì phải ghi phương pháp thực hiện đó vào trong ngoặc đơn.</p>
<p class="vi">8	Về “Diện tích phòng ở” 3Ad mục IV,” phải chọn nội dung tương ứng từ các hộp đánh dấu trong ngoặc đơn.</p>
<p class="vi">Từ ② đến ④, chỉ điền trong trường hợp đã đánh dấu “Có” ở ①.</p>
<p class="vi">③ thì đánh dấu vào “Cơ sở do bản thân sở hữu” hoặc “Cơ sở thuê”.</p>
<p class="vi">④ thì ví dụ như phải ghi quan điểm như sau và giải thích phù hợp.</p>
<p class="vi" style="padding-left:2.21em;text-indent:-1.11em">- Trường hợp ③ là “Cơ sở do bản thân sở hữu”: Là số tiền có thể giải thích hợp lý với việc xem xét đến chi phí cần để xây dựng và cải tạo, v.v. trong thực tế, tuổi thọ sử dụng của cơ sở, số lượng người nước ngoài kỹ năng đặc định vào ở, v.v.</p>
<p class="vi" style="padding-left:2.21em;text-indent:-1.11em">- Trường hợp ③ là “Cơ sở thuê”: Là số tiền được tính bằng cách chia tiền thuê cần để thuê cơ sở (bao gồm phí quản lý, phí tiện ích, v.v., không bao gồm tiền đặt cọc, tiền lễ, tiền bảo đảm, phí môi giới. Sau đây cũng áp dụng tương tự.) cho số lượng người nước ngoài kỹ năng đặc định vào ở.</p>
<p class="vi">9 Cột “Thời gian giải quyết” 6C trong mục IV, điền thứ trong tuần có thể giải quyết được và khoảng thời gian đó.</p>
<p class="ja" style="padding-left:3.00em;text-indent:-3.00em">上記の支援は、地方公共団体が実施する共生社会の実現のための施策を踏まえ、適切に実施します。</p>
<p class="ja" style="padding-left:3.00em;text-indent:-3.00em">また，本書面は支援対象者が十分に理解できる言語に翻訳し，支援対象者に交付するとともに，内容について十分に説明しました。</p>

<p class="vi">Ngoài ra, văn bản này chúng tôi đã dịch sang ngôn ngữ mà đối tượng được hỗ trợ có thể hiểu được đầy đủ, cùng với việc giao cho đối tượng được hỗ trợ, chúng tôi đã giải thích đầy đủ về nội dung.</p>

// DB → サイドバー流し込み
async function loadFromDB(passedInfo){
  var info=passedInfo;
  if(!info){ var sel=document.getElementById('caseSelect'); if(!sel||!sel.value) return; try{info=JSON.parse(sel.value);}catch(e){return;} }
  if(!info||!info.caseId) return;
  var caseId=info.caseId, companyId=info.companyId, companyName=info.companyName;
  var _s=function(id,val){var e=document.getElementById(id); if(e&&val!=null&&val!=='') e.value=val;};
  try{
    var res=await Promise.all([
      sb('cases?select=id,name,applicant,company_id,doc_create_date&id=eq.'+caseId),
      sb('persons?select=*&case_id=eq.'+caseId)
    ]);
    var cas=res[0]&&res[0][0]; var _pd=res[1]&&res[1][0]; var pd=(_pd&&_pd.data)||_pd||{};
    // 申請人
    _s('f_applicant', (pd.applicant_name_en||pd.applicantNameEn||pd.nameEn)|| (cas&&cas.applicant)||'');
    _s('f_nationality', pd.nationality||pd.nationality_ja||'');
    _s('f_gender', pd.gender||'');
    var bd=(pd.birthday||pd.birth_date||pd.birthDate||'').toString().replace(/[年月]/g,'-').replace(/日/,'').split(/[-\/.]/);
    if(bd.length>=3){_s('f_birthY',bd[0]);_s('f_birthM',String(parseInt(bd[1],10)||bd[1]));_s('f_birthD',String(parseInt(bd[2],10)||bd[2]));}
    // 作成日
    var dc=(cas&&cas.doc_create_date||'').toString().replace(/[年月]/g,'-').replace(/日/,'').split(/[-\/.]/);
    if(dc.length>=3){_s('es_createY',dc[0]);_s('es_createM',String(parseInt(dc[1],10)||dc[1]));_s('es_createD',String(parseInt(dc[2],10)||dc[2]));}
    // 所属機関
    var coQ = companyId ? 'companies?select=*&id=eq.'+companyId : (companyName?'companies?select=*&name=eq.'+encodeURIComponent(companyName):null);
    if(coQ){ var cos=await sb(coQ); var co=cos&&cos[0];
      if(co){
        _s('es_coName',co.name); _s('es_coNameEn',co.name_en);
        _s('es_coNameKana',co.name_kana||co.kana);
        _s('es_coZip',co.zip); _s('es_coAddress',(co.pref||'')+(co.city||'')+(co.address||'')); _s('es_coAddressEn',co.address_en);
        var t=(co.tel||'').split(/[-－]/); _s('es_coTel1',t[0]); _s('es_coTel2',t[1]); _s('es_coTel3',t[2]);
        _s('es_coMgrName',co.support_manager_name||co.rep_name); _s('es_coMgrNameEn',co.support_manager_name_en||co.rep_name_en);
        _s('es_coMgrTitle',co.support_manager_title||co.rep_title); _s('es_coMgrTitleEn',co.support_manager_title_en||co.rep_title_en);
        _s('es_coMgrKana',co.support_manager_kana);
        _s('es_coAuthorName',co.author_name||co.rep_name);
      }
    }
    // 登録支援機関
    if(typeof findSupportOrg==='function'){
      try{ var so=await findSupportOrg(info.orgName||''); if(so){
        _s('es_soName',so.name); _s('es_soNameEn',so.name_en); _s('es_soNameKana',so.name_kana);
        _s('es_soRegNo',so.reg_no); _s('es_soZip',so.zip); _s('es_soAddress',so.address);
        _s('es_soRepName',so.rep_name); _s('es_soRepNameEn',so.rep_name_en); _s('es_soRepKana',so.rep_kana);
      }}catch(e){}
    }
    p();
    if(typeof showToast==='function') showToast('案件を読み込みました');
  }catch(e){ console.error(e); alert('読込エラー: '+e.message); }
}

// プレビューをプレビュー領域の幅に収める（横長A4を自動縮小）
function p17Fit(){
  var area=document.getElementById('pageArea'); if(!area) return;
  var docs=area.querySelectorAll('.doc.p17doc'); if(!docs.length) return;
  var avail=area.clientWidth - 40;
  if(avail<=0){ requestAnimationFrame(p17Fit); return; }
  var w=1120;                       // 横A4 doc の実効幅（右端余裕込み）
  var scale=Math.min(1, avail/w);
  docs.forEach(function(d){ d.style.zoom=''; d.style.transform='none'; d.style.zoom=scale; });
}
window.addEventListener('resize', function(){ if(!window._editMode) p17Fit(); });
// iframeが後から表示される（タブ切替）ケース: 可視化・フォーカス・visibilitychangeで再フィット
window.addEventListener('focus', function(){ if(!window._editMode) p17Fit(); });
document.addEventListener('visibilitychange', function(){ if(!document.hidden && !window._editMode) p17Fit(); });
(function(){
  var area=document.getElementById('pageArea');
  if(area && window.IntersectionObserver){
    try{ new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting && !window._editMode) p17Fit(); }); }).observe(area); }catch(e){}
  }
  // 保険: 起動後しばらく定期的にfit（幅が遅れて確定する環境向け）
  var n=0, t=setInterval(function(){ n++; if(!window._editMode) p17Fit(); if(n>=6) clearInterval(t); }, 400);
})();
// pageAreaの幅変化を監視して常にフィット（iframe内で初期幅が遅れて確定するケース対策）
(function(){
  function obs(){
    var area=document.getElementById('pageArea'); if(!area||!window.ResizeObserver) return;
    try{ new ResizeObserver(function(){ if(!window._editMode) p17Fit(); }).observe(area); }catch(e){}
  }
  if(document.readyState!=='loading') obs(); else document.addEventListener('DOMContentLoaded',obs);
})();

document.addEventListener('DOMContentLoaded', function(){
  if(typeof initCommon==='function'){ try{ initCommon(); }catch(e){} }
  p();
  var q=new URLSearchParams(location.search).get('case');
  if(q){ loadFromDB({caseId:q}); }
  setTimeout(function(){ p17Fit(); if(typeof setupPageTracker==="function") setupPageTracker(); },120);
});


// ページ切替時も必ずフィット（common.scrollToPageの前後でzoom維持）
(function(){
  var _orig = window.scrollToPage;
  window.scrollToPage = function(n){ if(window.p17Fit) p17Fit(); if(_orig) return _orig(n); };
})();
