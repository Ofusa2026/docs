<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>在留資格変更許可申請書（所属機関等作成用2・特定技能）</title>

<link rel="stylesheet" href="ofusa_common.css?v=1784720412">

<body>
<div class="app-bar">
  <div>
    <div class="app-bar-title">🏢 在留資格変更許可申請書（所属機関等作成用2）　特定技能</div>
    <div class="ver">ver.20260715.03</div>
  </div>
  <div class="bar-btns">
    <button class="btn" id="editModeBtn" onclick="toggleEditMode()" style="background:#7c3aed;color:white;">✏️ 直接編集</button>

<div class="main">

  <div class="fp-inner">
    <div class="fs"><div class="fs-title">2 (14)　取次機関<span style="font-weight:normal;font-size:9px;color:#aaa;">（情報の取次ぎを行う者）</span></div>
      <div class="fg"><label>氏名又は名称</label><input id="f_imName" oninput="p()"></div>
      <div class="fg"><label>住所（所在地）</label><textarea id="f_imAddr" oninput="p()" rows="2"></textarea></div>
      <div class="fg"><label>電話番号</label><input id="f_imTel" oninput="p()"></div>
    </div>
    <div class="fs"><div class="fs-title">3　特定技能所属機関 (1)〜(10)</div>
      <div class="fg"><label>(1) 氏名又は名称</label><input id="f_o2coName" oninput="p()"></div>
      <div class="fg"><label>(2) 法人番号（13桁）</label><input id="f_coCorp" oninput="p()" maxlength="13"></div>
      <div class="fg"><label>(3) 雇用保険適用事業所番号（11桁）</label><input id="f_coEi" oninput="p()" maxlength="11"></div>
      <div class="fg"><label>(4) 主たる業種（番号1つ）</label><input id="f_bizMain" oninput="p()"></div>
      <div class="fg"><label>(4) 他の業種（番号・複数可）</label><input id="f_bizSub" oninput="p()" placeholder="カンマ区切り"></div>
      <div class="fg"><label>(5) 住所（本店・主たる事務所）</label><textarea id="f_coAddr" oninput="p()" rows="2"></textarea></div>
      <div class="fg"><label>　電話番号</label><input id="f_coTel" oninput="p()"></div>
      <div class="fg"><label>(6) 資本金（円）</label><input id="f_capital" oninput="p()"></div>

<script>

(function(){
  let h='';
  NG.forEach(([k,ja,en,dl])=>{
    h+=`<div style="border-top:1px dashed #444;margin-top:4px;padding-top:3px;">
      <div style="font-size:10px;color:#888;line-height:1.4;">${ja.slice(0,44)}…</div>
      <div class="fg"><label>有無</label><select id="f_${k}" onchange="p()"><option value=""></option><option>有</option><option selected>無</option></select></div>
      <div class="fg"><label>${dl}</label><input id="f_${k}d" oninput="p()"></div>
    </div>`;
  });
  document.getElementById('ngRows').innerHTML=h;
})();

function v_(id){ const e=document.getElementById(id); return e?String(e.value||'').trim():''; }
function setPick(id, val){
  const e=document.getElementById(id); if(!e) return;
  e.value = (String(e.value||'').trim()===val) ? '' : val;
  p();
}
function pick(id, a, b, ea, eb){
  const cur=v_(id);
  const O=(txt,sel)=>`<span onclick="setPick('${id}','${a===txt||ea===txt?a:b}')" style="cursor:pointer;padding:0 3px;${sel?'border:1px solid #000;border-radius:45%;':''}">${txt}</span>`;
  let h=`<span style="white-space:nowrap;">${O(a,cur===a)}・${O(b,cur===b)}</span>`;
  if(ea&&eb) h+=`<span class="en" style="margin-left:3px;white-space:nowrap;">${O(ea,cur===a)}／${O(eb,cur===b)}</span>`;
  return h;
}
// 法人番号13桁・雇用保険番号11桁のマス目
function digits(id, n){
  const s=v_(id).replace(/[^0-9A-Za-z]/g,'');
  let h='';
  for(let i=0;i<n;i++) h+=`<span class="digit">${s[i]||''}</span>`;
  return `<span data-bind="${id}">${h}</span>`;
}

function p(){
  if(_editMode) return;
  const w=document.getElementById('pageArea'); if(!w) return;

  NG.forEach(([k,ja,en,dl])=>{

        <div class="en">(${dl==='内容'?'Details':dl==='内容・理由'?'Details / Reason':'Details / Name of applicable person'}: )</div></div>
    </div>`;
  });
  w.innerHTML=`
<div class="doc">
<div class="page-num-label">P1</div>
<table style="width:100%;border-collapse:collapse;margin-bottom:1.5mm;"><tr>
  <td style="border:none;font-size:7.4pt;">所属機関等作成用 ２　　V　（「特定技能（1号）」・「特定技能（2号）」）

  <td style="border:none;text-align:right;font-size:7.4pt;white-space:nowrap;">在留資格変更用<div class="en">For change of status</div></td>
</tr></table>

<div class="q">(14)取次機関（職業紹介事業者があっせんを行うに際し，情報の取次ぎを行う者がある場合に記入）
  <div class="en">Intermediary organization (fill in this section if there is a person who intermediates information when the employment placement service provider carries out the mediation)</div></div>
<table class="frm" style="margin-top:1px;">
  <colgroup><col style="width:16%"><col style="width:38%"><col style="width:14%"><col style="width:32%"></colgroup>
  <tr><td class="lbl">氏名又は名称<div class="en">Name of person or organization</div></td><td class="val" colspan="3">${f('f_imName')}</td></tr>
  <tr>
    <td class="lbl">住所（所在地）<div class="en">Address</div></td><td class="val">${f('f_imAddr')}</td>
    <td class="lbl">電話番号<div class="en">Telephone No.</div></td><td class="val">${f('f_imTel')}</td>
  </tr>
</table>

<div class="sec">3　特定技能所属機関 <span class="en">Organization of affiliation of the specified skilled worker</span></div>
<div style="font-size:6pt;">※(3)及び(8)については，主に勤務させる事業所について記載すること
  <div class="en">For sub-items (3) and (8), fill in the information of principal place of business where foreign national is to work</div></div>
<table class="frm" style="margin-top:1px;">
  <colgroup><col style="width:16%"><col style="width:34%"><col style="width:16%"><col style="width:34%"></colgroup>
  <tr>
    <td class="lbl">(1)氏名又は名称<div class="en">Name of person or organization ※本店又は主たる事務所のものを記入</div></td><td class="val">${f('f_o2coName')}</td>

  </tr>
  <tr>
    <td class="lbl">(3)雇用保険適用事業所番号（11桁）<div class="en">Employment insurance application office number (11 digits) *If not applicable, it should be omitted.</div></td>

  <tr>

    <td class="val" colspan="3" style="font-size:7pt;">
      ○主たる業種を別紙「業種一覧」から選択して番号を記入（１つのみ）：${f('f_bizMain')}<br>
      ○他に業種があれば別紙「業種一覧」から選択して番号を記入（複数選択可）：${f('f_bizSub')}

// 案件切替時に前の案件の値が残らないよう必ず初期化する（別人の情報が載るのを防ぐ）
function resetForm(){
  const ids=['f_imName','f_imAddr','f_imTel','f_o2coName','f_coCorp','f_coEi','f_bizMain','f_bizSub',
    'f_coAddr','f_coTel','f_capital','f_sales','f_staff','f_rep','f_office','f_officeAddr',
    'f_ins1','f_ins2','f_li1','f_li2','f_li3','f_li4','f_li5'];
  NG.forEach(([k])=>ids.push('f_'+k+'d'));
  ids.forEach(id=>{const e=document.getElementById(id); if(e) e.value='';});
  // 欠格事由は「無」が既定
  NG.forEach(([k])=>{const e=document.getElementById('f_'+k); if(e) e.value='無';});
}
async function loadFromDB(passedInfo){
  let info = passedInfo;
  if(!info){
    const sel=document.getElementById('caseSelect');
    if(!sel.value) return;
    try{info=JSON.parse(sel.value);}catch(e){return;}
  }
  if(!info || !info.caseId) return;
  const {caseId, companyId, companyName}=info;
  resetForm();
  try{
    const cases=await sb('cases?select=company,company_id&id=eq.'+caseId);
    const cas=cases&&cases[0];
    let co=null;
    const cid=companyId||(cas&&cas.company_id);
    // ver.20260715: 実在する列のみ指定する。存在しない列を混ぜるとPostgRESTがエラーを返し反映が全部止まる。
    // 実データ件数(2,032社中): corp_no=1466 / capital=1512 / sales=1488 / employees=1514 / labor_ins_no=1410 / rep_name=1540
    const sel='name,corp_no,pref,city,address,tel,capital,sales,employees,labor_ins_no,author_name,author_title,rep_name,rep_title';
    if(cid){ const r=await sb('companies?select='+sel+'&id=eq.'+cid); co=r&&r[0]; }
    if(!co){
      const nm=companyName||(cas&&cas.company);
      if(nm){ const r=await sb('companies?select='+sel+'&name=eq.'+encodeURIComponent(nm)); co=r&&r[0]; }
    }
    const s=(id,val)=>{const e=document.getElementById(id);if(e&&val)e.value=val;};
    if(co){
      s('f_o2coName',co.name||'');
      s('f_coCorp',co.corp_no||'');
      s('f_coAddr',((co.pref||'')+(co.city||'')+(co.address||''))||'');
      s('f_coTel',co.tel||'');
      s('f_capital',co.capital||'');
      s('f_sales',co.sales||'');
      s('f_staff',co.employees||'');
      s('f_rep',((co.rep_title||co.author_title||'')+' '+(co.rep_name||co.author_name||'')).trim());
      // ver.20260715: 労働保険番号は自動分割しない。
      // アンシスの実データは桁数がバラバラ（14桁1,135件/13桁69件/11桁60件/15桁21件/18桁17件…）で、
      // しかも「01-3-13-101341-000」のように区切り済みの値が主流。数字だけを機械的に切ると
      // 様式の枠(2-2-6-3-4)とズレて別の番号になる。法定書類なので誤りを出すより手入力に委ねる。
      // 参考値として原文を最初の枠に入れ、運用者が見て配り直せるようにする。
      if(co.labor_ins_no && !/^[―ー\-]+$/.test(String(co.labor_ins_no).trim())){
        window._laborInsRaw = co.labor_ins_no;   // 画面下に原文を出す
      }
    }
    p(); showToast('✅ データを読み込みました');
  }catch(e){showToast('⚠️ 読込エラー: '+e.message);console.error(e);}
}
initCaseSelect(); p();

function fitDocToPreview(){
  requestAnimationFrame(()=>{
    const pp=document.querySelector('.pp'), area=document.getElementById('pageArea');
    if(!pp||!area) return;
    const ppW=pp.clientWidth-40, docW=794;
    area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = (ppW<docW) ? (ppW/docW) : 1; });
  });
}
window.addEventListener('resize', fitDocToPreview);

window.addEventListener('message', async function(e){
  if(!e.data||e.data.type!=='SELECT_CASE') return;
  const info=e.data.info;
  if(!info||!info.caseId) return;
  const sel=document.getElementById('caseSelect');
  if(sel){
    let found=false;
    for(let o of sel.options){
      try{ const d=JSON.parse(o.value); if(d.caseId===info.caseId){sel.value=o.value;found=true;break;} }catch(e2){}
    }
    if(!found){
      const opt=document.createElement('option');
      opt.value=JSON.stringify(info); opt.textContent='（indexから選択）';
      sel.appendChild(opt); sel.value=opt.value;
    }
  }
  if(typeof loadCaseToForm==='function'){ await loadCaseToForm(info, 'shinsei_henkou_org2'); }
  if(typeof loadFromDB==='function') loadFromDB(info);
});
</script>
