      <div class="fg"><label>5 出生地</label><input id="f_birthPlace" oninput="p()"></div>

    <div class="fs"><div class="fs-title">11〜12　現在の在留資格</div>

<script>
// 16 在日親族の入力欄（6行）
const FAM_COLS=[['Rel','続柄'],['Nm','氏名'],['Bd','生年月日'],['Nat','国籍・地域'],['Liv','同居'],['Wk','勤務先・通学先'],['Cd','在留カード番号']];
(function(){
  let h='';
  for(let i=1;i<=6;i++){
    h+=`<div style="border-top:1px dashed #444;margin-top:4px;padding-top:3px;"><div style="font-size:10px;color:#888;">${i}人目</div>`;
    FAM_COLS.forEach(([k,l])=>{
      if(k==='Liv') h+=`<div class="fg"><label>${l}</label><select id="f_fam${i}${k}" onchange="p()"><option value=""></option><option>有</option><option>無</option></select></div>`;
      else h+=`<div class="fg"><label>${l}</label><input id="f_fam${i}${k}" oninput="p()"></div>`;
    });
    h+='</div>';
  }
  document.getElementById('famRows').innerHTML=h;
})();

function v_(id){ const e=document.getElementById(id); return e?String(e.value||'').trim():''; }

// ver.20260715: プレビュー上の「男/女」「有/無」をクリックで選べるようにする。
// 選んだ側は日本語・英訳の両方を丸で囲む。もう一度押すと解除。
// 実体はサイドバーの select なので、DB保存・直接編集の作法は他書類と同じ。
function setPick(id, val){
  const e=document.getElementById(id); if(!e) return;
  e.value = (String(e.value||'').trim()===val) ? '' : val;   // 同じものを再クリックで解除
  p();
}
// a,b = 日本語の選択肢 ／ ea,eb = その訳（省略時は訳行を出さない）
function pick(id, a, b, ea, eb){
  const cur=v_(id);
  const O=(txt,sel)=>`<span onclick="setPick('${id}','${a===txt||ea===txt?a:b}')" style="cursor:pointer;padding:0 3px;${sel?'border:1px solid #000;border-radius:45%;':''}">${txt}</span>`;
  let h=`<span style="white-space:nowrap;">${O(a,cur===a)}・${O(b,cur===b)}</span>`;
  if(ea&&eb) h+=`<div class="en" style="text-align:center;"><span style="white-space:nowrap;">${O(ea,cur===a)}／${O(eb,cur===b)}</span></div>`;
  return h;
}

function p(){
  if(_editMode) return;
  const w=document.getElementById('pageArea'); if(!w) return;
  let fam='';
  for(let i=1;i<=6;i++){
    fam+='<tr>';
    FAM_COLS.forEach(([k])=>{
      if(k==='Liv') fam+=`<td style="text-align:center;font-size:6.4pt;">${pick('f_fam'+i+k,'有','無')}</td>`;
      else fam+=`<td>${f('f_fam'+i+k).replace('class="f"','class="f" style="font-size:6.4pt;"')}</td>`;
    });
    fam+='</tr>';
  }
  w.innerHTML=`
<div class="doc">
<div class="page-num-label">P1</div>
<div style="font-size:7pt;">別記第三十号様式（第二十条関係）</div>
<table style="width:100%;border-collapse:collapse;margin-bottom:1mm;"><tr>

<div style="font-size:7.6pt;margin:1.5mm 0 2mm;">　出入国管理及び難民認定法第２０条第２項の規定に基づき，次のとおり在留資格の変更を申請します。
<div class="en">　Pursuant to the provisions of Paragraph 2 of Article 20 of the Immigration Control and Refugee Recognition Act, I hereby apply for a change of status of residence.</div></div>

<table class="frm">
<colgroup><col style="width:19%"><col style="width:31%"><col style="width:19%"><col style="width:31%"></colgroup>
<tr>
  <td class="lbl">1　国　籍・地　域<div class="en">Nationality/Region</div></td>
  <td class="val">${f('f_nationality')}</td>

</tr>
<tr>

  <td class="val" colspan="3">${f('f_name')}<div class="en">Family name／Given name</div></td>
</tr>
<tr>

  <td class="val" colspan="3">${f('f_homeAddr')}</td>
</tr>
<tr>
  <td class="lbl">9　住居地<div class="en">Address in Japan</div></td>
  <td class="val" colspan="3">${f('f_jpAddr')}</td>

  <td class="val">${f('f_perTel')}</td>

  <td class="val">${f('f_perCel')}</td>
</tr>
<tr>
  <td class="lbl">10　旅券<div class="en">Passport</div></td>
  <td class="val">(1) 番　号 <span class="en">Number</span><br>${f('f_passport')}</td>
  <td class="val" colspan="2">(2) 有効期限 <span class="en">Date of expiration</span><br>${f('f_passExpY')} <span style="font-size:6pt;">年 Year</span> ${f('f_passExpM')} <span style="font-size:6pt;">月 Month</span> ${f('f_passExpD')} <span style="font-size:6pt;">日 Day</span></td>
</tr>
<tr>
  <td class="lbl">11　現に有する在留資格<div class="en">Status of residence</div></td>
  <td class="val">${f('f_curStatus')}</td>
  <td class="lbl">　在留期間<div class="en">Period of stay</div></td>
  <td class="val">${f('f_curPeriod')}</td>
</tr>
<tr>
  <td class="lbl">　在留期間の満了日<div class="en">Date of expiration</div></td>
  <td class="val" colspan="3">${f('f_expY')} <span style="font-size:6pt;">年 Year</span> ${f('f_expM')} <span style="font-size:6pt;">月 Month</span> ${f('f_expD')} <span style="font-size:6pt;">日 Day</span></td>
</tr>
<tr>
  <td class="lbl">12　在留カード番号<div class="en">Residence card number</div></td>
  <td class="val" colspan="3">${f('f_card')}</td>
</tr>
<tr>
  <td class="lbl">13　希望する在留資格<div class="en">Desired status of residence</div></td>
  <td class="val">${f('f_newStatus')}</td>
  <td class="lbl">　在留期間<div class="en">Period of stay</div></td>
  <td class="val">${f('f_newPeriod')}　<span style="font-size:5.6pt;">（審査の結果によって希望の期間とならない場合があります。）<br>( It may not be as desired after examination.)</span></td>
</tr>
<tr>
  <td class="lbl">14　変更の理由<div class="en">Reason for change of status of residence</div></td>
  <td class="val" colspan="3">${f('f_reason')}</td>
</tr>
<tr>
  <td colspan="4" class="lbl">15　犯罪を理由とする処分を受けたことの有無 （日本国外におけるものを含む。）※交通違反等による処分を含む。
    <div class="en">　Criminal record (in Japan / overseas)※Including dispositions due to traffic violations, etc.</div>
    <div style="font-size:7.6pt;margin-top:1px;display:flex;align-items:flex-start;gap:6px;">
      <div>${pick('f_crime','有','無','Yes','No')}</div>
      <div style="flex:1;">（具体的内容 ${f('f_crimeDetail')} ）<div class="en">( Detail: )</div></div>
    </div>
  </td>
</tr>
<tr>
  <td colspan="4" class="lbl">16　在日親族（父・母・配偶者・子・兄弟姉妹・祖父母・叔(伯)父・叔(伯)母など）及び同居者
    <div class="en">　Family in Japan (father, mother, spouse, children, siblings, grandparents, uncle, aunt or others) and cohabitants</div>
    <div style="font-size:7.6pt;margin:1px 0;display:flex;align-items:flex-start;gap:6px;">
      <div>${pick('f_famYN','有','無','Yes','No')}</div>

    </div>

// 'YYYY-MM-DD' → [Y,M,D]
function _ymd(s){
  const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m?[m[1],String(+m[2]),String(+m[3])]:['','',''];
}
async function loadFromDB(passedInfo){
  let info = passedInfo;
  if(!info){
    const sel=document.getElementById('caseSelect');
    if(!sel.value) return;
    try{info=JSON.parse(sel.value);}catch(e){return;}
  }
  if(!info || !info.caseId) return;
  const {caseId}=info;
  try{
    const [persons,cases]=await Promise.all([
      sb('persons?select=applicant_name_en,nationality,birthdate,gender,birth_place,spouse,occupation,home_country_address,address,jp_postal_code,jp_address,jp_detail_address,phone,tel_num,cel_phone,passport,passport_expiry,residence_status,stay_period,expire,residence_card&case_id=eq.'+caseId),
      sb('cases?select=applicant,expire&id=eq.'+caseId)
    ]);
    const pd=persons&&persons[0], cas=cases&&cases[0];
    const s=(id,val)=>{const e=document.getElementById(id);if(e&&val)e.value=val;};
    if(pd){
      s('f_nationality',pd.nationality||'');
      const b=_ymd(pd.birthdate); s('f_birthY',b[0]); s('f_birthM',b[1]); s('f_birthD',b[2]);
      s('f_name',pd.applicant_name_en||(cas&&cas.applicant)||'');
      s('f_gender',pd.gender||'');
      s('f_birthPlace',pd.birth_place||'');
      s('f_spouse',pd.spouse||'');
      // ver.20260715: 職業はアンシス未入力が多いため在留資格から補完する。
      // 「留学」なら学生、それ以外は会社員。アンシスに値があればそちらを優先。
      s('f_occupation', pd.occupation || (/留学/.test(pd.residence_status||'') ? '学生' : (pd.residence_status ? '会社員' : '')));
      // 8 本国における居住地：未入力なら出生地で代用（様式も =出生地 を参照している）
      s('f_homeAddr',pd.home_country_address||pd.birth_place||'');
      // ver.20260715: 住居地の本命は persons.address（3,096件）。
      // jp_address は5,393件中15件しか無いため、address を優先し jp_* はフォールバックに回す。
      const _addr = pd.address || ((pd.jp_address||'')+(pd.jp_detail_address||''));
      s('f_jpAddr',((pd.jp_postal_code?'〒'+pd.jp_postal_code+'　':'')+(_addr||'')).trim());
      s('f_perTel',pd.phone||pd.tel_num||'');
      s('f_perCel',pd.cel_phone||'');
      s('f_passport',pd.passport||'');
      const pe=_ymd(pd.passport_expiry); s('f_passExpY',pe[0]); s('f_passExpM',pe[1]); s('f_passExpD',pe[2]);
      s('f_curStatus',pd.residence_status||'');
      s('f_curPeriod',pd.stay_period||'');
      const ex=_ymd(pd.expire||(cas&&cas.expire)); s('f_expY',ex[0]); s('f_expM',ex[1]); s('f_expD',ex[2]);
      s('f_card',pd.residence_card||'');
    } else if(cas){
      s('f_name',cas.applicant||'');
      const ex=_ymd(cas.expire); s('f_expY',ex[0]); s('f_expM',ex[1]); s('f_expD',ex[2]);
    }
    p(); showToast('✅ データを読み込みました');
  }catch(e){showToast('⚠️ 読込エラー: '+e.message);console.error(e);}
}
initCaseSelect(); p();

function fitDocToPreview(){
  requestAnimationFrame(()=>{
    const pp=document.querySelector('.pp'), area=document.getElementById('pageArea');
    if(!pp||!area) return;
    const ppW=pp.clientWidth-40, docW=794;
    area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = (ppW<docW) ? (ppW/docW) : 1; });
  });
}
window.addEventListener('resize', fitDocToPreview);

window.addEventListener('message', async function(e){
  if(!e.data||e.data.type!=='SELECT_CASE') return;
  const info=e.data.info;
  if(!info||!info.caseId) return;
  const sel=document.getElementById('caseSelect');
  if(sel){
    let found=false;
    for(let o of sel.options){
      try{ const d=JSON.parse(o.value); if(d.caseId===info.caseId){sel.value=o.value;found=true;break;} }catch(e2){}
    }
    if(!found){
      const opt=document.createElement('option');
      opt.value=JSON.stringify(info); opt.textContent='（indexから選択）';
      sel.appendChild(opt); sel.value=opt.value;
    }
  }
  if(typeof loadCaseToForm==='function'){ await loadCaseToForm(info, 'shinsei_henkou'); }
  if(typeof loadFromDB==='function') loadFromDB(info);
});
</script>
