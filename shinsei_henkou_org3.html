 ['q31','(31)外国人の報酬を，当該外国人の指定する銀行その他の金融機関に対する振込み又は現実に支払われた額を確認できる方法によって支払われることとしており，かつ，後者の場合には，出入国在留管理庁長官に報酬の支払を裏付ける客観的な資料を提出し，その確認を受けることとしていることの有無',

  'Does the organization meet the criteria stipulated in the public notice in light of circumstances specific to the specified industrial field?','',''],
];
(function(){
  const build=(arr,el)=>{
    let h='';
    arr.forEach(([k,ja,en,dl,def])=>{
      h+=`<div style="border-top:1px dashed #444;margin-top:4px;padding-top:3px;">
        <div style="font-size:10px;color:#888;line-height:1.4;">${ja.slice(0,42)}…</div>
        <div class="fg"><label>有無</label><select id="f_${k}" onchange="p()"><option value=""></option><option${def==='有'?' selected':''}>有</option><option${def==='無'?' selected':''}>無</option></select></div>`;
      if(dl) h+=`<div class="fg"><label>${dl}</label><input id="f_${k}d" oninput="p()"></div>`;
      h+='</div>';
    });
    document.getElementById(el).innerHTML=h;
  };
  build(G1,'g1'); build(G2,'g2');

function v_(id){ const e=document.getElementById(id); return e?String(e.value||'').trim():''; }
function setPick(id, val){
  const e=document.getElementById(id); if(!e) return;
  e.value = (String(e.value||'').trim()===val) ? '' : val;
  p();
}
function pick(id, a, b, ea, eb){
  const cur=v_(id);
  const O=(txt,sel)=>`<span onclick="setPick('${id}','${a===txt||ea===txt?a:b}')" style="cursor:pointer;padding:0 3px;${sel?'border:1px solid #000;border-radius:45%;':''}">${txt}</span>`;
  let h=`<span style="white-space:nowrap;">${O(a,cur===a)}・${O(b,cur===b)}</span>`;
  if(ea&&eb) h+=`<span class="en" style="margin-left:3px;white-space:nowrap;">${O(ea,cur===a)}／${O(eb,cur===b)}</span>`;
  return h;
}
function ck(id, val){
  const on=v_(id)===val;
  return `<span onclick="setPick('${id}','${val}')" style="cursor:pointer;font-family:monospace;">${on?'■':'□'}</span>`;
}

function p(){
  if(_editMode) return;
  const w=document.getElementById('pageArea'); if(!w) return;
  const row=([k,ja,en,dl])=>`
    <div class="q">${ja}<div class="en">${en}</div>
      <div style="margin-top:1px;display:flex;align-items:flex-start;gap:6px;">
        <div style="white-space:nowrap;">${pick('f_'+k,'有','無','Yes','No')}</div>
        ${dl?`<div style="flex:1;">（${dl}：${f('f_'+k+'d')}）<div class="en">(Details: )</div></div>`:''}
      </div>
    </div>`;
  w.innerHTML=`
<div class="doc">
<div class="page-num-label">P1</div>
<table style="width:100%;border-collapse:collapse;margin-bottom:1.5mm;"><tr>
  <td style="border:none;font-size:7.4pt;">所属機関等作成用 ３　　V　（「特定技能（1号）」・「特定技能（2号）」）
    <div class="en">For organization, part 3　V ("Specified Skilled Worker (i)" / "Specified Skilled Worker (ii)")</div></td>
  <td style="border:none;text-align:right;font-size:7.4pt;white-space:nowrap;">在留資格変更用<div class="en">For change of status</div></td>
</tr></table>

${G1.map(row).join('')}

<div class="note">（以下(27)，(28)は外国人を労働者派遣の対象とする場合に記入）
  <div class="en" style="font-weight:normal;">(Fill in sections (27) and (28) if the foreign national is likely to be subject to worker dispatch)</div></div>

<div class="q">(27)次のいずれかに該当することの有無（有の場合は該当するものを選択）
  <div class="en">Whether it falls under any of the following cases: (If "Yes", choose the corresponding item)</div>
  <div style="margin-top:1px;">${pick('f_q27','有','無','Yes','No')}</div>
  <div class="ind1" style="margin-top:1px;">${ck('f_q27sel','1')} ①派遣先において従事する業務の属する特定産業分野に係る業務又はこれに関連する業務を行っていること
    <div class="en ind1">A dispatch site conducting work pertaining to a specified industrial field to which the work engaged in belongs, or work related thereto</div>
    <div class="ind1">（内容：${f('f_q27d')}）<span class="en">(Details: )</span></div></div>
  <div class="ind1">${ck('f_q27sel','2')} ②地方公共団体又は①に該当する者が資本金の過半数を出資していること
    <div class="en ind1">A local government or a person who falls under ① who has invested a majority of the capital</div></div>
  <div class="ind1">${ck('f_q27sel','3')} ③地方公共団体又は①に該当する者が業務執行に実質的に関与していること
    <div class="en ind1">A local government or a person who falls under ① who is substantially involved in the execution of business</div></div>
  <div class="ind1">${ck('f_q27sel','4')} ④派遣先において従事する業務の属する分野が農業である場合であって国家戦略特別区域法第16条の5第1項に規定する特定機関であること
    <div class="en ind1">The field of work the foreign national is to engage in at the dispatch site is agriculture, and the site is a specified organization as prescribed in Article 16-5, paragraph 1 of the National Strategic Special Zones Act</div></div>
</div>

<div class="q">(28)労働者派遣をすることとしている派遣先が(11)から(22)に該当していることの有無
  <div class="en">Will the organization be sending dispatch workers to a dispatch site that falls under items (11) to (22)?</div>
  <div style="margin-top:1px;">${pick('f_q28','有','無','Yes','No')}　（内容：${f('f_q28d')}）<span class="en">(Details: )</span></div>
</div>

${G2.map(row).join('')}

<div class="note">（以下(33)から(41)は申請人が「特定技能1号」での在留を希望する場合であって，契約により登録支援機関に1号特定技能外国人支援計画の全部の実施を委託しない場合に記入）
  <div class="en" style="font-weight:normal;">(Fill in sections (33) to (41) if the applicant wishes to reside in Japan as a "Specified Skilled Worker (i)" and not all of the support plans for specified skilled workers (i) are entrusted to a registered support organization by contract)</div></div>

<table class="frm" style="margin-top:1px;">
  <colgroup><col style="width:15%"><col style="width:35%"><col style="width:14%"><col style="width:36%"></colgroup>
  <tr>
    <td class="lbl">(33)支援責任者名<div class="en">Support manager</div></td><td class="val">${f('f_smName')}</td>
    <td class="lbl">所属・役職<div class="en">Title and department</div></td><td class="val">${f('f_smTitle')}</td>
  </tr>
  <tr>
    <td class="lbl" colspan="2">役員又は職員の中から支援責任者を選任していることの有無
      <div class="en">Has a support manager been appointed from among the officers or employees?</div></td>
    <td class="val" colspan="2" style="text-align:center;">${pick('f_smYN','有','無','Yes','No')}</td>
  </tr>
  <tr>
    <td class="lbl">(34)支援担当者名<div class="en">Support staff</div></td><td class="val">${f('f_ssName')}</td>
    <td class="lbl">所属・役職<div class="en">Title and department</div></td><td class="val">${f('f_ssTitle')}</td>
  </tr>
  <tr>
    <td class="lbl" colspan="2">役員又は職員の中から，業務に従事させる事業所ごとに1名以上の支援担当者を選任していることの有無
      <div class="en">Has at least one support staff member been appointed from among the officers or employees for each place of business?</div></td>
    <td class="val" colspan="2" style="text-align:center;">${pick('f_ssYN','有','無','Yes','No')}</td>
  </tr>
</table>

<div class="q">(35)次のいずれかに該当することの有無（有の場合は該当するものを選択）
  <div class="en">Whether it falls under any of the following cases: (If "Yes", choose the corresponding item)</div>
  <div style="margin-top:1px;">${pick('f_q35','有','無','Yes','No')}</div>
  <div class="ind1" style="margin-top:1px;">${ck('f_q35sel','1')} ①過去2年間において法別表第1の1の表，2の表及び5の表の上欄の在留資格（収入を伴う事業を運営する活動又は報酬を受ける活動を行うことができる在留資格に限る）をもって在留する中長期在留者の受入れ又は管理を適正に行った実績を有すること
    <div class="en ind1">It has a past record of properly accepting or managing mid to long-term residents over the past two years</div></div>
  <div class="ind1">${ck('f_q35sel','2')} ②支援責任者及び支援担当者が過去2年以内に法別表第1の1の表，2の表及び5の表の上欄の在留資格（収入を伴う事業を運営する活動又は報酬を受ける活動を行うことができる在留資格に限る）をもって在留する中長期在留者の生活相談等に従事した経験を有すること
    <div class="en ind1">The support manager and support staff have experience of engaging in life consultation, etc. for mid to long-term residents within the past two years</div></div>
  <div class="ind1">${ck('f_q35sel','3')} ③その他支援業務を適正に実施できる事情を有すること　（内容：${f('f_q35d')}）
    <div class="en ind1">Other conditions to ensure support is properly implemented (Details: )</div></div>
</div>

<div class="q" style="display:flex;align-items:flex-start;gap:6px;">
  <div style="flex:1;">(36)1号特定技能外国人支援計画に基づく支援を，外国人が十分に理解することができる言語によって行うことができる体制を有していることの有無
    <div class="en">Do you have a structure in place where support based on the support plan can be provided in a language that the foreign national can sufficiently understand?</div></div>

<div class="q" style="display:flex;align-items:flex-start;gap:6px;">

  _fontSize = (_fontSize === 8.5) ? 8 : _fontSize;

// 案件切替時に前の案件の値が残らないよう必ず初期化する（別人の情報が載るのを防ぐ）
function resetForm(){
  const ids=['f_q27','f_q27sel','f_q27d','f_q28','f_q28d','f_smName','f_smTitle','f_smYN',
    'f_ssName','f_ssTitle','f_ssYN','f_q35','f_q35sel','f_q35d','f_q36','f_q37'];
  [...G1,...G2].forEach(([k,ja,en,dl])=>{ ids.push('f_'+k); if(dl) ids.push('f_'+k+'d'); });
  ids.forEach(id=>{const e=document.getElementById(id); if(e) e.value='';});
  const d=(id,v)=>{const e=document.getElementById(id); if(e) e.value=v;};
  // 既定値（欠格事由系は無、労災は「雇用開始後、すぐに労災保険へ加入」が定型）
  d('f_q22','無'); d('f_q24','無'); d('f_q25','無'); d('f_q28','無');
  d('f_q29d','雇用開始後、すぐに労災保険へ加入');
}
async function loadFromDB(passedInfo){
  let info = passedInfo;
  if(!info){
    const sel=document.getElementById('caseSelect');
    if(!sel.value) return;
    try{info=JSON.parse(sel.value);}catch(e){return;}
  }
  if(!info || !info.caseId) return;
  const {caseId}=info;
  resetForm();
  try{
    const cases=await sb('cases?select=org&id=eq.'+caseId);
    const cas=cases&&cases[0];
    const s=(id,val)=>{const e=document.getElementById(id);if(e&&val)e.value=val;};
    // (33)(34) 支援責任者・支援担当者は登録支援機関から引く。
    // ※本来この欄は「登録支援機関に全部委託しない場合」に記入するもの。
    //   委託している案件では空欄が正しいので、参考値として入れるだけに留める。
    if(cas&&cas.org&&typeof findSupportOrg==='function'){
      const org=await findSupportOrg(cas.org,'name,support_manager');
      if(org&&org.support_manager) s('f_smName',org.support_manager);
    }
    p(); showToast('✅ データを読み込みました');
  }catch(e){showToast('⚠️ 読込エラー: '+e.message);console.error(e);}
}
initCaseSelect(); p();

function fitDocToPreview(){
  requestAnimationFrame(()=>{
    const pp=document.querySelector('.pp'), area=document.getElementById('pageArea');
    if(!pp||!area) return;
    const ppW=pp.clientWidth-40, docW=794;
    area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = (ppW<docW) ? (ppW/docW) : 1; });
  });
}
window.addEventListener('resize', fitDocToPreview);

window.addEventListener('message', async function(e){
  if(!e.data||e.data.type!=='SELECT_CASE') return;
  const info=e.data.info;
  if(!info||!info.caseId) return;
  const sel=document.getElementById('caseSelect');
  if(sel){
    let found=false;
    for(let o of sel.options){
      try{ const d=JSON.parse(o.value); if(d.caseId===info.caseId){sel.value=o.value;found=true;break;} }catch(e2){}
    }
    if(!found){
      const opt=document.createElement('option');
      opt.value=JSON.stringify(info); opt.textContent='（indexから選択）';
      sel.appendChild(opt); sel.value=opt.value;
    }
  }
  if(typeof loadCaseToForm==='function'){ await loadCaseToForm(info, 'shinsei_henkou_org3'); }
  if(typeof loadFromDB==='function') loadFromDB(info);
});
</script>
