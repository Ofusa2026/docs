<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>参考様式第１－２０号　支援責任者の履歴書</title>
<style>.fp-case{display:none!important;}</style>
<link rel="stylesheet" href="ofusa_common.css?v=1784720412">
<style>
/* 原本（入管庁 参考様式第１－２０号 Word）の実寸どおり:
   A4縦・余白15mm・行グリッド16pt・ＭＳ明朝10.5pt
   表: 列幅(mm) 35.0/13.5/13.5/50.4/22.5/47.0・行高(mm) 9.8/15.0/7.6(見出し)/7.8×8/8.0（Word表示時の実高）
   タイトル: 16pt・字間8.5pt（9文字で約77.8mm）
   外枠・氏名欄と②③の間・④の上下 1.5pt、内線0.5pt、ふりがなと氏名の間は点線 */
.doc{width:210mm!important;height:297mm!important;min-height:0!important;padding:15mm!important;
  font-family:'MS Mincho','ＭＳ 明朝','Yu Mincho','Hiragino Mincho ProN',serif!important;font-size:10.5pt!important;line-height:16pt!important;overflow:hidden!important;}
.doc .g{line-height:16pt;min-height:16pt;}
.doc .ttl{text-align:center;margin:26pt 0 23pt;line-height:16pt;}
.doc .ttl span{display:inline-block;width:77.8mm;font-size:16pt;text-align:justify;text-align-last:justify;}
.doc .rt{width:180mm;border-collapse:collapse;table-layout:fixed;border:1.5pt solid #000;}
.doc .rt td{border:0.5pt solid #000;padding:0 1mm;vertical-align:middle;overflow:hidden;font-size:10.5pt;line-height:14pt;}
.doc .rt td.c{text-align:center;}
.doc .rt .tk-r{border-right:1.5pt solid #000;}
.doc .rt .tk-l{border-left:1.5pt solid #000;}
.doc .rt .tk-t{border-top:1.5pt solid #000;}
.doc .rt .tk-b{border-bottom:1.5pt solid #000;}
.doc .rt .kana{border-bottom:0.5pt dotted #000;font-size:9pt;}
.doc .rt .nm{border-top:0.5pt dotted #000;font-size:13pt;}
.doc .circ{display:inline-block;width:1.5em;height:1.5em;line-height:1.5em;text-align:center;border:1px solid #000;border-radius:50%;margin:-0.25em 0;}
.doc .sp{line-height:12pt;margin:16pt 0;}
/* 左パネル：学歴・職歴エディタ */
.hr-row{display:grid;grid-template-columns:4.2em 2.8em 1fr 20px;gap:4px;margin-bottom:4px;align-items:center;}
.hr-row input{width:100%;box-sizing:border-box;font-size:11px;padding:4px 5px;}
.hr-row button{border:none;background:none;color:#94a3b8;cursor:pointer;font-size:13px;padding:0;}
.hr-row button:hover{color:#dc2626;}
.hr-head{display:grid;grid-template-columns:4.2em 2.8em 1fr 20px;gap:4px;font-size:9.5px;color:#64748b;margin-bottom:2px;}
.hr-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.hr-tools button{font-size:11px;padding:5px 9px;border-radius:7px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;font-weight:600;color:#334155;}
@media print{
  @page{size:A4 portrait;margin:0;}
  html,body,.main,.pp,#pageArea{background:#fff!important}
  .app-bar,.fp,.page-nav,.page-num-label{display:none!important}
  .main{display:block!important}
  .pp{padding:0!important;overflow:visible!important}
  #pageArea{padding:0!important;display:block!important}
  .doc{zoom:1!important;box-shadow:none!important;margin:0!important;width:210mm!important;height:297mm!important;min-height:0!important;padding:15mm!important;
    font-size:10.5pt!important;line-height:16pt!important;break-after:auto;}
  .f[style*="color:#aaa"]{visibility:hidden}
}
</style>
</head>
<body>
<div class="app-bar">
  <div>
    <div class="app-bar-title">📄 参考様式第１－２０号　支援責任者の履歴書</div>
    <div class="ver">ver.20261020.02</div>
  </div>
  <div class="bar-btns">
    <button class="btn" id="editModeBtn" onclick="toggleEditMode()" style="background:#7c3aed;color:white;">✏️ 直接編集</button>
    <button class="btn" id="styleModeBtn" onclick="toggleStyleMode()" style="background:#0f766e;color:white;">🎨 スタイル編集</button>
    <button class="btn" onclick="saveFormGeneric('1_20')" style="background:#16a34a;color:white;">🛢 DB保存</button>
    <button class="btn" onclick="saveEditedHTML()" style="background:#0369a1;color:white;">📥 編集保存</button>
    <button class="btn" onclick="loadEditedHTML()" style="background:#0369a1;color:white;">📂 編集呼出</button>
    <button class="btn btn-print" onclick="doPrint()">🖨️ 印刷・PDF</button>
  </div>
</div>
<div class="main">
<div class="fp">
  <div class="fp-case">
    <label>登録支援機関</label><select id="filterOrg" onchange="filterCases()"></select>
    <label>所属機関</label><select id="filterCompany" onchange="filterCases()"></select>
    <label>検索</label><input id="filterText" oninput="filterCases()" placeholder="名前で絞り込み">
    <label>案件選択 <span id="caseCount" style="color:#888;font-weight:normal;font-size:9px;"></span></label>
    <select id="caseSelect" onchange="loadFromDB()"></select>
  </div>
  <div class="fp-inner">
    <div id="rsItakuNote" style="display:none;margin:0 0 8px;padding:7px 9px;border-radius:8px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:11px;line-height:1.5;"></div>
    <div id="rsFormInfo" style="display:none;margin:0 0 8px;padding:7px 9px;border-radius:8px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;font-size:11px;line-height:1.55;"></div>
    <div class="fs"><div class="fs-title">支援責任者</div>
      <div id="rsFormBtnWrap" style="display:none;margin:0 0 8px;"><button onclick="rsLoadFromForm(true)" style="font-size:11px;padding:5px 10px;border-radius:7px;border:1px solid #0369a1;background:#0369a1;color:#fff;cursor:pointer;font-weight:600;">📝 自社支援の回答から読み込み</button></div>
      <div class="fg" id="rsPickWrap" style="display:none;"><label>支援責任者を選ぶ（案シスに複数登録あり）</label><select id="rsPick" onchange="rsPickName(this.value)"></select></div>
      <div class="fg"><label>（ふりがな）</label><input id="f_kana" oninput="p()" placeholder="ほうむ はなこ"></div>

      <div class="fg"><label>③ 生年月日（年 / 月 / 日）</label><div style="display:flex;gap:4px;"><input id="f_bYear" oninput="p()" style="width:4.5em;" placeholder="1980"><input id="f_bMonth" oninput="p()" style="width:3em;"><input id="f_bDay" oninput="p()" style="width:3em;"></div></div>
    </div>
    <div class="fs"><div class="fs-title">④ 学歴・職歴（最終学歴・主たる職歴）</div>
      <div class="hr-head"><span>年</span><span>月</span><span>内容</span><span></span></div>
      <div id="hrList"></div>
      <div class="hr-tools">
        <button onclick="hrAdd()">＋ 行を追加</button>
        <button onclick="hrAdd('現在に至る')">＋「現在に至る」</button>
      </div>
      <textarea id="f_histJson" style="display:none;"></textarea>
    </div>
    <div class="fs"><div class="fs-title">⑤ 資格・免許</div>
      <div class="fg"><textarea id="f_license" oninput="p()" rows="2" placeholder="例：中国語検定○級（無ければ「なし」）"></textarea></div>
    </div>
    <div class="fs"><div class="fs-title">作成日</div>
      <div class="fg"><label>年 / 月 / 日</label><div style="display:flex;gap:4px;"><input id="f_docYear" oninput="p()" style="width:4.5em;"><input id="f_docMonth" oninput="p()" style="width:3em;"><input id="f_docDay" oninput="p()" style="width:3em;"></div></div>
    </div>
  </div>
</div>
<div class="pp">
  <div class="page-nav">
    <span class="page-nav-label">ページ:</span>
    <button class="pn-btn pn-btn-page active" onclick="scrollToPage(1)">P1</button>

    <button class="pn-btn" onmousedown="event.preventDefault();changeFontSize(-0.5)" style="padding:2px 7px;">A-</button>
    <button class="pn-btn" onmousedown="event.preventDefault();changeFontSize(0)" style="padding:2px 7px;" id="fontSizeLabel">10.5pt</button>

  </div>
  <div id="pageArea"></div>

<script src="ofusa_common.js?v=1792459072"></script>
<script>
// ============================================================
// 参考様式第１－２０号　支援責任者の履歴書
//   氏名は案シスの所属機関「支援責任者」から自動。
//   学歴・職歴は隠し欄 f_histJson に JSON で保持（DB保存＝companies.extra['1_20']）。
// ============================================================
const RS_ROWS = 8;    // 学歴・職歴の行数（記載が多い時は自動で増える）
let _hist = [];
function _rsEsc(s){ return (typeof esc==='function') ? esc(String(s==null?'':s)) : String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hrSync(){ const t=document.getElementById('f_histJson'); if(t) t.value=JSON.stringify(_hist); }
function hrLoadFromField(){ const t=document.getElementById('f_histJson'); try{ const a=JSON.parse(t&&t.value||'[]'); _hist=Array.isArray(a)?a:[]; }catch(e){ _hist=[]; } }
function hrAdd(text){ _hist.push({y:'',m:'',t:text||''}); hrSync(); hrRender(); p();
  setTimeout(()=>{ const l=document.querySelectorAll('#hrList .hr-y'); if(l.length && !text) l[l.length-1].focus(); },30); }
function hrDel(i){ _hist.splice(i,1); hrSync(); hrRender(); p(); }
function hrSet(i,k,val){ if(!_hist[i]) return; _hist[i][k]=val; hrSync(); p(); }
function hrRender(){
  const box=document.getElementById('hrList'); if(!box) return;
  if(!_hist.length){ _hist=[{y:'',m:'',t:''},{y:'',m:'',t:''},{y:'',m:'',t:''}]; hrSync(); }
  box.innerHTML=_hist.map((r,i)=>`<div class="hr-row">
    <input class="hr-y" value="${_rsEsc(r.y)}" placeholder="2010" oninput="hrSet(${i},'y',this.value)">
    <input value="${_rsEsc(r.m)}" placeholder="4" oninput="hrSet(${i},'m',this.value)">
    <input value="${_rsEsc(r.t)}" placeholder="${i===0?'○○大学○○学部卒業':i===1?'株式会社○○入社 総務課配属':'総務課主任'}" oninput="hrSet(${i},'t',this.value)">
    <button onclick="hrDel(${i})" title="この行を削除">✕</button>
  </div>`).join('');
}
function rsPickName(n){
  const e=document.getElementById('f_name'); if(e){ e.value=n; }
  // フォームに同じ人の回答があれば、その人の内容に入れ替える
  if(_rsFormPerson(n)) rsLoadFromForm(true, true); else p();
}
// ---- ヒアリングフォーム（会社・特定技能1号）の【自社支援】の回答 ----
//   response.selfSupport（ssMode=self）: supportManagerName/Kana、attachments.support_staff[{name,kana,…}]
//   rireki.mgr / rireki.staff[i] = {gender, birth(YYYY-MM-DD), hist:[{y,m,text}], licenses}（選任の根拠②のときだけ）
const RS_ROLE='support_manager_name'==='support_manager_name' ? 'mgr' : 'staff';
// 自社支援の回答の取得：①案シスの所属機関 extra.selfSupport（「🤝 自社支援」タブで取り込み・修正したもの）を優先
//   ②まだ取り込んでいなければ ヒアリングフォーム（form_responses, form_type=company）の最新の回答
//   戻り値 {ss, src:'anshis'|'form'|'', newer:bool, fe:'外国人従業員数'}
async function _ssFetchSelfSupport(coId, caseId){
  const out={ss:null, src:'', newer:false, fe:''};
  let ssAt='';
  if(coId){
    try{
      const r=await sb(`companies?select=foreign_employees,ss:extra->selfSupport,ssAt:extra->>selfSupportAt&id=eq.${encodeURIComponent(coId)}`);
      const c=r&&r[0];
      if(c){
        if(c.ss && typeof c.ss==='object' && Object.keys(c.ss).length){ out.ss=c.ss; out.src='anshis'; ssAt=c.ssAt||''; }
        if(c.foreign_employees!=null && String(c.foreign_employees).trim()!=='') out.fe=String(c.foreign_employees);
      }
    }catch(e){ console.warn('[selfSupport]',e); }
  }
  const ids=[]; if(coId) ids.push('co_'+coId); if(caseId) ids.push(caseId);
  if(ids.length){
    const q=ids.map(x=>`"${x}"`).join(',');
    try{
      const r=await sb(`form_responses?select=response,submitted_at&form_type=eq.company&case_id=in.(${encodeURIComponent(q)})&deleted_at=is.null&order=submitted_at.desc.nullslast&limit=10`)||[];
      for(const x of r){
        const rs=x&&x.response||{};
        if(rs.ssMode==='self' && rs.selfSupport){
          if(!out.ss){ out.ss=rs.selfSupport; out.src='form'; }
          else if(out.src==='anshis' && x.submitted_at && ssAt && String(x.submitted_at)>String(ssAt)) out.newer=true;
          break;
        }
      }
      if(out.fe===''){ for(const x of r){ const rs=x&&x.response||{}; if(rs.foreignEmployees!=null && String(rs.foreignEmployees).trim()!==''){ out.fe=String(rs.foreignEmployees); break; } } }
    }catch(e){ console.warn('[form]',e); }
  }
  return out;
}
function _ssSrcHtml(r){
  let h = r.src==='anshis' ? '🤝 案シスの「自社支援」タブの内容を使っています' : '📝 ヒアリングフォーム（自社支援）の回答を使っています<br><span style="color:#64748b;">（案シスにはまだ取り込まれていません）</span>';
  if(r.newer) h+='<br><span style="color:#b45309;font-weight:700;">⚠️ 案シスに取り込んでいない新しいフォーム回答があります。案シスで取り込むと反映されます。</span>';
  return h;
}
let _rsSS=null, _rsSrc={};
async function _rsFetchForm(coId, caseId){
  _rsSrc=await _ssFetchSelfSupport(coId, caseId);
  _rsSS=_rsSrc.ss;
}
function _rsFormNames(){
  const ss=_rsSS; if(!ss) return [];
  if(RS_ROLE==='mgr') return ss.supportManagerName ? [String(ss.supportManagerName).trim()] : [];
  return ((ss.attachments||{}).support_staff||[]).map(x=>String(x&&x.name||'').trim()).filter(Boolean);
}
// 氏名に対応するフォームの人（{name,kana,rk}）
function _rsFormPerson(name){
  const ss=_rsSS; if(!ss) return null;
  const nz=x=>String(x||'').replace(/[\s　]/g,'');
  const rk=ss.rireki||{};
  if(RS_ROLE==='mgr'){
    if(!ss.supportManagerName) return null;
    if(name && nz(name)!==nz(ss.supportManagerName)) return null;
    return {name:ss.supportManagerName, kana:ss.supportManagerKana||'', rk:rk.mgr||null};
  }
  const st=(ss.attachments||{}).support_staff||[];
  let i = name ? st.findIndex(x=>nz(x&&x.name)===nz(name)) : 0;
  if(i<0) return null;
  const x=st[i]||{}; if(!x.name) return null;
  return {name:x.name, kana:x.kana||'', rk:(rk.staff||[])[i]||null};
}
// force=false: 空欄だけ埋める（DB保存済みの内容を優先）／ force=true: フォームの内容で上書き
function rsLoadFromForm(force, quiet){
  // 画面の氏名と同じ人の回答だけを使う（別人の内容を入れない）。氏名が空なら最初の人
  const per=_rsFormPerson(v('f_name'));
  if(!per){ if(force&&!quiet) showToast('⚠️ この氏名の回答が自社支援の回答にありません'); return false; }
  if(force && !quiet && (v('f_kana')||_hist.some(r=>r.y||r.m||r.t)) && !confirm('自社支援の回答で入れ直します（いまの入力は上書きされます）。よろしいですか？')) return false;
  const set=(id,val)=>{ const e=document.getElementById(id); if(!e||val==null||val==='') return; if(force||!e.value) e.value=val; };
  set('f_name', per.name); set('f_kana', per.kana);
  const rk=per.rk;
  if(rk){
    set('f_gender', rk.gender||'');
    const b=String(rk.birth||'').match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if(b){ set('f_bYear',String(+b[1])); set('f_bMonth',String(+b[2])); set('f_bDay',String(+b[3])); }
    set('f_license', rk.licenses||'');
    const hs=(rk.hist||[]).filter(h=>h&&(h.y||h.m||h.text)).map(h=>({y:String(h.y||''),m:String(h.m||''),t:String(h.text||'')}));
    if(hs.length && (force || !_hist.some(r=>r.y||r.m||r.t))){ _hist=hs; hrSync(); hrRender(); }
  }
  p();
  if(force && !quiet) showToast('✅ 自社支援の回答を入れました');
  return true;
}
function _rsRenderFormInfo(){
  const el=document.getElementById('rsFormInfo'), bw=document.getElementById('rsFormBtnWrap'); if(!el) return;
  const ss=_rsSS;
  if(!ss){ el.style.display='none'; if(bw) bw.style.display='none'; return; }
  const b=String(ss.basis||'');
  const bTxt = b==='1' ? '①受入れ実績（→ 1-11-2号）' : b==='2' ? '②生活相談の経験（→ 1-11-3号・1-20号・1-22号）' : '未回答';
  let h=_ssSrcHtml(_rsSrc)+`<br>支援責任者・担当者の選任の根拠：<b>${bTxt}</b>`;
  if(b==='1') h+='<br><span style="color:#b45309;font-weight:700;">⚠️ ①を選んでいるため、通常この履歴書は使いません（フォームでも履歴書の項目は聞いていません）。</span>';
  const per=_rsFormPerson(v('f_name'));
  if(per && per.rk) h+='<br>この人の履歴書の回答：あり';
  el.innerHTML=h; el.style.display='';
  if(bw) bw.style.display = (_rsFormNames().length) ? '' : 'none';
}

function p(){
  if(_editMode) return;
  const w=document.getElementById('pageArea'); if(!w) return;
  const g=v('f_gender');
  const gm=(x)=> g===x ? `<span class="circ">${x}</span>` : x;
  const by=v('f_bYear'), bm=v('f_bMonth'), bd=v('f_bDay');
  const birth = `${by?_rsEsc(by):'　　'}年　${bm?_rsEsc(bm):'　　'}月　${bd?_rsEsc(bd):'　　'}日生`;
  const rows=_hist.filter(r=>r.y||r.m||r.t);
  const H=[7.8,7.8,7.8,7.8,7.8,7.8,7.8,7.8];   // 学歴・職歴の行高 mm（原本をWordで開いた時の実高）
  const n=Math.max(H.length, rows.length);
  let hist='';
  for(let i=0;i<n;i++){
    const r=rows[i]||{}; const h=H[i]||7.8; const last=(i===n-1)?' tk-b':'';
    hist+=`<tr style="height:${h}mm;"><td class="c${last}">${_rsEsc(r.y||'')}</td><td class="c${last}">${_rsEsc(r.m||'')}</td><td colspan="3" class="tk-r${last}">${_rsEsc(r.t||'')}</td></tr>`;
  }
  const y=v('f_docYear'), m=v('f_docMonth'), d=v('f_docDay');
  // 列(mm): ラベル35.0 | 年13.5 | 月13.5 | 50.4 | ②③ラベル22.5 | 値47.0（合計181.9→本文幅180mmに比例配分）
  const C=[35.0,13.5,13.5,50.4,22.5,47.0].map(x=>(x/181.9*180).toFixed(2));
  w.innerHTML=`
<div class="doc">
<div class="page-num-label">P1</div>
<div class="g" style="font-size:11pt;">参考様式第１－２０号</div>
<div class="ttl"><span>支援責任者の履歴書</span></div>
<table class="rt">
  <colgroup>${C.map(x=>`<col style="width:${x}mm">`).join('')}</colgroup>
  <tr style="height:9.8mm;">
    <td rowspan="2"><div style="font-size:8pt;line-height:10pt;padding-left:1em;">（ふりがな）</div><div>①氏名</div></td>
    <td colspan="3" class="kana tk-r">${f('f_kana')}</td>
    <td class="tk-l">②性別</td><td class="c">${gm('男')}　・　${gm('女')}</td>
  </tr>
  <tr style="height:15mm;">
    <td colspan="3" class="nm tk-r">${f('f_name')}</td>
    <td class="tk-l">③生年月日</td><td style="text-align:right;white-space:nowrap;">${birth}</td>
  </tr>
  <tr style="height:7.6mm;">
    <td rowspan="${n+1}" class="tk-t tk-b">④学歴・職歴</td>
    <td class="c tk-t">年</td><td class="c tk-t">月</td><td colspan="3" class="c tk-t tk-r">最終学歴・主たる職歴</td>
  </tr>
  ${hist}
  <tr style="height:8mm;"><td class="tk-t">⑤資格・免許</td><td colspan="5" class="tk-t">${f('f_license')}</td></tr>
</table>
<div class="g"></div><div class="g"></div><div class="g"></div>
<div class="g" style="font-size:11pt;">　上記の記載内容は、事実と相違ありません。</div>

// A+/A- は記入欄の文字（氏名・職歴など）だけを拡大縮小する（枠の寸法は原本どおり固定）
function _applyRsFontSize(){
  const st=document.getElementById('_rsFontStyle')||document.createElement('style');
  st.id='_rsFontStyle'; document.head.appendChild(st);
  const s=_fontSize/10.5;
  st.textContent=[
    `.doc{font-size:10.5pt!important}`,
    `.doc .rt td{font-size:${(10.5*s).toFixed(2)}pt!important}`,
    `.doc .rt td.kana{font-size:${(9*s).toFixed(2)}pt!important}`,
    `.doc .rt td.nm{font-size:${(13*s).toFixed(2)}pt!important}`,
  ].join('');
}

async function loadFromDB(passedInfo){
  let info = passedInfo;
  if(!info){
    const sel=document.getElementById('caseSelect');
    if(!sel||!sel.value) return;
    try{info=JSON.parse(sel.value);}catch(e){return;}
  }
  if(!info || !info.caseId) return;
  try{
    const caseId=info.caseId;
    const cs=await sb('cases?select=company,company_id,doc_create_date&id=eq.'+caseId); const cas=cs&&cs[0];
    const SEL='id,name,support_org_name,support_manager_name,support_manager_title,support_staff';
    let co=null; const cid=info.companyId||(cas&&cas.company_id);
    if(cid){ const r=await sb(`companies?select=${SEL}&id=eq.${cid}`); co=r&&r[0]; }
    const cname=info.companyName||(cas&&cas.company);
    if(!co && cname){ const r=await sb(`companies?select=${SEL}&name=eq.${encodeURIComponent(cname)}`); co=r&&r[0]; }
    co=co||{};
    const s=(id,val)=>{const e=document.getElementById(id);if(e&&val&&!e.value)e.value=val;};
    // 氏名：案シス 所属機関の「支援責任者」。複数登録（「、」区切り等）なら選べるようにする
    const raw=String(co.support_manager_name||'').trim();
    // ヒアリングフォーム（自社支援）の回答を先に取る（新しい回答の氏名を優先）
    await _rsFetchForm(co.id||cid, caseId);
    const nz=x=>String(x||'').replace(/[\s　]/g,'');
    const names=[];
    _rsFormNames().concat(raw && !/別紙/.test(raw) ? raw.split(/[、,，\/／\n]+/).map(x=>x.trim()).filter(Boolean) : [])
      .forEach(n=>{ if(n && !names.some(x=>nz(x)===nz(n))) names.push(n); });
    const pw=document.getElementById('rsPickWrap'), pk=document.getElementById('rsPick');
    if(names.length>1 && pw && pk){
      pk.innerHTML=names.map(n=>`<option>${_rsEsc(n)}</option>`).join('');
      pw.style.display='';
      const cur=v('f_name'); if(cur && names.includes(cur)) pk.value=cur;
    }else if(pw){ pw.style.display='none'; }
    s('f_name', names[0]||'');
    // 作成日 = 書類作成日（cases.doc_create_date）。無ければ今日。
    if(!v('f_docYear')){
      const dcd=(cas&&cas.doc_create_date)?String(cas.doc_create_date).split(/[-\/]/):[];
      const n=new Date();
      s('f_docYear',String(parseInt(dcd[0]||n.getFullYear(),10))); s('f_docMonth',String(parseInt(dcd[1]||(n.getMonth()+1),10))); s('f_docDay',String(parseInt(dcd[2]||n.getDate(),10)));
    }
    // 登録支援機関に全部委託している会社では、この書類は通常不要
    const note=document.getElementById('rsItakuNote');
    const norm=x=>String(x||'').replace(/[\s　]/g,'');
    if(note){
      const org=co.support_org_name||'', nm=co.name||cname||'';
      if(org && norm(org)!==norm(nm) && !/自社/.test(org)){
        note.style.display=''; note.innerHTML=`ℹ️ この会社は登録支援機関「${_rsEsc(org)}」に支援を委託しています。<br>この書類は、通常<b>自社で支援する場合</b>に提出します。`;
      }else note.style.display='none';
    }
    hrLoadFromField(); hrRender();
    rsLoadFromForm(false, true);   // フォームの回答で空欄を埋める（DB保存済みの内容はそのまま）
    _rsRenderFormInfo(); p();
    showToast('✅ データを読み込みました');
  }catch(e){showToast('⚠️ 読込エラー: '+e.message);console.error(e);}
}
initCaseSelect(); hrRender(); p();

function fitDocToPreview(){
  requestAnimationFrame(()=>{
    const pp = document.querySelector('.pp');
    const area = document.getElementById('pageArea');
    if(!pp || !area) return;
    const ppW = pp.clientWidth - 40;
    const docW = 794;
    const scale = ppW < docW ? ppW / docW : 1;
    area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = scale; });
  });
}
window.addEventListener('resize', fitDocToPreview);

window.addEventListener('message', async function(e){
  if(!e.data||e.data.type!=='SELECT_CASE') return;
  const info=e.data.info;
  if(!info||!info.caseId) return;
  const sel=document.getElementById('caseSelect');
  if(sel){
    let found=false;
    for(let o of sel.options){
      try{ const d=JSON.parse(o.value); if(d.caseId===info.caseId){sel.value=o.value;found=true;break;} }catch(e2){}
    }
    if(!found){
      const opt=document.createElement('option');
      opt.value=JSON.stringify(info);
      opt.textContent='（indexから選択）';
      sel.appendChild(opt);
      sel.value=opt.value;
    }
  }
  // 前の案件の値が残らないよう、いったん空にする
  ['f_kana','f_name','f_gender','f_bYear','f_bMonth','f_bDay','f_license','f_docYear','f_docMonth','f_docDay','f_histJson'].forEach(id=>{const el=document.getElementById(id); if(el) el.value='';});
  _hist=[]; _rsSS=null; _rsSrc={};
  if(typeof loadCaseToForm==='function'){ await loadCaseToForm(info, '1_20'); }
  if(typeof loadFromDB==='function') loadFromDB(info);
});
</script>
