<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在留資格変更許可申請書（申請人等作成用3・特定技能）</title>
<style>.fp-case{display:none!important;}</style>
<link rel="stylesheet" href="ofusa_common.css?v=1784720412">
<style>
.doc{padding:8mm 10mm!important;line-height:1.15!important;min-height:auto!important;font-size:8pt;}
.doc .en{font-size:5.6pt;color:#333;line-height:1.1;}
.doc table.frm{width:100%;border-collapse:collapse;table-layout:fixed;}
.doc table.frm td{border:0.6pt solid #000;padding:2px 3px;vertical-align:top;}
.doc .lbl{font-size:7.6pt;}
.doc .val{font-size:8.4pt;}
.doc .q{font-size:7.4pt;margin-top:1.5mm;}
.doc table.wk{width:100%;border-collapse:collapse;table-layout:fixed;}
.doc table.wk td,.doc table.wk th{border:0.6pt solid #000;padding:1px 2px;font-weight:normal;font-size:6.4pt;height:13px;text-align:center;}
@media print{
  .app-bar,.fp{display:none!important}
  .main{display:block!important}
  .doc{box-shadow:none!important;margin:0!important}
  .f[style*="color:#aaa"]{visibility:hidden}
}
</style>
</head>
<body>
<div class="app-bar">
  <div>
    <div class="app-bar-title">🪪 在留資格変更許可申請書（申請人等作成用3）　特定技能</div>
    <div class="ver">ver.20260715.02</div>
  </div>
  <div class="bar-btns">
    <button class="btn" id="editModeBtn" onclick="toggleEditMode()" style="background:#7c3aed;color:white;">✏️ 直接編集</button>
    <button class="btn" id="styleModeBtn" onclick="toggleStyleMode()" style="background:#0f766e;color:white;">🎨 スタイル編集</button>
    <button class="btn" onclick="saveFormGeneric('shinsei_henkou3')" style="background:#16a34a;color:white;">🛢 DB保存</button>
    <button class="btn" onclick="saveEditedHTML()" style="background:#0369a1;color:white;">📥 編集保存</button>
    <button class="btn" onclick="loadEditedHTML()" style="background:#0369a1;color:white;">📂 編集呼出</button>
    <button class="btn btn-print" onclick="doPrint()">🖨️ 印刷・PDF</button>
  </div>
</div>
<div class="main">
<div class="fp">
  <div class="fp-case">
    <label>登録支援機関</label><select id="filterOrg" onchange="filterCases()"></select>
    <label>所属機関</label><select id="filterCompany" onchange="filterCases()"></select>
    <label>検索</label><input id="filterText" oninput="filterCases()" placeholder="名前で絞り込み">
    <label>案件選択 <span id="caseCount" style="color:#888;font-weight:normal;font-size:9px;"></span></label>
    <select id="caseSelect" onchange="loadFromDB()"></select>
  </div>
  <div class="fp-inner">
    <div class="fs"><div class="fs-title">22　保証金の徴収等</div>
      <div class="fg"><label>有無</label><select id="f_a22" onchange="p()"><option value=""></option><option>有</option><option selected>無</option></select></div>
      <div class="fg"><label>徴収又は管理機関名</label><input id="f_q22Org" oninput="p()"></div>
      <div class="fg"><label>徴収金額又は管理財産</label><input id="f_q22Amt" oninput="p()"></div>
    </div>
    <div class="fs"><div class="fs-title">23　外国の機関への費用支払の理解・合意</div>
      <div class="fg"><label>有無</label><select id="f_a23" onchange="p()"><option value=""></option><option>有</option><option>無</option></select></div>
      <div class="fg"><label>外国の機関名</label><input id="f_q23Org" oninput="p()"></div>
      <div class="fg"><label>支払額（日本円換算・約○円）</label><input id="f_q23Amt" oninput="p()"></div>
    </div>
    <div class="fs"><div class="fs-title">24〜27　各種確認</div>
      <div class="fg"><label>24 本国の遵守手続を経ている</label><select id="f_a24" onchange="p()"><option value=""></option><option>有</option><option>無</option></select></div>
      <div class="fg"><label>25 定期的に負担する費用の理解・合意</label><select id="f_a25" onchange="p()"><option value=""></option><option>有</option><option>無</option></select></div>
      <div class="fg"><label>26 技能等の本国への移転に努める<span style="font-size:9px;color:#aaa;">（2号希望時）</span></label><select id="f_a26" onchange="p()"><option value=""></option><option>有</option><option>無</option></select></div>
      <div class="fg"><label>27 分野特有の告示基準に適合</label><select id="f_a27" onchange="p()"><option value=""></option><option>有</option><option>無</option></select></div>
    </div>
    <div class="fs"><div class="fs-title">28　職歴<span style="font-weight:normal;font-size:9px;color:#aaa;">（外国におけるものを含む）</span></div>
      <div id="wkRows"></div>
    </div>
    <div class="fs"><div class="fs-title">29　代理人<span style="font-weight:normal;font-size:9px;color:#aaa;">（法定代理人による申請の場合）</span></div>
      <div class="fg"><label>(1) 氏名</label><input id="f_agName" oninput="p()"></div>
      <div class="fg"><label>(2) 本人との関係</label><input id="f_agRel" oninput="p()"></div>
      <div class="fg"><label>(3) 住所</label><textarea id="f_agAddr" oninput="p()" rows="2"></textarea></div>
      <div class="fg"><label>　電話番号</label><input id="f_agTel" oninput="p()"></div>
      <div class="fg"><label>　携帯電話番号</label><input id="f_agCel" oninput="p()"></div>
    </div>
    <div class="fs"><div class="fs-title">署名／申請書作成年月日</div>
      <div class="fg"><label>作成年月日</label>
        <div style="display:flex;gap:4px;"><input id="f_aSigY" oninput="p()" placeholder="年"><input id="f_aSigM" oninput="p()" placeholder="月"><input id="f_aSigD" oninput="p()" placeholder="日"></div>
      </div>
      <div style="font-size:10px;color:#888;padding:2px 0;">※ 署名と作成年月日は申請人（法定代理人）が自署</div>
    </div>
    <div class="fs"><div class="fs-title">※　取次者</div>
      <div class="fg"><label>(1) 氏名</label><input id="f_agentName" oninput="p()"></div>
      <div class="fg"><label>(2) 住所</label><textarea id="f_agentAddr" oninput="p()" rows="2"></textarea></div>
      <div class="fg"><label>(3) 所属機関等</label><input id="f_agentOrg" oninput="p()"></div>
      <div class="fg"><label>　電話番号</label><input id="f_agentTel" oninput="p()"></div>
    </div>
  </div>
</div>
<div class="pp">
  <div class="page-nav">
    <span class="page-nav-label">ページ:</span>
    <button class="pn-btn pn-btn-page active" onclick="scrollToPage(1)">P1</button>
    <span style="margin-left:8px;font-size:10px;color:#aaa;font-family:sans-serif;">文字:</span>
    <button class="pn-btn" onmousedown="event.preventDefault();changeFontSize(-0.5)" style="padding:2px 7px;">A-</button>
    <button class="pn-btn" onmousedown="event.preventDefault();changeFontSize(0)" style="padding:2px 7px;" id="fontSizeLabel">8pt</button>
    <button class="pn-btn" onmousedown="event.preventDefault();changeFontSize(0.5)" style="padding:2px 7px;">A+</button>
  </div>
  <div id="pageArea"></div>
</div>
</div>
<script src="ofusa_common.js?v=1787843147"></script>
<script>
// 28 職歴（6行 × 入社年月・退社年月・勤務先名称）
const WK_COLS=[['InY','入社(年)'],['InM','入社(月)'],['OutY','退社(年)'],['OutM','退社(月)'],['Nm','勤務先名称']];
(function(){
  let h='';
  for(let i=1;i<=6;i++){
    h+=`<div style="border-top:1px dashed #444;margin-top:4px;padding-top:3px;"><div style="font-size:10px;color:#888;">${i}件目</div>`;
    h+=`<div style="display:flex;gap:4px;">`;
    ['InY','InM','OutY','OutM'].forEach(k=>{ h+=`<input id="f_wk${i}${k}" oninput="p()" placeholder="${k.replace('In','入').replace('Out','退').replace('Y','年').replace('M','月')}">`; });
    h+=`</div>`;
    h+=`<div class="fg"><label>勤務先名称</label><input id="f_wk${i}Nm" oninput="p()"></div></div>`;
  }
  document.getElementById('wkRows').innerHTML=h;
})();

function v_(id){ const e=document.getElementById(id); return e?String(e.value||'').trim():''; }
// プレビュー上の「有」「無」をクリックで選択。日本語と訳が連動して丸で囲まれる。
// 同じものを再クリックで解除。実体はサイドバーの select。
function setPick(id, val){
  const e=document.getElementById(id); if(!e) return;
  e.value = (String(e.value||'').trim()===val) ? '' : val;
  p();
}
function pick(id, a, b, ea, eb){
  const cur=v_(id);
  const O=(txt,sel)=>`<span onclick="setPick('${id}','${a===txt||ea===txt?a:b}')" style="cursor:pointer;padding:0 3px;${sel?'border:1px solid #000;border-radius:45%;':''}">${txt}</span>`;
  let h=`<span style="white-space:nowrap;">${O(a,cur===a)}・${O(b,cur===b)}</span>`;
  if(ea&&eb) h+=`<span class="en" style="margin-left:3px;white-space:nowrap;">${O(ea,cur===a)}／${O(eb,cur===b)}</span>`;
  return h;
}

function p(){
  if(_editMode) return;
  const w=document.getElementById('pageArea'); if(!w) return;
  let wk='';
  for(let i=1;i<=6;i++){
    wk+=`<tr>
      <td>${f('f_wk'+i+'InY')}</td><td>${f('f_wk'+i+'InM')}</td>
      <td>${f('f_wk'+i+'OutY')}</td><td>${f('f_wk'+i+'OutM')}</td>
      <td style="text-align:left;">${f('f_wk'+i+'Nm')}</td></tr>`;
  }
  // 24〜27 は「設問＋有・無」の同じ形
  const yn=(id,ja,en)=>`
    <div class="q" style="display:flex;align-items:flex-start;gap:6px;">
      <div style="flex:1;">${ja}<div class="en">${en}</div></div>
      <div style="white-space:nowrap;">${pick(id,'有','無','Yes','No')}</div>
    </div>`;
  w.innerHTML=`
<div class="doc">
<div class="page-num-label">P1</div>
<table style="width:100%;border-collapse:collapse;margin-bottom:1.5mm;"><tr>
  <td style="border:none;font-size:7.4pt;">申請人等作成用 ３　　V　（「特定技能（１号）」・「特定技能（２号）」）
    <div class="en">For applicant, part 3　V ("Specified Skilled Worker (i)" / "Specified Skilled Worker (ii)")</div></td>
  <td style="border:none;text-align:right;font-size:7.4pt;white-space:nowrap;">在留資格変更用<div class="en">For change of status</div></td>
</tr></table>

<div class="q">22　特定技能雇用契約に係る保証金の徴収その他財産管理又は違約金等の支払契約の有無
  <div class="en">Is there a contract on the collection of a deposit pertaining to the employment contract for a specified skilled worker, other management of property, or the payment of a penalty, etc.?</div>
  <div style="margin-top:1px;">${pick('f_a22','有','無','Yes','No')}　（徴収又は管理機関名：${f('f_q22Org')}　徴収金額又は管理財産：${f('f_q22Amt')}）
    <div class="en">(Name of the organization collecting the deposit or managing the property: ／ Deposit amount or type of property managed: )</div></div>
</div>

<div class="q">23　特定技能雇用契約に係る申込みの取次ぎ又は外国における活動準備に関する外国の機関への費用の支払について，その額及び内訳を十分に理解して合意していることの有無（当該費用の支払がある場合に記入）
  <div class="en">Do you fully understand and agree on the amount and breakdown of the payment to a foreign organization for the intermediation of the application pertaining to the employment contract or for preparation for activities in a foreign country?</div>
  <div style="margin-top:1px;">${pick('f_a23','有','無','Yes','No')}　（外国の機関名：${f('f_q23Org')}　支払額（日本円に換算）：約 ${f('f_q23Amt')} 円）
    <div class="en">(Name of the organization in a foreign country: ／ Payment (converted into Japanese yen): Approximately　Yen)</div></div>
</div>

${yn('f_a24','24　国籍又は住居を有する国又は地域において定められる，本邦で行う活動に関連して遵守すべき手続を経ていることの有無（当該手続が定められている場合に記入）','Have you followed the procedures to be complied with in relation to the activities to be carried out in Japan, which are stipulated in the country or region of your nationality or residence?')}
${yn('f_a25','25　本邦において定期的に負担する費用について，対価の内容を十分に理解して合意していることの有無（当該費用の負担がある場合に記入）','Do you fully understand and have you agreed to the expenses to be borne periodically in Japan?')}
${yn('f_a26','26　技能実習によって本邦において修得，習熟又は熟達した技能等の本国への移転に努めることの有無（技能実習の在留資格をもって在留していたことがある場合であって，「特定技能2号」での在留を希望する場合に記入）','Will you endeavor to transfer the skills, etc. you acquire, become proficient in, or master in Japan through technical intern training to your home country?')}
${yn('f_a27','27　申請人につき特定産業分野に特有の事情に鑑みて告示で定められる基準に適合していることの有無（当該基準が定められている場合に記入）','Do you meet the criteria prescribed in the public notice in light of circumstances specific to the specified industrial field?')}

<div class="q">28　職　歴（外国におけるものを含む） <span class="en">Work experience (including those in a foreign country)</span></div>
<table class="wk" style="margin-top:1px;">
  <colgroup><col style="width:10%"><col style="width:8%"><col style="width:10%"><col style="width:8%"><col style="width:64%"></colgroup>
  <tr>
    <th colspan="2">入社 <span class="en">Date of joining</span></th>
    <th colspan="2">退社 <span class="en">Date of leaving</span></th>
    <th>勤務先名称 <span class="en">Place of employment</span></th>
  </tr>
  <tr><th>年 <span class="en">Year</span></th><th>月 <span class="en">Month</span></th><th>年 <span class="en">Year</span></th><th>月 <span class="en">Month</span></th><th></th></tr>
  ${wk}
</table>

<div class="q">29　代理人（法定代理人による申請の場合に記入） <span class="en">Legal representative (in case of legal representative)</span></div>
<table class="frm" style="margin-top:1px;">
  <colgroup><col style="width:14%"><col style="width:36%"><col style="width:16%"><col style="width:34%"></colgroup>
  <tr>
    <td class="lbl">(1) 氏　名<div class="en">Name</div></td><td class="val">${f('f_agName')}</td>
    <td class="lbl">(2) 本人との関係<div class="en">Relationship with the applicant</div></td><td class="val">${f('f_agRel')}</td>
  </tr>
  <tr>
    <td class="lbl">(3) 住　所<div class="en">Address</div></td><td class="val" colspan="3">${f('f_agAddr')}</td>
  </tr>
  <tr>
    <td class="lbl">電話番号<div class="en">Telephone No.</div></td><td class="val">${f('f_agTel')}</td>
    <td class="lbl">携帯電話番号<div class="en">Cellular Phone No.</div></td><td class="val">${f('f_agCel')}</td>
  </tr>
</table>

<div class="q">以上の記載内容は事実と相違ありません。
  <div class="en">I hereby declare that the statement given above is true and correct.</div></div>
<div class="q">申請人（法定代理人）の署名／申請書作成年月日
  <div class="en">Signature of the applicant (legal representative) / Date of filling in this form</div></div>
<table class="frm" style="margin-top:1px;">
  <colgroup><col style="width:60%"><col style="width:40%"></colgroup>
  <tr><td class="val" style="height:9mm;"></td>
    <td class="val" style="text-align:center;">${f('f_aSigY')} <span style="font-size:6.4pt;">年 Year</span> ${f('f_aSigM')} <span style="font-size:6.4pt;">月 Month</span> ${f('f_aSigD')} <span style="font-size:6.4pt;">日 Day</span></td>
  </tr>
</table>
<div style="font-size:6pt;margin-top:1mm;line-height:1.3;">注意　申請書作成後申請までに記載内容に変更が生じた場合，申請人（法定代理人）が変更箇所を訂正し，署名すること。<br>
　　　申請書作成年月日は申請人（法定代理人）が自署すること。<br>
Attention : In cases where descriptions have changed after filling in this application form up until submission of this application, the applicant (legal representative) must correct the part concerned and sign their name.<br>
　　　The date of preparation of the application form must be written by the applicant (legal representative).</div>

<div class="q">※　取次者 <span class="en">Agent or other authorized person</span></div>
<table class="frm" style="margin-top:1px;">
  <colgroup><col style="width:14%"><col style="width:36%"><col style="width:14%"><col style="width:36%"></colgroup>
  <tr>
    <td class="lbl">(1) 氏　名<div class="en">Name</div></td><td class="val">${f('f_agentName')}</td>
    <td class="lbl">(2) 住　所<div class="en">Address</div></td><td class="val">${f('f_agentAddr')}</td>
  </tr>
  <tr>
    <td class="lbl">(3) 所属機関等<div class="en">Organization to which the agent belongs (in case of a relative, the relationship with the applicant)</div></td>
    <td class="val">${f('f_agentOrg')}</td>
    <td class="lbl">電話番号<div class="en">Telephone No.</div></td><td class="val">${f('f_agentTel')}</td>
  </tr>
</table>
</div>`;
  _fontSize = (_fontSize === 8.5) ? 8 : _fontSize;
  _applyFontSize();
  const lbl=document.getElementById('fontSizeLabel');if(lbl)lbl.textContent=_fontSize+'pt';
  setupPageTracker();
  fitDocToPreview();
}

// 案件切替時に前の案件の値が残らないよう必ず初期化する（別人の情報が載るのを防ぐ）
function resetForm(){
  const ids=['f_a22','f_q22Org','f_q22Amt','f_a23','f_q23Org','f_q23Amt','f_a24','f_a25','f_a26','f_a27',
    'f_agName','f_agRel','f_agAddr','f_agTel','f_agCel','f_aSigY','f_aSigM','f_aSigD',
    'f_agentName','f_agentAddr','f_agentOrg','f_agentTel'];
  for(let i=1;i<=6;i++) WK_COLS.forEach(([k])=>ids.push('f_wk'+i+k));
  ids.forEach(id=>{const e=document.getElementById(id); if(e) e.value='';});
  const d=document.getElementById('f_a22'); if(d) d.value='無';   // 22 は無が既定
}
async function loadFromDB(passedInfo){
  let info = passedInfo;
  if(!info){
    const sel=document.getElementById('caseSelect');
    if(!sel.value) return;
    try{info=JSON.parse(sel.value);}catch(e){return;}
  }
  if(!info || !info.caseId) return;
  const {caseId}=info;
  resetForm();
  try{
    const cases=await sb('cases?select=org&id=eq.'+caseId);
    const cas=cases&&cases[0];
    const s=(id,val)=>{const e=document.getElementById(id);if(e&&val)e.value=val;};
    // ※取次者：登録支援機関(support_orgs)の支援責任者を既定にする。
    // 名前の揺れ（「株式会社KMT(82)」等）は共通の findSupportOrg が3段照合で吸収する。
    if(cas&&cas.org&&typeof findSupportOrg==='function'){
      const org=await findSupportOrg(cas.org,'name,address,support_manager,tel');
      if(org){
        s('f_agentName',org.support_manager||'');
        s('f_agentAddr',org.address||'');
        s('f_agentOrg',org.name||'');
        s('f_agentTel',org.tel||'');
      }
    }
    // 作成年月日は今日を既定
    const n=new Date();
    s('f_aSigY',String(n.getFullYear())); s('f_aSigM',String(n.getMonth()+1)); s('f_aSigD',String(n.getDate()));
    p(); showToast('✅ データを読み込みました');
  }catch(e){showToast('⚠️ 読込エラー: '+e.message);console.error(e);}
}
initCaseSelect(); p();

function fitDocToPreview(){
  requestAnimationFrame(()=>{
    const pp=document.querySelector('.pp'), area=document.getElementById('pageArea');
    if(!pp||!area) return;
    const ppW=pp.clientWidth-40, docW=794;
    area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = (ppW<docW) ? (ppW/docW) : 1; });
  });
}
window.addEventListener('resize', fitDocToPreview);

window.addEventListener('message', async function(e){
  if(!e.data||e.data.type!=='SELECT_CASE') return;
  const info=e.data.info;
  if(!info||!info.caseId) return;
  const sel=document.getElementById('caseSelect');
  if(sel){
    let found=false;
    for(let o of sel.options){
      try{ const d=JSON.parse(o.value); if(d.caseId===info.caseId){sel.value=o.value;found=true;break;} }catch(e2){}
    }
    if(!found){
      const opt=document.createElement('option');
      opt.value=JSON.stringify(info); opt.textContent='（indexから選択）';
      sel.appendChild(opt); sel.value=opt.value;
    }
  }
  if(typeof loadCaseToForm==='function'){ await loadCaseToForm(info, 'shinsei_henkou3'); }
  if(typeof loadFromDB==='function') loadFromDB(info);
});
</script>
</body>
</html>
