bsp;日前に社長・工場長等に届けること）<br><span class=\"id\" style=\"font-size:7.5pt;\" data-key=\"103\">1. នីតិវិធីឈប់ការងារតាមការសម្រេចផ្ទាល់ខ្លួន (ត្រូវជូនដំណឹងដល់អគ្គនាយក/ប្រធានរោងចក្រ ${f('es_resignNoticeDays')} ថ្ងៃមុនការឈប់ការងារ)</span></div>","      <div style=\"margin-top:4px;\">２．解雇の事由及び手続<br><span class=\"id\" style=\"font-size:7.5pt;\" data-key=\"104\">2. មូលហេតុ និងនីតិវិធីបណ្តេញចេញ</span></div>","      <div style=\"margin-left:8px;\">解雇は，やむを得ない事由がある場合に限り少なくとも30日前に予告をするか，又は30日分以上の平均賃金を支払って解雇する。特定技能外国人の責めに帰すべき事由に基づいて解雇する場合には，所轄労働基準監督署長の認定を受けることにより予告も平均賃金の支払も行わず即時解雇されることもあり得る。${v('es_severanceCondition')?'<br>'+f('es_severanceCondition'):''}<br><span class=\"id\" style=\"font-size:7pt;margin-left:8px;\" data-key=\"105\">ការបណ្តេញចេញពីការងារ ត្រូវជូនដំណឹងជាមុនយ៉ាងហោចណាស់ 30 ថ្ងៃ ឬត្រូវបង់ប្រាក់ឈ្នួលមធ្យមសម្រាប់រយៈពេលលើសពី 30 ថ្ងៃមុននឹងបណ្តេញចេញ។${v('es_severanceConditionEn')?'<br>'+f('es_severanceConditionEn'):''}</span></div>","      <div style=\"font-size:7.5pt;\">○詳細は，就業規則　${_wr('Retire')}<br><span class=\"id\" style=\"font-size:7pt;\" data-key=\"106\">${_wrHas('Retire')?_wrTR('Retire','km'):`◦សម្រាប់ព័ត៌មានលម្អិត សូមមើលបទបញ្ជាការងារ មាត្រា(&emsp;〜&emsp;), មាត្រា(&emsp;〜&emsp;), មាត្រា(&emsp;〜&emsp;)`}</span></div>"],0,1],[1092,1,1130085713,["    <div style=\"font-size:9pt;font-weight:bold;margin-bottom:3px;\">Ⅸ．その他<br><span style=\"font-size:8pt;font-weight:normal;\">Ⅸ. ខ្លឹមសារផ្សេងៗ</span></div>"],0,1],[1095,8,3439845903,["      <div style=\"margin-left:16px;\">${cb(false,\"ins_kokumin\")}&nbsp;国民年金，${cb(false,\"ins_kokumin_kenko\")}&nbsp;国民健康保険，${cb(!!otherIns(),\"ins_other\")}&nbsp;その他（${otherIns()?'&nbsp;'+esc(otherIns())+'&nbsp;':'&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;'}））<br><span class=\"id\" style=\"font-size:7pt;\" data-key=\"107\">1. ស្ថានភាពចូលរួមធានារ៉ាប់រងសង្គម/ស្ថានភាពអនុវត្តធានារ៉ាប់រងការងារ (${cb(insEnrolled('insPension'),\"ins_kousei_id\")} ប្រាក់សោធននិវត្តន៍កម្មករ, ${cb(insEnrolled('insKenpo'),\"ins_kenko_id\")} ធានារ៉ាប់
