    L417:()=>`  <div style="margin-bottom:1mm;" class="id">(සැලකිලිමත් වන්න)</div>`,
    L418:()=>`  <div style="text-indent:-1.5em;padding-left:1.5em;margin-bottom:0.4mm;" class="id">1. තම මව් රටේ පිහිටා ඇති සංවිධාන යනු, විශේෂිත ඉලක්කයන් අරමුණු කර ගනිමින් සීමා සහිතව පවත්වාගෙන යන ඒවා නොව, නිශ්චිත කුසලතා රැකියා කොන්ත්‍රාත්තුවල අයදුම් කිරීම සහ අදාල ක්‍රියාකාරකම් සඳහා වන පෙර සූදානම් කිරීම් හා සම්බන්ධ සියලුම සංවිධාන වේ.</div>`,
    L419:()=>`  <div style="text-indent:-1.5em;padding-left:1.5em;margin-bottom:0.4mm;" class="id">2. ගෙවන ලද මුදල් සම්බන්ධව තොරතුරු ඉදිරිපත් කිරීමේදී තමාගේ රටේ දේශීය මුදල් ඒකකයෙන් හෝ ඇමරිකන් ඩොලරවලින් සඳහන් කර, එම මුදලේ වටිනාකම ජපන් යෙන්වලින් ගණනය කර වරහන් තුළ සඳහන් කරන්න.</div>`,
    L420:()=>`  <div style="text-indent:-1.5em;padding-left:1.5em;" class="id">3. ”අරමුණ” සඳහන් කිරීමේදී අයදුම්කරුට සංවිධානය මගින් පැවසූ අරමුණ සඳහන් කරන්න.</div>`,
    L424:()=>`<div style="font-size:9pt;margin-bottom:4mm;" class="id">නිශ්චිත කුසලතා රැකියා කොන්ත්‍රාත්තුවලට අදාල අයදුම් කිරීමේ කටයුතු සහ පදිංචි තත්වය (නිශ්චිත කුසලතා) හා සම්බන්ධව පෙර සූදානම් කටයුතු හා සම්බන්ධයෙන් මාගේ මව් රටේ සංවිධාන වෙත ඉහල සඳහන් මුදල් ගෙවූ අරමුණ පිලිබඳ අවබෝධයෙන් අදාල මුදල් ගෙවන ලද අතර, ඉහත සඳහන් මුදල් වලට අමතරව කිසිඳු මුදලක් ගෙවා නැත.</div>`,

    p(); showToast('✅ データを読み込みました');
  }catch(e){showToast('⚠️ 読込エラー: '+e.message);console.error(e);}
}
initCaseSelect(); p();

function fitDocToPreview(){
  requestAnimationFrame(()=>{
    const pp = document.querySelector('.pp');
    const area = document.getElementById('pageArea');
    if(!pp || !area) return;
    const ppW = pp.clientWidth - 40;
    const docW = 794;
    if(ppW < docW){
      const scale = ppW / docW;
      area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = scale; });
    } else {
      area.querySelectorAll('.doc').forEach(d=>{ d.style.zoom = 1; });
    }
  });
}
window.addEventListener('resize', fitDocToPreview);

window.addEventListener('message', async function(e){
  if(!e.data||e.data.type!=='SELECT_CASE') return;
  const info=e.data.info;
  if(!info||!info.caseId) return;
  const sel=document.getElementById('caseSelect');
  if(sel){
    let found=false;
    for(let o of sel.options){
      try{
        const d=JSON.parse(o.value);
        if(d.caseId===info.caseId){sel.value=o.value;found=true;break;}
      }catch(e2){}
    }
    if(!found){
      const opt=document.createElement('option');
      opt.value=JSON.stringify(info);
      opt.textContent='（indexから選択）';
      sel.appendChild(opt);
      sel.value=opt.value;
    }
  }
  // まず共通関数で全入力欄を埋める
  if(typeof loadCaseToForm==='function'){ await loadCaseToForm(info, '1_16'); }
  // 書類固有の追加処理があれば loadFromDB で補完
  if(typeof loadFromDB==='function') loadFromDB(info);
});
</script>
