<style>
/* 書類固有スタイル */
.doc{
  background:white;
  width:794px;
  min-height:1123px;
  flex-shrink:0;
  margin:0 0 24px 0;
  padding:15mm 14mm;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
  font-family:'MS Mincho','Yu Mincho','Hiragino Mincho ProN',serif;
  font-size:8.5pt;line-height:1.9;color:#000;
  position:relative;
  box-sizing:border-box;
  overflow:hidden;
}
.page-num-label{
  position:absolute;top:5px;right:8px;
  font-size:8px;color:#bbb;font-family:sans-serif;letter-spacing:0.05em;
  background:white;padding:0 2px;
}
/* P1は内容が密でA4高さギリギリのため、印刷時のみ行間を詰めて1枚に収める */
@media print{ #docP1{ line-height:1.5 !important; } }
/* ヘッダー差込値に下線 */
.doc .hdr-ul .f{border-bottom:1px solid #333;}
/* 記入欄の体裁：日本語行・翻訳行それぞれに下線を引き、値は線のすぐ上に中央寄せ。
   左のラベル（事業所名／Nama kantor）と2行ずつ対応して並ぶようにする。 */
.doc .ul-cell{padding:0 4px;vertical-align:top;}
.doc .ul-cell br{display:none;}
.doc .ul-cell > .f,
.doc .ul-cell > .id > .f{display:block;text-align:center;border-bottom:1px solid #333;padding-bottom:2px;margin-bottom:5px;min-height:1.2em;line-height:1.4;}
.doc .ul-cell > .id{display:block;}
.doc .ul-label{vertical-align:top;line-height:1.4;padding-top:0;}
.doc .ul-label .id{display:block;margin-top:7px;}
/* 冒頭の所属機関ブロック：ラベルを折り返さない最小幅にし、値の欄を広く取る（中央寄せはしない） */
.doc table.hdr-ul{width:72%;table-layout:fixed;margin-left:auto;}
.doc table.hdr-ul > tbody > tr > td:first-child{width:42%;padding-right:10px;vertical-align:top;}
.doc table.hdr-ul > tbody > tr > td:last-child{width:58%;vertical-align:top;}
/* 記入欄の値だけ中央寄せ（下線なし）：分野・業務区分など */
.doc .ctr-cell{text-align:center;}
</style>
</head>

<script>
// ver.20260716: f() は未入力でもプレースホルダの<span>を返すため常に truthy。
// そのため f(A)||f(B) は必ず A を返し、フォールバックが機能していなかった。
// 生値 v() で中身の有無を判定してから f() を呼ぶ。
function fOr(a, b){
  return (typeof v==='function' && String(v(a)||'').trim()) ? f(a) : ((typeof v==='function' && String(v(b)||'').trim()) ? f(b) : f(a));

        <div style="font-size:7.5pt;">※ １年単位の変形労働時間制を採用している場合には，乙が十分に理解できる言語を併記した年間カレンダーの写し及び労働基準監督署へ届け出た変形労働時間制に関する協定書の写しを添付する。<br><span class="id" style="font-size:6.5pt;">* ในกรณีที่ใช้ระบบชั่วโมงการทำงานที่ปรับเปลี่ยนได้ในหน่วย 1 ปี จะต้องแนบสำเนาปฏิทินระยะเวลา 1 ปีที่มีภาษาที่ผู้รับจ้างสามารถเข้าใจได้ดีเขียนระบุไว้อยู่ด้วย พร้อมกับสำเนาข้อตกลงที่เกี่ยวข้องกับระบบชั่วโมงการทำงานที่ปรับเปลี่ยนได้ซึ่งได้ยื่นเรื่องไปยังหน่วยงานที่กำกับดูแลมาตรฐานแรงงานไว้แล้ว</span></div>

        ${(()=>{
          // シフトデータがあれば実データ、なければ空欄行を5行表示
          const rows = shifts.length > 0 ? shifts : [{start:'',end:'',h:'',min:'',days:'',daysEn:''}];
          const maxRows = shifts.length > 0 ? shifts.length : 5;
          return Array.from({length:maxRows},(_,i)=>{
            const s = rows[i]||{start:'',end:'',h:'',min:'',days:'',daysEn:''};
            const startStr = s.start ? s.start : '&emsp;時&emsp;分';
            const endStr   = s.end   ? s.end   : '&emsp;時&emsp;分';
            const daysStr  = s.days  ? s.days  : '&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;';
            const hStr     = s.h     ? s.h     : '&emsp;&emsp;';

            const daysEnStr= s.daysEn? s.daysEn: '&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;';

          }).join('');
        })()}

    <div style="font-size:9pt;font-weight:bold;margin-bottom:3px;">Ⅷ．退職に関する事項<br><span style="font-size:8pt;font-weight:normal;">VIII. รายการที่เกี่ยวข้องกับการลาออก</span></div>
    <div style="font-size:8.5pt;margin-left:8px;">
      <div>１．自己都合退職の手続&emsp;（退職する&nbsp;${f('es_resignNoticeDays')}&nbsp;日前に社長・工場長等に届けること）<br><span class="id" style="font-size:7.5pt;">1. ขั้นตอนสำหรับการลาออกด้วยเหตุผลส่วนตัว (แจ้งต่อประธานบริษัท ผู้จัดการโรงงาน ฯลฯ&emsp;${f('es_resignNoticeDays')}&emsp;วันก่อนลาออก)</span></div>
      <div style="margin-top:4px;">２．解雇の事由及び手続<br><span class="id" style="font-size:7.5pt;">2.  เหตุผลและขั้นตอนการเลิกจ้าง</span></div>
      <div style="margin-left:8px;">解雇は，やむを得ない事由がある場合に限り少なくとも30日前に予告をするか，又は30日分以上の平均賃金を支払って解雇する。特定技能外国人の責めに帰すべき事由に基づいて解雇する場合には，所轄労働基準監督署長の認定を受けることにより予告も平均賃金の支払も行わず即時解雇されることもあり得る。${v('es_severanceCondition')?'<br>'+f('es_severanceCondition'):''}<br><span class="id" style="font-size:7pt;margin-left:8px;">ในการเลิกจ้าง เฉพาะในกรณีที่มีเหตุอันหลีกเลี่ยงไม่ได้ อย่างน้อยที่สุดต้องแจ้งล่วงหน้า 30 วัน หรือเลิกจ้างโดยจ่ายค่าจ้างเฉลี่ยของระยะเวลาตั้งแต่ 30 วันขึ้นไป ในกรณีของการเลิกจ้างด้วยเหตุอันเนื่องมาจากความบกพร่องของแรงงานเฉพาะทางชาวต่างชาติ เมื่อได้รับการอนุมัติจากผู้อำนวยการกองกำกับดูแลมาตรฐานแรงงานที่มีอำนาจสั่งการ สามารถเลิกจ้างได้ทันทีโดยไม่ต้องมีการแจ้งล่วงหน้า และไม่จำเป็นต้องจ่ายค่าจ้างเฉลี่ย${v('es_severanceConditionEn')?'<br>'+f('es_severanceConditionEn'):''}</span></div>

// フォームに値をセット
function setFormValues(esData){
  if(!esData) return;

  // ヘルパー：要素に値をセット
  const set = (id, val) => { const e=document.getElementById(id); if(e && val!=null) e.value=val; };
  // 日付文字列（YYYY-MM-DD or YYYY/MM/DD）をY/M/Dに分割してセット
  const setDate = (prefix, val) => {
    if(!val) return;
    const m = String(val).match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if(m){ set('es_'+prefix+'Y',m[1]); set('es_'+prefix+'M',String(parseInt(m[2]))); set('es_'+prefix+'D',String(parseInt(m[3]))); }
  };

  // 1. 各DBキーをフォームにマッピング
  Object.keys(esData).forEach(dbKey=>{
    let val = esData[dbKey];
    if(val==null || val==='') return;
    const formKey = dbKeyToForm(dbKey);

    // 日付系は分割セット
    if(dbKey==='contractStart'){ setDate('contractStart',val); return; }
    if(dbKey==='contractEnd')  { setDate('contractEnd',val); return; }

    // 分野・区分: 末尾の（特定技能１号）等を除去
    if(dbKey==='applicantField'||dbKey==='category'||dbKey==='applicantFieldEn'||dbKey==='categoryEn'){
      val = String(val).replace(/[（(][^）)]*[）)]/g,'').trim();
    }

    // allowance動的フォーム（DBキー: allowance1Name → フォームID: es_a1Name）
    const am = dbKey.match(/^allowance(\d)(Name|NameEn|Amt|Amount|Cond|CondEn)$/);
    if(am){
      const n=am[1], part=am[2];
      const partMap = {Name:'Name',NameEn:'NameEn',Amt:'Amt',Amount:'Amt',Cond:'Calc',CondEn:'CalcEn'};
      set('es_a'+n+(partMap[part]||part), val);
      return;
    }

    // 通常フォーム
    set('es_'+formKey, val);
  });

  // 2. 給与形態別セット
  if(esData.salaryAmt || esData.salaryMonthly){
    const amt = esData.salaryAmt || esData.salaryMonthly;
    const st = esData.salaryType || '月給';
    if(st==='時給'||st==='hourly') set('es_salaryHourly', amt);
    else if(st==='日給'||st==='daily') set('es_salaryDaily', amt);
    else set('es_salaryMonthly', amt);
  }

  // 3. 契約更新（renewal）
  if(esData.contractRenewal){
    const rv = esData.contractRenewal;
    const renewMap = {'自動':'auto','possible':'possible','更新する場合':'possible','なし':'none','none':'none'};
    const mapped = renewMap[rv] || (rv.includes('自動')?'auto':rv.includes('可能')||rv.includes('あり')?'possible':'none');
    set('es_renewal', mapped);
  }


  // ===== 定例休日テキスト自動生成（fixedHolidayXxx フラグ → fixedDay1）=====
  const _dayJa={Mon:'月',Tue:'火',Wed:'水',Thu:'木',Fri:'金',Sat:'土',Sun:'日',Hol:'祝日'};
  const _isDayOff=function(vv){ vv=String(vv==null?'':vv).trim(); return vv==='休み'||vv==='true'||vv==='1'||vv==='●'||vv==='○'||vv==='〇'||vv==='✓'||vv==='☑'||vv==='レ'||vv==='◯'; };
  const _fixedDays=Object.entries(_dayJa).filter(([k])=>_isDayOff(esData['fixedHoliday'+k])).map(([,v])=>v);
  if(_fixedDays.length>0){
    const _fdEl=document.getElementById('es_fixedDay1');
    if(_fdEl && !_fdEl.value) _fdEl.value='毎週'+_fixedDays.join('・');
  }
  // 非定例日: nonRegWeeklyDays / nonRegMonthlyDays → es_nonRegDays
  if(esData.nonRegWeeklyDays){
    const _nrw=document.getElementById('es_nonRegWeeklyDays');
    if(_nrw && !_nrw.value) _nrw.value=esData.nonRegWeeklyDays;
  }
  if(esData.nonRegMonthlyDays){
    const _nrm=document.getElementById('es_nonRegMonthlyDays');
    if(_nrm && !_nrm.value) _nrm.value=esData.nonRegMonthlyDays;
  }
  // 4. applicantName は persons から別途セット済みのため上書きしない
  p();
}

function collectFormValues(){
  const data = {};
  getAllFormFields().forEach(formKey=>{
    const el = document.getElementById('es_'+formKey);
    if(el && el.value.trim()!==''){
      // 動的手当フォーム (a1Name→allowance1Name, a1Amt→allowance1Amt 等)
      const am = formKey.match(/^a(\d)(Name|NameEn|Amt|Calc|CalcEn)$/);
      if(am){
        const n=am[1], part=am[2];
        const partMap={Name:'Name',NameEn:'NameEn',Amt:'Amt',Calc:'Cond',CalcEn:'CondEn'};
        data['allowance'+n+(partMap[part]||part)] = el.value.trim();
        return;
      }
      const dbKey = formKeyToDb(formKey);
      data[dbKey] = el.value.trim();
    }
  });
  const nameEl = document.getElementById('applicantName');
  if(nameEl && nameEl.value.trim()) data.applicantName = nameEl.value.trim();

}

var _PAY_L={"everyD": "วันที่ {d} ของทุกเดือน", "everyEnd": "วันสิ้นเดือนของทุกเดือน", "nextD": "วันที่ {d} ของเดือนถัดไป", "nextEnd": "วันสิ้นเดือนของเดือนถัดไป", "curD": "วันที่ {d} ของเดือนปัจจุบัน", "curEnd": "วันสิ้นเดือนปัจจุบัน"};
function fPayL(jaId, enId){
  var ja=String(v(jaId)||'').trim().replace(/[\s\u3000]/g,'');
  var en=String(v(enId)||'').trim();
  if(!ja) return f(enId);
  if(ja.length>12) return en?('<span class="f" data-bind="'+enId+'">'+esc(en)+'</span>'):f(enId);
  var m=ja.match(/^(毎月|翌月|当月|翌)/);
  var pre=m?(m[1]==='翌'?'翌月':m[1]):'毎月';
  var body=m?ja.slice(m[1].length):ja;
  if(body==='月末') body='末';
  var t='';
  if(/^(末|末日)$/.test(body)) t=(pre==='翌月')?_PAY_L.nextEnd:(pre==='当月'?_PAY_L.curEnd:_PAY_L.everyEnd);
  else { var mm=body.match(/^(\d+)日?$/); if(mm) t=((pre==='翌月')?_PAY_L.nextD:(pre==='当月'?_PAY_L.curD:_PAY_L.everyD)).replace('{d}',mm[1]); }
  if(!t) return en?('<span class="f" data-bind="'+enId+'">'+esc(en)+'</span>'):f(enId);
  return '<span class="f" data-bind="'+enId+'">'+esc(t)+'</span>';
}

function _kensetsuBonus(txt){
  txt=(txt||'').trim();
  if(!txt) return '業績による';
  if(txt.length>26 || /自\s*\d|至\s*\d|期間|在職|在籍|以降|勤続|号給/.test(txt)) return txt;
  var t=txt.replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);});
  var months=[],mre=/(\d{1,2}(?:\s*[,，、]\s*\d{1,2})*)\s*月/g,m;
  while((m=mre.exec(t))!==null){m[1].split(/[,，、]/).forEach(function(n){var mm=parseInt(n);if(mm>=1&&mm<=12&&months.indexOf(mm)<0)months.push(mm);});}
  var count=null,cm=t.match(/年\s*(\d+)\s*回/)||t.match(/(\d+)\s*回\s*[／\/]\s*年/);
  if(cm)count=cm[1];
  var ms=months.map(function(x){return x+'月';}).join('・');

  return txt;
}

// DB保存（companies.emp_sets に上書き保存）
async function saveForm(){
  // 案件情報を取得：caseSelect → 親から問い合わせ
  let info = null;
  const sel = document.getElementById('caseSelect');
  if(sel && sel.value){
    try{ info = JSON.parse(sel.value); }catch(e){}
  }
  // caseSelect が空なら親に問い合わせ
  if(!info || !info.caseId){
    info = await new Promise((resolve) => {
      const handler = (e) => {
        if(e.data && e.data.type === 'CASE_INFO_RESPONSE'){
          window.removeEventListener('message', handler);
          resolve(e.data.info || null);
        }
      };
      window.addEventListener('message', handler);
      try{ window.parent.postMessage({type:'GET_CASE_INFO'}, '*'); }catch(e){}
      setTimeout(() => {
        window.removeEventListener('message', handler);
        resolve(null);
      }, 1000);
    });
  }
  if(!info || !info.caseId){ alert('案件情報が不正です'); return; }
  let {companyId, companyName, orgName, empSetIdx} = info;
  // companyIdが未設定の場合、会社名でDBを検索して補完する。
  // ※ info.companyName が空/登録支援機関名になる場合や、案件一覧の再構築で
  //   caseSelectの値が入れ替わる場合があるため、フォームの特定技能所属機関名
  //   (es_orgName) を最優先候補にして会社を解決する。
  if(!companyId){
    const _formOrg = (document.getElementById('es_orgName')||{}).value || '';
    const _cands = [_formOrg, companyName, orgName].map(s=>(s||'').trim()).filter(Boolean);
    for(const nm of _cands){
      try{
        const found = await sb('companies?select=id&name=eq.'+encodeURIComponent(nm));
        if(found&&found[0]){ companyId = found[0].id; break; }
      }catch(e){}
    }
  }
  if(!companyId){ alert('会社IDが取得できませんでした\n（案件管理で会社を紐付けてください）'); return; }

  try{
    const idx = empSetIdx !== '' && empSetIdx != null ? parseInt(empSetIdx) : 0;
    // 現在のフォーム値を収集
    const newData = collectFormValues();
    // ver.20260819.09: ユーザー注記(_userNotes)もemp_setに保存
    try{
      if(Array.isArray(window._userNotes)){
        newData._userNotes = JSON.parse(JSON.stringify(window._userNotes));
      }
    }catch(_e){ console.warn('[saveForm] userNotes serialize failed:', _e); }
    // ②: 読込後に雇用条件を編集していたら保存モードを選ばせる（B:新セット / C:上書き）
    let mode = 'overwrite';
    if(typeof isEmpDirtyByForm==='function' && isEmpDirtyByForm()){
      mode = await promptEmpSaveMode(companyId, idx);
      if(mode===null){ return; }              // キャンセル
    }
    let res = await saveEmpSetWithMode(companyId, info.caseId, newData, mode, idx);
    // ①: 上書き競合（読み込み後に他で変更）を検出したら選択させる
    if(res && res.conflict){
      const _choice = await promptEmpConflict();
      if(_choice===null){ return; }
      if(_choice==='overwrite'){ res = await saveEmpSetWithMode(companyId, info.caseId, newData, 'overwrite', idx, true); }
      else if(_choice==='new'){ res = await saveEmpSetWithMode(companyId, info.caseId, newData, 'new', idx); }
    }
    if(res && res.saved===false){ return; }    // 新セット名入力キャンセル

    // 直接編集中/フリーズ中なら、編集版HTMLも extra['_edited']['1_6_th'][caseId] に保存
    let _editedSaved=false;
    try{
      if(window._htmlFrozen || _editMode){
        const _area=document.getElementById('pageArea');
        if(_area && info.caseId){
          // ⑦: read-modify-write競合を避け、DB側で該当パスのみ原子的に更新（jsonb_set RPC）
          await sb('rpc/set_edited_html',{method:'POST',body:JSON.stringify({p_company_id:companyId,p_doc:'1_6_th',p_case_id:info.caseId,p_html:(typeof getBindResetHtml==='function'?getBindResetHtml():_area.innerHTML),p_saved_at:new Date().toISOString(),p_saved_by:(typeof _currentUserId==='function'?_currentUserId():'')})});
          const _rex=await sb('companies?select=extra&id=eq.'+companyId);
          const _sv=_rex&&_rex[0]&&_rex[0].extra&&_rex[0].extra['_edited']&&_rex[0].extra['_edited']['1_6_th']&&_rex[0].extra['_edited']['1_6_th'][info.caseId];
          if(!_sv||!_sv.html) throw new Error('直接編集版の保存確認に失敗しました');
          _editedSaved=true;
        }
      }
    }catch(_e){ console.warn('[saveEditedToDB]',_e); showToast('⚠️ 直接編集版の保存に失敗しました。もう一度お試しください'); }
    // 保存後：新セット作成ならセレクタ更新＋案件情報更新、基準値を取り直す
    let _msg = '✅ 保存しました';
    if(res && res.mode==='new'){
      _msg = '✅ 新セット['+res.newIdx+'] 「'+res.setName+'」を作成し、この案件に紐付けました';
      window._lastCaseInfo = Object.assign({}, info, {empSetIdx:String(res.newIdx), companyId:companyId});
      try{ if(typeof renderEmpSetSelector==='function') renderEmpSetSelector({id:companyId, emp_sets:(res.empSets||[])}, res.newIdx, window._lastCaseInfo); }catch(_e){}
    }
    try{ if(typeof snapshotEmpBaseline==='function') snapshotEmpBaseline(); }catch(_e){}
    showToast(_editedSaved ? _msg+'（直接編集版も保存）' : _msg);
  }catch(e){
    console.error('DB保存エラー:',e);
    alert('保存エラー: '+e.message);
  }
}

async function discardEditedFromDB(){
  let info=null;
  const sel=document.getElementById('caseSelect');
  if(sel&&sel.value){ try{info=JSON.parse(sel.value)}catch(e){} }
  if((!info||!info.caseId)&&window._lastCaseInfo&&window._lastCaseInfo.caseId) info=window._lastCaseInfo;
  if(!info||!info.caseId){ showToast('⚠️ 案件が選択されていません'); return; }
  if(!confirm('保存済みの直接編集版を破棄して、初期表示に戻します。よろしいですか？')) return;
  let cid=info.companyId;
  try{
    if(!cid){ const q=await sb('cases?select=company_id&id=eq.'+info.caseId); if(q&&q[0])cid=q[0].company_id; }
    if(!cid){ showToast('⚠️ 会社情報が取得できません'); return; }
    const r=await sb('companies?select=id,extra&id=eq.'+cid);
    const c=r&&r[0];
    const ex=c&&c.extra&&typeof c.extra==='object'?JSON.parse(JSON.stringify(c.extra)):{};
    if(ex['_edited']&&ex['_edited']['1_6_th']&&ex['_edited']['1_6_th'][info.caseId]){
      delete ex['_edited']['1_6_th'][info.caseId];
      await sb('companies?id=eq.'+cid,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({extra:ex})});
    }
    window._htmlFrozen=false;
    if(typeof p==='function') p();
    showToast('♻️ 編集版を破棄しました');
  }catch(e){ console.error('[discardEdited]',e); showToast('⚠️ エラー: '+e.message); }
}

    <div style="font-size:11px;color:#64748b;margin:-4px 0 10px;line-height:1.5;">雇用条件書セット：<span id="km_bonus_ref" style="color:#334155;">－</span> <button type="button" onclick="km_use('km_bonus','km_bonus_ref')" style="font-size:10px;padding:1px 8px;border:1px solid #cbd5e1;background:#f1f5f9;border-radius:4px;cursor:pointer;">これを使う</button></div>

<script>
/* 合計自動計算（es_salaryTotal / es_deductTotal / es_netPay） ver.20260724.02 */
(function(){
  var PAY=['es_salaryMonthly','es_a1Amt','es_a2Amt','es_a3Amt','es_a4Amt','es_a5Amt','es_a6Amt','es_fixedOTAmount'];
  var DED=[['es_deductTax'],['es_deductSocialIns'],['es_deductEmpIns'],
           ['es_deductFood','es_deductFoodEst'],['es_deductHousing','es_deductHousingEst'],
           ['es_deductUtility','es_deductUtilityEst'],
           ['es_deductOther1Amount','es_deductOther1AmountEst'],
           ['es_deductOther2Amount','es_deductOther2AmountEst'],
           ['es_deductOther3Amount','es_deductOther3AmountEst'],
           ['es_deductOther4Amount','es_deductOther4AmountEst']];
  var TOTALS=['es_salaryTotal','es_deductTotal','es_netPay'];
  function el(id){return document.getElementById(id);}
  function num(v){
    if(v==null) return 0;
    v=String(v).replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);});
    v=v.replace(/[^0-9.\-]/g,'');
    var n=parseFloat(v); return isFinite(n)?n:0;
  }
  function val(ids){
    /* 実費（金額が確定しないもの）は合計に含めない */
    for(var i=0;i<ids.length;i++){
      var e=el(ids[i]);
      if(e&&/実費|実\s*費/.test(String(e.value))) return 0;
    }
    for(var i=0;i<ids.length;i++){
      var e=el(ids[i]);
      if(e&&String(e.value).trim()!=='') return num(e.value);
    }
    return 0;
  }
  function calc(){
    var pay=0; PAY.forEach(function(id){pay+=val([id]);});
    var ded=0; DED.forEach(function(g){ded+=val(g);});
    var net=pay-ded;
    var hasPayInput = PAY.some(function(id){ var e=el(id); return e && String(e.value).trim()!==''; });
    if(!hasPayInput) return;
    set('es_salaryTotal',pay); set('es_deductTotal',ded); set('es_netPay',net);
  }
  function set(id,v){
    var e=el(id); if(!e) return;
    if(e.dataset.manual==='1') return;
    var s=(v===0?'':String(Math.round(v)));
    if(e.value!==s){ e.value=s; e.dispatchEvent(new Event('input',{bubbles:true})); }
  }
  function init(){
    if(!el('es_salaryTotal')) return;
    TOTALS.forEach(function(id){
      var e=el(id); if(!e) return;
      e.addEventListener('input',function(ev){
        if(ev.isTrusted) e.dataset.manual = (String(e.value).trim()===''?'':'1');
      });
      e.title='自動計算されます（手入力で上書き可・空にすると自動計算に戻ります）';
    });
    document.addEventListener('input',function(ev){
      var id=ev.target&&ev.target.id;
      if(!id) return;
      if(TOTALS.indexOf(id)>=0) return;
      if(id.indexOf('es_')!==0) return;
      calc();
    },true);
    calc();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>
