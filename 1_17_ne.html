"bl\" id=\"f406\" name=\"f406\" data-label=\"Ⅴ共生施策関係 ＞ Ⅴ共生施策関係｜＿)\" style=\"width:17.00em\">)</p><p class=\"vi\" style=\"padding-left:6.30em\">टिप्पणी:</p></td>"],0,1],[2244,16,2543715452,["<p class=\"vi\">(ध्यान दिनुहोस्)</p>","<p class=\"vi\">1\tI कोलम, सहायताको लागि लक्षित व्यक्ति एक भन्दा बढी भएमा र सहायताको बिषयबस्तु एउटै भएमा मात्र, 「1 नाम」मा「छुट्टै कागजको नाम सूची अनुसार」भनी लेखी, I कोलमका कुराहरू लेखिएको नाम सूची (जुनसुकै ढाँचा) संलग्न गरे पनि समस्या हुने छैन। तर, एकै समयमा आवेदन दिने अवस्थामा मात्र सीमित।</p>","<p class=\"vi\">2\tII कोलम 4, विशेष सीप भएका बिदेशीहरु संग्लन संस्था आफैले 1. विशेष सीप भएका बिदेशी सहायता योजना कार्यान्वयन गर्ने भएमा मात्र लेख्ने।</p>","<p class=\"vi\">3\tIII कोलम, 1. विशेष सीप भएका बिदेशी सहायता योजनाको सम्पूर्ण कार्यान्वयन दर्ता सहायता संस्थालाई आयोजन गर्न दिएमा मात्र लेख्ने।</p>","<p class=\"vi\">4\tIV कोलम 1 देखि 9 सम्मको [कार्यान्वयन योजना] कोलममा, लागु हुनेमा ठिक चिन्ह लगाई, कार्यान्वयन योजना「छ」भएमा कार्यान्वयन अवधि छोटकरीमा लेखी,「छैन」भएमा उक्त सहायता कार्यान्वयन नगर्ने कारण कोष्ठक भित्र लेख्ने।</p>","<p class=\"vi\">5 IV कोलम 1 देखि 9 सम्मको [आयोजक छ छैन] को कोलममा, विशेष सीप भएका संस्थाले सहायताको केही अंश तेस्रो पक्षलाई (दर्ता सहयोग संस्थाबाट आयोजन गरिने अवस्था बाहेक।) आयोजना गर्न दिइने खण्डमा मात्र, 「छ」भनेर लेख्ने। विशेष सीप भएका संस्था आफैले सहायता गर्ने खण्डमा वा दर्ता सहयोग संस्थालाई सम्पूर्ण सहायता आयोजनाको जिम्मेवारी दिइने खण्डमा \"छैन\" भनेर लेख्ने।</p>","<p class=\"vi\">6 IV कोलम 1 देखि 8 सम्मको「सहायता जिम्मेवार व्यक्ति अथवा आयोजन कार्यान्वयन गर्ने जिम्मेवार व्यक्ति」कोलममा, विशेष सीप भएका संस्था आफैले सहायता गर्ने खण्डमा वा दर्ता सहयोग संस्थालाई सम्पूर्ण सहायता आयोजनाको जिम्मेवारी दिइने खण्डमा, प्रत्येक सहायता विषयमा नियुक्त गरिने सम्बन्धित सहायता जिम्मेवार व्यक्तिको नाम र कोष्ठकमा पद लेखी, विशेष सीप भएका संस्थाबाट कामको केही अंशको जिम्मेवारी लिएको तेस्रो पक्षले सहायता कार्यान्वयन गर्ने खण्डमा, सहायताको जिम्मेवारी लिएको व्यक्तिको नाम तथा ठेगाना लेख्ने।</p>","<p class=\"vi\" style=\"text-indent:0.86em\">पुनश्च, IV कोलम 9 को「सहायता जिम्मेवार व्यक्ति वा सहायता इन्चार्ज」कोलममा, निर्दिष्ट सीप भएका कामदार आबद्ध संस्था स्वयमले सहायता गर्ने बेलामा वा दर्तावाला सहायता संस्थालाई सहायताको सम्पूर्ण कुरा ठेक्का दिएको अवस्थामा, नियुक्त हुने सहायता जिम्मेवार व्यक्ति वा सहायता इन्चार्जको नाम र कोष्ठक भित्र पद लेख्ने। त्यस भित्रको b कोलम तथा आफूखुसी लेख्ने कोलमको सम्बन्धमा, सोही कोलमको सहायतालाई, निर्दिष्ट सीप भएको कामदार आबद्ध संस्थाबाट ठेक्का पाएको संस्थाबाट केही अंश ठेक्का पाएको तेस्रो पक्षले कार्यान्वयन गर्ने बेलामा, सहायताको ठेक्का पाएको व्यक्ति वा संस्थाको नाम तथा ठेगाना लेख्ने।</p>","<p class=\"vi\">7\tIV कोलम 1 देखि 4 सम्म र 9 को [कार्यान्वयन तरिका] कोलममा, लागु हुनेमा ठिक चिन्ह लगाउने। [अन्य] मा ठिक चिन्ह लगाएको भए, त्यसको कार्यान्वयन तरिका कोष्ठक भित्र लेख्ने।</p>","<p class=\"vi\">8\tIV कोलम 3Ad [कोठाको चौडाई] को बारेमा, मिल्ने कुरा कोष्ठक भित्रको बाकसबाट छान्ने।</p>","<p class=\"vi\">②देखि ④सम्म, ①मा「छ」मा चिन्ह लगाइएको खण्डमा मात्र भर्नुहोस्।</p>","<p class=\"vi\">③मा, \"व्यक्तिगत स्वामित्वको भवन\" वा \"भाडामा लिइएको भवन\" मध्ये कुनै एकमा चिन्ह लगाउनुहोस्।</p>","<p class=\"vi\">④मा, उदाहरणका लागि निम्न दृष्टिकोणबाट उल्लेख गरिनुपर्छ र व्याख्या उपयुक्त रूपमा गरिनुपर्छ</p>","<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- ③मा \"व्यक्तिगत स्वामित्वको भवन\" भएको खण्डमा: वास्तविक निर्माण/पुनर्निर्माण आदिमा लागेको खर्च, सम्पत्तिको उपयोगी आयु, बस्ने विशेष सीप भएका विदेशी नागरिकहरूको संख्या आदि विचार गरेर तर्कसंगत रूपमा व्याख्या गर्न सकिने रकम</p>","<p class=\"vi\" style=\"padding-left:2.21em;text-indent:-1.11em\">- ③मा \"भाडामा लिइएको भवन\" भएको खण्डमा: भाडामा लिन आवश्यक भाडा शुल्क (व्यवस्थापन शुल्क/साझा खर्च आदि समावेश गरिएको, तर धरौटी/अग्रिम भुक्तानी/जमानत रकम/मध्यस्थ शुल्क समावेश नगरिएको। यसपछि पनि यही लागू हुने) लाई बस्ने विशेष सीप भएका विदेशी नागरिकहरूको संख्याले भाग गरेको रकम</p>","<p class=\"vi\">9 IV कोलम 6B को [कार्यान्वयन समय] कोलममा, गर्न सकिने दिन र समय लेख्ने।</p>"],0,1],[2263,2,1942020107,["<p class=\"vi\" style=\"padding-left:3.00em;text-indent:-3.00em\">माथि उल्लेखित सहायता स्थानीय सरकारले कार्यान्वयन गर्ने सहअस्तित्व समाज निर्माणका नीतिहरूका आधारमा उपयुक्त रूपमा कार्यान्वयन गरिनेछ।</p>","<p class=\"vi\">यसको अतिरिक्त, यो कागजात सहायताको लागि लक्षित व्यक्तिले पूर्णरुपमा बुझ्ने भाषामा अनुवाद गरि, सहायताको लागि लक्षित व्यक्तिलाई प्रदान गर्नुको साथै, बिषयबस्तुको बारे पूर्णरुपमा बयान गरेको छ।</p>"],0,1],[2267,1,1846093434,["<tr><td class=\"lb\"><p class=\"ja\">特定技能所属機関の氏名又は名称</p><p class=\"vi\">विशेष सीप भएका बिदेशीहरु संग्लन संस्थाको नाम</p></td>"],0,1],[2269,1,617466521,["<tr><td class=\"lb\"><p class=\"ja\">作成責任者の氏名</p><p class=\"vi\">बनाएको जिम्मेवार व्यक्तिको नाम</p></td>"],0,1],[2274,2,4244995961,["<p class=\"vi\" style=\"padding-left:3.00em;text-indent:-3.00em\">यो कागजातमा, <span class=\"p17ul\">नेपाली</span> भाषाको अनुवाद प्राप्त गरि, यसको बिषयबस्तु सम्बन्धित जानकारी प्राप्त गरि पुर्णरुपमा बुझे।</p>","<p class=\"vi\">साथै, IV कोलमको 9Aa मा उल्लेखित नियमित अन्तर्वार्ता सञ्चालन गर्ने विधिको बारेमा व्याख्या सुनेर, त्यसको सामग्री पूर्ण रूपमा बुझेर,  <input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f408\" disabled>प्रत्यक्ष र अनलाइन दुवै  <input type=\"checkbox\" class=\"cb vi-cb\" data-mirror=\"f409\" disabled>प्रत्यक्ष मात्र विधिद्वारा कार्यान्वयन गर्न चाहन्छु।</p>"],0,1],[2277,1,31155209,["<p class=\"vi p17sign-date\" style=\"margin-top:.1em\">सहि गरेको मिति　${v('es_createY')||'　　'} साल ${v('es_createM')||'　'} महिना ${v('es_createD')||'　'} तारिख</p>"],0,1],[2279,1,3300998647,["<p class=\"vi\" style=\"margin-left:34%\">1. विशेष सीप भएका बिदेशीको सहि</p>"],0,1],[2323,4,3624395170,["    var _nat=String(pd.nationality||pd.nationality_ja||'').trim();","    if(_nat && !/ネパール|Nepal/i.test(_nat)){","      console.warn('[1-17ne] 申請人の国籍が「'+_nat+'」ですが、この書類はネパール語版です。');","      if(typeof showToast==='function') showToast('⚠ 申請人の国籍は「'+_nat+'」です。ネパール語版ではなく該当言語の1-17をお使いください。');"],0,1],[2354,1,1236495361,["    })('ne');"],0,1],[2598,1,2407934466,["    lo = langs.filter(function(x){ return x && x.language_code==='ne'
